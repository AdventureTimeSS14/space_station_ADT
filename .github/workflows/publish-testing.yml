name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.7
        ss14-changelog update -d Resources/Changelog
      env:
        REPO: ${{ github.repository }}
        BRANCH: master
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN_TEST }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
        FORK_ID: ${{ vars.FORK_ID_TEST }}
