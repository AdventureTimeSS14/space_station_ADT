name: "Labels"

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review, review_requested ]

jobs:
  labels:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Close PRs on master
      if: ${{ (github.event.action == 'opened' || github.event.action == 'ready_for_review')
        && (github.head_ref == 'master' || github.head_ref == 'main' || github.head_ref == 'develop' || github.head_ref == 'stable' || github.head_ref == 'staging')
        && github.event.pull_request.head.repo.fork }}
      uses: superbrothers/close-pull-request@v3
      with:
        comment: "Благодарим вас за вклад в репозиторий Space Station 14. К сожалению, похоже, что вы отправили свой PR из master-ветки. Мы предлагаем вам следовать [нашей документации по использованию git](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html) \n\n Вы можете переместить текущую работу из master-ветки в другую ветку, выполнив команду `git branch <название_ветки>` и сбросив измененив в  master-ветке."

    - name: "Labels: PR"
      if: ${{ !cancelled() && github.actor != 'IanComradeBot'
        && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}
      uses: actions/labeler@v5
      with:
        sync-labels: true

    - name: "Labels: Size"
      if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}
      uses: "pascalgn/size-label-action@v0.5.5"
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      with:
        sizes: >
          {
            "0": "XS",
            "10": "S",
            "100": "M",
            "1000": "L",
            "5000": "XL"
          }

    - name: Check for Merge Conflicts
      if: ${{ !cancelled() && github.event.pull_request.draft == false && github.actor != 'IanComradeBot' && github.event.action != 'review_requested' }}
      uses: eps1lon/actions-label-merge-conflict@v3.0.0
      with:
        dirtyLabel: "S: Merge Conflict"
        repoToken: "${{ secrets.GITHUB_TOKEN }}"
        commentOnDirty: "This pull request has conflicts, please resolve those before we can evaluate the pull request."

    - name: "Labels: Review"
      if: ${{ !cancelled() && github.event.pull_request.draft == false
        && (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'review_requested') }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Status: Needs Review"

    - name: "Labels: Review (remove)"
      if: ${{ !cancelled() && github.event.pull_request.draft == false
        && (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'review_requested') }}
      uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: "Status: Awaiting Changes"
