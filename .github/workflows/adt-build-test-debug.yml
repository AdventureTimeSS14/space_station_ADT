name: ADT Build & Test Debug Linux

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'IanComradeBot' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # изменение

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    # изменение
    - name: Increase swap space
      run: |
        echo "Before:"
        free -h
        df -h /mnt

        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 24G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile

        echo "After:"
        free -h

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      shell: bash
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      shell: bash
      # Изменение
      run: |
        ( while true; do
            awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} /^SwapTotal:/{st=$2} /^SwapFree:/{sf=$2} END{printf "%d %d\n",(t-a)/1024,(st-sf)/1024}' /proc/meminfo
            sleep 5
          done > /tmp/mem-samples.txt ) &
        sampler=$!

        export DOTNET_gcServer=1

        set +e
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"
        code=$?
        set -e

        kill $sampler 2>/dev/null || true
        echo "::group::Peak memory during integration tests"
        echo "Peak RAM used  (MB): $(sort -n -k1,1 /tmp/mem-samples.txt | tail -1 | cut -d' ' -f1)"
        echo "Peak swap used (MB): $(sort -n -k2,2 /tmp/mem-samples.txt | tail -1 | cut -d' ' -f2)"
        free -h
        echo "::endgroup::"

        exit $code

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.os }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
