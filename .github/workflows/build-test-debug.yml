name: Build & Test Debug Linux # ADT-Tweak

on:
  #push:
  #  branches: [ master, staging, stable ]
#  merge_group:
#  pull_request:
#    types: [ opened, reopened, synchronize, ready_for_review ]
#    branches: [ master, staging, stable ]
  workflow_dispatch: # ручной запуск ADT Tweak

jobs:
  build:
    if: github.actor != 'IanComradeBot' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    # ADT-Tweak start
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: content-build
        path: bin/
        if-no-files-found: error
        compression-level: 0

  integration-test:
    if: github.actor != 'IanComradeBot' && github.event.pull_request.draft == false
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            filter: "FullyQualifiedName!~EntityTest&FullyQualifiedName!~PostMapInitTest&FullyQualifiedName!~MappingTests&FullyQualifiedName!~PrototypeTests"
          - name: entity
            filter: "FullyQualifiedName~EntityTest"
          - name: maps
            filter: "FullyQualifiedName~PostMapInitTest|FullyQualifiedName~MappingTests"
          - name: prototypes
            filter: "FullyQualifiedName~PrototypeTests"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: content-build
        path: ./

    - name: Run Integration Tests (${{ matrix.name }})
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "${{ matrix.filter }}" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs-${{ matrix.name }}" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.name }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
        # ADT-Tweak end
  ci-success:
    name: Build & Test Debug
    needs:
      - build
      - integration-test # ADT-Tweak
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
