name: "Labels: Review"

# ADT-Tweak-start
on:
  workflow_dispatch:
#on:
#  pull_request_target:
#    types: [review_requested, opened]
# ADT-Tweak-end

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Status: Needs Review"
    - uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: "Status: Awaiting Changes"
