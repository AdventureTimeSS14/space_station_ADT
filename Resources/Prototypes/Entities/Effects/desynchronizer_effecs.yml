- type: entity
  id: EffectDesynchronizer
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 10
  - type: Sprite
    color: "#FFFFFF80"
    drawdepth: Effects
    offset: 0, 0.5
    snapCardinals: false
    noRot: true
    layers:
      - shader: unshaded
        sprite: ADT/Wizard/Effects/effects160x160.rsi
        state: time
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/Wizard/warudo.ogg
      params:
        volume: -6
  - type: AnimationPlayer
  - type: FreezeContacts
  - type: GravPulseOnMapInit # This is required to trigger physics collision
    maxRange: 2
    baseRadialAcceleration: 0.01
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeCircle
          radius: 2
        hard: false
        layer:
        - Opaque
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        - BulletImpassable
        - BlobImpassable
  - type: Tag
    tags:
    - HideContextMenu