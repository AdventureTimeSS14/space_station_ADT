# Large, circular gateway portals
- type: entity
  abstract: true
  parent: BasePortal
  id: BasePortalGateway
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/gateway.rsi
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeCircle
          radius: 0.6
          position: 0, 0.26
        mask:
        - FullTileMask
        - GhostImpassable
        layer:
        - WallLayer
        hard: false

- type: entity
  parent: BasePortalGateway
  id: PortalGatewayBlue
  components:
  - type: Sprite
    color: SkyBlue
    layers:
    - state: portal
  - type: PointLight
    color: SkyBlue

- type: entity
  parent: BasePortalGateway
  id: PortalGatewayOrange
  components:
  - type: Sprite
    color: OrangeRed
    layers:
    - state: portal
  - type: PointLight
    color: OrangeRed
