# Standing portals
- type: entity
  abstract: true
  id: BasePortal
  name: bluespace portal
  description: Transports you to a linked destination!
  components:
  - type: Transform
    anchored: True
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: /Textures/Effects/portal.rsi
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        - GhostImpassable
        layer:
        - WallLayer
        hard: false
  - type: Portal
  - type: PointLight
    radius: 3
    energy: 1
    netsync: false

- type: entity
  parent: BasePortal
  id: PortalRed
  description: This one looks more like a redspace portal.
  components:
  - type: Sprite
    layers:
    - state: portal-red
  - type: PointLight
    color: OrangeRed
