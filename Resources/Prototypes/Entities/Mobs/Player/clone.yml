# Settings for cloning bodies
# If you add a new trait, job specific component or a component doing visual/examination changes for humanoids
# then add it here to the correct prototype.
# The datafields of the components copied using CopyComp.
# Subscribe to CloningEvent instead if that is not enough.

# Traits that root mentally or otherwise only affect you mentally.
- type: cloningSettings
  id: TraitsMental
  components:
  - Pacified
  - Paracusia
  - LightweightDrunk

# Traits that root in physical things in your body.
- type: cloningSettings
  id: TraitsPhysical
  components:
  - BlackAndWhiteOverlay
  - Narcolepsy
  - ImpairedMobility
  # - LegsParalyzed (you get healed)
  - PermanentBlindness
  - Snoring
  - Unrevivable

- type: cloningSettings
  parent: [TraitsMental, TraitsPhysical]
  id: Traits

# for basic physical traits
- type: cloningSettings
  id: Body
  components:
  # general
  - DetailExaminable
  - Dna
  - Fingerprint
  - Grammar # Pronouns
  - HumanoidProfile # Age, Sex, Gender
  - InnerBodyAnomalyVisuals # How you look with anomalies
  - MeleeWeapon # Attack animation, damage and sound
  - NpcFactionMember
  - RandomPrice
  - TemperatureDamage
  - TemperatureSpeed
  # accents
  - Accentless
  - BackwardsAccent
  - BarkAccent
  - BleatingAccent
  - DamagedSiliconAccent
  - FrenchAccent
  - FrontalLisp
  - GermanAccent
  - LizardAccent
  - MobsterAccent
  - MonkeyAccent
  - MothAccent
  - MumbleAccent
  - OwOAccent
  - ParrotAccent
  - PirateAccent
  - RussianAccent
  - ScrambledAccent
  - SkeletonAccent
  - SlurredAccent
  - SouthernAccent
  - SpanishAccent
  - StutteringAccent
  - VoxAccent
  # - ReplacementAccent
  # Not supported at the moment because AddAccentClothingComponent will make it permanent when cloned.
  # TODO: AddAccentClothingComponent should use an inventory relay event.
  # Also ZombieComponent overwrites the old replacement accent, because you can only have one at a time.
  - TTS # Corvax-TTS
  # ADT-fix-clone-start
  - BurrinessAccent
  - LanguageSpeaker
  - SpeechBarks
  - SizeAttribute
  - Hemophilia
  - DeafTrait
  - Monochromacy
  - Frail
  - SoftWalk
  - Freerunning
  - Sprinter
  - HardThrower
  - FoodConsumptionSpeedModifier
  - DrunkenResilience
  - NyaAccent
  - EmotionallyUnstableAccent
  - WeaknessAccent
  - ResomiAccent
  - RoarAccent
  - SickTeethAccent
  - WieldingBlocker
  - UnadaptedToSpace
  - DamagedThroat
  - ParrotSpeech
  - EmotionLoop
  - ActiveListener
  - BlockWriting
  - Hushed
  - Touchy
  - CharacterFlavor
  # ADT-fix-clone-end
  eventComponents:
  - Damageable # Sprites and damage modifier
  - Flammable # Displacements
  - CreamPied # Displacements
  - Hands # displacements
  - Puller
  - Vocal # voice sounds

# for job-specific traits etc.
- type: cloningSettings
  id: Special
  components:
  - BibleUser
  - CommandStaff
  - MindShield
  - MimePowers
  - SpaceNinja
  - Thieving

# antag roles
- type: cloningSettings
  id: Antag
  components:
  - HeadRevolutionary
  - Revolutionary
  - NukeOperative

- type: cloningSettings
  abstract: true
  id: BaseEquipmentBlacklist
  equipmentBlacklist:
    components:
    - AttachedClothing # helmets, which are part of the suit
    - HumanoidProfile # will cause problems for downstream felinids getting cloned as Urists
    - Implanter # they will spawn full again, but you already get the implant. And we can't do item slot copying yet
    - VirtualItem

# a full clone with all traits and items, but no antag roles
- type: cloningSettings
  id: BaseClone
  parent: [Body, Special, Traits, BaseEquipmentBlacklist]

# for cloning pods
- type: cloningSettings
  id: CloningPod
  parent: [BaseClone, Antag]
  forceCloning: false
  copyEquipment: null
  copyInternalStorage: false
  copyImplants: false

# for paradox clones
- type: cloningSettings
  id: ParadoxCloningSettings
  parent: [BaseClone, Antag]
  components:
  - Forensics # This is so hugging data is copied to the clone, so you can't hug metagame them


# # spawner
- type: entity
  id: RandomCloneSpawner
  name: Random Clone
  suffix: Non-Antag
  components:
  - type: Sprite
    sprite: Mobs/Aliens/paradox_clone.rsi
    state: preview
  - type: RandomCloneSpawner
    settings: BaseClone

# for plant clones
- type: cloningSettings
  id: PlantClone
  components:
  - Plant
  - PlantHarvest
  - PlantChemicals
  - PlantGrowth
  - PlantAtmospheric
  - PlantConsumeExudeGas
  - PlantWeedPest
  - PlantToxins
  # traits
  - PlantTraitKudzu
  - PlantTraitLigneous
  - PlantTraitScream
  - PlantTraitUnviable

# for plant lifecycle clones
- type: cloningSettings
  id: PlantLifecycleClone
  parent: PlantClone
  components:
  # traits
  - PlantTraitSampled
  - PlantTraitSeedless
  eventComponents:
  - PlantHolder
