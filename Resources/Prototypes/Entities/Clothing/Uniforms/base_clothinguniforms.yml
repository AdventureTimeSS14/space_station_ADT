- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolNormal, Clothing, BaseSlicingRefinable]
  id: UnsensoredClothingUniformBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 3
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 150
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underwearb, underweart]
  - type: ADTAccessoryHolder
    maxAccessories: 5
  #ADT-Tweak-End

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  #ADT-Tweak-Start
  - type: CoveredSlot # Backmen
    slots: [underweart]
  #ADT-Tweak-End

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformBase
  components:
  - type: ADTSuitSensor
  # #ADT-Tweak Start - New Monitor: Deprecated
  # - type: DeviceNetwork
  #   deviceNetId: Wireless
  #   transmitFrequencyId: SuitSensor
  #   savableAddress: false
  # - type: WirelessNetworkConnection
  #   range: 1200
  # - type: StationLimitedNetwork
  # #ADT-Tweak End
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underwearb, underweart]
  - type: Tag
    tags:
      - ClothMade
      - Recyclable
      - ADTJumpSuitSacrifice
      - WhitelistChameleon
  #ADT-Tweak-End

- type: entity
  abstract: true
  parent: ClothingUniformBase
  id: ClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underweart]
  #ADT-Tweak-End

- type: entity
  abstract: true
  id: ClothingUniformFoldableBase
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded
