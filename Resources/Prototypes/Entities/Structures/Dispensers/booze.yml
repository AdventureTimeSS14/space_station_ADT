- type: entity
  id: BoozeDispenserEmpty
  name: booze dispenser
  suffix: Empty
  description: A booze dispenser with a single slot for a container to be filled.
  parent: ReagentDispenserBase
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: booze
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
      - ChemDispensable #ADT_Tweak
  - type: Transform
    noRot: false
  - type: Machine
    board: BoozeDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  - type: StealTarget
    stealGroup: BoozeDispenser

- type: entity
  id: BoozeDispenser
  suffix: Filled
  parent: BoozeDispenserEmpty
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - ADTDrinkAleCanister #ADT_Tweak, бутылки заменены на канистры
        - ADTDrinkBeerCanister
        - ADTDrinkCoffeeLiqueurCanister
        - ADTDrinkCognacCanister
        - ADTDrinkGinCanister
        - ADTDrinkMeadCanister
        - ADTDrinkRumCanister
        - ADTDrinkTequilaCanister
        - ADTDrinkVermouthCanister
        - ADTDrinkVodkaCanister
        - ADTDrinkWhiskeyCanister
        - ADTDrinkWineCanister #ADT_Tweak, бутылки заменены на канистры
