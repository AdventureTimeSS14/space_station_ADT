# Standard ammo. HP/FMJ/AP → ADT/.../Projectiles/hp.yml

- type: entity
  parent: BaseBulletHitscan
  id: BulletRifle
  categories: [ HideSpawnMenu ]
  name: bullet (.20 rifle)
  components:
  - type: HitscanBasicDamage
    armorPenetration: -0.13
    damage:
      types:
        Piercing: 17
  - type: HitscanStaminaDamage
    staminaDamage: 2
  - type: HitscanPierce
    chance: 0.4
    pierceLevel: Wood
  - type: HitscanRicochet
    chance: 0.3

- type: entity
  parent: BaseBulletHitscanPractice
  id: BulletRiflePractice
  categories: [ HideSpawnMenu ]
  name: bullet (.20 rifle practice)
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Blunt: 2
  - type: HitscanPierce
    chance: 0.69
  - type: HitscanRicochet
    chance: 0.48
  - type: HitscanBasicVisuals
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: practice

- type: entity
  parent: BaseBulletHitscanIncendiary
  id: BulletRifleIncendiary
  categories: [ HideSpawnMenu ]
  name: bullet (.20 rifle incendiary)
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Blunt: 2
        Heat: 15
  - type: HitscanIgnite
  - type: HitscanPierce
    chance: 0.69
  - type: HitscanRicochet
    chance: 0.48
  - type: HitscanBasicVisuals
    bullet:
      sprite:
        sprite: ADT/Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: incendiary

- type: entity
  parent: BaseBulletHitscanUranium
  id: BulletRifleUranium
  categories: [ HideSpawnMenu ]
  name: bullet (.20 rifle uranium)
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Radiation: 7
        Piercing: 8
  - type: HitscanPierce
    chance: 0.69
    pierceLevel: HardenedMetal
  - type: HitscanRicochet
    chance: 0.8
  - type: HitscanBasicVisuals
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: uranium
