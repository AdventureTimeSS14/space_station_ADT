# Keep as physical projectile: embeddable glass shards

- type: entity
  parent: BaseBullet
  id: PelletGlass
  categories: [ HideSpawnMenu ]
  name: glass shard
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: shard
  - type: EmbeddableProjectile
    deleteOnRemove: true
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Slash: 25

- type: entity
  parent: PelletGlass
  id: PelletGlassSpread
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: PelletGlass
    count: 5
    spread: 10
