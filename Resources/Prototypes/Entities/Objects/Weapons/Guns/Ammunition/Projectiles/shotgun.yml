# Keep as physical projectile: needs SolutionInjectOnProjectileHit

- type: entity
  parent: BaseBulletPractice
  id: PelletShotgunTranquilizer
  categories: [ HideSpawnMenu ]
  name: pellet (.50 tranquilizer)
  components:
  # ADT-Tweak-Start
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: piercing
  # ADT-Tweak-End
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 15
  - type: SolutionInjectOnProjectileHit
    transferAmount: 15
    solution: ammo

