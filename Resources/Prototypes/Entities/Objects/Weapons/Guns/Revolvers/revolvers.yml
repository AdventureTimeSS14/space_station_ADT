
- type: entity
  name: Inspector
  parent: [ADTBaseWeaponRevolverLesser, BaseSecurityContraband] # ADT tweak BaseWeaponRevolver > ADTBaseWeaponRevolver
  id: WeaponRevolverInspector
  description: A double-action revolver manufactured by various companies. It is readily available on the civilian market, making it a popular choice among private investigators. You feel lucky just holding it. Loads 6 rounds of .45 magnum.
  components:
  # ADT tweak Start
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/Revolvers/inspector.rsi # ADT tweak
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  # ADT tweak End
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Revolvers/inspector.rsi # ADT tweak
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
  - type: StealTarget
    stealGroup: OfficerHandgun

- type: entity
  name: Mateba
  parent: [BaseWeaponRevolver, BaseMajorContraband]
  id: WeaponRevolverMateba
  description: A modern revolver used by Nanotrasen’s elite, near mythical ‘Death Squad’ task force. Its unique trigger action and barrel placement enable a high fire rate with minimal muzzle flip. Many have looked down this barrel, but few have lived to tell of it. Loads 6 rounds of .45 magnum.
  components:
  # ADT tweak Start
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/Revolvers/mateba.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  # ADT tweak End
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Revolvers/mateba.rsi # ADT tweak
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/Revolvers/mateba.rsi # ADT tweak
  - type: Gun
    fireRate: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg

