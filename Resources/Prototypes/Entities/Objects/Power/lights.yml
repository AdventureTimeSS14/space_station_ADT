- type: entity
  abstract: true
  parent: BaseReplacementLight
  id: BaseLightbulb
  components:
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger10
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          LightBulbBroken:
            min: 1
            max: 1

