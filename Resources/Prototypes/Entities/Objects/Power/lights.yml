        spawn:
          LightTubeBroken:
            min: 1
            max: 1

# Lighting color values gathered from
# https://andi-siess.de/rgb-to-color-temperature/
# https://academo.org/demos/colour-temperature-relationship/
- type: entity
  parent: BaseLightbulb
  name: incandescent light bulb
  id: LightBulb
  description: A light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#fffcf8" # ADT-Sound-Update
    lightEnergy: 1.0
    lightRadius: 5 # ADT-Sound-Update
    lightSoftness: 1.1
    shortName: comp-light-bulb-incandescent
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: BaseLightbulb
  name: led light bulb
  id: LedLightBulb
  description: A power efficient light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#EEEEFF"
    lightEnergy: 1
    lightRadius: 8
    lightSoftness: 1
    BurningTemperature: 350 #LEDs are colder than incandescent bulbs
    PowerUse: 6 #LEDs are more power efficient than incandescent bulbs
    shortName: comp-light-bulb-led
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: BaseLightbulb
  name: dim light bulb
  id: DimLightBulb
  description: A dim light bulb for populating the darkness of maintenance.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#ba473fe2" # ADT-Sound-Update
    lightEnergy: 0.5
    lightRadius: 5
    lightSoftness: 3
    shortName: comp-light-bulb-dim
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: BaseLightbulb
  name: warm light bulb
  id: WarmLightBulb
  description: A warm light bulb for a more cozy atmosphere.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#fcc489" # ADT-Sound-Update
    lightEnergy: 1
    lightRadius: 6
    lightSoftness: 3
    shortName: comp-light-bulb-warm
  - type: Tag
    tags:
    - LightBulb
    - Trash

- type: entity
  parent: LightBulb
  name: old incandescent light bulb
  id: LightBulbOld
  description: An aging light bulb.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#ffd5b9" # ADT-Sound-Update
    lightEnergy: 0.3 # old incandescents just arent as bright
    lightRadius: 6
    lightSoftness: 1.1
    shortName: comp-light-bulb-old

- type: entity
  parent: BaseLightbulb
  name: incandescent light bulb
  id: LightBulbBroken
  suffix: Broken
  description: A broken light bulb.
  components:
  - type: LightBulb
    startingState: Broken
    bulb: Bulb

- type: entity
  parent: BaseLightbulb
  name: service light bulb
  id: ServiceLightBulb
  description: A low-brightness green lightbulb used in janitorial service lights.
  components:
  - type: LightBulb
    bulb: Bulb
    color: "#dbff8f" # ADT-Sound-Update
    lightEnergy: 0.45
    lightRadius: 1.5
    lightSoftness: 3
    shortName: comp-light-bulb-service
  - type: Tag
    tags:
    - LightBulb
    - Trash

