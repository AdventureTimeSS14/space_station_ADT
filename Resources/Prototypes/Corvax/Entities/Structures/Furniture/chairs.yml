- type: entity
  name: carp chair
  id: ChairCarp
  parent: SeatBase
  description: A luxurious chair, the many purple scales reflect the light in a most pleasing manner.
  components:
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Anchorable
    - type: Rotatable
    - type: Sprite
      sprite: Corvax/Structures/Furniture/chairs.rsi
      state: carp
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
