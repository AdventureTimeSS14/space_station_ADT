- type: reagent
  id: BlindToxin
  name: reagent-name-blind-toxin
  group: Narcotics
  desc: reagent-desc-blind-toxin
  physicalDesc: reagent-physical-desc-syrupy
  color: "#000000"
  boilingPoint: 255.0
  meltingPoint: 36.0
  metabolisms:
    Bloodstream:
      effects:
      - !type:ModifyStatusEffect # ADT-Tweak
        effectProto: StatusEffectBlindness
        type: Add
        time: 3

