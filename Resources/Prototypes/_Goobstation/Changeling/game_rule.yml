- type: entity
  parent: BaseGameRule
  id: Changeling
  components:
  - type: ChangelingRule
  - type: GameRule
    minPlayers: 20 # ADT-Tweak
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroups
    maxDifficulty: 5
  - type: AntagObjectives
    objectives:
    - ChangelingSurviveObjective
    - ChangelingStealDNAObjective
    - ChangelingAbsorbObjective
    - EscapeIdentityObjective
  - type: AntagSelection
    selectionTime: JobsAssigned
    agentName: changeling-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 12
      range:
        min: 1
        max: 4

- type: antagSpecifier
  id: Changeling
  prefRoles: [ Changeling ]
  blacklist:
    components:
    - CommandStaff
    # ADT-Tweak-Start
    - Silicon
    tags:
    - ChangelingBlacklist
    # ADT-Tweak-End
  mindRoles:
  - MindRoleChangeling
