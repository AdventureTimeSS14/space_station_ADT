- type: entity
  id: SunnyMagazine
  name: "Sunny flare autoloader"
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - SunnyMagazine
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    proto: SunnyCartridge
    capacity: 30
    mayTransfer: true
    infiniteUnspawned: true
    whitelist:
      tags:
      - SunnyCartridge
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/generic_shipgun_box.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  id: SunnyCartridge
  name: Packaged flare
  description: An individual electronically activated flare for the GS-002 countermeasure system.
  parent: BaseCartridge
  components:
  - type: Tag
    tags:
    - SunnyCartridge
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipSunnyFlare
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/flare_countermeasure.rsi #Behold, flare but yellow.
    layers:
    - state: sunny-flare
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 0.25
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic

# flare launcher payload

- type: entity
  id: SparkFlare
  name: Signal Emitter
  categories: [ HideSpawnMenu ]
  components:
  - type: TargetSeekingTarget
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: EmbeddableProjectile
    deleteOnRemove: true
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        mask:
        - ItemMask # BulletImpassable
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    state: magicm_cyan
    scale: 0.3,0.3
  - type: TimedDespawn
    lifetime: 40 # Same as normal flare
  - type: AmbientSound
    enabled: true
    volume: -10
    range: 3
    sound:
      path: /Audio/Ambience/Objects/light_hum.ogg
      params:
        loop: true
  - type: PointLight
    enabled: true
    color: "#CF0E0E"
    radius: 9.0
    energy: 3.0
    netsync: false
  - type: RadarBlip
    scale: 4
    shape: square
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 0
