
# Cyrexa 130x820mm

- type: entity
  id: WeaponTurretCyrexa
  name: CYREXA 130mm cannon
  parent:
  - BallisticArtilleryCartridge
  - BallisticArtilleryTier4HP
  suffix: Large, T4
  description: A main battery with dual barrels, delivering rapid, punishing salvos at extreme range. Fires 130x820mm auto shells with slightly reduced brute strength. Can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 15000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/cyrexa.rsi
    layers:
    - state: space_artillery
    scale: 1, 1
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Gun
    damageModifier: 2
    projectileSpeed: 380
    minAngle: 0
    maxAngle: 1
    fireRate: 0.2
    burstCooldown: 10
    burstFireRate: 2
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/heph.ogg
      params:
        volume: 1.1
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 12000
    powerUsePassive: 1500
    powerUseActive: 0
  - type: Actions
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 2
    visibleFromOtherGrids: true
    gridConfig:
      color: "#FF0000"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-1.5,1.5,1.5"
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    whitelist:
      tags:
      - 220mmCartridge
    capacity: 24
    proto: 220mmCartridgeAPHE
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium

- type: entity
  id: WeaponTurretCyrexaHomingCluster
  name: CYREXA 220mm cannon
  parent: WeaponTurretCyrexa
  suffix: Large, T4, Infinite HMNG-CLST
  components:
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    whitelist:
      tags:
      - 220mmCartridge
    capacity: 24
    proto: 220mmCartridgeSmartCluster
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg

- type: entity
  id: WeaponTurretCyrexaHECluster
  name: CYREXA 220mm cannon
  parent: WeaponTurretCyrexa
  suffix: Large, T4, Infinite HE-CLST
  components:
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    whitelist:
      tags:
      - 220mmCartridge
    capacity: 24
    proto: 220mmCartridgeHECluster
