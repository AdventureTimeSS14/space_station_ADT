      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg

# AK820 120mm

- type: entity
  id: WeaponTurretAk820Base # LuaM: WeaponTurretAk820 > WeaponTurretAk820Base, shared by AK820 and AK800
  abstract: true # LuaM
  name: AK820 100mm autocannon
  parent:
  - BallisticArtilleryCartridge
  # - BallisticArtilleryUnanchorableCartridge # LuaM: its RequiresGrid deleted the gun once dragged off the grid
  - BallisticArtilleryTier4HP
  suffix: Large, T4
  description: Large hard hitting naval gun for steady damage. Fires APHEDS rounds, allowing for enhanced penetration, but not as much explosive power as full-sized APHE rounds. Feeds from an 96 round internal magazine.
  components:
  - type: StaticPrice
    price: 16000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/ak820.rsi
    layers:
    - state: space_artillery
    - state: fcs-unshaded
      shader: unshaded
    scale: 1, 1
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Gun
    projectileSpeed: 360
    minAngle: 0
    maxAngle: 0.5
    fireRate: 3.5
    selectedMode: FullAuto
    availableModes: FullAuto
    soundGunshot:
      collection: 120mmAutocannonAK820
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
  - type: Actions
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 2
    visibleFromOtherGrids: true
    gridConfig:
      color: "#FF0000"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-1.5,1.5,1.5"
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    whitelist:
      tags:
      - 120mmCartridge
    capacity: 96
    proto: 120mmCartridgeAPHEDS
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Superheavy

# LuaM-start: AK820 needs a superheavy hardpoint, AK800 does not
- type: entity
  id: WeaponTurretAk820
  parent: WeaponTurretAk820Base
# LuaM-end

- type: entity
  id: WeaponTurretAk800
  name: AK800 100mm autocannon
  parent:
  - WeaponTurretAk820Base # LuaM: WeaponTurretAk820 > WeaponTurretAk820Base, no hardpoint needed
  suffix: Large, T4
  description: A single-barreled variant of the AK820 autocannon, with less GCS strain but lower firerate. Large hard hitting naval gun for steady damage. Fires APHEDS rounds, allowing for enhanced penetration, but not as much explosive power as full-sized APHE rounds. Feeds from an 96 round internal magazine.
  components:
  - type: StaticPrice
    price: 8000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/ak800.rsi
  - type: Gun
    fireRate: 1.75
  - type: ShipGunClass
    shipClass: Heavy

