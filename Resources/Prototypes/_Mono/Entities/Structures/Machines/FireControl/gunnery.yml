# Monolith : Gunnery Computer
- type: entity
  parent: BaseComputerAiAccess
  id: ComputerGunneryConsole
  name: gunnery control console
  description: Interfaces with the gunnery control server to operate ship weapons.
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: _Mono/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_not_rot
    - map: ["computerLayerKeyboard"]
      state: gunnery_keyboard
    - map: ["computerLayerScreen"]
      state: gunnery_screen
    - map: ["computerLayerKeys"]
      state: gunnery_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: FireControlConsole
  # - type: ShipNpcTarget # Commented by LuaM
  #   needPower: true
  - type: TargetSeekingTarget
  - type: ActivatableUI
    key: enum.FireControlConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.FireControlConsoleUiKey.Key:
          type: FireControlConsoleBoundUserInterface
          requireInputValidation: false
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: RadarConsole
  - type: Computer
    board: GunneryControlComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#ff8400"
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#fc9403"
    scale: 1.5
    shape: diamond
    gridConfig:
      color: "#fc9403"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-0.5,0.5,0.5"

