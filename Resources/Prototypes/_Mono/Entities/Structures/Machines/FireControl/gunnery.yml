# Monolith : Gunnery Server
- type: entity
  id: GunneryServerBase
  parent: BaseMachinePowered
  name: gunnery control server
  description: Manages the remote operation of ship weapons.
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/gunnery_server.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: ExtensionCableReceiver
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Construction # Mono
    graph: MachineGunneryServer # LuaM Machine > MachineGunneryServer
    node: machine
    containers:
      - machine_board
      - machine_parts
  - type: ContainerContainer # Mono
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ExaminableBattery
  - type: BatterySelfRecharger
  - type: StaticPrice
    price: 200
  - type: Anchorable # LuaM
    delay: 15

- type: entity
  id: GunneryServerLow
  parent: GunneryServerBase
  name: low-power gunnery control server
  components:
  - type: Machine
    board: MachineGCSLowCircuitboard
  - type: FireControlServer
    processingPower: 24
  - type: Battery
    netsync: false # charged from the power net, see BatterySystem
    maxCharge: 125
    startingCharge: 125
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: ApcPowerReceiverBattery
    idleLoad: 5
    batteryRechargeRate: 300
    batteryRechargeEfficiency: 0.95

