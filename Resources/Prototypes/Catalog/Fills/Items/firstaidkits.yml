- type: entity
  id: MedkitAdvancedFilled
  suffix: Filled
  parent: MedkitAdvanced
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        # ADT Tweak start
        - id: BurnAutoInjector
        - id: BruteAutoInjector
        - id: RadAutoInjector
        - id: AntiPoisonMedipen
        - id: ADTBloodPackTransfusionFull # ADT Tweak: Blood IV
        - id: ADTSalineChemistryBottle
          amount: 2
        - id: ADTHemostasisAutoInjector
        - id: Syringe
        # ADT Tweak End

- type: entity
  id: MedkitCombatFilled
  suffix: Filled
  parent: MedkitCombat
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MedicatedSuture
        - id: RegenerativeMesh
        # ADT Tweak start
        # - id: SyringeEphedrine
        - id: ADTStimulantAutoInjector #Дезоко и диловен
        # - id: SyringeSaline
        - id: ADTHemostasisAutoInjector #Пополняет кровь
        # ADT Tweak End
        - id: BruteAutoInjector
        - id: BurnAutoInjector

- type: entity
  id: StimkitFilled
  suffix: Stimkit, Filled
  parent: Medkit
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: StimpackMini
        amount: 6

