# Core medical supply vendor
- type: vendingMachineInventory
  id: NanoMedPlusInventory
  startingInventory:
    ADTVendingCategoryMedical: # ADT-Tweak
        # ADT tweak start
        Gauze: 5
        ADTPatchPackFilled: 3
        ADTAntibioticOintment: 4
        ADTBloodPackTransfusionFull: 5
        ADTSprayBottleStypticPowder: 5
        ADTSprayBottleSilverSulfadiazine: 5
        # ADT tweak end
        Brutepack: 4
        Ointment: 4
#        Bloodpack: 4  # ADT-Tweak
        PillCanisterTricordrazine: 4
    ADTVendingCategoryMedEquipment: # ADT-Tweak
        # Medical Essential Gear
        ClothingBeltMedicalFilled: 2
        # Shared Essential
        HandheldHealthAnalyzer: 3
        JetInjector: 3
        # Paramed Essential Gear
        ClothingBeltMedicalEMTFilled: 1
        EmergencyRollerBedSpawnFolded: 1
        BoxBodyBag: 1
        # Optional / Situational Gear
        BoxBottle: 3
        Defibrillator: 2 # Easily shared between several people
        Syringe: 4
    ClothingOuterHospitalGown: 2 # Not a popular item, so less stock
  contrabandInventory:
    PillCanisterRandom: 3
    PillSpaceDrugs: 3
    FoodApple: 1
  # ADT tweak Start
  emaggedInventory:
    ADTMorphineBottle: 1
    ADTOmnizineBottle: 1
    ADTPatchHonk: 3
  # ADT tweak End

