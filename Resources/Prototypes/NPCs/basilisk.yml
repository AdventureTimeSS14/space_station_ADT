- type: htnCompound
  id: BasiliskCompound
  branches:
  # ADT-Tweak-Start
  - preconditions:
    - !type:ADTGrabbedPrecondition
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ADTGrabEscapeOperator
  # ADT-Tweak-End
  - tasks:
    - !type:HTNCompoundTask
      task: BasiliskMeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: InnateRangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: BasiliskMeleeCombatCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyColdMeleeTargets
    - !type:HTNCompoundTask
      task: BeforeMeleeAttackTargetCompound
