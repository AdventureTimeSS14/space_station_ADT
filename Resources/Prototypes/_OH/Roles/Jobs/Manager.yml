- type: job
  id: Manager
  name: manager-job-name
  description: manager-job-desc
  playTimeTracker: JobManager
  requirements:
    - !type:DepartmentTimeRequirement
      department: Command
      time: 36000 # 10 hours
    - !type:AgeRequirement
      requiredAge: 25
