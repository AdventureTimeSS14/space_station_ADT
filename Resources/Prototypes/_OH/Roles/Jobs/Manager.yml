  joinNotifyCrew: false
  supervisors: job-supervisors-SOO
  canBeAntag: false
  displayWeight: 100 
  radioBold: true 
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  - DSO2lvl
  - DSO3lvl
  - DSO4lvl
  - DSOgeneral
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, DeathRattleImplantCentcomm ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: playTimeTracker
  id: JobManager
