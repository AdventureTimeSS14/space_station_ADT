
- type: entity
  id: OHRandomHumanoidSpawnerERTLeader
  name: ERT leader
  suffix: ERTRole, EVA
  components:
    - type: Sprite
      sprite: Markers/jobs.rsi
      state: ertleadereva
    - type: RandomMetadata
      nameSegments:
      - ADTCmndNamesFirstMilitary
      - NamesLastERTCallsign
      nameFormat: name-format-standard
    - type: RandomHumanoidSpawner
      settings: OHERTLeader

- type: randomHumanoidSettings
  id: OHERTLeader
  parent: EventHumanoidMindShielded
  randomizeName: false
  speciesBlacklist: # OH-Tweak-start
    - Diona
    - Vox
    - KoboltSpecies
    - DemonSpecies
    - NovakidSpecies
    - TajaranSpecies
    - UrsusSpecies
    - Moth
    - VulpkaninSpecies
    - Shadekin
    - Arachnid
    - Reptilian
    - Felinid
    - Resomi
    - SlimePerson
    - Dwarf
    - IPC
    - DraskSpecies # OH-Tweak-end
  components:
    - type: GhostRole
      name: ghost-role-information-ert-leader-name
      description: ghost-role-information-ert-leader-description
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: short
      requirements:
      - !type:OverallPlaytimeRequirement
        time: 180000 # 50h #
    - type: Loadout
      prototypes: [ OHERTLeaderGearEVA ]
    - type: RandomMetadata
      nameSegments:
      - ADTCmndNamesFirstMilitary
      - NamesLastERTCallsign
      nameFormat: name-format-standard

