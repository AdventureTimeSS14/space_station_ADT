# ДСО легаси

- type: entity
  parent: BasePDA
  id: OHBasePDA
  name: PDA dso
  description: none
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-dsobase
  - type: Sprite
    sprite: _OH/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - MedTekCartridge
      - WantedListCartridge
      - AstroNavCartridge
      - NanoChatCartridge # ADT-tweak: Наночат

- type: entity
  parent: OHBasePDA
  id: OHSOOPDA
  name: name-pda-soo
  suffix: DSO
  description: desc-pda-soo
  components:
  - type: Pda
    id: OHIDSOOCard
    sprite: _OH/Devices/pda.rsi
    state: pda-soo
  - type: PdaBorderColor
    borderColor: "#181224"
    accentHColor: "#fff23f"
  - type: Icon
    sprite: _OH/Devices/pda.rsi
    state: pda-soo
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-soo

