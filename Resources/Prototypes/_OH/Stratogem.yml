# === Подавление стратогем ===
# Консоль, гасящая вызовы стратогем в своём радиусе действия: любая зона удара,
# появившаяся в этом радиусе, отменяется без единого взрыва.

- type: entity
  id: OHStratogemJammer
  parent: [ BaseMachine ]
  suffix: Jammer 100
  name: консоль подавления стратогем
  description: Создаёт помехи наведению стратогем в радиусе действия, блокируя нанесение ими ударов.
  placement:
    mode: SnapgridCenter
  components:
  - type: Rotatable
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic
      shader: unshaded
  - type: Appearance
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: StratogemJammer
    range: 100

- type: entity
  id: OHStratogemJammer50
  parent: [ BaseMachine ]
  suffix: Jammer 50
  name: консоль подавления стратогем
  description: Создаёт помехи наведению стратогем в радиусе действия, блокируя нанесение ими ударов.
  components:
  - type: StratogemJammer
    range: 50

- type: entity
  id: OHStratogemJammer25
  parent: [ BaseMachine ]
  suffix: Jammer 25
  name: консоль подавления стратогем
  description: Создаёт помехи наведению стратогем в радиусе действия, блокируя нанесение ими ударов.
  components:
  - type: StratogemJammer
    range: 25