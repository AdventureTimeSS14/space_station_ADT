
# Стратогемы: карманный предмет с выбором снаряда -> бросок маркера -> зона периодических
# ударов на протяжении времени -> может быть подавлена консолью подавления (StratogemJammer).

# === Зоны ударов (StratogemStrike) ===
# Невидимый для физики маркер, спавнящийся в точке падения броска и наносящий серию
# взрывов в заданном радиусе на протяжении заданного времени. Спавнится через SpawnOnTrigger.

- type: entity
  abstract: true
  id: OHStratogemStrikeZoneBase
  name: stratogem strike zone
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: ADT/Effects/target_circle.rsi
    state: icon
    color: "#ff000088"
  - type: PointLight
    energy: 0.3
    radius: 1
    color: "#ff0000"
  - type: StratogemStrike
    impactSound:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg

- type: entity
  parent: OHStratogemStrikeZoneBase
  id: OHStratogemZoneCarpetBomb
  components:
  - type: StratogemStrike
    explosionType: Default
    totalIntensity: 20
    intensitySlope: 5
    maxIntensity: 20
    radius: 30
    impactCount: 50
    interval: 0.4
  - type: TimedDespawn
    lifetime: 20

- type: entity
  parent: OHStratogemStrikeZoneBase
  id: OHStratogemZone120mm
  components:
  - type: StratogemStrike
    explosionType: HardBomb
    totalIntensity: 500
    intensitySlope: 5
    maxIntensity: 50
    radius: 15
    impactCount: 20
    interval: 1.5
  - type: TimedDespawn
    lifetime: 15

- type: entity
  parent: OHStratogemStrikeZoneBase
  id: OHStratogemZoneNapalm
  components:
  - type: StratogemStrike
    explosionType: FireBomb
    totalIntensity: 300
    intensitySlope: 5
    maxIntensity: 50
    radius: 15
    impactCount: 20
    interval: 1.2
  - type: TimedDespawn
    lifetime: 15

- type: entity
  parent: OHStratogemStrikeZoneBase
  id: OHStratogemZone380mm
  components:
  - type: StratogemStrike
    explosionType: HardBomb
    totalIntensity: 1500
    intensitySlope: 5
    maxIntensity: 50
    radius: 20
    impactCount: 10
    interval: 2.5
  - type: TimedDespawn
    lifetime: 15

- type: entity
  parent: OHStratogemStrikeZoneBase
  id: OHStratogemZoneBSA
  components:
  - type: StratogemStrike
    explosionType: HardBomb
    totalIntensity: 5000
    intensitySlope: 5
    maxIntensity: 50
    radius: 5
    impactCount: 1
    interval: 1
  - type: TimedDespawn
    lifetime: 10

# === Атакующие стратогемы (бросаемые маркеры) ===
# Бросок -> взводится таймер -> по истечении маркер спавнит зону удара на месте своего
# падения и удаляется. Сама зона удара подавляется, если рядом есть StratogemJammer.

- type: entity
  parent: TimerGrenadeBase
  id: OHtrowablestratogemcarpetbomb
  name: stratogem
  description: Вызывает воздушную бомбардировку в указанной точке.
  components:
  - type: Sprite
    sprite: _OH/Entities/Stratogem/StratogemON.rsi
    state: icon
  - type: TimerTrigger
    delay: 5
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 5
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { visible: false }
          Unprimed: { visible: false }
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: OHStratogemZoneCarpetBomb
    useMapCoords: true
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: PointLight
    enabled: true
    radius: 0
    energy: 3
    color: "#ff0000"
  - type: LightBehaviorOnTrigger
    behavior: glow
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: glow
      maxDuration: 10
      startValue: 0
      endValue: 10

