# Универсальная стратогема

- type: entity
  parent: ScatteringGrenadeBase
  id: OHUniversalstratogem
  name: Универсальная стратогема
  description: хуйня для выбора стратогем
  components:
  - type: Sprite
    sprite: _OH/Entities/Stratogem/StratogemOFF.rsi
    state: icon
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    kits:
    - OHstratogemcarpetbomb
    - OHstratogem120mm
    - OHstratogemBSA
    - OHstratogem380mm
    - OHstratogemnapalm
    - OHstratogemsupply
    typeDropPlace: ThisPlace


# Выбор стратогем 

- type: thiefBackpackSet
  id: OHstratogemcarpetbomb
  name: воздушная бомба
  description: воздушная бомба
  sprite:
    sprite: _OH/Stratogem/Stratogemicons.rsi
    state: bomb
  content:
  - OHtrowablestratogemcarpetbomb

- type: thiefBackpackSet
  id: OHstratogem380mm
  name: 380мм
  description: 380мм
  sprite:
    sprite: _OH/Stratogem/Stratogemicons.rsi
    state: 380mm
  content:
  - OHtrowablestratogem380mm

- type: thiefBackpackSet
