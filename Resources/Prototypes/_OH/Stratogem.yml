# Универсальная стратогема

- type: entity
  parent: BaseItem
  id: OHUniversalstratogem
  name: Универсальная стратогема
  description: Карманное устройство для вызова стратогем. При выборе типа снаряда выдаёт соответствующий бросаемый маркер.
  components:
  - type: Sprite
    sprite: _OH/Entities/Stratogem/StratogemOFF.rsi
    state: icon
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    kits:
    - OHstratogemcarpetbomb
    - OHstratogem120mm
    - OHstratogemBSA
    - OHstratogem380mm
    - OHstratogemnapalm
    - OHstratogemsupply
    typeDropPlace: ThisPlace


