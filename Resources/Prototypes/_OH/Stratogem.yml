
# Сделать дольше время взрыва самого снаряда



# база для работы

- type: entity
  abstract: true
  parent: [GrenadeBase, Incorporeal]
  id: OHSTRATOGEMPROJECTILEBASE
  components:
  - type: CanMoveInAir
  - type: MovementIgnoreGravity
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        layer:
        - GhostImpassable
  - type: Sprite
    drawdepth: Overdoors
    sprite: ADT/Effects/target_circle.rsi
    state: icon
  - type: InteractionOutline
  - type: TimedDespawn
    lifetime: 10
  - type: PointLight
    energy: 0.3
    radius: 1
    color: "#ff0000"

# Снаряды

- type: entity
  name: Воздушная бомба
  parent: OHSTRATOGEMPROJECTILEBASE
  id: OHstratogemcarpetbomb
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    totalIntensity: 50
    intensitySlope: 5
    maxIntensity: 50
  - type: Appearance

- type: entity
  name: 120mm
  parent: OHSTRATOGEMPROJECTILEBASE
  id: OHstratogem120mm
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: HardBomb
    totalIntensity: 500
    intensitySlope: 5
    maxIntensity: 50
  - type: Appearance

- type: entity
  name: napalmbomb
  parent: OHSTRATOGEMPROJECTILEBASE
  id: OHstratogemnapalm
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 300
    intensitySlope: 5
    maxIntensity: 50
  - type: Appearance

- type: entity
  name: 380mm
  parent: OHSTRATOGEMPROJECTILEBASE
  id: OHstratogem380mm
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: HardBomb
    totalIntensity: 1500
    intensitySlope: 5
    maxIntensity: 50
  - type: Appearance

- type: entity
  name: БСА
  parent: OHSTRATOGEMPROJECTILEBASE
  id: OHstratogemBSA
  components:
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: HardBomb
    totalIntensity: 5000
    intensitySlope: 5
    maxIntensity: 50
  - type: Appearance

# Атакующие стратогемы


- type: entity
  parent: ScatteringGrenadeBase
  id: OHtrowablestratogemcarpetbomb
  name: stratogem
  description: Releases a bothersome spray of foam darts that cause severe welching.
  components:
  - type: Sprite
    sprite: _OH/Entities/Stratogem/StratogemON.rsi
    state: icon
  - type: ScatteringGrenade
    fillPrototype: OHstratogemcarpetbomb
    capacity: 30
    velocity: 12
    randomDistance: true
    randomThrowDistanceMax: 30
  - type: TriggerOnUse
  - type: TimerTrigger
