- type: thiefBackpackSet
  id: OHstratogemnapalm
  name: напалм
  description: напалм
  sprite:
    sprite: _OH/Stratogem/Stratogemicons.rsi
    state: napalm
  content:
  - OHtrowablestratogemnapalm

- type: thiefBackpackSet
