# ваучеры для лодаутов

- type: entity
  parent: BaseItem
  id: OHDSOVoucherWeapon
  name: DSOVoucherWeapon-name
  description: DSOVoucherWeapon-desc
  components:
  - type: Sprite
    sprite: _OH/Entities/Vouchers/DSOvoucher.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    vendorWhitelist: # it's the only mining points vendor :)
     components:
     - MiningShop
    kits:
    - OHBaseweaponyRifle
    - OHBaseweaponyShotgun
    - OHBaseweaponySubmachinegun
    - OHBaseweaponyTruncheon


- type: entity
  parent: BaseItem
  id: OHDSOVoucherMedical
  name: DSOVoucherMedical-name
  description: DSOVoucherMedical-desc
  components:
  - type: Sprite
    sprite: _OH/Entities/Vouchers/DSOvoucher.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    vendorWhitelist: # it's the only mining points vendor :)
     components:
     - MiningShop
    kits:
    - OHBasemedkitcombat
    - OHbasemedkitchemical

- type: entity
  parent: BaseItem
  id: OHDSOVoucherSpecial 
  name: DSOVoucherSpecial-name
  description: DSOVoucherSpecial-desc
  components:
  - type: Sprite
    sprite: _OH/Entities/Vouchers/DSOvoucher.rsi
