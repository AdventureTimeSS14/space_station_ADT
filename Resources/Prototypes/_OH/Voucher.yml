# техника

- type: entity
  parent: BaseItem
  id: OHDSOVouchervehicle
  name: DSOVoucherVehicle-name
  description: DSOVoucherVehicle-desc
  components:
  - type: Sprite
    sprite: _OH/Entities/Stratogem/StratogemOFF.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    kits:
    - OHvauchervehicleAbrams
    - OHvauchervehiclemech
    typeDropPlace: ThisPlace

