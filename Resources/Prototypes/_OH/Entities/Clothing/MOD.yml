# DSO officer 
- type: entity
  parent: ADTClothingModsuitBackBase
  id: OHClothingModsuitDSOofficer
  name: OHClothingModsuitDSOofficer-name
  description: OHClothingModsuitDSOofficer-desc
  components:
  - type: Sprite
    sprite: _OH/Clothing/back/modsuit/DSOofficer.rsi
    state: icon
  - type: ModSuit
    fullyEnabledSound:
      path: /Audio/ADT/Mecha/nominalnano.ogg
    clothingPrototypes:
      head: OHClothingHeadHelmetModsuitDSOofficer
      gloves: OHClothingHandsModsuitDSOofficer
      outerClothing: OHClothingOuterModsuitDSOofficer
      shoes: OHClothingModsuitShoesDSOofficer
    startingModules:
      - ADTModsuitModStorageLarge
      - ADTModsuitModWelding
      - ADTModsuitModIsulation
      - ADTModsuitModNightVision
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        whitelist:
          components:
            - PowerCellHyper

- type: entity
  parent: ADTClothingHeadHelmetModsuitBase
  id: OHClothingHeadHelmetModsuitDSOofficer
  name: OHClothingHeadHelmetModsuitDSOofficer-name
  description: OHClothingHeadHelmetModsuitDSOofficer-desc
  components:
  - type: Sprite
    sprite: _OH/Clothing/Head/modsuit/Dsoofficer.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _OH/Clothing/Head/modsuit/Dsoofficer.rsi
    clothingVisuals:
      head:
      - state: equipped-head
  - type: PointLight
    enabled: false
    color: "#5e73af"

- type: entity
  parent: ADTClothingHandsModsuitBase
  id: OHClothingHandsModsuitDSOofficer
  name: OHClothingHandsModsuitDSOofficer-name
  components:
  - type: Sprite
    sprite: _OH/Clothing/Hands/modsuit/Dsoofficer.rsi
  - type: Clothing
    sprite: _OH/Clothing/Hands/modsuit/Dsoofficer.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 3
    unequipDelay: 3
  - type: Fiber
    fiberColor: fibers-black

- type: entity
  parent: ADTClothingOuterModsuitBodyBase
  id: OHClothingOuterModsuitDSOofficer
  name: OHClothingOuterModsuitDSOofficer-name
  description: OHClothingOuterModsuitDSOofficer-desc
  components:
  - type: Sprite
    sprite: _OH/Clothing/OuterClothing/modsuit/DSOofficer.rsi
  - type: Clothing
    equipDelay: 3
    unequipDelay: 3
    sprite: _OH/Clothing/OuterClothing/modsuit/DSOofficer.rsi
    slots: [ OUTERCLOTHING ]
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Heat: 0.8
        Piercing: 0.8
        Caustic: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.9
  - type: FireProtection
    reduction: 0.2
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ADTClothingModsuitShoesBase
  id: OHClothingModsuitShoesDSOofficer
  name: OHClothingModsuitDSOofficer-name
  components:
  - type: Sprite
    sprite: _OH/Clothing/shoes/modsuit/Dsoofficer.rsi
    state: icon
  - type: Clothing
    equipDelay: 3
    unequipDelay: 3
    sprite: _OH/Clothing/shoes/modsuit/Dsoofficer.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg