# DSO ERT

#ERT Leader Hardsuit
- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterHardsuitBase ]
  id: OHClothingOuterHardsuitERTLeader
  name: ERT leader's hardsuit
  description: A protective hardsuit worn by the leader of an emergency response team.
  components:
  - type: Sprite
    sprite: _OH/Clothing/OuterClothing/Hardsuit/ERTSuits/ertleader.rsi
  - type: Clothing
    sprite: _OH/Clothing/OuterClothing/Hardsuit/ERTSuits/ertleader.rsi
  - type: ToggleableClothing
    clothingPrototype: OHClothingHeadHelmetHardsuitERTLeader
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000 
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: FireProtection
    reduction: 0.8
  - type: StaminaResistance 
    damageCoefficient: 0.6
  - type: MeleeWeapon
    autoAttack: true
    attackRate: 1
    damage:
      types:
       Blunt: 15
       Structural: 5
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: Armor
    modifiers:
      coefficients: 
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.50
        Heat: 0.7
        Radiation: 0.7
        Caustic: 0.7
  - type: StaminaDamageOnHit
    damage: 15
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: ClothingSpeedModifier 
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: DNALocker 

