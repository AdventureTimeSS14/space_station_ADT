# Гарнитуры
- type: entity
  parent: ClothingHeadset
  id: OHClothingHeadsetDSOcommand
  name: name-HeadsetDSOcommand
  description: desc-HeadsetDSOcommand
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - OHEncryptionKeyDSOcommand
      - OHEncryptionKeyDSObase
      - EncryptionKeyCentCom
      - EncryptionKeyStationMaster
  - type: Sprite
    sprite: _OH/Clothing/Ears/Headsets/DSOcom.rsi
  - type: Clothing
    sprite: _OH/Clothing/Ears/Headsets/DSOcom.rsi

- type: entity
  parent: ClothingHeadset
  id: OHClothingHeadsetDSObase
  name: name-HeadsetDSObase
  description: desc-HeadsetDSObase
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - OHEncryptionKeyDSObase
      - EncryptionKeyStationMaster
  - type: Sprite
    sprite: _OH/Clothing/Ears/Headsets/DSOoper.rsi
  - type: Clothing
    sprite: _OH/Clothing/Ears/Headsets/DSOoper.rsi

# Ключи

- type: entity
  parent: EncryptionKey
  id: OHEncryptionKeyDSOcommand
  name: name-EncryptionDSOKeyDSOcommand
  description: desc-EncryptionDSOKeyDSOcommand
  components:
  - type: EncryptionKey
    channels:
    - radioChannelDSOcomm
    defaultChannel: radioChannelDSOcomm
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: cargo_label

- type: entity
  parent: EncryptionKey
  id: OHEncryptionKeyDSObase
  name: name-EncryptionKeyDSObase
  description: desc-EncryptionKeyDSObase
  components:
  - type: EncryptionKey
    channels:
    - radioChannelDSObase
    defaultChannel: radioChannelDSObase
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: cargo_label


# частоты

- type: radioChannel
  id: radioChannelDSOcomm
  name: chat-radio-DSOcomm
  keycode: 'ш' 
  frequency: 141
  color: "#d3d3d3"
  longRange: true

- type: radioChannel
  id: radioChannelDSObase
  name: chat-radio-DSObase
  keycode: 'щ' 
  frequency: 14
  color: "#7a7a7a"
  longRange: true

