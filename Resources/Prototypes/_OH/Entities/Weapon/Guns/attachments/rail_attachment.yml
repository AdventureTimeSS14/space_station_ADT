- type: entity
  parent: ADTRailAttachmentBase
  id: OHAttachmentScopeholo
  name: OHattachmentscopeholo-name
  description: OHattachmentscopeholo-desc
  components:
  - type: Sprite
    sprite: _OH/Weapon/attachments/rail.rsi
    state: reflex
  - type: Tag
    tags:
    - ADTAttachmentRail
    - OHAttachmentScopeholo
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        wieldedOnly: true
      accuracyAddMult: 0.20
      scatterFlat: -2
      burstScatterAddMult: -1
    - conditions:
        unwieldedOnly: true
      accuracyAddMult: 0.4
      scatterFlat: -4

- type: Tag
  id: OHAttachmentScopeholo

- type: Tag
  id: OHAttachmentScope4x

