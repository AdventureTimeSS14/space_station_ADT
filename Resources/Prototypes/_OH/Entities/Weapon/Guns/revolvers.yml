    sprite: _OH/Weapon/Guns/Pistols/mateba/tiny.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Sprite
    sprite: _OH/Weapon/Guns/Pistols/mateba/big.rsi
  - type: Clothing
    sprite: _OH/Weapon/Guns/Pistols/mateba/tiny.rsi
  - type: Gun
    minAngle: 6
    maxAngle: 12
    fireRate: 4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg