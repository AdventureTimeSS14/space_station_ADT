- type: entity
  name: BaseWeaponRevolver
  parent: BaseItem
  id: BaseWeaponRevolver
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  # - type: AmmoCounter #ADT-tweak: для русской рулетки
  # ADT-Tweak start
  - type: RunAndGunSpreadModifier
    modifyer: 0.1
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1
    damage:
      types:
        Blunt: 7
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  # ADT-Tweak end
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: UseDelay
    delay: 0.66
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
        - SpeedLoaderMagnum
    proto: CartridgeMagnum
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: StaticPrice
    price: 500
  - type: UniqueAction # ADT TWEAK

- type: entity
  name: Deckard
  parent: [BaseWeaponRevolver, BaseSecurityCommandContraband]
  suffix: Под реворк
  id: WeaponRevolverDeckard
  description: A beautifully machined, custom-built revolver. Used when there is no time for the Voight-Kampff test. Loads 5 rounds of .45 magnum.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    fireRate: 2
  - type: RevolverAmmoProvider
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500
  - type: AmmoCounter #ADT-tweak: единственный револьвер со счётчиком патронов

- type: entity
  name: Revolver 9x19
  suffix: Реворкнуто!
  parent: [BaseWeaponRevolver, BaseSecurityContraband] # ADT tweak BaseWeaponRevolver > ADTBaseWeaponRevolver
  id: WeaponRevolver9х19
  description: A single-action revolver manufactured by various companies. It is readily available on the civilian market, making it a popular choice among private investigators. You feel lucky just holding it. Loads 6 rounds of .45 magnum.
  components:
  # ADT tweak Start
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/Revolvers/inspector.rsi # ADT tweak
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  # ADT tweak End
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Revolvers/inspector.rsi # ADT tweak
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    whitelist:
      tags:
        - CartridgePistol
        - SpeedLoaderPistol
    proto: CartridgePistol


- type: entity
  name: Python
  parent: [BaseWeaponRevolver, BaseSyndicateContraband, ADTBasePumpingGun]  # ADT tweak BaseWeaponRevolver > ADTBaseWeaponRevolver
  id: WeaponRevolverPython
  suffix: Реворкнуто!
  description: A powerful double-action revolver manufactured by the Syndicate. Loud and flashy, perfect for any agent looking to make a statement. Loads 6 rounds of .45 magnum.
  components:
  # ADT tweak Start
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/Revolvers/python.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  # ADT tweak End
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Revolvers/python.rsi # ADT tweak
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 3 # 2 > 3 akimbo buff
    availableModes: 
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
  - type: StaticPrice
    price: 1500 # Botany can shit these out like candy, but let's see how it goes
  - type: UseDelay
    delay: 0.01 # akimbo buff

