- type: entity
  parent: ActionIntrinsicStore
  id: ActionRevenantShop
  name: Shop
  description: Opens the ability shop.

- type: entity
  id: ActionRevenantDefile
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 15
  - type: Sprite
    sprite: Interface/Actions/revenant.rsi
    layers:
    - state: rev_corruption
  - type: InstantAction
    event: !type:RevenantDefileActionEvent

- type: entity
  id: ActionRevenantOverloadLights
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 20
  - type: Sprite # ADT-Tweak
    sprite: Interface/Actions/revenant.rsi
    layers:
    - state: rev_blackout
  - type: InstantAction
    event: !type:RevenantOverloadLightsActionEvent

