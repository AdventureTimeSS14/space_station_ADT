# Actions added to mobs in crit.
- type: entity
  abstract: true
  parent: BaseMentalAction
  id: BaseCritAction
  components:
  - type: Action
    itemIconStyle: NoItem

- type: entity
  parent: BaseCritAction
  id: ActionCritSuccumb
  name: Succumb
  description: Accept your fate.
  components:
  - type: Action
    startDelay: true
    useDelay: 10
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: InstantAction
    event: !type:CritSuccumbEvent

- type: entity
  parent: BaseCritAction
  id: ActionCritFakeDeath
  name: Fake Death
  description: Pretend to take your final breath while staying alive.
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: fakedeath
  - type: InstantAction
    event: !type:CritFakeDeathEvent

- type: entity
  parent: ActionCritSuccumb # for use delay
  id: ActionCritLastWords
  name: Say Last Words
  # ADT-Tweak-Start: последние слова наносят урон удушения вместо мгновенного ghost
  description: Whisper your last words to anyone nearby. Each phrase deals 20 points of suffocation damage. You only have 20 characters to work with.
  # ADT-Tweak-End
  components:
  - type: Action
    # ADT-Tweak-Start: кулдаун последних слов 5с вместо унаследованных 10с от ActionCritSuccumb
    useDelay: 5
    # ADT-Tweak-End
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: lastwords
  - type: InstantAction
    event: !type:CritLastWordsEvent
