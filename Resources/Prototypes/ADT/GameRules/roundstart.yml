- type: entityTable
  id: RampingGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: BasicAntagEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseHereticRule
  components:
  - type: HereticRule
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    agentName: heretic-roundend-name

- type: entity
  parent: BaseHereticRule
  id: Heretic
  components:
  - type: GameRule
    minPlayers: 15
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Heretic
      playerRatio: 15
      range:
        min: 1
        max: 3
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
  parent: BaseHereticRule
  id: CalmHeretic
  components:
  - type: GameRule
    minPlayers: 15
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Heretic
      playerRatio: 20
      range:
        min: 1
        max: 2
  - type: Tag
    tags:
      - CalmAntag

- type: entity
  parent: BaseHereticRule
  id: HereticSoloGameRule
  components:
  - type: GameRule
    minPlayers: 25
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:FixedAntagCount
      proto: Heretic

- type: entityTable
  id: ExtendedGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entity
  id: ExtendedStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: ExtendedGameRulesTable

#Облегченное число агентов
- type: entity
  parent: BaseTraitorRule
  id: TraitorLightGameRule
  components:
  - type: GameRule
    minPlayers: 5
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Traitor
      playerRatio: 15
      range:
        min: 1
        max: 4
  - type: AntagRandomObjectives
    sets:
    - groups: TraitorLightObjectiveGroups
      maxPicks: 2
    maxDifficulty: 8

- type: entityTable
  id: TraitorLightGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: BasicAntagEventsTable
      - id: ParadoxCloneSpawn
      - id: SleeperAgentsLight
      - id: LoneOpsSpawn
      - id: VoxRaidersEvent
      - !type:NestedSelector
        tableId: DerelictBorgEventTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entity
  id: TraitorLightStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: TraitorLightGameRulesTable
    minMaxEventTiming:
      min: 300
      max: 900

