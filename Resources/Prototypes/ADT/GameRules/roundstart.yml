- type: entity
  parent: BaseGameRule
  id: ThiefSecretGameRule
  components:
  - type: ThiefRule
  - type: AntagObjectives
    objectives:
    - EscapeThiefShuttleObjective
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefBigObjectiveGroups
      prob: 0.7
      maxPicks: 1
    - groups: ThiefObjectiveGroups
      maxPicks: 10
    maxDifficulty: 2.5
  - type: GameRule
    minPlayers: 25
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 20
      range:
        min: 1
        max: 2


#этот геймрул сделан только для выдачи трейтора
- type: entity
  parent: BaseTraitorRule
  id: TraitorOnly
  components:
  - type: GameRule
    minPlayers: 5
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:FixedAntagCount
      proto: Traitor
  - type: TraitorRule

- type: entity
  parent: SleeperAgents
  id: SleeperAgentsLight
  components:
  - type: AntagRandomObjectives
    sets:
    - groups: TraitorLightObjectiveGroups
    maxDifficulty: 8

# Blob
- type: entity
  id: BlobRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BlobRule
  - type: GameRule

- type: entity
  id: BlobGameMode
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BlobRule
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: ADTBlob

- type: entity
  id: BlobSpawn
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 6
    duration: 1
    earliestStart: 50
    minimumPlayers: 20
    maxOccurrences: 2
  - type: GameRule
  - type: BlobSpawnRule
    carrierBlobProtos:
    - ADTSpawnPointGhostBlobRat
    playersPerCarrierBlob: 30
    maxCarrierBlob: 1
