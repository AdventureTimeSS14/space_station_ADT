- type: reagent
  id: RMCNapalmUT
  name: reagent-name-rmcnapalm-ut
  group: Pyrotechnic
  desc: reagent-desc-rmcnapalm-ut
  physicalDesc: reagent-physical-desc-shiny
  flavor: bitter
  color: "#DD9B00"
  # Сила пламени. От неё считается урон в секунду
  intensity: 30
  # Сколько секунд горит плитка
  duration: 20
  # Дальность струи в плитках
  radius: 7
  # Насколько крепче будет молотов из этой жидкости
  intensityMod: 0.5
  # Горит ли смесь без кислорода
  burnsInVacuum: false
  # За сколько секунд смесь догорает без кислорода
  vacuumBurnout: 1.5
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Novakid ]
          inverted: true
        multiplier: 0.4
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Novakid ]
          inverted: true
        damage:
          types:
            Heat: 2
            Poison: 1
            Caustic: 0.5 # based off napalm being an irritant
      - !type:Flammable
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.4
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Novakid ]

