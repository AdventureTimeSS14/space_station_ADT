- type: entity
  parent: ImpactGrenadeBase
  id: RMCGrenadeMolotov
  name: improvised firebomb
  description: A potent, improvised firebomb, coupled with a pinch of gunpowder. Cheap, very effective, and deadly in confined spaces. Commonly found in the hands of rebels and terrorists. It can be difficult to predict how many seconds you have before it goes off, so be careful. Chances are, it might explode in your face.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/molotov.rsi
  # - type: OnUseTimerTrigger
  #   examinable: false
  #   beepSound: null
  # - type: RandomTimerTrigger
  #   min: 1
  #   max: 4
  - type: TileFireOnTrigger
    spawn: RMCTileFireWeak
  - type: Tag
    tags:
    - Grenade
  - type: Construction
    graph: ADTMolotovGrenade
    node: molotov_ready

- type: entity
  parent: [ DrinkBottleBeer, BaseMinorContraband ]
  id: RMCGrenadeMolotovEmpty
  name: fire bomb
  suffix: empty
  description: A weak, improvised incendiary device. This one has no fuel.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/molotov.rsi
    layers:
    - state: empty
      map: ["enum.OpenableVisuals.Layer"]
  # bad dog
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "empty"}
          False: {state: "empty"}
  - type: Construction
    graph: ADTMolotovGrenade
    node: molotov_empty
    defaultTarget: molotov_ready
  - type: Tag
    tags:
    - Trash
