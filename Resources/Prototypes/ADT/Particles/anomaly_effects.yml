- type: particleEffect
  id: DrippingBlood
  sprite:
    sprite: ADT/Particles/generic.rsi
    state: soft_dot
  startColor: "#a80000"
  endColor: "#730b0b"
  alphaOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 1.0
      value: 0.0
  emissionRate: 10
  maxCount: 100
  particleSize: 1
  burst: false
  duration: 0
  gravity: 1
  drag: 0.1
  noiseStrength: 0.15
  noiseFrequency: 0.8
  spreadAngle: 60
  emitAngle: 180
  shape:
    type: CircleFill
    radius: 0.3

