- type: constructionGraph
  id: ExpShell
  start: start
  graph: 
  - node: start
    edges:
    - to: ADTCartridgeExplosiveImprovisedShell
      steps:
      - tag: FireBomb
        icon:
          sprite: Objects/Weapons/Bombs/ied.rsi
          state: icon
        name: construction-graph-tag-firebomb
      - material: Steel
        amount: 1
      - material: Cable
        amount: 5
      - material: Gunpowder
        amount: 1
        doAfter: 4
  - node: ADTCartridgeExplosiveImprovisedShell
    entity: ADTCartridgeExplosiveImprovisedShell

- type: constructionGraph
  id: FlameShell
  start: start
  graph: 
  - node: start
    edges:
    - to: ADTCartridgeFlameUnfinished
      steps:
      - tag: Igniter
        icon:
          sprite: Objects/Devices/igniter.rsi
          state: icon
        name: construction-graph-tag-igniter
      - material: Steel
        amount: 1
      - material: Cable
        amount: 5
      - material: Plasma
        amount: 1
        doAfter: 4

  - node: ADTCartridgeFlameUnfinished
    entity: ADTCartridgeFlameUnfinished
    edges:
    - to: ADTCartridgeFlameImprovisedShell
      conditions:
      - !type:MinSolution
        solution: drink
        reagent:
          ReagentId: Napalm
        quantity: 30
      steps:
       - tool: Screwing
         doAfter: 2

  - node: ADTCartridgeFlameImprovisedShell
    entity: ADTCartridgeFlameImprovisedShell

- type: constructionGraph
  id: SmokeShell
  start: start
  graph: 
  - node: start
    edges:
    - to: ADTCartridgeSmokeUnfinished
      steps:
      - tag: PestSpray
        icon:
          sprite: Objects/Tools/Hydroponics/sprays.rsi
          state: pestspray
        name: construction-graph-tag-pest-spray
      - material: Steel
        amount: 1
      - material: Cable
        amount: 5
        doAfter: 4

  - node: ADTCartridgeSmokeUnfinished
    entity: ADTCartridgeSmokeUnfinished
    edges:
    - to: ADTCartridgeSmokeImprovisedShell
      conditions:
      - !type:MinSolution
        solution: drink
        reagent:
          ReagentId: Phosphorus
        quantity: 10
      steps:
       - tool: Screwing
         doAfter: 2

  - node: ADTCartridgeSmokeImprovisedShell
    entity: ADTCartridgeSmokeImprovisedShell