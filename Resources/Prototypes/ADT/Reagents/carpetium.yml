- type: reagent
  id: ADTCarpetiumWhite
  name: reagent-name-adt-carpetium-white
  group: Special
  desc: reagent-desc-adt-carpetium-white
  physicalDesc: reagent-physical-desc-fibrous
  flavor: carpet
  color: "#DCDCDC"
  tileReactions:
  - !type:CreateEntityTileReaction
    entity: CarpetWhite
    maxOnTileWhitelist:
      tags: [ Carpet ]
  metabolisms:
    Digestion:
      effects:
      - !type:GenericStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Moth ]
        key: Stutter
        component: StutteringAccent
      - !type:ModifyStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Moth ]
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 15

