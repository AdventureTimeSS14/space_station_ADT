- type: reagent
  id: ADTEntropicPolypnium
  name: reagent-name-adt-entropic-polypnium
  group: Toxins
  desc: reagent-desc-adt-entropic-polypnium
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#1d043d"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1.5
            Asphyxiation: 1
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 4
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        type: Add
        time: 2
        probability: 0.2
        conditions:
        - !type:ReagentCondition
          reagent: ADTEntropicPolypnium
          min: 5

