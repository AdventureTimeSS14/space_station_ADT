- type: htnCompound
  id: ADTXenoborgEngiCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ADTFindAllyOperator
            range: 10
            minDamage: 0.05
            allowCritical: true
            components:
              - type: Repairable
        - !type:HTNPrimitiveTask
          operator: !type:ADTSelectBorgItemOperator
            activate: true
            items:
              - WelderExperimental
              - RefuelingWelder
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target

    - preconditions:
        - !type:ADTHostileNearPrecondition
          range: 3
        - !type:ADTBorgItemActivePrecondition
          invert: true
          items:
            - WelderExperimental
            - RefuelingWelder
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ADTSelectBorgItemOperator
            activate: true
            items:
              - WelderExperimental
              - RefuelingWelder

    - preconditions:
        - !type:ADTHostileNearPrecondition
          range: 3
      tasks:
        - !type:HTNCompoundTask
          task: ADTXenoborgMeleeCompound

    - tasks:
        - !type:HTNCompoundTask
          task: ADTXenoborgIdleCompound
