- type: ttsSanitize
  id: ADTTTSSanitizeNumbers
  priority: 300
  rules:
  - !type:TTSSanitizeRegex
    pattern: '(?<=[0-9])[.,](?=[0-9])'
    replacement: ' целых '
  - !type:TTSSanitizeNumbers
  - !type:TTSSanitizeTrim
