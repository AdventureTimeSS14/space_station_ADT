- type: ttsSanitize
  id: ADTTTSSanitizeChars
  priority: 0
  rules:
  - !type:TTSSanitizeTrim
  - !type:TTSSanitizeFilterChars
    allowed: 'a-zA-Zа-яА-ЯёЁ0-9,\-+?!. '

- type: ttsSanitize
  id: ADTTTSSanitizeTranslit
  priority: 200
  rules:
  - !type:TTSSanitizeCharMap
    pattern: '[a-zA-Z]'
    map:
      "a": "а"
      "b": "б"
      "v": "в"
      "g": "г"
      "d": "д"
      "e": "е"
      "je": "ё"
      "zh": "ж"
      "z": "з"
      "i": "и"
      "y": "й"
      "k": "к"
      "l": "л"
      "m": "м"
      "n": "н"
      "o": "о"
      "p": "п"
      "r": "р"
      "s": "с"
      "t": "т"
      "u": "у"
      "f": "ф"
      "h": "х"
      "c": "ц"
      "x": "кс"
      "ch": "ч"
      "sh": "ш"
      "jsh": "щ"
      "hh": "ъ"
      "ih": "ы"
      "jh": "ь"
      "eh": "э"
      "ju": "ю"
      "ja": "я"

