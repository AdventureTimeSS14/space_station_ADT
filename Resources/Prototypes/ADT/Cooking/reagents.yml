- type: reagent
  id: ADTOilSunflower
  name: reagent-name-adt-oil-sunflower
  group: Foods
  desc: reagent-desc-adt-oil-sunflower
  physicalDesc: reagent-physical-desc-oily
  flavor: oily
  color: "#e8c840"
  recognizable: true

- type: entity
  parent: ReagentContainerOliveoil
  id: ADTReagentContainerSunflowerOil
  name: sunflower oil
  description: Plain sunflower oil. Good for almost any frying.
  components:
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/ingredients.rsi
    color: "#ffe680"
    layers:
    - state: oliveoil
      map: ["enum.OpenableVisuals.Layer"]
  - type: Solution
    solution:
      maxVol: 50
      reagents:
      - ReagentId: ADTOilSunflower
        Quantity: 50

- type: reagent
  id: ADTPancakeBatter
  name: reagent-name-adt-pancake-batter
  group: Foods
  desc: reagent-desc-adt-pancake-batter
  physicalDesc: reagent-physical-desc-viscous
  flavor: batter
  color: "#f2dca2"
  recognizable: true
  metabolisms:
    Digestion:
      metabolites:
        Nutriment: 0.4

- type: reaction
  id: ADTCreatePancakeBatter
  impact: Low
  quantized: true
  conserveEnergy: false
