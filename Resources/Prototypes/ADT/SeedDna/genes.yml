# Статические гены по одному на поле SeedData, id совпадает с именем поля
# Типы Chemical и Gas служебные их настройки применяются ко всем строкам химикатов и газов соответственно.
# requiredTechnology категория исследований РНД, открывающая ген
# cost фиксированная стоимость переноса (bool/harvest/служебные гены)
# costPerUnit стоимость за единицу значения для числовых генов
# (реальная цена = значение гена × costPerUnit)

- type: seedDnaGene
  id: NutrientConsumption
  valueType: Float
  min: 0
  max: 10
  requiredTechnology: ADTGeneticEngineeringNutrients
  costPerUnit: 10
  sellPrice: 20
  description: seed-dna-desc-NutrientConsumption

