- type: adtRitual
  id: ADTRitualAshstorm
  categories: [ ADTAshWalker ]
  name: adt-ritual-ashstorm-name
  description: adt-ritual-ashstorm-desc
  shamanOnly: true
  extraInvokers: 2
  charges: 2
  cooldown: 1200
  castTime: 20
  failChance: 0.2
  disasterChance: 0.2
  neededDye: Amber
  totemDye: Amber
  dyeFluff: adt-ritual-dye-amber
  requiredThings:
  - name: adt-ritual-thing-goldgrub
    whitelist:
      tags: [ ADTGoldgrub ]
  checks:
  - !type:ADTRitualThingsCheck
    mustBeDead: true
    reason: adt-ritual-things-must-be-dead
  effects:
  - !type:ADTRitualWeatherEffect
    weather: ADTLavalandWeatherAshfall
    duration: 300
  disasterEffects:
  - !type:ADTRitualDamageEffect
    target: RandomTribesman
    damage:
      types:
        Poison: 95
  - !type:ADTRitualMessageEffect
    target: RandomTribesman
    message: adt-ritual-ashstorm-sick

- type: adtRitual
  id: ADTRitualTransformation
  categories: [ ADTAshWalker ]
  name: adt-ritual-transformation-name
  description: adt-ritual-transformation-desc
  extraInvokers: 1
  cooldown: 480
  castTime: 30
  failChance: 0.5
  disasterChance: 0.3
  deleteThingsOnSuccess: false
  deleteThingsOnFail: true
