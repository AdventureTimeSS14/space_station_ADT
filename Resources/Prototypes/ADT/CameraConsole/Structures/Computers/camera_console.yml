- type: entity
  id: ADTComputerCameraConsole
  parent: BaseComputerAiAccess
  name: advanced camera console
  description: Lets you watch the station through its camera network, even from another map.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: ai-fixer
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: EyeControlConsole
    eyeProto: ADTCameraEye
    area: null
  - type: Computer
    board: ADTCameraConsoleComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: AccessReader
    access: [["Command"]]

- type: entity
  id: ADTCameraConsoleComputerCircuitboard
  parent: BaseComputerCircuitboard
  name: advanced camera console board
  description: A computer printed circuit board for an advanced camera console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ADTComputerCameraConsole
  - type: StaticPrice

- type: entity
