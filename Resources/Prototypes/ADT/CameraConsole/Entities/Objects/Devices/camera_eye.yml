- type: entity
  abstract: true
  parent: [Incorporeal, BaseMob]
  id: ADTCameraEyeBase
  name: camera eye
  description: A remote camera eye piloted from an eye control console.
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Fixtures
    fixtures:
      lightTrigger:
        shape:
          !type:PhysShapeCircle
          radius: 8
        density: 80
        hard: false
        layer:
        - GhostImpassable
  - type: NoFTL
  - type: Eye
    pvsScale: 1.5
  - type: MovementSpeedModifier
    baseWalkSpeed: 20
    baseSprintSpeed: 8
  - type: Visibility
    layer: 2
  - type: Sprite
    sprite: ADT/Xenobiology/Specific/camera_eye.rsi
    layers:
    - state: generic_camera
      shader: unshaded
      map: ["base"]

- type: entity
  parent: ADTCameraEyeBase
  id: ADTCameraEye
  name: camera console eye
  description: A remote camera eye piloted from an advanced camera console.
  categories: [ HideSpawnMenu, DoNotMap ]

- type: entity
  parent: ADTCameraEyeBase
  id: ADTCameraEyeMarker
  name: camera eye marker
  description: A marker used for remote camera eyes.
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
