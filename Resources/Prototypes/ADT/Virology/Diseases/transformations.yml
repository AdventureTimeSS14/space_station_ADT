- type: adtDisease
  id: ADTBaseTransformation
  parent: ADTBaseVirus
  abstract: true
  name: adt-disease-transformation
  agent: adt-disease-agent-transformation
  maxStages: 5
  stageProb: 10
  severity: Dangerous
  canImmunity: false
  spread: NonContagious

- type: adtDisease
  id: ADTDiseaseJungleFever
  parent: ADTBaseTransformation
  name: adt-disease-jungle-fever
  description: adt-disease-jungle-fever-desc
  agent: adt-disease-agent-jungle-fever
  stageProb: 2
  spread: Bites
  cures:
  - JuiceBanana
  severity: Biohazard
  stages:
  - minStage: 2
    maxStage: 4
    effects:
    - !type:PopupMessage
      type: Local
      visualType: MediumCaution
      messages: [ adt-disease-jungle-fever-1, adt-disease-jungle-fever-2 ]
      probability: 0.1
  - minStage: 5
    effects:
    - !type:Polymorph
      prototype: ADTVirusMonkey

