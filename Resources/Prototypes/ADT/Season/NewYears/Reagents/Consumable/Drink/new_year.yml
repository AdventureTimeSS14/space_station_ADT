- type: reagent
  id: ADTHotChocolate
  name: reagent-name-hot-chocolate
  parent: BaseDrink
  desc: reagent-desc-hot-chocolate
  physicalDesc: reagent-physical-desc-aromatic
  flavor: ADTChocolateDrinkFlavor
  color: "#9c9289"
  metamorphicSprite:
    sprite: ADT/Season/NewYears/Objects/Consumable/Drinks/hot_chocolate.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
