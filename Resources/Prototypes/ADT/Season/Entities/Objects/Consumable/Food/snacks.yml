- type: entity
  parent: FoodEggBoiled
  id: ADTFoodEggBoiledEaster
  name: easter egg
  description: easter egg
  components:
  - type: Sprite
    layers:
    - state: red
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: EggCooked
        Quantity: 6
  - type: Temperature
    # preserve temperature from the boiling step
    temperature: 344
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          blue: ""
          green: ""
          orange: ""
          purple: ""
          rainbow: ""
          red: ""
          yellow: ""
