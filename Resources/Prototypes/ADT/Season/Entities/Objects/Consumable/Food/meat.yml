- type: entity
  name: raw chicken wing
  parent: [ FoodMeatRawBase, BaseSlicingRefinableFood ]
  id: ADTFoodMeatChickenWing
  description: Raw wing of chicken. Remember to wash your hands!
  components:
  - type: Sprite
    sprite: ADT/Season/Objects/Consumable/Food/chicken_meat.rsi
    state: raw_wing
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 6
      - ReagentId: Fat
        Quantity: 3
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatChickenCutlet
      amount: 1
  - type: InternalTemperature
  #- type: Construction
  #  graph: ChickenSteak
  #  node: start
  #  defaultTarget: cooked chicken
  - type: Item
    size: Small

