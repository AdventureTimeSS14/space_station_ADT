- type: entity
  name: weisswurst
  parent: FoodMeatBase
  id: ADTFoodMeatWeissWurst
  description: Traditional white Bavarian sausage made of veal, lard and spices.
  suffix: Oktoberfest
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: ADT/Season/Objects/Consumable/Food/meat.rsi #спрайт от Празата
    state: weisswurst
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Solution
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Protein
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 8

