- type: entity
  name: chocolate glaze cake
  parent: [ FoodCakeBase, BaseSlicingRefinableFood ]
  id: ADTFoodCakeChocolateGlazeHeart
  description: A cake with added chocolate.
  components:
  - type: Sprite
    sprite: ADT/Season/Objects/Consumable/Food/Baked/cake.rsi
    state: chocolate_heart
  - type: ToolRefinable
    refineResult:
    - id: ADTFoodCakeChocolateGlazeHeartSlice
      amount: 5
  - type: Solution
    solution:
      maxVol: 35
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Theobromine
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 5

- type: entity
  name: slice of chocolate cake
  parent: FoodCakeSliceBase
  id: ADTFoodCakeChocolateGlazeHeartSlice
  components:
  - type: Sprite
    sprite: ADT/Season/Objects/Consumable/Food/Baked/cake.rsi
    state: chocolate-slice-heart
  - type: Solution
    solution:
      maxVol: 8
      reagents:
      - ReagentId: Nutriment
        Quantity: 4
      - ReagentId: Theobromine
        Quantity: 1
      - ReagentId: Vitamin
        Quantity: 1

