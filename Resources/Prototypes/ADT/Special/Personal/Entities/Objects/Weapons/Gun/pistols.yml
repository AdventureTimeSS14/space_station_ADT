- type: entity
  name: SNP-44 PDV «Maria»
  parent: WeaponPistolMk58
  id: ADTWeaponPistolMaria
  description: SNP-44 PDV «Maria»
  suffix: Personal, PrazzzCool999
  components:
  - type: Sprite
    sprite: ADT/Personalization/maria_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 1
    maxAngle: 15
    angleIncrease: 8
    angleDecay: 9
    fireRate: 1.7
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/ADT/Weapons/Guns/Gunshots/44-shot.ogg
    soundEmpty:
      path: /Audio/ADT/Weapons/Guns/Empty/44-empty.ogg
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    sprite: ADT/Personalization/maria_pistol.rsi
  - type: Clothing
    sprite: ADT/Personalization/maria_pistol.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/ADT/Weapons/Guns/Cock/44-bolt-close.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnum
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineMagnum
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnum
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: Tag
    tags:
    - Sidearm
    - ADTWeaponPistolMaria
  - type: DNAGunLocker

