- type: entity
  name: Deckard
  parent: BaseWeaponRevolver
  id: ADTWeaponRevolverDeckardGold
  description: A rare, custom-built revolver. Use when there is no time for Voight-Kampff test. Uses .45 magnum ammo.
  components:
  - type: Sprite
    sprite: ADT/Personalization/decard_gold.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    selectedMode: FullAuto
    fireRate: 2.6
    availableModes:
    - SemiAuto
    - FullAuto
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 10000

- type: entity
  name: Argument
  parent: [BaseWeaponRevolver, BaseSecurityCommandContraband]
  id: ADTWeaponRevolverArgumentCouatl
  description: A beautifully machined, custom-built revolver. Used when there is no time for the Voight-Kampff test. Loads 5 rounds of .45 magnum.
  suffix: Revolver, Personal, Couatl
  components:
  - type: Sprite
    sprite: ADT/Personalization/couatl_argument.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 2
  - type: RevolverAmmoProvider
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
  - type: Appearance
  - type: StaticPrice
    price: 1500
  - type: Clothing
    sprite: ADT/Personalization/couatl_argument.rsi
  - type: AmmoCounter #ADT-tweak: единственный револьвер со счётчиком патронов
  - type: Construction
    graph: ADTPistolTransforms
    node: icon

- type: entity
  name: Cutter
  parent: BaseWeaponBatterySmall
  id: ADTWeaponCutterBLAD
  description: A self-defense weapon that exhausts organic targets, weakening them until they collapse.
  suffix: Personal, BLAD
  components:
    - type: Item
      size: Small
      shape:
      - 0,0,2,0
      - 0,1,0,1
    - type: MaterialStorage
      storageLimit: 0
      materialWhiteList: [RawUranium, RawPlasma, Plasma, Uranium]
      canEjectStoredMaterials: false
    - type: BatteryRecharge
      multiplier: 1.25
    - type: Sprite
      sprite: ADT/Personalization/cutter_blad.rsi
      state: icon
    - type: Gun
      fireRate: 0.8
      soundGunshot:
        path: /Audio/Weapons/plasma_cutter.ogg
    - type: BatteryAmmoProvider
      proto: ADTBulletCutter
      fireCost: 100
    - type: BatteryWeaponFireModes
      fireModes:
      - proto: ADTBulletCutterWeak
        fireCost: 100
      - proto: ADTBulletLaserGreenWeak
        fireCost: 150
    - type: Battery
      maxCharge: 2500
      startingCharge: 2500
    - type: Appearance
