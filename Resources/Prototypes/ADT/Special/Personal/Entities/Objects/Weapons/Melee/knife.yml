- type: entity
  id: ADTEgflaerFoldingKnife
  parent: BaseItem
  name: Egflaer Folding Knife
  description: Egflaer Folding Knife
  suffix: Personal, Egflaer
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  # - type: EmbeddableProjectile
  #   sound: /Audio/Weapons/star_hit.ogg
  #   offset: -0.15,0.0
  # - type: LandAtCursor
  # - type: DamageOtherOnHit
  #   damage:
  #     types:
  #       Slash: 10
  # - type: ThrowingAngle
  #   angle: 225
  - type: Clothing
    sprite: ADT/Personalization/egflaer_folded_knife.rsi
    slots: [belt]
    equipSound:
      path: /Audio/Items/belt_equip.ogg
    quickEquip: false
  - type: Sprite
    sprite: ADT/Personalization/egflaer_folded_knife.rsi
    layers:
    - state: icon_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: SwitchableWeapon
    openSound: "/Audio/ADT/Weapons/Melee/egflaer_knife_opening.ogg"
    # closeSound: "/Audio/Items/sheath.ogg"
    #bonkSound: "/Audio/ADT/bonk_dubinka.ogg"
    damageOpen:
      types:
        Slash: 12
    damageFolded:
      types:
        Blunt: 2
        Slash: 2
    staminaDamageFolded: 0
    staminaDamageOpen: 0
    sizeOpened: Small
    sizeClosed: Tiny
  - type: Item
    size: Tiny
    sprite: ADT/Personalization/egflaer_folded_knife.rsi
    storedSprite:
     state: storage_off
     sprite: ADT/Personalization/egflaer_folded_knife.rsi
  - type: UseDelay
    delay: 1.0
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon_on}
          False: {state: icon_off}
  - type: Tag
    tags:
      # - ADTTelescopicBaton
      - CombatKnife
      - Knife
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Utensil
    types:
      - Knife
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg

- type: entity
  name: KS-43 "Cherry"
  parent: CombatKnife
  id: ADTSvet217KnifeKS43Cherry
  description: Not just a knife, but a silent companion of a scout. Light, reliable, and comfortable in the hand, it served where weapons could fail. Without unnecessary glitz or ostentatious brutality, only cold steel, precision, and confidence in every movement. With it, the light shines brighter.
  suffix: Svet217
  components:
  - type: Tag
    tags:
    - ADTSvet217KnifeKS43Cherry
  - type: Sprite
    sprite: ADT/Personalization/svet217_KS-43_Cherry.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -250
    attackRate: 1.7
    damage:
      types:
        Slash: 12
        Piercing: 4
  - type: ThrowingAngle
    angle: 90
  - type: Item
    sprite: ADT/Personalization/svet217_KS-43_Cherry.rsi
