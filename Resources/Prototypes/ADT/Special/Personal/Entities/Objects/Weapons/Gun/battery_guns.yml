- type: entity
  name: YV-2 multiphase stunner
  parent: BaseWeaponBatterySmall
  id: ADTWeaponPistolYV2
  description: new version of antique gun witout selfrcharge
  suffix: Personal, KonnorSmith
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Battery/yv2.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      visible: false
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/Battery/yv2.rsi
  - type: Gun
    fireRate: 3
    projectileSpeed: 60
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 150
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 150
    - proto: ADTBulletLaser
      fireCost: 150
  - type: Battery
    maxCharge: 900
    startingCharge: 900
  - type: Tag
    tags:
    - YV2Pistol
    - Taser
    - Sidearm
  - type: StaticPrice
    price: 5000
  - type: Item
    size: Normal

# Svet217
- type: entity
  name: pulse pistol
  parent: [BaseWeaponBatterySmall, BaseCentcommContraband]
  id: WeaponPulsePistolTypeSvet217
  description: A state of the art energy pistol favoured as a sidearm by the NT operatives.
  suffix: Svet217
  components:
  - type: Sprite
    sprite: ADT/Personalization/svet217_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    storedOffset: -2,-5
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: ADT/Personalization/svet217_pistol.rsi
  # ADT-Tweak start
  # - type: RunAndGunSpreadModifier
  #   modifier: 0.1
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1
    damage:
      types:
        Blunt: 7
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  # ADT-Tweak end
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/ADT/Weapons/Guns/Gunshots/laser_gun_type.ogg
    soundEmpty:
      path: /Audio/ADT/Weapons/Guns/Gunshots/laser_gun_type_empty.ogg
  - type: BatteryAmmoProvider
    proto: PulseType
    fireCost: 100
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 40
    autoRechargePauseTime: 5

- type: entity
  parent: BasicHitscan
  id: PulseType
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 23
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: ADT/Personalization/svet217_pistol_projectiles.rsi
      state: type_laser


