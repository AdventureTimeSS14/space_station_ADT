- type: entity
  name: captain's battle axe
  parent: [ BaseSword, BaseCommandContraband ]
  id: ADTSyrelBattleAxe
  description: A ceremonial weapon of Vazei-Amussa, inherited. The inscription on the hilt is illegible, but it is clearly written in the Sinta'Unathi language.
  components:
  - type: Sprite
    sprite: ADT/Personalization/syrel_battleaxe.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 17 #cmon, it has to be at least BETTER than the rest.
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: Item
    sprite: ADT/Personalization/syrel_battleaxe.rsi
  - type: Tag
    tags:
    - ADTSyrelBattleAxe
  - type: DisarmMalus

#KonnorSmith
- type: entity
  name: fireaxe
  parent: [FireAxe, BaseEngineeringContraband]
  id: ADTFireAxeKori
  description: Truly, the weapon of a madman. Who would think to fight fire with an axe?
  suffix: Personal, KonnorSmith
  components:
  - type: Sprite
    sprite: ADT/Personalization/kori_axe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        # axes are kinda like sharp hammers, you know?
        Blunt: 5
        Slash: 12.5
        Structural: 10
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 12.5
        Structural: 40
  - type: Item
    size: Large
    shape:
    - 0,0,3,3
  - type: Clothing
    sprite: ADT/Personalization/kori_axe.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage #ADT_Tweak - чтобы вешать на спину
