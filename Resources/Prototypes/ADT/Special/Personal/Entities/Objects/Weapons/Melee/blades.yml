- type: entity
  name: Pyotr's sabre
  parent: BaseItem
  id: ADTPyotrSabre
  description: A ceremonial weapon belonging to the Pyotr Shahin. Heavier than stadart captain`s sabre.
  components:
  - type: Sharp
  - type: Sprite
    sprite: ADT/Personalization/pyotr_sabre.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Slash: 22
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  # - type: Reflect
  #   enabled: true
  #   reflectProb: .5 # TODO: Дорабоатть компонент, ругается на поле spread вместе с enabled
  #   spread: 90
  - type: Item
    size: Huge
    sprite: ADT/Personalization/pyotr_sabre.rsi
  - type: DisarmMalus
  - type: Tag
    tags:
    - CaptainSabre

