- type: entity
  name: saeros klevetz
  parent: [ BaseSword, BaseCommandContraband ]
  id: ADTSaerosKlevetz
  description: ADTSaerosKlevetz
  suffix: Personal, Melima, Farrellka
  components:
  - type: Sprite
    sprite: ADT/Personalization/saeros_klevetz.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Piercing: 20 #cmon, it has to be at least BETTER than the rest.
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: Item
    sprite: ADT/Personalization/saeros_klevetz.rsi
  - type: DisarmMalus
  - type: Clothing
    sprite: ADT/Personalization/saeros_klevetz.rsi
    slots: [belt]
    equipSound:
      path: /Audio/Items/belt_equip.ogg
    quickEquip: false

