# FigurinesData
- type: entity
  parent: BaseItem
  id: ADTBaseFigurineNoObjective
  name: figurine
  description: A small miniature.
  abstract: true
  components:
  - type: Sprite
    sprite: ADT/Personalization/figurines.rsi
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 50
  - type: UseDelay
    delay: 10
  - type: Speech
    speechSounds: Pai # it just sounds better

# Lir Battlstorm, Sh4zik figurine
- type: entity
  parent: ADTBaseFigurineNoObjective
  id: ToyFigurineLirBattlstorm
  name: Lir Battlstorm
  description: Funny Vulpcanine. Cool.
  components:
  - type: Sprite
    state: LirBattlstorm
  - type: TriggerOnActivate
  - type: SpeakOnTrigger
    pack: FigurinesLirBattlstorm

