- type: entity
  parent: ADTVehicleKeyJanicart
  id: ADTVehicleKeyPangaariBike
  name: Pangaari bike keys # Для Пани на её ДР в 2026 году от Altius, Mina0, kiwi_fruit, RedLis. Тут был Лис.
  description: Today, its on the highway, and tomorrow, its just a burning wreck.
  components:
  - type: Tag
    tags:
    - VehicleKey
    - ADTKeyPangaariBike
  - type: Sprite
    sprite: ADT/Special/Personal/pangaari_bike.rsi
    state: keys

- type: entity
  parent: ADTBaseVehicleRideable
  id: ADTVehiclePangaariBike
  name: sports motorcycle # Для Пани на её ДР в 2026 году от Altius, Mina0, kiwi_fruit, RedLis. Тут был Лис.
  description: Today, its on the highway, and tomorrow, its just a burning wreck.
  components:
  - type: ADTVehicle
    southOver: true
    northOver: true
    northOverride: -0.1
    southOverride: 0.1
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
    preventInvalidInsertion: false
  - type: Sprite
    sprite: ADT/Special/Personal/pangaari_bike.rsi
    layers:
    - state: vehicle
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    noRot: true
  - type: MovementSpeedModifier
    acceleration: 1
    friction: 1
    baseWalkSpeed: 4.5
    baseSprintSpeed: 7
  - type: Strap
    buckleOffset: "0.1, -0.05"
    #maxBuckleDistance: 1
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    lightMask: ADTLightMaskCone
    autoRot: true
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ADTKeyPangaariBike
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
