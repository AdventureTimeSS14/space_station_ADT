#Levontiy
- type: entity
  parent: Bible
  name: ADTBibleContemplator-name
  description: ADTBibleContemplator-desc
  id: ADTBibleContemplator
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/contemplator_tome.rsi
    layers:
    - state: "watcher_tome"
      shader: "unshaded"
  - type: Icon
    sprite: ADT/Objects/Misc/contemplator_tome.rsi
    state: icon
  - type: Paper
    contentSize: 12000
  - type: PointLight
    enabled: false
    radius: 1.5
    softness: 5
    autoRot: true
    color: "#9932CC"
  - type: UnpoweredFlashlight
    toggleFlashlightSound: /Audio/Effects/eye_close.ogg
  - type: Item
    size: Small
    sprite: ADT/Objects/Misc/contemplator_tome.rsi
  - type: Wieldable
    useDelayOnWield: false
  - type: Clothing
    sprite: ADT/Objects/Misc/contemplator_tome.rsi
    quickEquip: false
    slots: [belt]
  - type: Summonable
    specialItem: SpawnADTMobWatcherBible
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_book.svg.96dpi.png"
    backgroundPatchMargin: 23.0, 16.0, 14.0, 15.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface

- type: entity
  parent: MobWatcherPride
  id: ADTMobWatcherBible
  name: MobWatcherBible-name
  description: MobWatcherBible-desc
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-WatcherBible-name
    description: ghost-role-information-WatcherBible-description
    rules: ghost-role-information-WatcherBible-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: TTS
    voice: shadow_fiend_dota_2

- type: entity
  parent: SpawnMobWatcherPride
  id: SpawnADTMobWatcherBible
  components:
  - type: ConditionalSpawner
    prototypes:
    - ADTMobWatcherBible
