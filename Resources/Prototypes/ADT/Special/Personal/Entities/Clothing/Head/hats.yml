- type: entity
  parent: [ClothingHeadBase, BaseFoldable]
  id: ADTAdmiraldeathushanka
  name: the Quartermaster's Elite Ushanka
  description: A ushaka, with a golden pickaxe on the front and an emblem on the left side. It looks rather worn and old...
  suffix: Personal, ADMIRAL_DEATH
  components:
  - type: Clothing
    sprite: ADT/Special/Personal/admiral_deathqmusnka.rsi
  - type: Appearance
  - type: RussianAccent
    relayAccent: true
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up
  - type: Sprite
    sprite: ADT/Special/Personal/admiral_deathqmusnka.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-up
      map: ["foldedLayer"]
      visible: false
  - type: TemperatureProtection ##ADT-Tweak start
    coefficient: 0.5

