- type: entity
  parent: ClothingBeltBase
  id: ADTPortableYV2Recharger
  name: YV-2 portable recharger
  description: High-tech recharger adapted for portability.
  suffix: Personal, KonnorSmith
  components:
  - type: Appearance
  - type: Item
    size: Large # ADT tweak
    sprite: ADT/Personalization/yv2recharger.rsi
  - type: Sprite
    sprite: ADT/Personalization/yv2recharger.rsi
    state: icon
  - type: Clothing
    sprite: ADT/Personalization/yv2recharger.rsi
    slots: [belt, neck]
    equipSound:
      path: /Audio/Items/belt_equip.ogg
    quickEquip: false
  - type: Charger
    chargeRate: 20 # ADT tweak
    slotId: charger_slot
    portable: true
  # - type: PowerChargerVisuals
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 1
  - type: StaticPrice
    price: 500
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      charger_slot:
        name: оружие
        startingItem: ADTWeaponPistolYV2
        ejectOnInteract: true
        whitelist:
          tags:
          - YV2Pistol
  - type: ItemMapper
    mapLayers:
      yv2:
        whitelist:
          tags:
          - YV2Pistol
    sprite: ADT/Personalization/yv2recharger.rsi
