#Rip_Zoro
- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase]
  id: ADTClothingBeltZoroSheath
  suffix: Rip_Zoro
  name: The scabbard of the legendary katana
  description: The scabbard of a legendary swordsman...
  components:
  - type: Sprite
    sprite: ADT/Personalization/rip_zoro_sheats.rsi
    state: sheath
  - type: Clothing
    sprite: ADT/Personalization/rip_zoro_sheats.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: Katana
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - Katana
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - Katana
  - type: Appearance

