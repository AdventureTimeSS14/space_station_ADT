#Sir_talter
- type: entity
  parent: [ClothingOuterArmorBasic, BadgeOnClothing]
  id: ADTClothingOuterArmorMinerSirtalter
  name: plated explorer suit
  description: This explorer suit is reinforced with goliath hides. The pinnacle of mining ingenuity and Lavaland's own madness in the field of defense.
  suffix: Personal, Sir_talter
  components:
  - type: Sprite
    sprite: ADT/Personalization/sirtalter_armorminer.rsi
  - type: Clothing
    sprite: ADT/Personalization/sirtalter_armorminer.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.7
    coolingCoefficient: 1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.4
        Piercing: 0.95
        Heat: 0.6
        Caustic: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.70
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetMinerSirtalter
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      badge: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      toggleable-clothing: !type:ContainerSlot {}

