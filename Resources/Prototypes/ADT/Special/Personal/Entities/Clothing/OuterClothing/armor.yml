  components:
  - type: Sprite
    sprite: ADT/Personalization/Mishail_armored_jacket_sec_officer.rsi
    state: icon
  - type: Clothing
    sprite: ADT/Personalization/Mishail_armored_jacket_sec_officer.rsi

- type: entity
  parent: ADTClothingBlueshieldArmor
  id: ADTClothingOuterBSArmor
  name: tattered ceremonial armor of the "Blue Shield" officer.
  description: This armor piece was made specifically to order for officer "Blue Shield" O.G. This armor provides excellent protection against bullets and moderate protection against impacts and cuts. There is a tiny graffiti with a pink pig on the back.
  components:
  - type: Sprite
    sprite: ADT/Personalization/Raven559/blue_shield_ceremonial_armor.rsi
  - type: Clothing
    sprite: ADT/Personalization/Raven559/blue_shield_ceremonial_armor.rsi

