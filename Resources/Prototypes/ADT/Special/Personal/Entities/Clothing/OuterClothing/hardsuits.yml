#LemonLimeLord
- type: entity
  parent: [ClothingOuterEVASuitBase, BaseMedicalContraband, BaseJetpack] #Despite "Voidsuits are light hardsuits", since it parents of EVA Suits, it goes with the other softsuits
  id: ADTClothingOuterHardsuitParamedLemon
  name: paramedic void suit
  description: A void suit made for paramedics.
  suffix: Personal, LemonLimeLord
  components:
  - type: Construction
    graph: ADTParamedicHardsuitTransforms
    node: icon
  - type: Sprite
    sprite: ADT/Personalization/lemon_paramedic_hardsuit.rsi
    layers:
    - state: icon
  - type: Appearance
  - type: Clothing
    sprite: ADT/Personalization/lemon_paramedic_hardsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier
    walkModifier: 1.1
    sprintModifier: 1.05
  # - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.70
        Radiation: 0.75
        Caustic: 0.5
  - type: GroupExamine
  # - type: StealTarget ADT tweak
  #   stealGroup: ClothingOuterHardsuitVoidParamed ADT tweak
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetParamedLemon
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Effects/Vehicle/ambulancesiren.ogg #not the best sound, but after looking through all of current freesound regarding sirens and ambulance, this was the best compromise
      params:
        volume: -4
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleParamedicSiren
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: red
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 360
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  # - type: Tag
  #   tags:
  #   - CorgiWearable
  #   - WhitelistChameleon
  - type: GasTank
    outputPressure: 42.6
    air:
      # 13 minutes of thrust
      volume: 5
      temperature: 293.15
      moles:
        - 1.025689525 # oxygen
        - 1.025689525 # nitrogen

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ] #Despite acting like a hardsuit helmet, since it inherits from EVA Helmet, it goes here.
  id: ADTClothingHeadHelmetParamedLemon
  name: paramedic void helmet
  description: A void helmet made for paramedics.
  categories: [ HideSpawnMenu ]
  suffix: Personal, LemonLimeLord
  components:
  - type: Sprite
    sprite: ADT/Personalization/lemon_paramedic_helmet.rsi
  - type: Clothing
    sprite: ADT/Personalization/lemon_paramedic_helmet.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.5
  - type: PointLight
    radius: 5
    energy: 2
    color: "#00ffff"
  - type: Tag
    tags:
    # - CorgiWearable
    - HelmetEVA
    # - WhitelistChameleon

- type: entity
  parent: [ClothingOuterHardsuitVoidParamed, BaseMedicalContraband]
  id: ADTClothingOuterHardsuitRachell
  name: Rachell paramedic void suit
  description: A void suit made for paramedics.
  suffix: Personal, Rache11
  components:
  - type: Sprite
    sprite: ADT/Personalization/rachel_hardsuit.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: ADT/Personalization/rachel_hardsuit.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.85
        Caustic: 0.85
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetRachell
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: violet
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: Item
    size: Large
    shape:
    - 0,0,2,2

- type: entity
  parent: [ ClothingHeadHelmetVoidParamed, ClothingHeadEVAHelmetBase ]
  id: ADTClothingHeadHelmetRachell
  name: paramedic void helmet
  description: A void helmet made for paramedics.
  categories: [ HideSpawnMenu ]
  suffix: Personal, Rache11
  components:
  - type: Sprite
    sprite: ADT/Personalization/rachel_hardsuit_helmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.75
  - type: PointLight
    radius: 6
    energy: 2
    color: violet

- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCargoContraband]
  id: ADTClothingOuterHardsuitKringe
  name: Kringe hardsuit
  description: A lightweight hardsuit designed for industrial EVA in zero gravity.
  suffix: Personal, kringe
  components:
  - type: Sprite
    sprite: ADT/Personalization/kringe-hardsuit.rsi
  - type: Clothing
    sprite: ADT/Personalization/kringe-hardsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.7
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Radiation: 0.3 #salv is supposed to have radiation hazards in the future
        Caustic: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHelmetHardsuitKringe
  - type: Tag
    tags:
    - Hardsuit
    - HardsuitSpatio

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ADTClothingHeadHelmetHardsuitKringe
  name: spationaut hardsuit helmet
  description: A sturdy helmet designed for complex industrial operations in space.
  suffix: Personal, kringe
  components:
  - type: Sprite
    sprite: ADT/Personalization/kringe-hardsuit-helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PointLight
    radius: 6
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000
