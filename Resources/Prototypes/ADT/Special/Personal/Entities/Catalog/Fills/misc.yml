- type: entity
  parent: ClothingBeltSheath
  id: ADTClothingBeltPrazatSheath
  name: Prazat sheath
  description: Prazat sheath
  suffix: Personal, PrazzzCool999
  components:
  - type: Sprite
    sprite: ADT/Personalization/prazat_sheath2.rsi
  - type: Clothing
    sprite: ADT/Personalization/prazat_sheath2.rsi
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      item:
        name: Sabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - CaptainSabre
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - CaptainSabre
          - ADTWeaponMeleePrasatChainsword
  - type: Appearance
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: Storage
    grid:
    - 0,0,5,1
    maxItemSize: Small
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      item: !type:ContainerSlot
  - type: Construction
    graph: ADTBeltSheathTransforms
    node: icon

