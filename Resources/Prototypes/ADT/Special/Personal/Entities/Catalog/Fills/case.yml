- type: entity
  id: ADTWeaponCasePrazat
  name: weapon case Prazat
  description: weapon case Prazat
  parent: [BaseStorageItem, BaseBagOpenClose]
  suffix: Personal, PrazzzCool999
  components:
  - type: Sprite
    sprite: ADT/Personalization/prazat_weaponcase.rsi
    state: closed
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
      visible: false
    - state: pistolhawk
      map: ["pistolhawk"]
      visible: false
    - state: pistolmaria
      map: ["pistolmaria"]
      visible: false
  - type: Appearance
  - type: Item
    sprite: ADT/Personalization/prazat_weaponcase.rsi
    size: Normal
  - type: Storage
    grid:
    - 0,0,4,2
    maxItemSize: Small
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ADTWeaponPistolPrazatHawk
        - id: ADTWeaponPistolMaria
        - id: MagazineMagnum
        - id: ADTMagazineMagnumLesser
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: ItemCounter
    count:
      tags: [ADTWeaponPistolPrazatHawk, ADTWeaponPistolMaria]
    composite: true
    layerStates:
    - pistolhawk
    - pistolmaria

- type: entity
  id: ADTPremiumCaseKimerk
  name: premium case
  description: premium case desc
  parent: [BaseStorageItem, BaseBagOpenClose]
  suffix: Personal, kimer_k
  components:
  - type: Sprite
    sprite: ADT/Personalization/Kimer_k/kimer_k_premium_case.rsi
    state: closed
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
      visible: false
    # Слои заполнения
    - state: full-item-open
      map: ["full-item-open"]
      visible: false
    - state: bez_trex
      map: ["bez_trex"]
      visible: false
    - state: bez_dvux
      map: ["bez_dvux"]
      visible: false
    - state: bez_loshki
      map: ["bez_loshki"]
      visible: false
  - type: Appearance
  - type: Item
    sprite: ADT/Personalization/Kimer_k/kimer_k_premium_case.rsi
    size: Normal
  - type: Storage
    grid:
    - 0,0,4,2
    maxItemSize: Small
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ADTGoldPlatedDrinkJigger
        - id: ADTGoldPlatedDrinkJigger
        - id: ADTGoldPlatedBarSpoon
        - id: ADTGoldPlatedDrinkShaker
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: ItemCounter
    count:
      tags:
        - ADTGoldPlatedDrinkJiggerTag
        - ADTGoldPlatedBarSpoonTag
        - ADTGoldPlatedDrinkShakerTag
    composite: true
    layerStates:
      - full-item-open
      - bez_trex
      - bez_dvux
      - bez_loshki

- type: entity
  id: ADTFamilyBusinessWeaponCase
  name: weapon case
  description: A weapon case specially designed for the Evenwood family.
  suffix: Personal, Minokaa, Cethet, NikSAN
  parent: BaseItem
  components:
  - type: Sprite
    sprite: ADT/Personalization/minokaa_cethet_niksan_weapon_case.rsi
    layers:
    - state: closed
    - state: lock
      shader: unshaded
  - type: Item
    sprite: ADT/Personalization/minokaa_cethet_niksan_weapon_case.rsi
    size: Normal
  - type: ActivatableUI
    key: enum.MiningVoucherUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: MiningVoucher
    kits:
    - ADTFamilyBusinessWeaponCasePinkKit
    - ADTFamilyBusinessWeaponCasePurpleKit
    - ADTFamilyBusinessWeaponCaseRedKit
    typeDropPlace: InHands

