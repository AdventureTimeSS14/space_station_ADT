  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  category: Special
  shortDesc: species-short-desc-adt-draconid
  description: "/ServerInfo/ADT/SpeciesDescriptions/Draconid.xml"
  pros:
  - Не нуждаются в дыхании.
  - Получают на 20% меньше физического урона и на 10% меньше урона от огня.
  - Не горят в пепельной буре и почти не боятся жара.
  - Всегда передвигаются быстрее сородичей.
  - Рвут врагов когтями сильнее любого пеплоходца.
  special:
  - Возносятся из пеплоходцев только через Ритуал Души.
  - Чёрная чешуя, тёмно-красные глаза и драконьи рога вместо привычного облика.
  cons:
