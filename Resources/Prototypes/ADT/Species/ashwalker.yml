- type: species
  id: ADTAshWalkerShamanSpecies
  name: species-name-adt-ashwalker-shaman
  roundStart: false
  prototype: ADTMobAshWalkerShaman
  dollPrototype: ADTAppearanceAshWalkerShaman
  defaultSkinTone: "#6b6a4a"
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  category: Special
  shortDesc: species-short-desc-adt-ashwalker-shaman
  description: "/ServerInfo/ADT/SpeciesDescriptions/AshWalkerShaman.xml"
  pros:
  - Не нуждаются в дыхании.
  - Владеют Прикосновением шамана, заживляющим раны соплеменников.
  - Чувствуют направление до священных мест Лазиса.
  - Быстрее передвигаются по Лазису.
  - Могут высечь огонь прямо из пасти.
  special:
  - Проводят племенные ритуалы, недоступные остальным.
  - Не понимают технологию и не могут пользоваться огнестрельным оружием.
  - В племени может быть только один шаман, пока ритуал не приведёт второго.
  cons:
  - Получают на 15% больше физического урона и урона от огня.
  - Получают на 30% больше урона от холода.
  defaultLanguages:
  - Draconic
  maxAge: 70
  oldAge: 45
  youngAge: 20
  minAge: 12

- type: species
