- type: job
  id: ADTSODOfficer
  name: job-name-ADTSODOfficer
  description: job-description-ADTSODOfficer
  playTimeTracker: JobADTSODOfficer
  setPreference: false
  startingGear: ADTSODOfficerGear
  icon: "JobIconADTSODOfficer"
  supervisors: job-supervisors-centcom # Corvax-JobSupervisors
