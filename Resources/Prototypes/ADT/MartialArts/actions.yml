- type: entity
  parent: BaseAction
  id: ActionLegSweep
  name: Leg Sweep
  description: Sweeps the legs out from under a target to knock them down for a few seconds.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite # ADT-Tweak
    sprite: ADT/Actions/kravmaga.rsi
    layers:
    - state: legsweep
  - type: InstantAction
    event: !type:KravMagaActionEvent {}
  - type: KravMagaAction
    configuration: LegSweep
    name: Leg Sweep

- type: entity
  parent: BaseAction
  id: ActionNeckChop
  name: Neck Chop
  description: A hard swing with the side of your hand deals some damage and disables the target's ability to speak for twenty seconds.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite # ADT-Tweak
    sprite: ADT/Actions/kravmaga.rsi
    layers:
    - state: neckchop
  - type: InstantAction
    event: !type:KravMagaActionEvent {}
  - type: KravMagaAction
    configuration: NeckChop
    name: Neck Chop
    effectTime: 20

- type: entity
  parent: BaseAction
  id: ActionLungPunch
  name: Lung Punch
  description: Deals stamina damage and prevents breathing for ten seconds.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite # ADT-Tweak
    sprite: ADT/Actions/kravmaga.rsi
    layers:
    - state: lungpunch
  - type: InstantAction
    event: !type:KravMagaActionEvent {}
  - type: KravMagaAction
    configuration: LungPunch
    name: Lung Punch
    staminaDamage: 40
    effectTime: 10
