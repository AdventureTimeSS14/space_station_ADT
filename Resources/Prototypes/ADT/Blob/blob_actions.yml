- type: entity
  parent: BaseAction
  id: ADTActionCreateBlobFactory
  name: Place Factory Blob (80).
  description: Turns selected normal blob into a factory blob, which will produce up to 3 spores and a blobbernaut if placed next to a core or a node.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobFactory
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobTransformTileActionEvent
      transformFrom: Normal
      tileType: Factory

- type: entity
  parent: BaseAction
  id: ADTActionCreateBlobResource
  name: Place Resource Blob (60)
  description: Turns selected normal blob into a resource blob which will generates resources if placed next to a core or a node.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobResource
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobTransformTileActionEvent
      transformFrom: Normal
      tileType: Resource

- type: entity
  parent: BaseAction
  id: ADTActionCreateBlobNode
  name: Place Node Blob (50)
  description: Turns selected normal blob into a node blob. A node blob will activate effects of factory and resource blobs, heal other blobs and slowly expand, destroying walls and creating normal blobs.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobNode
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobTransformTileActionEvent
      transformFrom: Normal
      tileType: Node

- type: entity
  parent: BaseAction
  id: ADTActionCreateBlobbernaut
  name: Produce a Blobbernaut (60)
  description: Creates a blobbernaut on the selected factory. Each factory can only do this once. The blobbernaut will take damage outside of blob tiles and heal when close to nodes.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobBlobbernaut
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobCreateBlobbernautActionEvent    

- type: entity
  parent: BaseAction
  id: ADTActionSplitBlobCore
  name: Split Core (400)
  description: You can only do this once. Turns selected node into an independent core that will act on its own.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobSplit
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobSplitCoreActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionSwapBlobCore
  name: Relocate core (200)
  description: Swaps the location of your core and the selected node.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobSwap
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobSwapCoreActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionTeleportBlobToCore
  name: Jump to Core
  description: Teleports you to your Blob Core.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobToCore
  - type: InstantAction
    event: !type:BlobToCoreActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionSwapBlobChem
  name: Swap chemicals (70)
  description: Lets you swap your current chemical.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobChemSwap
  - type: InstantAction
    event: !type:BlobSwapChemActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionTransformToBlob
  name: Transform into a blob
  description: Instantly destoys your body and creates the blob core. Make sure to stand on a floor tile, otherwise you will simply disappear.
  components:
  - type: Action
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobToCore
  - type: InstantAction
    event: !type:TransformToBlobActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionDowngradeBlob
  name: Downgrade blob
  description: Turns the selected tile back into a normal blob to install other types of cages.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: BigAction
  - type: Sprite
    sprite: ADT/Blob/Actions/blob.rsi
    layers:
    - state: blobDowngrade
  - type: TargetAction
    range: 200
  - type: WorldTargetAction
    event: !type:BlobTransformTileActionEvent
      transformFrom: Invalid
      tileType: Normal
