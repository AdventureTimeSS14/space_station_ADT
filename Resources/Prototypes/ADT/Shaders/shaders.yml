- type: shader
  id: ADTNightVisionDeviceShader
  kind: source
  path: "/Textures/ADT/Shaders/night_vision_device.swsl"
  params:
    Gain: 3.6
    TotalLighting: 0.0
    WhiteoutThreshold: 0.38
    WhiteoutIntensity: 2.4
    BloomRadius: 16.0
    BloomStrength: 0.9
    CenterClearRadius: 72.0
    CenterClearSoftness: 40.0
    NoiseAmplitude: 0.0
    FlickerStrength: 0.0
    GrainSize: 2.0
    DefectIntensity: 0.0
    ScanlineDark: 0.72

