# Starlight port: night / thermal vision overlays
# Innate NV: lift pitch-black + compress highlights (no white blind).
# Tiers: Weak < Medium(Shadekin/Vulp/Moth) < Strong(Tajaran)
- type: shader
  id: ADTModernNightVisionShader
  kind: source
  path: "/Textures/ADT/Shaders/night.swsl"
  params:
    NightVisionBoost: 2.2
    NightVisionThreshold: 0.28
    BlueTintIntensity: 0.22
    NightVisionLift: 0.03
    CompressStrength: 0.7
    MaxBrightness: 1.0

- type: shader
  id: ADTModernNightVisionShaderMedium
  kind: source
  path: "/Textures/ADT/Shaders/night.swsl"
  params:
    NightVisionBoost: 2.6
    NightVisionThreshold: 0.32
    BlueTintIntensity: 0.2
    NightVisionLift: 0.035
    CompressStrength: 0.6
    MaxBrightness: 1.0

- type: shader
  id: ADTModernNightVisionShaderStrong
  kind: source
  path: "/Textures/ADT/Shaders/night.swsl"
  params:
    NightVisionBoost: 3.0
    NightVisionThreshold: 0.35
    BlueTintIntensity: 0.18
    NightVisionLift: 0.04
    CompressStrength: 0.5
    MaxBrightness: 1.0

- type: shader
  id: ADTThermalVisionScreenShader
