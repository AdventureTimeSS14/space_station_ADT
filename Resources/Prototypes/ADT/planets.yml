- type: planet
  id: Lavaland
  biome: LavaLand
  mapName: shuttle-destination-lavaland
  mapLight: "#6e2c2c"
  dayCycle: false
  addedComponents:
  - type: ADTLavalandMap
  - type: RestrictedRange
    range: 350
    texturepath: "/Textures/ADT/Effects/weather.rsi/ashfal_lvery_light.png"
  - type: ADTRestrictedZone
    terrainMargin: 8
    spawnBuffer: 8
  - type: ADTLavalandGeneration
    safeRadius: 32
    safeEdgeNoise: 6
    safeFalloff: 14
    minRadius: 40
    maxRadius: 330
    riverNodes: 24
    riverMaxRadius: 320
    riverMinWidth: 1.5
    riverMaxWidth: 3.5
    riverMeander: 0.9
    riverEdgeNoise: 1.2
    riverSmoothPasses: 3
    lakes: 10
    lakeMinRadius: 10
    lakeMaxRadius: 22
    lakeOnRiverChance: 0.5
    lakeIslandChance: 0.3
    riverEntity: FloorLavaEntity
    riverBridge: Catwalk
    riverBridgeSpacing: 55
    riverBridgeMaxWidth: 6
    groups:
    # Некрополь
    - prototypes: [ ADTLegionNecropolisSpawner ]
      count: 1
      angle: 90
      minDistanceFromCenter: 318
      maxDistanceFromCenter: 322
      clearance: 75
      riverClearance: 52
    - prototypes: [ ADTLavaDungeonAshVillage ]
      count: 1
      minDistanceFromCenter: 250
      maxDistanceFromCenter: 300
      clearance: 55
    - prototypes: [ ADTHeliosEntranceRoomMarker ]
      count: 1
      minDistanceFromCenter: 140
      maxDistanceFromCenter: 240
      clearance: 20
    - prototypes: [ LavaDungeonRoomMarker ]
      roomWhitelist:
        tags:
        - LavaDungeon
      count: 61
      minSpacing: 50
      minDistanceFromCenter: 55
      avoidRooms: true
  - type: ADTLavalandPopulation
    groups:
    # /datum/spawn_pool/tendrils - roll("5d4") + roll("1d6")
    - minBudget: 10
      maxBudget: 43
      minSpacing: 24
      minDistanceFromCenter: 65
      maxRadius: 320
      entries:
      - prototype: ADTRandomTendrilSpawner
    # Загадка с пазлом
    - minBudget: 1
      maxBudget: 1
      minSpacing: 24
      minDistanceFromCenter: 70
      maxRadius: 310
      entries:
      - prototype: ADTSlidingPuzzleRoomMarker
    # Мировая Кузня
    - minBudget: 1
      maxBudget: 1
      minSpacing: 24
      minDistanceFromCenter: 70
      maxRadius: 310
      entries:
      - prototype: ADTWorldAnvilRoomMarker
    # /datum/spawn_pool/lavaland_fauna - rand(100, 150)
    - minBudget: 165
      maxBudget: 248
      minSpacing: 12
      minDistanceFromCenter: 60
      maxRadius: 325
      entries:
      - prototype: ADTMobLavalandGoliath
        weight: 3
        variants:
        - prototype: ADTMobLavalandGoliathAncient
          probability: 0.1
      - prototype: ADTMobLegion
        weight: 3
      - prototype: MobWatcherLavaland
        weight: 3
        variants:
        - prototype: MobWatcherIcewing
          probability: 0.0025
        - prototype: MobWatcherMagmawing
          probability: 0.0075
      - prototype: ADTMobGoldgrub
        weight: 2
      - prototype: ADTMobGutlunch
        weight: 1
        variants:
        - prototype: ADTMobGubbuck
          probability: 0.025
        - prototype: ADTMobGuthen
          probability: 0.025
  # Планировщик событий лаваленда. Закоменчено, потому что условие щас только одно и через погоду.
  # - type: ADTLavalandEventScheduler
  #   delay:
  #     min: 900
  #     max: 1800
  #   events:
  #   - ADTLavalandEventNecropolisSurge
  - type: ADTMegafaunaSpawn
    count: 67
    minDistanceFromCenter: 100
    maxRadius: 320
    minSpacing: 70
    avoidRooms: true
    bosses:
    - DrakeDungeMarker
    - ADTMegaFaunaBubblegum
    - BloodMinerDungeMarker
    - ADTHierophantArenaSpawner
    - ADTMegaFaunaColossus
    #- ADTMegaFaunaVetusSpeculator
  # LavalandGenerator.dm port
  - type: ADTLavalandCaves
    closedChance: 45
    smoothingIterations: 50
    birthLimit: 4
    deathLimit: 3
    minNodes: 45
    maxNodes: 75
    nodeMinSize: 75
    nodeMaxSize: 90
    hardNoise:
      chance: 40
      iterations: 100
      birthLimit: 4
      deathLimit: 3
    doubleNoise:
      chance: 25
      iterations: 100
      birthLimit: 4
      deathLimit: 3
    walls:
    # /turf/simulated/mineral/random/volcanic
    - prototype: ADTBasalt
      mineralChance: 14
      ores:
        Uranium: 5
        Diamond: 0.5
        Gold: 10
        Copper: 11
        Silver: 12
        Plasma: 20
        Iron: 40
        Gibtonite: 4
        Bluespace: 0.5
        Gem: 1
    # /turf/simulated/mineral/random/volcanic/hard
    - prototype: ADTBasaltHardened
      mineralChance: 24
      ores:
        Uranium: 10
        Diamond: 2
        Gold: 10
        Copper: 21
        Magmite: 0.25
        Silver: 12
        Plasma: 20
        Bluespace: 2
        Gibtonite: 4
        Iron: 40
        Gem: 2
    # /turf/simulated/mineral/random/volcanic/hard/double
    - prototype: ADTBasaltVolcanic
      mineralChance: 60
      ores:
        Uranium: 15
        Diamond: 3
        Gold: 15
        Copper: 31
        Magmite: 0.5
        Silver: 12
        Plasma: 25
        Bluespace: 3
        Gibtonite: 4
        Iron: 45
        Gem: 5
        Bananium: 2
    spread:
      Iron: 20
      Uranium: 5
      Gold: 5
      Silver: 5
      Copper: 5
      Plasma: 8
      Quartz: 8
      Coal: 5
      Sandstone: 5
    extraChance: 2
    extraOres:
      Quartz: 40
      Coal: 30
      Sandstone: 20
      Zinc: 12
      Lead: 12
      ArtifactFragment: 2
  - type: FTLDestination
  - type: ADTBaitDigging
    table: !type:NestedSelector
      tableId: ADTBasaltDigBaitTable
  - type: WeatherScheduler # Regular storms
    stages:
    - duration: # 5-10 minutes of calm
        min: 400
        max: 600
    - weather: ADTLavalandWeatherAshfallLight # ash starts to fall, 30 second warning
      message: ash-storm-telegraph
      duration:
        min: 30
        max: 30
    - duration: # 1-2 minutes of storm
        min: 60
        max: 120
      variants:
      - weather: ADTLavalandWeatherAshfall
        message: ash-storm-alert
        weight: 25
      - weather: ADTLavalandWeatherWind
        message: wind-storm-alert
        weight: 25
      - weather: ADTLavalandWeatherAshfallHeavy
        message: heavy-ash-storm-alert
        weight: 10
      - weather: ADTLavalandWeatherEmberfall
        message: emberfall-alert
        weight: 10
      - weather: ADTLavalandWeatherNecropolisSurge
        message: necropolis-surge-alert
        weight: 4
        eventOnEnd: ADTLavalandEventNecropolisSurge
    - weather: ADTLavalandWeatherAshfallLight
      message: ash-storm-clearing
      duration:
        min: 30
        max: 30
  - type: SunShadow
    alpha: 0.75
    direction: "-1, -1"
  - type: LightCycle
    duration: 1800
    minLightLevel: 0.45
    maxLightLevel: 6
    clipLight: 1.5
    clipLevel: "#FFFFFF"
    minLevel: "#FFFFFF"
    maxLevel: "#FFFFFF"
  - type: ADTLavalandDayNight
    nightThreshold: 0.8
    factions:
    - SimpleHostile
    meleeDamageMultiplier: 1.3
    speedMultiplier: 1.15
    incomingDamageMultiplier: 0.8
    tendrilDelayMultiplier: 0.5
    tendrilExtraSpawns: 1
  atmosphere:
    volume: 2500
    temperature: 320
    moles:
    - 8
    - 14

- type: planet
  id: GlacierSurface
  biome: Snow
  mapName: shuttle-destination-icemoon
  mapLight: "#2B3153"
  addedComponents:
  - type: FTLDestination
    whitelist:
      components:
      - MiningShuttleGuest
      - MiningShuttle
  atmosphere:
    volume: 2500
    temperature: 180 # -93, extreme cold
    moles: # 119kPa, 21% O2
    - 42
    - 158
  biomeMarkerLayers:
  - OreIron
  - OreQuartz
  - OreCoal
  - OreGold
  - OreSilver
  - OrePlasma
  - OreUranium
  - OreDiamond
  - OreArtifactFragment
  - ADTOreBS
  - OreCopper
  - OreZinc
  - OreLead
