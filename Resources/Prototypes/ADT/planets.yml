- type: planet
  id: Lavaland
  biome: LavaLand
  mapName: shuttle-destination-lavaland
  mapLight: "#6e2c2c"
  dayCycle: false
  addedComponents:
  - type: RestrictedRange
    range: 250
    texturepath: "/Textures/ADT/Effects/weather.rsi/ashfal_lvery_light.png"
  - type: ADTLavalandGeneration
    safeRadius: 40
    minRadius: 40
    maxRadius: 230
    groups:
    - prototypes: [ LavaDungeonRoomMarker ]
      count: 10
      minSpacing: 45
      minDistanceFromCenter: 40
      avoidRooms: true
    - prototypes: [ ADTRandomTendrilSpawner ]
      count: 8
      minSpacing: 40
      minDistanceFromCenter: 50
      avoidRooms: true
  - type: ADTMegafaunaSpawn
    count: 2
    minDistanceFromCenter: 100
    maxRadius: 220
    minSpacing: 70
    avoidRooms: true
    bosses:
    - MobDrake
    - ADTMegaFaunaBubblegum
    - BloodMinerDungeMarker
  - type: FTLDestination
  - type: WeatherScheduler # Regular storms
    stages:
    - duration: # 5-10 minutes of calm
        min: 400
        max: 600
    - weather: ADTLavalandWeatherAshfallLight # ash starts to fall, 30 second warning
      message: ash-storm-telegraph
      duration:
        min: 30
        max: 30
    - duration: # 1-2 minutes of storm
        min: 60
        max: 120
      variants:
      - weather: ADTLavalandWeatherAshfall
        message: ash-storm-alert
        weight: 25
      - weather: ADTLavalandWeatherWind
        message: wind-storm-alert
        weight: 25
      - weather: ADTLavalandWeatherAshfallHeavy
        message: heavy-ash-storm-alert
        weight: 10
      - weather: ADTLavalandWeatherEmberfall
        message: emberfall-alert
        weight: 10
    - weather: ADTLavalandWeatherAshfallLight
      message: ash-storm-clearing
      duration:
        min: 30
        max: 30
  - type: SunShadow
    alpha: 0.75
    direction: "-1, -1"
  atmosphere:
    volume: 2500
    temperature: 320
    moles:
    - 8
    - 14
  biomeMarkerLayers:
  - ADTLavaVeinOreIron
  - ADTLavaVeinOreQuartz
  - ADTLavaVeinOreCoal
  - ADTLavaVeinOreGold
  - ADTLavaVeinOreSilver
  - ADTLavaVeinOrePlasma
  - ADTLavaVeinOreUranium
  - ADTLavaVeinOreDiamond
  - ADTLavaVeinOreArtifactFragment
  - ADTLavaVeinADTOreBS
  - ADTLavaVeinOreCopper
  - ADTLavaVeinOreZinc
  - ADTLavaVeinOreLead
  - ADTLavaVeinOreGibtonit
  - ADTLavaGutlunchHerd
  - ADTLavaGutlunchPair
  - ADTLavaGubbucks
  - ADTLavaGoldgrubs

