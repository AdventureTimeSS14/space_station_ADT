# Ensembles - комбинированные плащи/мантии с переключением состояний
# Все плащи требуют 100 часов наигранного времени на соответствующей должности

- type: loadoutEffectGroup
  id: ADTEnsembleCaptain100hour
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCaptain
      time: 360000 # 100 часов

