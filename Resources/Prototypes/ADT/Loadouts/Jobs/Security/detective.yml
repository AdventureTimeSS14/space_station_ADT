# Для разблокировки одёжки следака
- type: loadoutEffectGroup
  id: MasterDetective
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobDetective
      time: 72000 #20 hrs

# Head
- type: loadout
  id: DetectiveInvestigatorCap
  equipment:
    head: ADTClothingHeadHatsInvestigatorCap
  effects:
  - !type:GroupLoadoutEffect
    proto: MasterDetective

- type: loadout
  id: ADTDetectiveOldFedora
  equipment:
    head: ADTClothingHeadOldFedora
  groupBy: "fedoras"

- type: loadout
  id: ADTDetectiveBeret
  equipment:
    head: ADTClothingHeadHatBeretDetective
  groupBy: "berets"

- type: loadout
  id: ADTDetectiveBeretNoir
  equipment:
    head: ADTClothingHeadHatBeretDetectiveNoir
  groupBy: "berets"

