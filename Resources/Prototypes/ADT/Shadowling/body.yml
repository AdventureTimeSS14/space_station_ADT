- type: entity
  id: ADTBaseShadowlingBody
  abstract: true
  components:
  - type: Injurable
    damageContainer: Biological
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#7c2fbdAA"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: LightDetection
  - type: NightVision
    innate: true
  - type: ThermalVision
    highlightOnly: true
    color: "#8a2be2"
  - type: PressureImmunity
  - type: Insulated
    coefficient: 0
  - type: NpcFactionMember
    factions:
    - ADTShadowling
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      ADTShadowlingCollectiveMind: Speak
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 10
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Alerts
  - type: FlashModifier
    modifier: 2

- type: entity
  save: false
  name: shadowling
  description: A hunched, chitinous horror. Its eyes glow a deep crimson and the air around it seems to drink the light.
  parent:
  - ADTAppearanceShadowling
  - ADTBaseShadowlingBody
  - ADTBaseShadowlingMobBase
  id: ADTMobShadowling
  components:
  - type: ADTShadowling
    hatched: true
  - type: Damageable
    damageModifierSet: ADTShadowling
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: LightDetectionDamage
    maxDetection: 3
    detectionValueRegeneration: 0.5
    resistanceModifier: 1
    alertProto: ShadowlingLight
    soundOnDamage:
      path: /Audio/ADT/Hierophant/sear.ogg
    damageToDeal:
      types:
        Heat: 6
    damageToHeal:
      types:
        Blunt: -3
        Slash: -3
        Piercing: -3
        Heat: -3
        Cold: -3
        Shock: -3
        Asphyxiation: -3
        Bloodloss: -3
        Poison: -3

- type: entity
  save: false
  name: lesser shadowling
  description: It used to be a person. Its skin has gone grey and taut, and it moves like something wearing a body it does not fit.
  parent:
  - ADTAppearanceLesserShadowling
  - ADTBaseShadowlingBody
  - ADTBaseShadowlingMobBase
  id: ADTMobLesserShadowling
  components:
  - type: ADTLesserShadowling
  - type: Damageable
    damageModifierSet: ADTLesserShadowling
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: LightDetectionDamage
    maxDetection: 5
    detectionValueRegeneration: 0.5
    resistanceModifier: 0.5
    alertProto: ShadowlingLight
    soundOnDamage:
      path: /Audio/ADT/Hierophant/sear.ogg
    damageToDeal:
      types:
        Heat: 6
    damageToHeal:
      types:
        Blunt: -1.5
        Slash: -1.5
        Piercing: -1.5
        Heat: -1.5
        Cold: -1.5
        Shock: -1.5
        Asphyxiation: -1.5
        Bloodloss: -1.5
        Poison: -1.5

