      HandRight: ADTOrganLesserShadowlingHandRight
      HandLeft: ADTOrganLesserShadowlingHandLeft
      LegLeft: ADTOrganLesserShadowlingLegLeft
      LegRight: ADTOrganLesserShadowlingLegRight
      FootLeft: ADTOrganLesserShadowlingFootLeft
      FootRight: ADTOrganLesserShadowlingFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
