  id: ADTAppearanceShadowling
  categories: [ HideSpawnMenu ]
  name: shadowling appearance
  components:
  - type: Inventory
    templateId: adtShadowling
  - type: InitialBody
    organs:
      Torso: ADTOrganShadowlingTorso
      Head: ADTOrganShadowlingHead
      ArmLeft: ADTOrganShadowlingArmLeft
      ArmRight: ADTOrganShadowlingArmRight
      HandRight: ADTOrganShadowlingHandRight
      HandLeft: ADTOrganShadowlingHandLeft
      LegLeft: ADTOrganShadowlingLegLeft
      LegRight: ADTOrganShadowlingLegRight
      FootLeft: ADTOrganShadowlingFootLeft
      FootRight: ADTOrganShadowlingFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
  - type: HumanoidProfile
    species: ADTShadowlingSpecies

- type: entity
  parent: BaseSpeciesAppearance
  id: ADTAppearanceLesserShadowling
  categories: [ HideSpawnMenu ]
  name: lesser shadowling appearance
  components:
  - type: Inventory
    templateId: adtShadowling
  - type: InitialBody
    organs:
      Torso: ADTOrganLesserShadowlingTorso
      Head: ADTOrganLesserShadowlingHead
      ArmLeft: ADTOrganLesserShadowlingArmLeft
