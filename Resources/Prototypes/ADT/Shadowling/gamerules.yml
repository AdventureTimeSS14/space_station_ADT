- type: entity
  abstract: true
  parent: BaseGameRule
  id: ADTBaseShadowlingRule
  components:
  - type: ADTShadowlingRule

- type: entity
  parent: ADTBaseShadowlingRule
  id: ADTShadowlingGameRule
  components:
  - type: GameRule
    minPlayers: 40
  - type: AntagSelection
    agentName: shadowling-roundend-agent-name
    definitions:
    - prefRoles: [ ADTShadowling ]
      max: 4
      playerRatio: 10
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: false
      mindRoles:
      - MindRoleShadowling

- type: entity
  parent: ADTBaseShadowlingRule
  id: ADTShadowlingSpawn
  components:
  - type: StationEvent
    earliestStart: 30
    weight: 6
    minimumPlayers: 40
    reoccurrenceDelay: 9999
    duration: 1
  - type: GameRule
    minPlayers: 40
  - type: AntagSelection
    agentName: shadowling-roundend-agent-name
    definitions:
    - prefRoles: [ ADTShadowling ]
      min: 1
      max: 1
      playerRatio: 1
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleShadowling
