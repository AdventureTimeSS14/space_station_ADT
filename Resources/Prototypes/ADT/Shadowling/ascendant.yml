- type: entity
  save: false
  name: ascendant shadowling
  description: A large, floating eldritch horror. Pulsing markings run all over its body and its horns scrape the ceiling. Nothing holds it up.
  id: ADTMobAscendantShadowling
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  components:
  - type: ADTAscendantShadowling
  - type: InputMover
  - type: MobMover
  - type: CombatMode
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: ADT/Mobs/Shadowling/ascendant.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: ascendant
    - state: ascendant_glow
      shader: unshaded
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        ascendant: ""
        ascendant_alt: ""
  - type: Appearance
  - type: MobState
    allowedStates:
    - Alive
  - type: MobThresholds
    thresholds:
      0: Alive
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
    baseWeightlessModifier: 1.5
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 60
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 250
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: NpcFactionMember
    factions:
    - ADTShadowling
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      ADTShadowlingCollectiveMind: Speak
  - type: Speech
    speechVerb: LargeMob
  - type: NightVision
    innate: true
  - type: ThermalVision
    highlightOnly: true
    color: "#8a2be2"
  - type: PressureImmunity
  - type: Insulated
    coefficient: 0
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: Flammable
    damage:
      types: {}
  - type: Damageable
    damageModifierSet: ADTAscendantShadowling
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune
  - type: Puller
    needsHands: false
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 4
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: MindContainer
  - type: Alerts

- type: entity
  name: shadow
  description: Faint traces of something moving between the walls.
  parent: BaseMobJaunt
  id: ADTMobShadowlingShadowWalk
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Effects/shadow_walk.rsi
    color: "#8a2be2"
    layers:
    - state: shadow
      shader: unshaded
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 5
  - type: NpcFactionMember
    factions:
    - ADTShadowling
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      ADTShadowlingCollectiveMind: Speak

- type: entity
  name: shadow
  description: A tear in the air where something enormous used to be.
  parent: BaseMobJaunt
  id: ADTMobAscendantPhased
  categories: [ HideSpawnMenu ]
  components:
  - type: ADTAscendantPhased
  - type: Sprite
    sprite: ADT/Effects/shadow_walk.rsi
    color: "#8a2be2"
    layers:
    - state: shadow
      shader: unshaded
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: NpcFactionMember
    factions:
    - ADTShadowling
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      ADTShadowlingCollectiveMind: Speak

- type: entity
  id: ADTEffectShadowWalkEnter
  name: shadow
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: ADT/Effects/shadow_walk.rsi
    color: "#8a2be2"
    layers:
    - state: disappear
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.6

- type: entity
  parent: ADTEffectShadowWalkEnter
  id: ADTEffectShadowWalkExit
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: ADT/Effects/shadow_walk.rsi
    color: "#8a2be2"
    layers:
    - state: appear
      shader: unshaded
