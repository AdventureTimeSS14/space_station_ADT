- type: surgeryGraph
  id: SurgeryBoneRepairHead
  category: SurgeryCategoryBoneRepair
  kindPart: Head
  name: surgery-graph-bone-repair-head-name
  location: surgery-location-head
  startNode: Attached
  nodes:
    - name: Attached
      label: surgery-node-limb-attached-label
      edges:
        - id: Cut
          label: surgery-edge-limb-cut-label
          target: Cut
          conditions:
            - !type:FractureCondition
              organId: Head
            - !type:ClothingCondition
              inverted: true
              slots: [ head ]
          steps:
            - name: surgery-edge-limb-cut-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 3
                      Bloodloss: 4

    - name: Cut
      label: surgery-node-limb-cut-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: ClampBleeders
          label: surgery-edge-limb-clamp-bleeders-label
          target: BleedersClamped
          steps:
            - name: surgery-edge-limb-clamp-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

    - name: BleedersClamped
      label: surgery-node-limb-bleeders-clamped-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: RetractSkin
          label: surgery-edge-limb-retract-skin-label
          target: SkinRetracted
          steps:
            - name: surgery-edge-limb-retract-skin-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: SkinRetracted
      label: surgery-node-limb-skin-retracted-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: GlueBone
          label: surgery-edge-bone-glue-label
          target: BoneGlued
          conditions:
            - !type:FractureCondition
              organId: Head
          steps:
            - name: surgery-edge-bone-glue-label
              quality: BoneMending
              successChance: 0.85
              duration: 2.4
              sound:
                path: /Audio/ADT/Medical/Surgery/bonegel.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3

    - name: BoneGlued
      label: surgery-node-bone-glued-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: SetBone
          label: surgery-edge-bone-set-label
          target: BoneSet
          steps:
            - name: surgery-edge-bone-set-label
              quality: BoneSetting
              successChance: 0.8
              duration: 3.2
              sound:
                path: /Audio/ADT/Medical/Surgery/bonesetter.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 10

    - name: BoneSet
      label: surgery-node-bone-set-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: FinishBone
          label: surgery-edge-bone-finish-label
          target: BoneMended
          steps:
            - name: surgery-edge-bone-finish-label
              quality: BoneMending
              successChance: 0.85
              duration: 2.4
              sound:
                path: /Audio/ADT/Medical/Surgery/bonegel.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3
          effects:
            - !type:MendFractureEffect
              organId: Head

    - name: BoneMended
      label: surgery-node-bone-mended-label
      packages:
        - SurgeryPackageLimbCauterize

