- type: surgeryEdgePackage
  id: SurgeryPackageRepairChestOrgans
  edges:
  - id: RepairHeart
    target: ChestOpen
    label: surgery-edge-repair-heart-label
    conditions:
    - !type:OrganDamagedCondition
      organId: Heart
      minDamagePercent: 0.6
      repeatable: false
    - !type:OrganKindCondition
      organId: Heart
      kind: Organic
    steps:
    - name: surgery-step-repair-heart-1
      quality: Clamping
      successChance: 0.8
      duration: 4.5
      sound:
        path: /Audio/ADT/Medical/Surgery/hemostat1.ogg
      failureEffects:
      - !type:DamageOrganEffect
        organId: Heart
        amount: 10
    - name: surgery-step-repair-heart-2
      quality: Cautery
      successChance: 0.85
      duration: 4.5
      sound:
        path: /Audio/ADT/Medical/Surgery/cautery2.ogg
      failureEffects:
      - !type:DamageOrganEffect
        organId: Heart
        amount: 10
    effects:
    - !type:RepairOrganEffect
      organId: Heart
      healTo: 0.6
  - id: RepairHeartMechanic
    target: ChestOpen
    label: surgery-edge-repair-heart-mechanic-label
    conditions:
    - !type:OrganDamagedCondition
      organId: Heart
      minStage: Bruised
    - !type:OrganKindCondition
      organId: Heart
      kind: Robotic
    steps:
    - name: surgery-step-repair-heart-mechanic-1
      quality: Screwdriving
      successChance: 0.85
      duration: 3
      sound:
        path: /Audio/Items/screwdriver.ogg
      failureEffects:
      - !type:DamageOrganEffect
        organId: Heart
        amount: 10
    - name: surgery-step-repair-heart-mechanic-2
      quality: Pulsing
      successChance: 0.85
      duration: 3
      failureEffects:
      - !type:DamageOrganEffect
        organId: Heart
        amount: 10
    effects:
    - !type:RepairOrganEffect
      organId: Heart
      healTo: 0.1
  - id: RepairLungs
    target: ChestOpen
    label: surgery-edge-repair-lungs-label
    conditions:
    - !type:OrganDamagedCondition
      organId: Lungs
      minDamagePercent: 0.6
      repeatable: false
