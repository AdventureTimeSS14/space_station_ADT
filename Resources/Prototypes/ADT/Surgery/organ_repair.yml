    - name: surgery-step-repair-lungs-2
      quality: Clamping
      successChance: 0.8
      duration: 2.5
      sound:
        path: /Audio/ADT/Medical/Surgery/hemostat1.ogg
      failureEffects:
      - !type:DamageOrganEffect
        organId: Lungs
        amount: 5
    effects:
    - !type:RepairOrganEffect
      organId: Lungs
      healTo: 0.6
  - id: RepairLungsMechanic
    target: ChestOpen
    label: surgery-edge-repair-lungs-mechanic-label
    conditions:
    - !type:OrganDamagedCondition
      organId: Lungs
      minStage: Bruised
    - !type:OrganKindCondition
      organId: Lungs
      kind: Robotic
    steps:
    - name: surgery-step-repair-lungs-mechanic-1
      quality: Screwdriving
      successChance: 0.85
      duration: 3
      sound:
        path: /Audio/Items/screwdriver.ogg
      failureEffects:
      - !type:DamageOrganEffect
        organId: Lungs
        amount: 10
    - name: surgery-step-repair-lungs-mechanic-2
