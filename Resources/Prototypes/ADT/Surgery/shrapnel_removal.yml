- type: surgeryGraph
  id: SurgeryShrapnelRemovalHead
  category: SurgeryCategoryShrapnelRemoval
  kindPart: Head
  name: surgery-graph-shrapnel-head-name
  location: surgery-location-head
  startNode: Attached
  nodes:
    - name: Attached
      label: surgery-node-limb-attached-label
      edges:
        - id: Cut
          label: surgery-edge-limb-cut-label
          target: Cut
          conditions:
            - !type:EmbeddedObjectsCondition
              organId: Head
            - !type:ClothingCondition
              inverted: true
              slots: [ head ]
          steps:
            - name: surgery-edge-limb-cut-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 3
                      Bloodloss: 4

    - name: Cut
      label: surgery-node-limb-cut-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: ClampBleeders
          label: surgery-edge-limb-clamp-bleeders-label
          target: BleedersClamped
          steps:
            - name: surgery-edge-limb-clamp-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

    - name: BleedersClamped
      label: surgery-node-limb-bleeders-clamped-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: RetractSkin
          label: surgery-edge-limb-retract-skin-label
          target: SkinRetracted
          steps:
            - name: surgery-edge-limb-retract-skin-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: SkinRetracted
      label: surgery-node-limb-skin-retracted-label
      packages:
        - SurgeryPackageLimbCauterize
      edges:
        - id: RemoveObjects
          label: surgery-edge-shrapnel-remove-label
          target: ObjectsRemoved
          conditions:
            - !type:EmbeddedObjectsCondition
              organId: Head
          steps:
            - name: surgery-edge-shrapnel-remove-label
              quality: Clamping
              successChance: 0.9
              duration: 3.2
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 2
          effects:
            - !type:ExtractEmbeddedEffect
              organId: Head

    - name: ObjectsRemoved
      label: surgery-node-shrapnel-removed-label
      packages:
        - SurgeryPackageLimbCauterize

- type: surgeryGraph
