    - name: Closed
      label: surgery-node-cyber-closed-label
      edges:
        - id: Unscrew
          label: surgery-edge-cyber-unscrew-label
          target: Unscrewed
          conditions:
            - !type:EmbeddedObjectsCondition
              organId: FootRight
            - !type:ClothingCondition
              inverted: true
              slots: [ shoes, socks ]
          steps:
            - name: surgery-edge-cyber-unscrew-label
              quality: Screwdriving
              successChance: 0.9
              duration: 2.4
              sound:
                path: /Audio/Items/screwdriver.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2

    - name: Unscrewed
      label: surgery-node-cyber-unscrewed-label
      packages:
        - SurgeryPackageCyberClose
      edges:
        - id: OpenHatch
          label: surgery-edge-cyber-open-hatch-label
          target: HatchOpen
          steps:
            - name: surgery-edge-cyber-open-hatch-label
              quality: Prying
              successChance: 0.9
              duration: 1.5
              sound:
                path: /Audio/Items/crowbar.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2

    - name: HatchOpen
      label: surgery-node-cyber-hatch-open-label
      packages:
        - SurgeryPackageCyberClose
      edges:
        - id: RemoveObjects
          label: surgery-edge-shrapnel-remove-label
          target: ObjectsRemoved
          conditions:
            - !type:EmbeddedObjectsCondition
              organId: FootRight
          steps:
            - name: surgery-edge-shrapnel-remove-label
              quality: Clamping
              successChance: 0.9
              duration: 3.2
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2
          effects:
            - !type:ExtractEmbeddedEffect
              organId: FootRight

    - name: ObjectsRemoved
      label: surgery-node-shrapnel-removed-label
      packages:
        - SurgeryPackageCyberClose
