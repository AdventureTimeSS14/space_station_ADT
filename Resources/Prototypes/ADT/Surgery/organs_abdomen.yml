- type: surgeryGraph
  id: SurgeryAbdomenOrgans
  category: SurgeryCategoryOrganManipulation
  name: surgery-graph-abdomen-organs-name
  location: surgery-location-abdomen
  startNodes:
    - AbdomenClosed
  nodes:
    - name: AbdomenClosed
      label: surgery-node-abdomen-closed-label
      edges:
        - id: Cut
          label: surgery-edge-abdomen-cut-label
          target: AbdomenIncised
          steps:
            - name: surgery-edge-abdomen-cut-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 5
                      Bloodloss: 10

    - name: AbdomenIncised
      label: surgery-node-abdomen-incised-label
      edges:
        - id: ClampBleeders
          label: surgery-edge-abdomen-clamp-bleeders-label
          target: AbdomenBleedersClamped
          steps:
            - name: surgery-edge-abdomen-clamp-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

        - id: Cauterize
          target: AbdomenClosed
          label: surgery-edge-abdomen-cauterize-label
          steps:
            - name: surgery-edge-abdomen-cauterize-label
              quality: Cautery
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 3
                - !type:CauterizeEffect

    - name: AbdomenBleedersClamped
      label: surgery-node-abdomen-bleeders-clamped-label
      edges:
        - id: RetractSkin
          label: surgery-edge-abdomen-retract-skin-label
          target: AbdomenSkinRetracted
          steps:
            - name: surgery-edge-abdomen-retract-skin-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10

        - id: Cauterize
          target: AbdomenClosed
          label: surgery-edge-abdomen-cauterize-label
          steps:
            - name: surgery-edge-abdomen-cauterize-label
              quality: Cautery
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 3
                - !type:CauterizeEffect

    - name: AbdomenSkinRetracted
      label: surgery-node-abdomen-skin-retracted-label
      edges:
        - id: RetractMuscle
          target: AbdomenOpen
          label: surgery-edge-abdomen-retract-muscle-label
          steps:
            - name: surgery-edge-abdomen-retract-muscle-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10

        - id: Cauterize
          target: AbdomenClosed
          label: surgery-edge-abdomen-cauterize-label
          steps:
            - name: surgery-edge-abdomen-cauterize-label
              quality: Cautery
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
                - !type:CauterizeEffect

    - name: AbdomenOpen
      label: surgery-node-abdomen-open-label
      edges:
        - id: UnretractMuscle
          target: AbdomenSkinRetracted
          label: surgery-edge-abdomen-unretract-muscle-label
          steps:
            - name: surgery-edge-abdomen-unretract-muscle-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 5

        - id: RemoveStomach
          target: AbdomenOpen
          label: surgery-edge-abdomen-remove-stomach-label
          conditions:
            - !type:OrganPresentCondition
              organId: Stomach
          steps:
            - name: surgery-edge-abdomen-remove-stomach-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Stomach
                  amount: 10
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: Stomach

        - id: InsertStomach
          target: AbdomenOpen
          label: surgery-edge-abdomen-insert-stomach-label
          conditions:
            - !type:OrganPresentCondition
              organId: Stomach
              inverted: true
          steps:
            - name: surgery-edge-abdomen-insert-stomach-label
              tools: [ Stomach ]
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Stomach

        - id: RemoveLiver
          target: AbdomenOpen
          label: surgery-edge-abdomen-remove-liver-label
          conditions:
            - !type:OrganPresentCondition
              organId: Liver
          steps:
            - name: surgery-edge-abdomen-remove-liver-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Liver
                  amount: 10
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: Liver

        - id: InsertLiver
          target: AbdomenOpen
          label: surgery-edge-abdomen-insert-liver-label
          conditions:
            - !type:OrganPresentCondition
              organId: Liver
              inverted: true
          steps:
            - name: surgery-edge-abdomen-insert-liver-label
              tools: [ Liver ]
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Liver

        - id: RemoveKidneys
          target: AbdomenOpen
          label: surgery-edge-abdomen-remove-kidneys-label
          conditions:
            - !type:OrganPresentCondition
              organId: Kidneys
          steps:
            - name: surgery-edge-abdomen-remove-kidneys-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Kidneys
                  amount: 10
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: Kidneys

        - id: InsertKidneys
          target: AbdomenOpen
          label: surgery-edge-abdomen-insert-kidneys-label
          conditions:
            - !type:OrganPresentCondition
              organId: Kidneys
              inverted: true
          steps:
            - name: surgery-edge-abdomen-insert-kidneys-label
              tools: [ Kidneys ]
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Kidneys

        - id: RemoveAppendix
          target: AbdomenOpen
          label: surgery-edge-abdomen-remove-appendix-label
          conditions:
            - !type:OrganPresentCondition
              organId: Appendix
          steps:
            - name: surgery-edge-abdomen-remove-appendix-label
              quality: OrganManipulation
              successChance: 0.65
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: Appendix

        - id: InsertAppendix
          target: AbdomenOpen
          label: surgery-edge-abdomen-insert-appendix-label
          conditions:
            - !type:OrganPresentCondition
              organId: Appendix
              inverted: true
          steps:
            - name: surgery-edge-abdomen-insert-appendix-label
              tools: [ Appendix ]
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Appendix
