- type: surgeryGraph
  id: SurgeryCyberDetachArmLeft
  category: SurgeryCategoryCyberDisassembly
  patientKind: Robotic
  kindPart: ArmLeft
  name: surgery-graph-cyber-detach-arm-left-name
  location: surgery-location-arm-left
  startNode: Closed
  nodes:
    - name: Closed
      label: surgery-node-cyber-closed-label
      edges:
        - id: Unscrew
          label: surgery-edge-cyber-unscrew-label
          target: Unscrewed
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
            - !type:ClothingCondition
              inverted: true
              slots: [ jumpsuit, outerClothing ]
          steps:
            - name: surgery-edge-cyber-unscrew-label
              quality: Screwdriving
              successChance: 0.9
              duration: 2.4
              sound:
                path: /Audio/Items/screwdriver.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2

    - name: Unscrewed
      label: surgery-node-cyber-unscrewed-label
      packages:
        - SurgeryPackageCyberClose
      edges:
        - id: OpenHatch
          label: surgery-edge-cyber-open-hatch-label
          target: Open
          steps:
            - name: surgery-edge-cyber-open-hatch-label
              quality: Prying
              successChance: 0.9
              duration: 1.5
              sound:
                path: /Audio/Items/crowbar.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2

    - name: Open
      label: surgery-node-cyber-open-label
      packages:
        - SurgeryPackageCyberClose
      edges:
        - id: ExtractImplant
          label: surgery-edge-limb-extract-implant-label
          perImplant: true
          target: Open
          conditions:
            - !type:HasImplantCondition
              organId: ArmLeft
          steps:
            - name: surgery-edge-limb-extract-implant-label
              quality: OrganManipulation
              successChance: 0.85
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2
          effects:
            - !type:ExtractImplantEffect
              organId: ArmLeft
        - id: Disconnect
          label: surgery-edge-cyber-disconnect-label
          target: Detached
          steps:
            - name: surgery-edge-cyber-disconnect-label
              quality: Wrenching
              successChance: 0.9
              duration: 2
              sound:
                path: /Audio/Items/ratchet.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Blunt: 2
          effects:
            - !type:RemoveOrganEffect
              organId: ArmLeft

    - name: Detached
      label: surgery-node-cyber-detached-label
      edges: []

