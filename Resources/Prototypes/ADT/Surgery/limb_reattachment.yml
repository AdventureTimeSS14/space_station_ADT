- type: surgeryGraph
  id: SurgeryReattachArmLeft
  category: SurgeryCategoryLimbReattachment
  name: surgery-graph-reattach-arm-left-name
  location: surgery-location-arm-left
  startNode: Amputated
  nodes:
    - name: Amputated
      label: surgery-node-limb-amputated-label
      edges:
        - id: OpenStump
          label: surgery-edge-limb-open-stump-label
          target: StumpOpened
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
              inverted: true
          steps:
            - name: surgery-edge-limb-open-stump-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 1
                      Bloodloss: 2

    - name: StumpOpened
      label: surgery-node-limb-stump-opened-label
      edges:
        - id: ClampBleeders
          label: surgery-edge-limb-clamp-bleeders-label
          target: BleedersClamped
          steps:
            - name: surgery-edge-limb-clamp-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

    - name: BleedersClamped
      label: surgery-node-limb-bleeders-clamped-label
      edges:
        - id: RetractSkin
          label: surgery-edge-limb-retract-skin-label
          target: SkinRetracted
          steps:
            - name: surgery-edge-limb-retract-skin-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: SkinRetracted
      label: surgery-node-limb-skin-retracted-label
      edges:
        - id: PrepareStump
          label: surgery-edge-limb-prepare-stump-label
          target: StumpPrepared
          steps:
            - name: surgery-edge-limb-prepare-stump-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 1
                      Bloodloss: 1

    - name: StumpPrepared
      label: surgery-node-limb-stump-prepared-label
      edges:
        - id: Attach
          label: surgery-edge-limb-attach-label
          target: LimbPlaced
          steps:
            - name: surgery-edge-limb-attach-label
              organ: ArmLeft
              successChance: 0.75
              duration: 4
          effects:
            - !type:InsertOrganEffect
              organId: ArmLeft

    - name: LimbPlaced
      label: surgery-node-limb-placed-label
      edges:
        - id: ApplyBoneGel
          label: surgery-edge-limb-bone-gel-first-label
          target: LimbBoneGelled
          steps:
            - name: surgery-edge-limb-bone-gel-first-label
              quality: BoneMending
              successChance: 0.9
              duration: 2

    - name: LimbBoneGelled
      label: surgery-node-limb-bone-gelled-label
      packages:
        - SurgeryPackageLimbCauterize

    - name: Attached
      label: surgery-node-limb-attached-label
      edges: []

