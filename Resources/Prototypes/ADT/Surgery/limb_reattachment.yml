- type: surgeryGraph
  id: SurgeryReattachArmLeft
  category: SurgeryCategoryLimbReattachment
  name: surgery-graph-reattach-arm-left-name
  location: surgery-location-arm-left
  startNode: Amputated
  nodes:
    - name: Amputated
      label: surgery-node-limb-amputated-label
      edges:
        - id: OpenStump
          label: surgery-edge-limb-open-stump-label
          target: StumpOpened
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
              inverted: true
          steps:
            - name: surgery-edge-limb-open-stump-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 1
                      Bloodloss: 2

    - name: StumpOpened
      label: surgery-node-limb-stump-opened-label
      edges:
        - id: Attach
          label: surgery-edge-limb-attach-label
          target: LimbPlaced
          steps:
            - name: surgery-edge-limb-attach-label
              organ: ArmLeft
              successChance: 0.75
              duration: 4
          effects:
            - !type:InsertOrganEffect
              organId: ArmLeft

    - name: LimbPlaced
      label: surgery-node-limb-placed-label
      edges:
        - id: ApplyBoneGelFirst
          label: surgery-edge-limb-bone-gel-first-label
          target: LimbBoneGelled
          steps:
            - name: surgery-edge-limb-bone-gel-first-label
              quality: BoneMending
              successChance: 0.9
              duration: 2

    - name: LimbBoneGelled
      label: surgery-node-limb-bone-gelled-label
      edges:
        - id: SetBone
          label: surgery-edge-limb-set-bone-label
          target: LimbBoneSet
          steps:
            - name: surgery-edge-limb-set-bone-label
              quality: BoneSetting
              successChance: 0.75
              duration: 3

    - name: LimbBoneSet
      label: surgery-node-limb-bone-set-label
      edges:
        - id: ApplyBoneGelSecond
          label: surgery-edge-limb-bone-gel-second-label
          target: Attached
          steps:
            - name: surgery-edge-limb-bone-gel-second-label
              quality: BoneMending
              successChance: 0.9
              duration: 2

    - name: Attached
      label: surgery-node-limb-attached-label
      edges: []

