- type: surgeryGraph
  id: SurgeryReattachArmLeft
  category: SurgeryCategoryLimbReattachment
  name: surgery-graph-reattach-arm-left-name
  startNodes:
    - Amputated
  nodes:
    - name: Amputated
      label: surgery-node-limb-amputated-label
      edges:
        - id: Attach
          label: surgery-edge-limb-attach-label
          target: Attached
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
              inverted: true
          steps:
            - name: Обработать культю
              tools: [ Cautery ]
              successChance: 0.9
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
            - name: Приложить конечность
              tools: [ ArmLeft ]
              duration: 4
          effects:
            - !type:InsertOrganEffect
              organId: ArmLeft
    - name: Attached
      label: surgery-node-limb-attached-label
      edges: []

