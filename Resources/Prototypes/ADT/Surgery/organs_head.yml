              tools: [ Hemostat ]
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 2
          effects:
            - !type:RemoveOrganEffect
              organId: Tongue

        - id: InsertTongue
          target: MouthOpen
          label: surgery-edge-head-insert-tongue-label
          conditions:
            - !type:OrganPresentCondition
              organId: Tongue
              inverted: true
          steps:
            - name: surgery-edge-head-insert-tongue-label
              tools: [ Tongue ]
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
