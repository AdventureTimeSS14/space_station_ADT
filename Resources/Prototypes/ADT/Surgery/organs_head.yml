                      Bloodloss: 1

        - id: RemoveEyes
          target: EyelidRetracted
          label: surgery-edge-head-remove-eyes-label
          conditions:
            - !type:OrganPresentCondition
              organId: Eyes
          steps:
            - name: surgery-edge-head-remove-eyes-label
              tools: [ Hemostat ]
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1
          effects:
            - !type:RemoveOrganEffect
              organId: Eyes

        - id: InsertEyes
          target: EyelidRetracted
          label: surgery-edge-head-insert-eyes-label
          conditions:
            - !type:OrganPresentCondition
              organId: Eyes
              inverted: true
          steps:
            - name: surgery-edge-head-insert-eyes-label
              tools: [ Eyes ]
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
