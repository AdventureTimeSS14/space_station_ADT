              organId: Eyes

    - name: ScalpIncised
      label: surgery-node-head-scalp-incised-label
      edges:
        - id: ClampBleeders
          label: surgery-edge-head-clamp-bleeders-label
          target: ScalpBleedersClamped
          steps:
            - name: surgery-edge-head-clamp-bleeders-label
