- type: surgeryGraph
  id: SurgeryHeadOrgans
  category: SurgeryCategoryOrganManipulation
  name: surgery-graph-head-organs-name
  location: surgery-location-head
  startNode: ScalpClosed
  nodes:
    - name: ScalpClosed
      label: surgery-node-head-scalp-closed-label
      edges:
        - id: Cut
          label: surgery-edge-head-cut-label
          target: ScalpIncised
          conditions:
            - !type:ClothingCondition
              inverted: true
              slots: [ head ]
          steps:
            - name: surgery-edge-head-cut-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 2
                      Bloodloss: 1

        - id: RetractEars
          target: EarsRetracted
          label: surgery-edge-head-retract-ears-label
          steps:
            - name: surgery-edge-head-retract-ears-label
              quality: Retraction
              successChance: 0.8
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: CutThroat
          target: ThroatIncised
          label: surgery-edge-head-cut-throat-label
          conditions:
            - !type:ClothingCondition
              inverted: true
              slots: [ head, mask ]
          steps:
            - name: surgery-edge-head-cut-throat-label
              quality: Incision
              successChance: 0.85
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 2
                      Bloodloss: 1

    - name: EarsRetracted
      label: surgery-node-head-ears-retracted-label
      packages:
        - SurgeryPackageRepairEars
      edges:
        - id: ReleaseEars
          target: ScalpClosed
          label: surgery-edge-head-release-ears-label
          steps:
            - name: surgery-edge-head-release-ears-label
              quality: Retraction
              successChance: 0.8
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: RemoveEars
          target: EarsRetracted
          label: surgery-edge-head-remove-ears-label
          conditions:
            - !type:OrganPresentCondition
              organId: Ears
          steps:
            - name: surgery-edge-head-remove-ears-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Ears
                  amount: 10
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1
          effects:
            - !type:RemoveOrganEffect
              organId: Ears

        - id: InsertEars
          target: EarsRetracted
          label: surgery-edge-head-insert-ears-label
          conditions:
            - !type:OrganPresentCondition
              organId: Ears
              inverted: true
          steps:
            - name: surgery-edge-head-insert-ears-label
              organ: Ears
              successChance: 0.75
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Ears

    - name: ThroatIncised
      label: surgery-node-head-throat-incised-label
      packages:
        - SurgeryPackageScalpCauterize
      edges:
        - id: ClampThroatBleeders
          label: surgery-edge-head-clamp-throat-bleeders-label
          target: ThroatBleedersClamped
          steps:
            - name: surgery-edge-head-clamp-throat-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

    - name: ThroatBleedersClamped
      label: surgery-node-head-throat-bleeders-clamped-label
      packages:
        - SurgeryPackageScalpCauterize
      edges:
        - id: OpenMouth
          target: MouthOpen
          label: surgery-edge-head-open-mouth-label
          steps:
            - name: surgery-edge-head-open-mouth-label
              quality: Retraction
              successChance: 0.8
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: MouthOpen
      label: surgery-node-head-mouth-open-label
      edges:
        - id: CloseMouth
          target: ScalpClosed
          label: surgery-edge-head-close-mouth-label
          steps:
            - name: surgery-edge-head-close-mouth-label
              quality: Retraction
              successChance: 0.8
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: RemoveTongue
          target: MouthOpen
          label: surgery-edge-head-remove-tongue-label
          conditions:
            - !type:OrganPresentCondition
              organId: Tongue
          steps:
            - name: surgery-edge-head-remove-tongue-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Tongue
                  amount: 10
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 2
          effects:
            - !type:RemoveOrganEffect
              organId: Tongue

        - id: InsertTongue
          target: MouthOpen
          label: surgery-edge-head-insert-tongue-label
          conditions:
            - !type:OrganPresentCondition
              organId: Tongue
              inverted: true
          steps:
            - name: surgery-edge-head-insert-tongue-label
              organ: Tongue
              successChance: 0.75
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Tongue

        - id: RemoveVocalCords
          target: MouthOpen
          label: surgery-edge-head-remove-vocal-cords-label
          conditions:
            - !type:OrganPresentCondition
              organId: ADTVocalCords
          steps:
            - name: surgery-edge-head-remove-vocal-cords-label
              quality: OrganManipulation
              successChance: 0.65
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 2
          effects:
            - !type:RemoveOrganEffect
              organId: ADTVocalCords

        - id: InsertVocalCords
          target: MouthOpen
          label: surgery-edge-head-insert-vocal-cords-label
          conditions:
            - !type:OrganPresentCondition
              organId: ADTVocalCords
              inverted: true
          steps:
            - name: surgery-edge-head-insert-vocal-cords-label
              organ: ADTVocalCords
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:InsertOrganEffect
              organId: ADTVocalCords

    - name: ScalpIncised
      label: surgery-node-head-scalp-incised-label
      packages:
        - SurgeryPackageScalpCauterize
      edges:
        - id: ClampBleeders
          label: surgery-edge-head-clamp-bleeders-label
          target: ScalpBleedersClamped
          steps:
            - name: surgery-edge-head-clamp-bleeders-label
              quality: Clamping
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

    - name: ScalpBleedersClamped
      label: surgery-node-head-scalp-bleeders-clamped-label
      packages:
        - SurgeryPackageScalpCauterize
      edges:
        - id: RetractScalp
          label: surgery-edge-head-retract-scalp-label
          target: ScalpRetracted
          steps:
            - name: surgery-edge-head-retract-scalp-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: ScalpRetracted
      label: surgery-node-head-scalp-retracted-label
      packages:
        - SurgeryPackageRepairEyes
        - SurgeryPackageScalpCauterize
      edges:
        - id: SawSkull
          label: surgery-edge-head-saw-skull-label
          target: SkullSawed
          steps:
            - name: surgery-edge-head-saw-skull-label
              quality: Sawing
              successChance: 0.7
              duration: 5
              sound:
                path: /Audio/ADT/Medical/Surgery/saw.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3
                      Bloodloss: 2

    - name: SkullSawed
      label: surgery-node-head-skull-sawed-label
      edges:
        - id: RetractSkull
          target: SkullOpen
          label: surgery-edge-head-retract-skull-label
          steps:
            - name: surgery-edge-head-retract-skull-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10

        - id: ApplyBoneGelFirst
          target: SkullBoneGelled
          label: surgery-edge-head-apply-bone-gel-first-label
          steps:
            - name: surgery-edge-head-apply-bone-gel-first-label
              quality: BoneMending
              successChance: 0.9
              duration: 2

    - name: SkullOpen
      label: surgery-node-head-skull-open-label
      edges:
        - id: OpenSkullCavity
          label: surgery-edge-cavity-open-label
          target: SkullCavityOpen
          steps:
            - name: surgery-edge-cavity-incise-label
              quality: Incision
              successChance: 0.95
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 1
                      Bloodloss: 1
            - name: surgery-edge-cavity-clamp-label
              quality: Clamping
              successChance: 0.95
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

        - id: UnretractSkull
          target: SkullSawed
          label: surgery-edge-head-unretract-skull-label
          steps:
            - name: surgery-edge-head-unretract-skull-label
              quality: Retraction
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10

        - id: RemoveBrain
          target: SkullOpen
          label: surgery-edge-head-remove-brain-label
          conditions:
            - !type:OrganPresentCondition
              organId: Brain
          steps:
            - name: surgery-edge-head-remove-brain-label
              quality: OrganManipulation
              successChance: 0.65
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: Brain

        - id: InsertBrain
          target: SkullOpen
          label: surgery-edge-head-insert-brain-label
          conditions:
            - !type:OrganPresentCondition
              organId: Brain
              inverted: true
          steps:
            - name: surgery-edge-head-insert-brain-label
              organ: Brain
              successChance: 0.75
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Brain

        - id: Lobotomy
          target: SkullOpen
          label: surgery-edge-head-lobotomy-label
          conditions:
            - !type:OrganPresentCondition
              organId: Brain
            - !type:LobotomizedCondition
              inverted: true
          steps:
            - name: surgery-step-head-lobotomy-drill
              quality: Drilling
              successChance: 0.7
              duration: 5
              sound:
                path: /Audio/ADT/Medical/Surgery/saw.ogg
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Brain
                  amount: 15
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3
                      Bloodloss: 2
            - name: surgery-step-head-lobotomy-cut
              quality: Incision
              successChance: 0.6
              duration: 6
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Brain
                  amount: 25
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 2
          effects:
            - !type:LobotomizeEffect

        - id: ExtractMindShield
          label: surgery-edge-head-extract-mindshield-label
          target: SkullOpen
          conditions:
            - !type:HasImplantCondition
              include: [ MindShieldImplant, FakeMindShieldImplant ]
          steps:
            - name: surgery-edge-head-extract-mindshield-label
              quality: OrganManipulation
              successChance: 0.65
              duration: 6.4
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3
                      Bloodloss: 2
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1
          effects:
            - !type:ExtractImplantEffect
              include: [ MindShieldImplant, FakeMindShieldImplant ]

        - id: RemoveShadowTumor
          target: SkullOpen
          label: surgery-edge-head-remove-shadow-tumor-label
          conditions:
            - !type:OrganPresentCondition
              organId: ADTShadowTumor
          steps:
            - name: surgery-edge-head-remove-shadow-tumor-label
              quality: OrganManipulation
              successChance: 0.65
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 2
          effects:
            - !type:RemoveShadowTumorEffect

        - id: RemoveEyes
          target: SkullOpen
          label: surgery-edge-head-remove-eyes-label
          conditions:
            - !type:OrganPresentCondition
              organId: Eyes
          steps:
            - name: surgery-edge-head-remove-eyes-label
              quality: OrganManipulation
              successChance: 0.65
              failureEffects:
                - !type:DamageOrganEffect
                  organId: Eyes
                  amount: 10
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1
          effects:
            - !type:RemoveOrganEffect
              organId: Eyes

        - id: InsertEyes
          target: SkullOpen
          label: surgery-edge-head-insert-eyes-label
          conditions:
            - !type:OrganPresentCondition
              organId: Eyes
              inverted: true
          steps:
            - name: surgery-edge-head-insert-eyes-label
              organ: Eyes
              successChance: 0.75
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Eyes

    - name: SkullCavityOpen
      label: surgery-node-cavity-open-label
      edges:
        - id: StoreSkullItem
          label: surgery-edge-cavity-store-label
          target: SkullCavityOpen
          conditions:
            - !type:CavityItemsCondition
              cavityId: adt-surgery-cavity-head
              max: 0
          steps:
            - name: surgery-edge-cavity-store-label
              anyItem: true
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
          effects:
            - !type:StoreItemEffect
              cavityId: adt-surgery-cavity-head

        - id: RetrieveSkullItems
          label: surgery-edge-cavity-retrieve-label
          target: SkullCavityOpen
          conditions:
            - !type:CavityItemsCondition
              cavityId: adt-surgery-cavity-head
              min: 1
          steps:
            - name: surgery-edge-cavity-retrieve-label
              quality: Retraction
              successChance: 0.9
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/organ1.ogg
              failureEffects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 2
                      Bloodloss: 1
          effects:
            - !type:RetrieveItemsEffect
              cavityId: adt-surgery-cavity-head

        - id: CloseSkullCavity
          label: surgery-edge-cavity-close-label
          target: SkullOpen
          steps:
            - name: surgery-edge-cavity-close-label
              quality: Cautery
              successChance: 0.85
              duration: 4
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
                - !type:CauterizeEffect

    - name: SkullBoneGelled
      label: surgery-node-head-skull-bone-gelled-label
      edges:
        - id: SetBone
          label: surgery-edge-head-set-bone-label
          target: SkullBoneSet
          steps:
            - name: surgery-edge-head-set-bone-label
              quality: BoneSetting
              successChance: 0.75
              duration: 3

    - name: SkullBoneSet
      label: surgery-node-head-skull-bone-set-label
      edges:
        - id: ApplyBoneGelSecond
          label: surgery-edge-head-apply-bone-gel-second-label
          target: SkullBoneGelledTwice
          steps:
            - name: surgery-edge-head-apply-bone-gel-second-label
              quality: BoneMending
              successChance: 0.9
              duration: 2

    - name: SkullBoneGelledTwice
      label: surgery-node-head-skull-bone-gelled-twice-label
      packages:
        - SurgeryPackageScalpCauterize
