              successChance: 0.9
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

        - id: Cauterize
          label: surgery-edge-head-cauterize-label
          target: ScalpClosed
          steps:
            - name: surgery-edge-head-cauterize-label
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
