          label: surgery-edge-head-saw-skull-label
          target: SkullSawed
          steps:
            - name: surgery-edge-head-saw-skull-label
              tools: [ Saw ]
              successChance: 0.9
              duration: 5
              sound:
                path: /Audio/ADT/Medical/Surgery/saw.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 3
                      Bloodloss: 2

        - id: Cauterize
          label: surgery-edge-head-cauterize-label
          target: ScalpClosed
          steps:
            - name: surgery-edge-head-cauterize-label
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 5
                - !type:CauterizeEffect

    - name: SkullSawed
