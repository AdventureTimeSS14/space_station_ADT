- type: surgeryGraph
  id: SurgeryHeadOrgans
  category: SurgeryCategoryOrganManipulation
  name: surgery-graph-head-organs-name
  location: surgery-location-head
  startNodes:
    - ScalpClosed
  nodes:
    - name: ScalpClosed
      label: surgery-node-head-scalp-closed-label
      edges:
        - id: Cut
          label: surgery-edge-head-cut-label
          target: ScalpIncised
          steps:
            - name: surgery-edge-head-cut-label
              tools: [ Scalpel ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 2
                      Bloodloss: 1

        - id: RetractEyelid
          target: EyelidRetracted
          label: surgery-edge-head-retract-eyelid-label
          steps:
            - name: surgery-edge-head-retract-eyelid-label
              tools: [ Retractor ]
              successChance: 0.9
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: RetractEars
          target: EarsRetracted
          label: surgery-edge-head-retract-ears-label
          steps:
            - name: surgery-edge-head-retract-ears-label
              tools: [ Retractor ]
              successChance: 0.9
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: OpenMouth
          target: MouthOpen
          label: surgery-edge-head-open-mouth-label
          steps:
            - name: surgery-edge-head-open-mouth-label
              tools: [ Retractor ]
              successChance: 0.9
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

    - name: EarsRetracted
      label: surgery-node-head-ears-retracted-label
      edges:
        - id: ReleaseEars
          target: ScalpClosed
          label: surgery-edge-head-release-ears-label
          steps:
            - name: surgery-edge-head-release-ears-label
              tools: [ Retractor ]
              successChance: 0.9
              duration: 2
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: RemoveEars
          target: EarsRetracted
          label: surgery-edge-head-remove-ears-label
          conditions:
            - !type:OrganPresentCondition
              organId: Ears
          steps:
            - name: surgery-edge-head-remove-ears-label
              tools: [ Hemostat ]
              successChance: 0.8
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1
          effects:
            - !type:RemoveOrganEffect
              organId: Ears

        - id: InsertEars
          target: EarsRetracted
          label: surgery-edge-head-insert-ears-label
          conditions:
            - !type:OrganPresentCondition
              organId: Ears
              inverted: true
          steps:
            - name: surgery-edge-head-insert-ears-label
              tools: [ Ears ]
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/organ2.ogg
          effects:
            - !type:InsertOrganEffect
              organId: Ears

    - name: MouthOpen
      label: surgery-node-head-mouth-open-label
      edges:
        - id: CloseMouth
          target: ScalpClosed
          label: surgery-edge-head-close-mouth-label
          steps:
            - name: surgery-edge-head-close-mouth-label
              tools: [ Retractor ]
