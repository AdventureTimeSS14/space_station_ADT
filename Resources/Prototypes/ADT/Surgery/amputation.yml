- type: surgeryGraph
  id: SurgeryAmputateArmLeft
  category: SurgeryCategoryAmputation
  name: surgery-graph-amputate-arm-left-name
  startNodes:
    - Attached
  nodes:
    - name: Attached
      label: surgery-node-limb-attached-label
      edges:
        - id: Cut
          label: surgery-edge-limb-cut-label
          target: Cut
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
          steps:
            - name: Сделать надрез
              tools: [ Scalpel ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 3
                      Bloodloss: 10
    - name: Cut
      label: surgery-node-limb-cut-label
      edges:
        - id: Saw
          label: surgery-edge-limb-saw-label
          target: Amputated
          steps:
            - name: Отпилить кость
              tools: [ Saw ]
              successChance: 0.9
              duration: 5
              sound:
                path: /Audio/ADT/Medical/Surgery/saw.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 4
                      Bloodloss: 10
          effects:
            - !type:RemoveOrganEffect
              organId: ArmLeft
            - !type:RemoveOrganEffect
              organId: HandLeft
    - name: Amputated
      label: surgery-node-limb-amputated-label
      edges:
        - id: Cauterize
          label: surgery-edge-limb-cauterize-label
          target: Cauterized
          steps:
            - name: Прижигание
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/Effects/lightburn.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
    - name: Cauterized
      label: surgery-node-limb-cauterized-label
      edges: []

