- type: surgeryGraph
  id: SurgeryAmputateArmLeft
  category: SurgeryCategoryAmputation
  name: surgery-graph-amputate-arm-left-name
  location: surgery-location-arm-left
  startNodes:
    - Attached
  nodes:
    - name: Attached
      label: surgery-node-limb-attached-label
      edges:
        - id: Cut
          label: surgery-edge-limb-cut-label
          target: Cut
          conditions:
            - !type:OrganPresentCondition
              organId: ArmLeft
          steps:
            - name: surgery-edge-limb-cut-label
              tools: [ Scalpel ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Slash: 3
                      Bloodloss: 4

    - name: Cut
      label: surgery-node-limb-cut-label
      edges:
        - id: ClampBleeders
          label: surgery-edge-limb-clamp-bleeders-label
          target: BleedersClamped
          steps:
            - name: surgery-edge-limb-clamp-bleeders-label
              tools: [ Hemostat ]
              successChance: 0.9
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/hemostat1.ogg

        - id: Cauterize
          label: surgery-edge-limb-cauterize-label
          target: Attached
          steps:
            - name: surgery-edge-limb-cauterize-label
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
                - !type:CauterizeEffect

    - name: BleedersClamped
      label: surgery-node-limb-bleeders-clamped-label
      edges:
        - id: RetractSkin
          label: surgery-edge-limb-retract-skin-label
          target: SkinRetracted
          steps:
            - name: surgery-edge-limb-retract-skin-label
              tools: [ Retractor ]
              successChance: 0.9
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/retractor1.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Bloodloss: 1

        - id: Cauterize
          label: surgery-edge-limb-cauterize-label
          target: Attached
          steps:
            - name: surgery-edge-limb-cauterize-label
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
                - !type:CauterizeEffect

    - name: SkinRetracted
      label: surgery-node-limb-skin-retracted-label
      edges:
        - id: Saw
          label: surgery-edge-limb-saw-label
          target: Amputated
          steps:
            - name: surgery-edge-limb-saw-label
              tools: [ Saw ]
              successChance: 0.9
              duration: 5
              sound:
                path: /Audio/ADT/Medical/Surgery/saw.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Piercing: 4
                      Bloodloss: 3
          effects:
            - !type:RemoveOrganEffect
              organId: ArmLeft

        - id: Cauterize
          label: surgery-edge-limb-cauterize-label
          target: Attached
          steps:
            - name: surgery-edge-limb-cauterize-label
              tools: [ Cautery ]
              successChance: 0.95
              duration: 3
              sound:
                path: /Audio/ADT/Medical/Surgery/cautery2.ogg
              effects:
                - !type:DamageEffect
                  damage:
                    types:
                      Heat: 1
                - !type:CauterizeEffect

    - name: Amputated
      label: surgery-node-limb-amputated-label
      edges:
