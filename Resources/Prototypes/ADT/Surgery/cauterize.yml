- type: surgeryEdgePackage
  id: SurgeryPackageLimbCauterize
  edges:
  - id: Cauterize
    label: surgery-edge-limb-cauterize-label
    target: Attached
    steps:
      - name: surgery-edge-limb-cauterize-label
        quality: Cautery
        successChance: 0.85
        duration: 3
        sound:
          path: /Audio/ADT/Medical/Surgery/cautery2.ogg
        effects:
          - !type:DamageEffect
            damage:
              types:
                Heat: 1
          - !type:CauterizeEffect

