  outputs: [ logic-pin-result ]
  behavior: !type:MaxBehavior

# Сравнение

- type: logicElement
  id: LogicEquals
  name: logic-element-equals
  description: logic-element-equals-desc
  category: Comparison
  cost: 1
  color: "#7a6a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  config:
  - name: logic-config-epsilon
    type: Number
    default: "0"
    min: 0
    max: 1000
  behavior: !type:EqualsBehavior

- type: logicElement
  id: LogicGreater
  name: logic-element-greater
  description: logic-element-greater-desc
  category: Comparison
  cost: 1
  color: "#7a6a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:GreaterBehavior

- type: logicElement
  id: LogicLess
  name: logic-element-less
  description: logic-element-less-desc
  category: Comparison
  cost: 1
  color: "#7a6a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:LessBehavior

# Память и время

- type: logicElement
  id: LogicConstant
  name: logic-element-constant
  description: logic-element-constant-desc
  category: Memory
  cost: 1
  color: "#6a4d7a"
  outputs: [ logic-pin-value ]
  config:
  - name: logic-config-value
    type: Text
    default: "1"
  behavior: !type:ConstantBehavior

- type: logicElement
  id: LogicMemory
  name: logic-element-memory
  description: logic-element-memory-desc
  category: Memory
  cost: 2
  color: "#6a4d7a"
  inputs: [ logic-pin-value, logic-pin-write ]
  outputs: [ logic-pin-value ]
  stateSize: 1
  behavior: !type:MemoryBehavior

- type: logicElement
  id: LogicShiftRegister
  name: logic-element-shift-register
  description: logic-element-shift-register-desc
  category: Memory
  cost: 3
  color: "#6a4d7a"
  inputs: [ logic-pin-value, logic-pin-push, logic-pin-reset ]
  outputs: [ logic-pin-value ]
  stateSize: 2
  config:
  - name: logic-config-length
    type: Number
    default: "4"
    min: 1
    max: 64
  behavior: !type:ShiftRegisterBehavior

- type: logicElement
  id: LogicToggle
  name: logic-element-toggle
  description: logic-element-toggle-desc
  category: Memory
  cost: 2
  color: "#6a4d7a"
  inputs: [ logic-pin-toggle, logic-pin-reset ]
  outputs: [ logic-pin-result ]
  stateSize: 2
  behavior: !type:ToggleBehavior

- type: logicElement
  id: LogicEdgeDetector
  name: logic-element-edge-detector
  description: logic-element-edge-detector-desc
  category: Memory
  cost: 2
  color: "#6a4d7a"
  inputs: [ logic-pin-signal ]
  outputs: [ logic-pin-rising, logic-pin-falling ]
  stateSize: 1
  behavior: !type:EdgeDetectorBehavior

- type: logicElement
  id: LogicDelay
  name: logic-element-delay
  description: logic-element-delay-desc
  category: Memory
  cost: 2
  color: "#6a4d7a"
  inputs: [ logic-pin-value ]
  outputs: [ logic-pin-value ]
  stateSize: 3
  config:
  - name: logic-config-delay
    type: Number
    default: "1"
    min: 0
    max: 600
  behavior: !type:DelayBehavior

- type: logicElement
  id: LogicOscillator
  name: logic-element-oscillator
  description: logic-element-oscillator-desc
  category: Memory
  cost: 2
  color: "#6a4d7a"
  inputs: [ logic-pin-enable ]
  outputs: [ logic-pin-signal ]
  stateSize: 1
  config:
  - name: logic-config-frequency
    type: Number
    default: "1"
    min: 0.05
    max: 10
  behavior: !type:OscillatorBehavior

# Текст

- type: logicElement
  id: LogicConcatenation
  name: logic-element-concatenation
  description: logic-element-concatenation-desc
  category: Text
  cost: 1
  color: "#7a4d5f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  config:
  - name: logic-config-separator
    type: Text
    default: ""
  behavior: !type:ConcatenationBehavior

# Связь с устройствами

- type: logicElement
  id: LogicSignalIn
  name: logic-element-signal-in
  description: logic-element-signal-in-desc
  category: Signal
  cost: 1
  color: "#3f7a6a"
  outputs: [ logic-pin-value ]
  config:
  - name: logic-config-port
    type: DevicePort
    default: "1"
    min: 1
    max: 64
  - name: logic-config-replacement
    type: Text
    default: ""
  behavior: !type:SignalInBehavior

- type: logicElement
  id: LogicSignalOut
  name: logic-element-signal-out
  description: logic-element-signal-out-desc
  category: Signal
  cost: 1
  color: "#3f7a6a"
  inputs: [ logic-pin-value ]
  config:
  - name: logic-config-port
    type: DevicePort
    default: "1"
    min: 1
    max: 64
  behavior: !type:SignalOutBehavior

- type: logicElement
  id: LogicDisplay
  name: logic-element-display
  description: logic-element-display-desc
  category: Signal
  cost: 1
  color: "#3f7a6a"
  inputs: [ logic-pin-value ]
  outputs: [ logic-pin-value ]
  behavior: !type:DisplayBehavior

