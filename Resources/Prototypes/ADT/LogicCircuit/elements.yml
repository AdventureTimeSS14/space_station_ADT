# Логика

- type: logicElement
  id: LogicAnd
  name: logic-element-and
  description: logic-element-and-desc
  category: Logic
  cost: 1
  color: "#4d7a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:AndBehavior

- type: logicElement
  id: LogicOr
  name: logic-element-or
  description: logic-element-or-desc
  category: Logic
  cost: 1
  color: "#4d7a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:OrBehavior

- type: logicElement
  id: LogicNot
  name: logic-element-not
  description: logic-element-not-desc
  category: Logic
  cost: 1
  color: "#4d7a3f"
  inputs: [ logic-pin-signal ]
  outputs: [ logic-pin-result ]
  behavior: !type:NotBehavior

- type: logicElement
  id: LogicXor
  name: logic-element-xor
  description: logic-element-xor-desc
  category: Logic
  cost: 1
  color: "#4d7a3f"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:XorBehavior

