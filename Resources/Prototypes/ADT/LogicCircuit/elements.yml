- type: logicElement
  id: LogicAbs
  name: logic-element-abs
  description: logic-element-abs-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-value ]
  outputs: [ logic-pin-result ]
  behavior: !type:AbsBehavior

- type: logicElement
  id: LogicRound
  name: logic-element-round
  description: logic-element-round-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-value ]
  outputs: [ logic-pin-result ]
  config:
  - name: logic-config-digits
    type: Number
    default: "0"
    min: 0
    max: 6
  behavior: !type:RoundBehavior

- type: logicElement
  id: LogicMin
  name: logic-element-min
  description: logic-element-min-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
