  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:SubtractBehavior

- type: logicElement
  id: LogicMultiply
  name: logic-element-multiply
  description: logic-element-multiply-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:MultiplyBehavior

- type: logicElement
  id: LogicDivide
  name: logic-element-divide
  description: logic-element-divide-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
  behavior: !type:DivideBehavior

- type: logicElement
  id: LogicModulo
  name: logic-element-modulo
  description: logic-element-modulo-desc
  category: Arithmetic
  cost: 1
  color: "#3f5f7a"
  inputs: [ logic-pin-a, logic-pin-b ]
  outputs: [ logic-pin-result ]
