# Зависимости. Один прототип = одна зависимость, вся настройка здесь:
# чем кормится (sources), как копится и спадает, как нарастает ломка и чем она бьёт.
# Код конкретные зависимости не различает - добавить новую можно одним прототипом.
#
# Id прототипа - это то, что в yml пишется как kind: у трайта (AddictionTraitEffect)
# и у реагентного эффекта AdjustAddictionLevel.
#
# stages идут по возрастанию: первый элемент - стадия 1. level - уровень привыкания,
# с которого стадия начинается; ниже level первой стадии зависимость считается вылеченной.
#
# Симптомы с одинаковым ключом от разных зависимостей не складываются: побеждает
# пришедший с более тяжёлой стадии. Поэтому дрожь на стадии 3 (амплитуда 10) перебивает
# дрожь на стадии 1 (амплитуда 6), а не суммируется с ней.

- type: addiction
  id: Alcohol
  name: health-analyzer-addiction-alcohol
  sources:
  # В ADT все спиртные наследуют BaseAlcohol
  - !type:AddictionReagentParentSource
    parent: BaseAlcohol
  beginPopup: addiction-begin-alcohol
  dosePopup: addiction-dose-alcohol
  curedPopup: addiction-cured-alcohol
  withdrawal:
    delay: 10m
  stages:
  - level: 25
    popups: [ addiction-withdrawal-alcohol-0 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 6
  - level: 50
    popups: [ addiction-withdrawal-alcohol-1 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 8
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectSlurred
  - level: 75
    popups: [ addiction-withdrawal-alcohol-2 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 10
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectSlurred
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectWithdrawalWeakness

- type: addiction
  id: Nicotine
  name: health-analyzer-addiction-nicotine
  # Никотин ищется по id: своей группы метаболизма у него нет.
  # Priority выше прочих, чтобы id перебивал возможные совпадения по группе или родителю.
  priority: 10
  sources:
  - !type:AddictionReagentSource
    reagent: Nicotine
  beginPopup: addiction-begin-nicotine
  dosePopup: addiction-dose-nicotine
  curedPopup: addiction-cured-nicotine
  # Никотин заметнее прочих: доза и подсадка говорят о себе громче.
  lifecyclePopupType: Medium
  alert: NicotineCraving
  withdrawal:
    delay: 10m
    # Трайтовый уровень не спадает, поэтому тяжесть копится по времени без сигареты,
    # а не прыгает сразу в максимум: сначала тяга, потом муть, и только потом слабость.
    ramp:
    - after: 0s
      stage: 1
    - after: 4m
      stage: 2
    - after: 10m
      stage: 3
    # Предупреждаем заранее, что таймер на иконке подходит к концу.
    warningAt: 0.55
    warningPopups:
    - addiction-craving-nicotine-0
    - addiction-craving-nicotine-1
    - addiction-craving-nicotine-2
    - addiction-craving-nicotine-3
  stages:
  # Никотиновая ломка не трясёт и не заставляет заикаться: тяга, кашель, муть и слабость.
  # Напоминает о себе чаще прочих - игрок должен замечать тягу, а не только симптомы.
  - level: 25
    popupInterval: 25s
    popupType: Medium
    popups:
    - addiction-withdrawal-nicotine-0-0
    - addiction-withdrawal-nicotine-0-1
    - addiction-withdrawal-nicotine-0-2
    - addiction-withdrawal-nicotine-0-3
    - addiction-withdrawal-nicotine-0-4
    - addiction-withdrawal-nicotine-0-5
    emotes:
    - emote: Cough
      popupChance: 0.45
  - level: 50
    popupInterval: 25s
    popupType: MediumCaution
    popups:
    - addiction-withdrawal-nicotine-1-0
    - addiction-withdrawal-nicotine-1-1
    - addiction-withdrawal-nicotine-1-2
    - addiction-withdrawal-nicotine-1-3
    - addiction-withdrawal-nicotine-1-4
    - addiction-withdrawal-nicotine-1-5
    emotes:
    - emote: Cough
      popupChance: 0.7
    symptoms:
    # Длительность должна быть больше ~50 секунд, иначе шейдер опьянения муть не рисует.
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectWoozy
      duration: 70s
  - level: 75
    popupInterval: 25s
    popupType: LargeCaution
    popups:
    - addiction-withdrawal-nicotine-2-0
    - addiction-withdrawal-nicotine-2-1
    - addiction-withdrawal-nicotine-2-2
    - addiction-withdrawal-nicotine-2-3
    - addiction-withdrawal-nicotine-2-4
    - addiction-withdrawal-nicotine-2-5
    emotes:
    # На тяжёлой стадии кашель идёт по своему таймеру, а не по поп-апам.
    - emote: Cough
      interval: 2m
    symptoms:
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectWoozy
      duration: 110s
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectWithdrawalWeakness

- type: addiction
  id: Drug
  name: health-analyzer-addiction-drug
  sources:
  - !type:AddictionReagentGroupSource
    group: Narcotics
  beginPopup: addiction-begin-drug
  dosePopup: addiction-dose-drug
  curedPopup: addiction-cured-drug
  withdrawal:
    delay: 10m
  stages:
  - level: 25
    popups: [ addiction-withdrawal-drug-0 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 6
  - level: 50
    popups: [ addiction-withdrawal-drug-1 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 8
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectStutter
  - level: 75
    popups: [ addiction-withdrawal-drug-2 ]
    symptoms:
    - !type:AddictionJitterSymptom
      amplitude: 10
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectStutter
    - !type:AddictionStatusEffectSymptom
      effect: StatusEffectWithdrawalWeakness
    # Мир теряет краски. Если монохромность уже стоит не от ломки - симптом не вмешивается.
    - !type:AddictionComponentSymptom
      components:
      - type: Monochromacy

# Лекарственные зависимости источников не имеют: канал появляется не от самого приёма,
# а от передоза - реагентным эффектом AdjustAddictionLevel с положительным amount.
