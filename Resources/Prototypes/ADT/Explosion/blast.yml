- type: explosion
  id: ADTBlast
  damagePerIntensity:
    types:
      Blunt: 6
      Heat: 4
  tileBreakChance: [0, 0]
  tileBreakIntensity: [0, 1000]
  lightColor: "#00000000"
  fireColor: "#00000000"
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  sound:
    collection: ADTBlast
  smallSound:
    collection: ADTBlast
  soundFar:
    collection: ADTBlastFar
  smallSoundFar:
    collection: ADTBlastFar

- type: soundCollection
  id: ADTBlast
  files:
  - /Audio/ADT/Mining/explosion1.ogg
  - /Audio/ADT/Mining/explosion2.ogg

- type: soundCollection
  id: ADTBlastFar
  files:
  - /Audio/ADT/Mining/explosionfar.ogg
  - /Audio/ADT/Mining/explosion_distant.ogg

- type: entity
  id: ADTEffectBlast
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: ADT/Effects/blast.rsi
    drawdepth: Effects
    noRot: false
    layers:
    - state: explosion
      shader: unshaded
  - type: TimedDespawn
    lifetime: 1.4

- type: entity
  id: ADTEffectBlastLight
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#C48A18"
    radius: 5
    energy: 3
  - type: TimedDespawn
    lifetime: 1

- type: particleEffect
  id: ADTBlastSmokeWave
  sprite:
    sprite: ADT/Effects/blast.rsi
    state: smoke
  colorOverLifetime:
  - time: 0.0
    color: "#BA9F6DFF"
  - time: 0.13
    color: "#808080E6"
  - time: 0.26
    color: "#FFFFFFB3"
  - time: 1.0
    color: "#FFFFFF00"
  particleSize: 0.3
  sizeOverLifetime:
  - time: 0.0
    value: 1
  - time: 1.0
    value: 8
  lifetime: 5
  lifetimeVariance: 0.5
  speed: 10
  speedVariance: 1
  drag: 2.1
  startRotationVariance: 45
  maxCount: 75
  burst: true
  shape:
    type: Point

- type: particleEffect
  id: ADTBlastSmokeWaveSmall
  parent: ADTBlastSmokeWave
  particleSize: 0.15
  lifetime: 3.5
  maxCount: 45

- type: particleEffect
  id: ADTBlastSmoke
  sprite:
    sprite: ADT/Effects/blast.rsi
    state: smoke
  colorOverLifetime:
  - time: 0.0
    color: "#FA9632FF"
  - time: 0.07
    color: "#C3630CFF"
  - time: 0.14
    color: "#333333F0"
  - time: 0.21
    color: "#808080D0"
  - time: 0.3
    color: "#FFFFFFB0"
  - time: 1.0
    color: "#FFFFFF00"
  particleSize: 0.75
  sizeOverLifetime:
  - time: 0.0
    value: 1
  - time: 1.0
    value: 4
  lifetime: 6
  lifetimeVariance: 0.5
  speed: 9.4
  speedVariance: 1
  drag: 7
  constantForce: 1.5, 3
  rotationSpeedVariance: 200
  maxCount: 45
  burst: true
  shape:
    type: Point

- type: particleEffect
  id: ADTBlastSmokeSmall
  parent: ADTBlastSmoke
  particleSize: 0.45
  lifetime: 3
  speed: 6.25
  maxCount: 15

- type: particleEffect
  id: ADTBlastSmokeDevastation
  parent: ADTBlastSmoke
  particleSize: 1.5
  lifetime: 9
  speed: 14.4

- type: particleEffect
  id: ADTBlastSparks
  sprite:
    sprite: ADT/Effects/blast_flare.rsi
    state: flare
  shader: unshaded
  colorOverLifetime:
  - time: 0.0
    color: "#FFFFFFFF"
  - time: 0.33
    color: "#FFFFFFFF"
  - time: 1.0
    color: "#FFFFFF00"
  particleSize: 0.2
  lifetime: 6
  lifetimeVariance: 0.5
  speed: 20
  speedVariance: 2
  drag: 2.1
  maxCount: 40
  burst: true
  shape:
    type: CircleFill
    radius: 0.25

- type: particleEffect
  id: ADTMineralDebris
  sprite:
    sprite: ADT/Effects/mineral_debris.rsi
    state: rock
  colorOverLifetime:
  - time: 0.0
    color: "#FFFFFFFF"
