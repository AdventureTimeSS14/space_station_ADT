#Vampire

- type: polymorph
  id: VampireBlood
  configuration:
    entity: MobPuddleBlood
    forced: true
    duration: 8
    polymorphSound:
      path: "/Audio/Effects/Fluids/splat.ogg"

- type: polymorph
  id: VampireBats
  configuration:
    entity: MobBats
    forced: true
    polymorphSound:
      path: "/Audio/ADT/Vampire/Effects/Vampire/wings_flapping.ogg"
    exitPolymorphSound:
      path: "/Audio/ADT/Vampire/Effects/Vampire/wings_flapping.ogg"

- type: polymorph
  id: VampireHound
  configuration:
    entity: MobHellHound
    forced: true
    polymorphSound:
      path: "/Audio/ADT/Vampire/Effects/Vampire/wings_flapping.ogg"
    exitPolymorphSound:
      path: "/Audio/ADT/Vampire/Effects/Vampire/wings_flapping.ogg"

