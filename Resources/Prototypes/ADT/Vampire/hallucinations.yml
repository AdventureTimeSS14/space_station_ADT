- type: hallucinationsPack
  id: Vampire
  data:
  - !type:MobHallucinations
    entities:
    - HallucinationMobVampV1
    - HallucinationMobVampV2
    range:
      min: 0
      max: 28
    spawnCount:
      min: 3
      max: 5
    delay:
      min: 15
      max: 15

- type: hallucinationsPack
  id: VampireUlt
  data:
  - !type:MobHallucinations
    entities:
    - HallucinationMobVampUV1
    - HallucinationMobVampUV2
    range:
      min: 0
      max: 28
    spawnCount:
      min: 3
      max: 5
    delay:
      min: 15
      max: 15

- type: entity
  parent: ADTBaseEntityHallucination
  id: HallucinationMobVampV1
  name: "???"
  description: "???"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Vampire/Mobs/Hallucination/greytide_stanbaton.rsi
    state: icon
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - Vampire
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/ADT/Effects/silence.ogg
    angle: 0
    damage:
      types:
        Blunt: 0
  - type: StaminaDamageOnHit
    damage: 5
    sound: /Audio/Weapons/egloves.ogg
    whitelist:
      components:
      - Hallucinating
    blacklist:
      components:
      - Thrall
      - ThrallOwner
  - type: TimedDespawn
    lifetime: 30.0

