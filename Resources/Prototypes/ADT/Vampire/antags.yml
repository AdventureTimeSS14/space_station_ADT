- type: antag
  id: Vampire
  name: roles-antag-vampire-name
  antagonist: true
  setPreference: true
  objective: roles-antag-vampire-objective
  guides: [ Vampires ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 25h
  - !type:DepartmentTimeRequirement
    department: Security
    time: 10h

- type: antagSpecifier
  parent: RestrictedAntag
  id: Vampire
  prefRoles:
  - Vampire
  allowNonHumans: true
  multiAntagSetting: None
  blacklist:
    components:
    - AntagImmune
    - BibleUser
    - Silicon
    - NovakidGlowing
  components:
  - type: HolyAffected
    piercing: false
    bibleSmite: true
    suppressible: true
    vulnerabilityPerPower: 0.001
    maxVulnerability: 2
  - type: Vampire
  - type: RevolutionaryImmune
  - type: ZombieImmune
  - type: NpcFactionMember
    factions:
    - Vampire
  mindRoles:
  - MindRoleVampire
  briefing:
    sound: "/Audio/ADT/Vampire/Ambience/Antag/vampare_start.ogg"

# Ability gear
- type: startingGear
  id: VampireClawsGear
  inhand:
    - WeaponVampireClaws
