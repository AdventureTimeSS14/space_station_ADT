- type: entity
  id: ADTPartAnimal
  parent: BaseItem
  name: "animal body part"
  abstract: true
  components:
  # yes these sprites dont make sense i dont care its better than them being invisible
  - type: Sprite
    sprite: Mobs/Species/Reptilian/parts.rsi
  - type: Damageable
    damageContainer: Biological
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 50
  - type: Tag
    tags:
      - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  parent: ADTPartAnimal
  id: ADTLeftHandAnimal
  name: left animal hand
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: l_hand
  - type: HandOrgan
    handID: left
    data:
      location: Left

- type: entity
  parent: ADTPartAnimal
  id: ADTRightHandAnimal
  name: right animal hand
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: r_hand
  - type: HandOrgan
    handID: right
    data:
      location: Right
