# Kobolt appearance (upstream PR#42476). Kobolt fully reuses Reptilian sprites/organs.
- type: markingsGroup
  parent: Undergarments
  id: Kobalt
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Special:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ LizardTailSmooth ]
    enum.HumanoidVisualLayers.TailOverlay:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ LizardSnoutRound ]
    enum.HumanoidVisualLayers.SnoutCover:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.SnoutOverlay:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Eyes:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 1
      required: false

- type: entity
  parent: AppearanceReptilian
  id: ADTAppearanceKobolt
  categories: [ HideSpawnMenu ]
  name: kobolt appearance
  components:
  - type: HumanoidProfile
    species: KoboltSpecies
  - type: ScaleVisuals
    scale: 0.85, 0.85

- type: entity
  save: false
  name: Urisst' Mzhand
  parent:
  - MobReptilian
  - ADTAppearanceKobolt
  id: MobKobolt
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      180: Dead
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute.
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.06
        Cold: -0.04
        Blunt: -0.08
        Slash: -0.08
        Piercing: -0.08
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ADTCorelanderBlood
        Quantity: 175
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 380
    coldDamageThreshold: 260  #starting temperature damage treshold
    coldDamage:
      types:
        Cold : 0.2 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 0.1 #per second, scales with temperature & other constants
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 140 #lower density
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#801900"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: TemperatureSpeed
    thresholds:
      283: 0.8
      240: 0.6
      200: 0.4
  - type: SlowOnDamage
    speedModifierThresholds:
      46: 0.75
      58: 0.55
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.7
    baseSprintSpeed : 4.5
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      Draconic: Speak
      CintaTaj: Speak
  - type: Sprite
    scale: 0.85, 0.85
  - type: SizeAttributeWhitelist # Frontier
    tall: true
    tallscale: 0.9
    short: true
    shortscale: 0.8
  - type: Thieving
    stealthy: false
    hideStealthyAlert: true
  - type: NightVision
    innate: true
    effectPrototype: ADTEffectNightVisionMedium
