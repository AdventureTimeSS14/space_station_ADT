- type: entity
  abstract: true
  save: false
  parent: BaseSpeciesMobOrganic
  id: ADTMobAshWalkerBase
  components:
  - type: BreathingImmunity
  - type: ADTIgnite
  - type: ADTLavalandSpeed
  - type: NpcFactionMember
    factions:
    - ADTAshWalker
  - type: TemperatureDamage
    heatDamageThreshold: 420
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: LanguageSpeaker
    languages:
      Draconic: Speak
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Thump']
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: TypingIndicator
    proto: lizard
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_lizard
  - type: Wagging
  - type: InjectorsBlocker
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Puller
    needsHands: false
  - type: Injurable
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#800000"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Cold: -0.05
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
  - type: SlowOnDamage
    speedModifierThresholds:
      55: 0.8
      75: 0.7
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureSpeed
    thresholds:
      301: 0.9
      295: 0.8
      285: 0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 215
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: Sprite
    scale: 1.05, 1.05
  - type: SizeAttributeWhitelist
    tall: true
    tallscale: 1.12
    short: true
    shortscale: 0.98

