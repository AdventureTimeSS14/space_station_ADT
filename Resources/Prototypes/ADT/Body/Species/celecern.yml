- type: entity
  save: false
  name: Celecern
  parent:
  - ADTAppearanceCelecern
  - BaseSpeciesMobOrganic
  id: MobCelecern
  components:
  - type: Wagging
  - type: Speech
    speechSounds: Lizard
  - type: Vocal
    sounds:
      Male: ADTCelecernMale
      Female: ADTCelecernFemale
      Unsexed: ADTCelecernFemale
  - type: Damageable
    damageModifierSet: Celecern
  - type: Injurable
    damageContainer: Biological
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.6
    baseSprintSpeed : 4.7
  - type: FootstepModifier
    footstepSoundCollection:
      collection: ADTCelecernFootstep
      params:
        variation: 0.125
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - ADTCelecernEmotes
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 2
        Piercing: 3
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 363
    coldDamageThreshold: 250
    coldDamage:
      types:
        Cold : 0.2
    heatDamage:
      types:
        Heat : 0.1
  - type: TemperatureSpeed
    thresholds:
      285: 0.8
      248: 0.6
      220: 0.4
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: TypingIndicator
    proto: ADTcelecern
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      SolCommon: Speak
      Arkane: Speak
  - type: SizeAttributeWhitelist
    tall: true
    tallscale: 1.08
    short: true
    shortscale: 0.92

