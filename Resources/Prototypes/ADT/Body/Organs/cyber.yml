- type: entity
  id: ADTOrganCyberHeart
  parent: [ OrganBaseHeart, OrganHumanMetabolizer ]
  name: cybernetic heart
  description: A mechanical pump that replaces a biological heart.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/Organs/cyber_organs.rsi
    layers:
    - state: heart-on
  - type: OrganHealth
    kind: Robotic
    maxDamage: 75
    healRate: 0
  - type: CyberOrgan
    effectCooldown: 15
    empJitter: 15
    empDamage:
      types:
        Asphyxiation: 8

