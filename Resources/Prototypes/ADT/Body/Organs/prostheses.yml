- type: entity
  id: ADTOrganProsthesis
  abstract: true
  components:
  - type: RoboticPart
  - type: Prosthesis
  - type: VisualOrganMarkings
    markingData:
      group: None

- type: entity
  parent: [ OrganBaseArmLeft, ADTOrganProsthesis ]
  id: ADTOrganProsthesisCheapArmLeft
  name: cheap prosthetic left arm
  description: A crude, cheap replacement limb.
  components:
  - type: Sprite
    sprite: ADT/Mobs/Customization/augments/cheap_prosthesis.rsi
    state: l_arm
  - type: VisualOrgan
    data:
      sprite: ADT/Mobs/Customization/augments/cheap_prosthesis.rsi
      state: l_arm
      color: "#FFFFFF"
  - type: Prosthesis
    meleeModifier: 0.85

