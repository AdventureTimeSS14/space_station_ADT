- type: trait
  id: ADTDisproportionate
  name: trait-disproportionate-name
  description: trait-disproportionate-desc
  category: Quirks
  cost: 0
  speciesWhitelist:
    - IPC
  rewriteComponents: true
  components:
  - type: ADTSuitSensor
    onMob: true
    sensorsTime: 6
  # ADT-Tweak Start - New Monitor: Deprecated
  # - type: DeviceNetwork
  #   deviceNetId: Wireless
  #   transmitFrequencyId: SuitSensor
  #   savableAddress: false
  # - type: WirelessNetworkConnection
  #   range: 1200
  # - type: StationLimitedNetwork
  # ADT-Tweak End
  - type: Inventory
    templateId: ipcDisproportionate
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female

- type: trait
  id: ADTDissociativeIdentity
  name: trait-dissociative-identity-name
  description: trait-dissociative-identity-desc
  category: Quirks
  cost: 1
  speciesBlacklist:
    - IPC
  departmentBlacklist:
    - Command
    - Security
    - Medical
    - CentcomSpecialists
  jobBlacklist:
    - ADTBlueShieldOfficer
    - IAA
    - Lawyer
  effects:
    - !type:AddCompsEffect
      components:
        - type: DissociativeIdentity
          chameleonClothing:
            jumpsuit: ClothingUniformJumpsuitChameleon
            outerClothing: ClothingOuterChameleon
            shoes: ClothingShoesChameleon
            head: ClothingHeadHatChameleon
          chameleonImplant: ChameleonControllerImplant
          alterComponents:
          - type: Physics
            bodyType: KinematicController
          - type: Fixtures
            fixtures:
              fix1:
                shape:
                  !type:PhysShapeCircle
                  radius: 0.35
                density: 50
                mask:
                - Impassable
                - LowImpassable
                - BlobImpassable
                layer:
                - None
          - type: DissociativeAlterBody
          - type: AntagImmune
          - type: ADTVirusImmune
            absolute: true
          - type: StatusIcon
            bounds: -0.5,-0.5,0.5,0.5
          - type: InputMover
          - type: MobMover
          - type: MovementSpeedModifier
            baseWalkSpeed: 2.5
            baseSprintSpeed: 4.5
          - type: Actions
          - type: Alerts
          - type: DoAfter
          - type: Examiner
          - type: Eye
          - type: ContentEye
          - type: MindContainer
          - type: TTS
          - type: LanguageSpeaker
          - type: Speech
            speechSounds: Alto
          - type: Emoting
          - type: TypingIndicator
          - type: Grammar
            attributes:
              proper: true
          - type: MidroundCustomization
            allowedLayers:
            - Hair
            - FacialHair
            playSoundForVoiceChange: false
          - type: UserInterface
            interfaces:
              enum.MidroundCustomizationUiKey.Key:
                type: MidroundCustomizationBoundUserInterface
              enum.DissociativeAlterSetupUiKey.Key:
                type: DissociativeAlterSetupBoundUserInterface
          - type: GhostRole
            allowMovement: true
            allowSpeech: true
            makeSentient: true
            name: ghost-role-information-dissociative-alter-name
            description: ghost-role-information-dissociative-alter-description
            rules: ghost-role-information-dissociative-alter-rules
          - type: GhostTakeoverAvailable

