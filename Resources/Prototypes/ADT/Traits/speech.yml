  name: trait-accentless-name
  description: trait-accentless-desc
  category: SpeechTraits
  cost: 0
  effects:
    - !type:AddCompsEffect
      components:
        - type: Accentless
          removes:
            - type: OwOAccent
            - type: NyaAccent
            - type: LizardAccent
            - type: MothAccent
            - type: GrowlingAccent
            - type: RoarAccent
            - type: ResomiAccent
            - type: VoxAccent
            - type: SkeletonAccent
            - type: DamagedSiliconAccent
