- type: entity
  id: ActionToggleMantisDaggers
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/mantis_daggers.rsi
      state: icon
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:ToggleMantisDaggersEvent

- type: entity
  id: ActionToggleSundownerShields
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: ADT/Interface/Actions/sundowner_shields.rsi
      state: icon
    iconOn:
      sprite: ADT/Interface/Actions/sundowner_shields.rsi
      state: icon-ON
    itemIconStyle: BigAction
    useDelay: 5
  - type: InstantAction
    event: !type:ToggleSundownerShieldsEvent

- type: entity
  id: ActionToggleMuscles
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/muscles_implant.rsi
      state: icon
    itemIconStyle: BigAction
    useDelay: 15
  - type: InstantAction
    event: !type:ToggleMusclesEvent

- type: entity
  id: ActionMusclesJump
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: ADT/Interface/Actions/muscles_implant.rsi
      state: jump-icon
  - type: TargetAction
    checkCanAccess: false
    repeat: true
    range: 16
  - type: WorldTargetAction
    event: !type:JumpbootsActionEvent

- type: entity
  id: ActionToggleCompStealth
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/stealth.rsi
      state: icon
    itemIconStyle: BigAction
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleCompStealthEvent

- type: entity
  id: ActionToggleSandevistan
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: ADT/Interface/Actions/sandevistan.rsi
      state: icon
    itemIconStyle: BigAction
    useDelay: 2
  - type: InstantAction
    event: !type:ToggleSandevistanEvent

- type: entity
  parent: BaseImplantAction
  id: ADTActionActivateStimulantsImplant
  name: Activate stimulants
  description: Injects a dose of stimulants into your bloodstream.
  categories: [ HideSpawnMenu ]
  components:
  - type: LimitedCharges
    maxCharges: 3
  - type: Action
    checkCanInteract: false # можно использовать, будучи оглушённым
    useDelay: 31 # 0.5 с задержка эффектов + 15 ед. / 0.5 ед/с метаболизма = 30 с: откат проходит, когда реагента в крови уже нет
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Specific/Medical/medipen.rsi
      state: stimpen
