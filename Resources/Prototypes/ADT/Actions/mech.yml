- type: entity
  id: ActionMechInhale
  name: Toggle tightness
  description: "*задыхается*"
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_internals_on
  - type: InstantAction
    event: !type:MechInhaleEvent

- type: entity
  id: ActionMechTurnLights
  name: Turn lights
  description: Мои глазаааа!!!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_lights_on
  - type: InstantAction
    event: !type:MechTurnLightsEvent

- type: entity
  id: ActionMechOverload
  name: Toggle overload
  description: Deja vu I've just been in this place before Higher on the street And I know it's my time to go
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_overload_on
  - type: InstantAction
    event: !type:MechOverloadEvent

- type: entity
  id: ActionMechPhaze
  name: Toggle phaze
  description: is this a noclip??? No, this is phaze
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_phasing_on
  - type: InstantAction
    event: !type:MechPhazeEvent

- type: entity
  id: ADTActionMechThruster
  name: Toggle jet
  description: Полётный режим. В полёте расходуется топливо.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_thrusters_on
  - type: InstantAction
    event: !type:MechThrusterEvent

- type: entity
  id: ADTActionMechCockpitEject
  name: Leave the cockpit
  description: Покинуть место второго пилота.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 2
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_eject
  - type: InstantAction
    event: !type:MechCockpitEjectEvent

- type: entity
  id: ADTActionMechEquipmentRadial
  name: Choose equipment
  description: Открывает меню выбора снаряжения меха.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_cycle_equip_on
  - type: InstantAction
    event: !type:MechOpenEquipmentRadialEvent

- type: entity
  id: ADTActionMechCycleEquipment
  name: Cycle equipment
  description: Переключает снаряжение меха на следующее по кругу.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_cycle_equip_off
  - type: InstantAction
    event: !type:MechCycleEquipmentEvent

- type: entity
  id: ADTActionMechReload
  name: Reload weapon
  description: Перезаряжает выбранное оружие меха магазином из хранилища.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    sprite: Interface/Actions/actions_mecha.rsi
    layers:
    - state: mech_damtype_brute
  - type: InstantAction
    event: !type:MechReloadEvent
