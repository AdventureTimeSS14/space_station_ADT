- type: entity
  id: ActionToggleFriendlyFire
  name: toggle friendly fire
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      useDelay: 1
    - type: Sprite
      sprite: ADT/Interface/Actions/friendly_fire.rsi
      layers:
      - state: on
        map: ["enum.ActionVisuals.Icon"]
      - state: off
        map: ["enum.ActionVisuals.IconToggled"]
        visible: false
    - type: InstantAction
      event: !type:ToggleActionEvent
