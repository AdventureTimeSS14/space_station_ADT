- type: entity
  parent: BaseMentalAction
  id: ADTActionPlaceBorgMarker
  name: Place waypoint
  description: Drops a coloured waypoint for the cyborgs. Aiming at an existing one takes it down.
  components:
  - type: Action
    priority: -6
    itemIconStyle: NoItem
    icon: Interface/VerbIcons/drop.svg.192dpi.png
    useDelay: 0.5
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ADTPlaceBorgMarkerEvent

- type: entity
  parent: BaseMentalAction
  id: ADTActionCycleBorgMarkerColor
  name: Waypoint colour
  description: Switches the colour the next waypoint will be painted with.
  components:
  - type: Action
    priority: -7
    itemIconStyle: NoItem
    icon: Interface/VerbIcons/refresh.svg.192dpi.png
    useDelay: 0.3
  - type: InstantAction
    event: !type:ADTCycleBorgMarkerColorEvent

- type: entity
  parent: BaseMentalAction
  id: ADTActionClearBorgMarkers
  name: Clear waypoints
  description: Takes down every waypoint you have placed.
  components:
  - type: Action
    priority: -8
    itemIconStyle: NoItem
    icon: Interface/VerbIcons/delete.svg.192dpi.png
    useDelay: 1
  - type: InstantAction
    event: !type:ADTClearBorgMarkersEvent
