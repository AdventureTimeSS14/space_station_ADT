# Игроки
- type: entity
  id: ActionPumpCursedHeart
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/lavaland.rsi
      state: cursed_heart_pump
    checkCanInteract: false
    checkConsciousness: false # Позволяет использовать сердце в крите, порт импрувмента отсюда: https://github.com/Rxup/space-station-14/pull/1351
    itemIconStyle: BigAction
    useDelay: 1
  - type: InstantAction
    event: !type:PumpHeartActionEvent

- type: entity
  id: ActionToggleCursedHeart
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/lavaland.rsi
      state: cursed_heart_toggle
    checkCanInteract: false
    checkConsciousness: true # НЕ позволяет переключать сердце в крите, иначе будет слишком имбово
    itemIconStyle: BigAction
    useDelay: 30
  - type: InstantAction
    event: !type:ToggleHeartActionEvent

# Фауна
- type: entity
  id: ActionAncientGoliathTentacle
  name: "[color=red]Tentacle Slam[/color]"
  description: Use your tentacles to grab and stun a target player!
  components:
  - type: Action
    raiseOnUser: true
    icon:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_spawn
    iconOn:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_wiggle
    sound:
      path: "/Audio/Weapons/slash.ogg"
    useDelay: 1
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:GoliathSummonRandomTentacleAction
