- type: entity
  abstract: true
  parent: BaseAction
  id: ADTActionSquadFollow
  name: Follow!
  description: Order your faction's fighters to follow you.
  components:
  - type: Action
    useDelay: 3
    priority: 6
  - type: Sprite
    sprite: Interface/Actions/actions_rat_king.rsi
    layers:
    - state: followOff
      map: ["enum.ActionVisuals.Icon"]
    - state: follow
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ADTSquadOrderActionEvent
      order: Follow

- type: entity
  abstract: true
  parent: BaseAction
