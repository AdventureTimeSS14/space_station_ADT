- type: entity
  id: ADTActionFishingCast
  name: Cast the line
  description: Cast the bait into the distance. Deep water hides bigger fish.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: ADT/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
    sound:
      path: /Audio/ADT/Items/Fishing/fishing_rod_cast.ogg
    itemIconStyle: BigAction
    useDelay: 2.5
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:ADTFishingCastActionEvent

