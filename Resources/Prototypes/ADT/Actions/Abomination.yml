- type: entity
  id: CompActionShootAbomination
  name: action-shoot
  description: action-shoot-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
    - state: icon
  - type: WorldTargetAction
    event: !type:CompProjectileActionEvent
  - type: TargetAction
    checkCanAccess: false
    range: 16
    repeat: true

- type: entity
  id: CompActionHealAbomination
  name: action-heal
  description: action-heal-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    useDelay: 120
  - type: Sprite
    sprite: ADT/Interface/Actions/actions_ling.rsi
    layers:
    - state: fleshmend
  - type: InstantAction
    event: !type:CompHealActionEvent

- type: entity
  id: CompActionJumpAbomination
  name: action-jump
  description: action-jump-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 35
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: repulse
  - type: TargetAction
    checkCanAccess: false
    range: 16
    repeat: true
  - type: WorldTargetAction
    event: !type:JumpbootsActionEvent
