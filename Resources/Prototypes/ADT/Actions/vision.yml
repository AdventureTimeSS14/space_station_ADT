- type: entity
  id: ADTActionToggleNightVision
  categories: [HideSpawnMenu]
  name: Toggle nightvision
  description: Allows you to see even in complete darkness.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.25
  - type: Sprite
    sprite: ADT/Interface/Actions/nightvision.rsi
    layers:
    - state: icon_on
      map: ["enum.ActionVisuals.Icon"]
    - state: icon_off
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleActionEvent

