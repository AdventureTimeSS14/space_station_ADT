- type: entity
  id: SwitchAgilityAction
  name: Switch agility
  description: Switching agility
  components:
  - type: Action
    useDelay: 20  # Появляется только при выключении
  - type: Sprite
    layers:
    - texture: ADT/Mobs/Species/Resomi/Abilities/AgilityOff.png
      map: ["enum.ActionVisuals.Icon"]
    - texture: ADT/Mobs/Species/Resomi/Abilities/AgilityOn.png
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:SwitchAgillityActionEvent
