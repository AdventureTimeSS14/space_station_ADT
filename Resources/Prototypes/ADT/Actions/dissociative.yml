- type: entity
  id: ActionDissociativeManifest
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    checkCanInteract: false
  - type: Sprite
    sprite: ADT/Interface/Actions/dissociative.rsi
    layers:
    - state: mirage
  - type: InstantAction
    event: !type:DissociativeManifestActionEvent

- type: entity
  id: ActionDissociativeFront
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: ADT/Interface/Actions/dissociative.rsi
    layers:
    - state: controler
  - type: InstantAction
    event: !type:DissociativeFrontActionEvent

- type: entity
  id: ActionDissociativeRelease
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: ADT/Interface/Actions/dissociative.rsi
    layers:
    - state: lost
  - type: InstantAction
    event: !type:DissociativeReleaseActionEvent

- type: entity
  id: ActionDissociativeSetup
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
  - type: Sprite
    sprite: ADT/Interface/Actions/actions_slime.rsi
    layers:
    - state: hair
  - type: InstantAction
    event: !type:DissociativeSetupActionEvent

- type: entity
  id: ActionDissociativeSurrender
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -20
  - type: ConfirmableAction
    popup: dissociative-surrender-confirm
  - type: Sprite
    sprite: ADT/Interface/Actions/dissociative.rsi
    layers:
    - state: lost
  - type: InstantAction
    event: !type:DissociativeSurrenderActionEvent

- type: entity
  id: ActionDissociativeGiveControl
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -19
  - type: ConfirmableAction
    popup: dissociative-give-control-confirm
  - type: Sprite
    sprite: ADT/Interface/Actions/dissociative.rsi
    layers:
    - state: controler
  - type: InstantAction
    event: !type:DissociativeGiveControlActionEvent
