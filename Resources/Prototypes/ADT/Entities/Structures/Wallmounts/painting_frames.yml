- type: entity
  parent: ADTPaintingFrame
  id: ADTPaintingFrameGallery
  suffix: Gallery
  components:
  - type: PaintingFrame
    gallery: true

- type: entity
  parent: ADTPaintingFrame
  id: ADTPaintingFrameGalleryPinned
  suffix: Gallery, pinned
  components:
  - type: PaintingFrame
    gallery: true
    pinnedOnly: true
