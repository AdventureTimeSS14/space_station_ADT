- type: entity
  id: ADTWallRockMagmite
  parent: WallRock
  description: An ore vein rich with plasma magmite.
  suffix: Magmite
  components:
  - type: EntityRemap
    mask:
      AsteroidRock: ADTAsteroidRockMagmite
      WallRockBasalt: ADTWallRockBasaltMagmite
      WallRockChromite: ADTWallRockChromiteMagmite
      WallRockSand: ADTWallRockSandMagmite
      WallRockSnow: ADTWallRockSnowMagmite
  - type: OreVein
    oreChance: 0.5
    currentOre: ADTOreMagmite
  - type: Icon
    sprite: ADT/Structures/Walls/rock.rsi
  - type: Sprite
    sprite: ADT/Structures/Walls/rock.rsi
    layers:
    - state: rock_bsore
      color: "#ff7a1a"
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]
    - state: rock
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_west

