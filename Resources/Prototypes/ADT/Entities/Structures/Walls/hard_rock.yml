- type: entity
  id: ADTWallRockAncient
  parent: BaseWall
  name: ancient rock
  description: A rare and dense rock that appears to be resistant to every mining tool except a pickaxe.
  suffix: Ancient, planetmap
  components:
  - type: ADTHardRock
  - type: Transform
    noRot: true
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: MiningScannerViewable
  - type: SmoothEdge
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    color: "#575757"
    layers:
    - state: rock_wall
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_wall_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_wall_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_wall_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_wall_west

- type: entity
  id: ADTWallRockAncientUranium
  parent: ADTWallRockAncient
  description: An ancient rock vein rich with uranium.
  suffix: Ancient, Uranium
  components:
  - type: OreVein
    oreChance: 0.5
    currentOre: OreUranium

- type: entity
  id: ADTWallRockAncientDiamond
  parent: ADTWallRockAncient
  description: An ancient rock vein rich with diamonds.
  suffix: Ancient, Diamond
  components:
  - type: OreVein
    oreChance: 0.35
    currentOre: OreDiamond
