- type: entity
  abstract: true
  parent: BaseStructure
  id: ADTBaseBasalt
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    noRot: true
  - type: Wall
  - type: IsRoof
  - type: Occluder
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
  - type: MiningScannerViewable
  - type: ADTMineral
    mineTime: 4
    explosionBonus: 2
    heavyIntensity: 4
    devastationIntensity: 8
  - type: IconSmooth
    key: ADTBasalt
    base: rock
    mode: Bitmask
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ADTMineralVisuals.Cracks:
        enum.ADTMineralVisuals.Cracks:
          None: { visible: false }
          One: { visible: true, state: cracks_1 }
          Two: { visible: true, state: cracks_2 }

- type: entity
  parent: ADTBaseBasalt
  id: ADTBasalt
  name: basalt
  description: A dense volcanic rock.
  suffix: Lavaland
  components:
  - type: ADTMineral
    hardness: 1
    maxHardness: 1
  - type: Icon
    sprite: ADT/Structures/Walls/Lavaland/basalt.rsi
    state: full
  - type: Sprite
    sprite: ADT/Structures/Walls/Lavaland/basalt.rsi
    drawdepth: Walls
    layers:
    - state: rock0
    - sprite: ADT/Structures/Walls/Lavaland/mineral_overlays.rsi
      state: cracks_1
      map: [ "enum.ADTMineralVisuals.Cracks" ]
      visible: false

