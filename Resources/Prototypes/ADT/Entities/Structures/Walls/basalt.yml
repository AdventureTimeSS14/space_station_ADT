      state: gibtonite
  - type: ADTGibtoniteDeposit
    minDetTime: 8
    maxDetTime: 10
    struckExplosion:
      devastation: 1
      heavy: 2
      light: 5
    timerExplosion:
      devastation: 1
      heavy: 3
      light: 5
  - type: GenericVisualizer
    visuals:
      enum.ADTMineralVisuals.Cracks:
        enum.ADTMineralVisuals.Cracks:
          None: { visible: false }
          One: { visible: true, state: cracks_1 }
          Two: { visible: true, state: cracks_2 }
      enum.ADTGibtoniteVisuals.Stage:
        enum.ADTGibtoniteVisuals.Stage:
          Unstruck: { visible: false }
          Active: { visible: true, state: gibtonite_active, shader: unshaded }
          Stable: { visible: true, state: gibtonite_inactive }
          Detonated: { visible: false }
  - type: Icon
    sprite: ADT/Structures/Walls/Lavaland/basalt.rsi
    state: full
