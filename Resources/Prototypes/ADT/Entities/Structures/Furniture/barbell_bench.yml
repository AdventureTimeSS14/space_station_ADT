- type: entity
  abstract: true
  id: ADTBarbellBenchBase
  parent: BaseStructure
  components:
  - type: Sprite
    noRot: true
    drawdepth: HighFloorObjects
  - type: BarbellBench
    repSoundMaxDistance: 6
  - type: BarbellBenchVisuals
    attachedState: barbell-overlay-up
    overlayBaseState: barbell-overlay-up
    overlayRepFlickState: barbell-up
  - type: Appearance
  - type: ItemSlots
    slots:
      adt-aslot-barbell:
        name: adt-aslot-barbell
        whitelist:
          tags:
          - ADTBarbellAttachment
        insertSound:
          path: /Audio/ADT/Furniture/barbell/sound_for_barbell_3.ogg
          params:
            maxDistance: 6
        ejectSound:
          path: /Audio/ADT/Furniture/barbell/sound_for_barbell_2.ogg
          params:
            maxDistance: 6
  # Визуализация штанги на скамье управляется BarbellBenchVisualizerSystem (низ + оверлей).
  - type: ContainerContainer
    containers:
      adt-aslot-barbell: !type:ContainerSlot
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0,-0.15"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2

- type: entity
  parent: ADTBarbellBenchBase
  id: ADTBarbellBench
  name: barbell bench
  description: A bench for bench pressing. You can attach a barbell to it.
  components:
  - type: Sprite
    sprite: ADT/Structures/Furniture/barbell_bench.rsi
    layers:
    - state: barbell
      map: ["base"]
    - state: barbell
      map: ["adt-aslot-barbell"]
      visible: false
  - type: Construction
    graph: ADTBarbellBench
    node: barbellbench

- type: entity
  id: ADTBarbellBenchOverlayVisual
  name: barbell bench overlay
  description: Visual overlay for barbell bench.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Objects/Fun/barbell.rsi
    layers:
    - state: barbell-overlay-up
      map: ["barbell-overlay"]
      visible: false
    noRot: true
    drawdepth: OverMobs
  - type: Transform
    noRot: true

# Отдельная штанга как предмет
- type: entity
  abstract: true
  id: ADTBarbellBase
  parent: BaseItem
  components:
  - type: Sprite
    sprite: ADT/Objects/Fun/barbell.rsi
    state: icon
  - type: Item
    size: Huge
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  # Увеличенный хитбокс, чтобы штанга нормально подсвечивалась и поднималась кликом.
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.55,-0.12,0.55,0.12"
        density: 20
        mask:
        - ItemMask
  - type: Tag
    tags:
    - ADTBarbellAttachment
  - type: BarbellLift
    staminaCost: 15
    overlayRsi: ADT/Objects/Fun/barbell.rsi
  - type: TrainingEquipment
    maxCreditPerAction: 10
    firstActionCredit: 3
    tiers:
    - time: 900
      staminaBonus: 0.1
      unarmedDamageBonus: 0.05
      pullDensityReduction: 0.4
    - time: 1800
      staminaBonus: 0.2
      unarmedDamageBonus: 0.1
      pullDensityReduction: 0.7
  - type: MultiHandedItem
    handsNeeded: 2
  - type: HeldSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: UseDelay
    delay: 1
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: PhysicalComposition
    materialComposition:
      Steel: 500

- type: entity
  parent: ADTBarbellBase
  id: ADTBarbell
  name: barbell
  description: A heavy barbell for bench pressing. Can be attached to a barbell bench.