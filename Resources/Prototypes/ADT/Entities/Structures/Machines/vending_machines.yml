# Автомат с мороженкой.

- type: entity
  parent: VendingMachine
  id: ADTIceCreamVendInventory
  name: Ice CreamMat
  description: Look! There a ice cream!
  components:
  - type: ADTVendingMachine
    pack: ADTIceCreamVendInventory
    initialStockQuality: 0.33
    priceMultiplier: 0.57 # ADT-Economy
  - type: VendingMachineVisuals
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
  - type: VendingMachineEject
    ejectDelay: 1
  - type: VendingMachineDispenseOnHit
    chance: 0.25
    threshold: 2
  - type: DatasetVocalizer
    dataset: IceCreammatAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: ADT/Structures/Machines/VendingMachines/icecream.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#9dc5c9"


