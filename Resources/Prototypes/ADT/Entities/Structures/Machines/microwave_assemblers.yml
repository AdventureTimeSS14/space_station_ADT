- type: entity
  id: ADTKitchenAssembler
  parent: KitchenMicrowave
  name: adt-kitchen-assembler
  description: Assembles and prepares NT-approved meals. You don't know what it's doing in there.
  components:
  - type: Microwave
    explosionChance: 0
    lightningChance: 0
    beginCookingSound: /Audio/Machines/machine_switch.ogg
    foodDoneSound: /Audio/Machines/ding.ogg
    loopingSound: /Audio/ADT/Machines/assembler.ogg
    validRecipeTypes: ADTAssembler
    canHeat: false
    canIrradiate: false
    key: AssemblerKey
  - type: GenericVisualizer #TODO: needs work
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "assembler" }
          Broken: { state: "assembler" }
          Cooking: { state: "assembler" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "assembler-on-unlit" }
          Broken: { state: "assembler-broken-unlit" }
          Cooking: { state: "assembler-running-unlit" }
        blinky:
          Idle: { state: "assembler-invisible" }
          Broken: { state: "assembler-invisible" }
          Cooking: { state: "assembler-blinky-unlit" }
        scan:
          Idle: { state: "assembler-invisible" }
          Broken: { state: "assembler-invisible" }
          Cooking: { state: "assembler-scan-unlit" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
        blinky:
          True: { visible: true }
          False: { visible: false }
        scan:
          True: { visible: true }
          False: { visible: false }
  - type: Sprite
    sprite: ADT/Structures/Machines/assembler.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: assembler
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: assembler-on-unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
      visible: false
    - state: assembler-invisible
      shader: unshaded
      map: ["blinky"]
      visible: false
    - state: assembler-invisible
      shader: unshaded
      map: ["scan"]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: Machine
    board: ADTKitchenAssemblerMachineCircuitBoard
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.AssemblerKey
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.AssemblerKey:
        type: AssemblerBoundUserInterface

- type: entity
  id: ADTMedicalAssembler
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: adt-medical-assembler
  description: Great for medicine, apparently. You don't know how it works.
  components:
  - type: Microwave
    validRecipeTypes: MedicalAssembler
    beginCookingSound: /Audio/Machines/machine_switch.ogg
    foodDoneSound: /Audio/Effects/Shuttle/radar_ping.ogg
    loopingSound: /Audio/ADT/Machines/medical-assembler.ogg
    key: MedicalAssemblerKey
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: "mediwave-base" }
          Broken: { state: "mediwave-base" }
          Cooking: { state: "mediwave-base" }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { state: "mediwave-off-unlit" }
          Broken: { state: "mediwave-off-unlit" }
          Cooking: { state: "mediwave-on-unlit" }
      enum.PowerDeviceVisuals.Powered:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          True: { visible: true }
          False: { visible: false }
  - type: Sprite
    sprite: ADT/Structures/Machines/medical_assembler.rsi
    snapCardinals: true
    layers:
    - state: mediwave-base
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: mediwave-off-unlit
      shader: unshaded
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: Machine
    board: ADTMedicalAssemblerMachineCircuitBoard
  - type: AssemblerUpgrade
  - type: ADTMedicalAssembler
    customBlankPrototype: ADTBlankMediPen
    medipenStylePrototypes:
      medipen: ADTCustomMedipen
      firstaid: ADTCustomMedipenFirstaid
      hypovolemic: ADTCustomMedipenHypovolemic
      stimpen: ADTCustomMedipenStimpen
      oxapen: ADTCustomMedipenOxapen
      bicpen: ADTCustomMedipenBicpen
      dexpen: ADTCustomMedipenDexpen
  - type: ResearchClient
  - type: TechnologyDatabase
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelistFailPopup: reagent-dispenser-component-cannot-put-entity-message
        whitelist:
          components:
          - FitsInDispenser
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.MedicalAssemblerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.MedicalAssemblerUiKey.Key:
        type: MedicalAssemblerUiBoundUserInterface
  - type: ContainerContainer # Redefined due to inheritance order
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
      beakerSlot: !type:ContainerSlot


- type: entity
  id: ADTKitchenElectricRange
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: adt-electric-range
  description: A stove with burners and an oven. Put pans and pots on the burners and trays in the oven.
  components:
  - type: ADTStove
    slots:
    - slotType: Burner
      offset: -0.1875, 0.28125
      name: adt-stove-slot-burner-left
      flameState: burner_left_
      mirror: true
    - slotType: Burner
      offset: 0.21875, 0.28125
      name: adt-stove-slot-burner-right
      flameState: burner_right_
    - slotType: Oven
      offset: -0.0625, -0.1875
      tint: "#B39E8CBF"
      name: adt-stove-slot-oven
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,-0.25,0.30,0.45"
        density: 600
        mask:
        - MachineMask
        layer:
        - MachineLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.30,0.15,0.30,0.45"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Sprite
    sprite: ADT/Structures/Machines/oven.rsi
    layers:
    - state: composite_off
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Machine
    board: ADTElectricRangeMachineCircuitBoard
  - type: ContainerContainer
    containers:
      adt_stove_slot_0: !type:ContainerSlot
      adt_stove_slot_1: !type:ContainerSlot
      adt_stove_slot_2: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - adt_stove_slot_0
    - adt_stove_slot_1
    - adt_stove_slot_2
  - type: GuideHelp
    guides:
    - Chef
  - type: PlaceableSurface
    isPlaceable: false
  - type: ActivatableUI
    key: enum.ADTStoveUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ADTStoveUiKey.Key:
        type: ADTStoveBoundUserInterface

- type: entity
  id: ADTSyndicateKitchenElectricRange
  parent: ADTKitchenElectricRange
  name: adt-syndicate-electric-range
  components:
  - type: ADTStove
    slots:
    - slotType: Burner
      offset: -0.1875, 0.28125
      name: adt-stove-slot-burner-left
      flameState: burner_left_
      mirror: true
    - slotType: Burner
      offset: 0.21875, 0.28125
      name: adt-stove-slot-burner-right
      flameState: burner_right_
    - slotType: Oven
      offset: -0.0625, -0.1875
      tint: "#B39E8CBF"
      name: adt-stove-slot-oven
    secretRecipes:
    - ADTCookBaguetteSword
    - ADTCookThrowingCroissant
    cookTimeMultiplier: 0.5
  - type: Sprite
    sprite: ADT/Structures/Machines/oven_syndie.rsi
  - type: Machine
    board: ADTSyndicateElectricRangeMachineCircuitboard
