# Drop Pod Console — placed on a DropPod grid to let syndicate operatives select and launch it at the station.

- type: entity
  parent: BaseComputer
  id: ComputerDropPodSyndicate
  name: drop pod deployment console
  description: A hardened syndicate console for selecting an impact beacon and launching the drop pod at the station.Restricted to authorised personnel.
  components:
  - type: DropPodConsole
  - type: ItemSlots
    slots:
      tcSlot:
        name: drop-pod-tc-slot-name
        startingItem: Telecrystal
        whitelist:
          components:
          - Currency
  - type: ContainerContainer
    containers:
      tcSlot: !type:ContainerSlot {}
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b01010"
  - type: Tag
    tags:
    - EmagImmune