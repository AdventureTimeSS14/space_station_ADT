
- type: entity
  name: advanced hydroponics tray
  parent: hydroponicsTray
  id: ADTHydroponicsTrayAdvanced
  description: An interstellar-grade space farmplot allowing for rapid growth and selective breeding of crops. Just... keep in mind the space weeds.
  components:
  - type: Sprite
    layers:
      - sprite: ADT/Structures/Machines/hydroT2.rsi
        state: hydrotrayT2
      - sprite: Structures/Hydroponics/overlays.rsi
        state: lowhealth3
        map: [ "health_alert" ]
        visible: false
      - sprite: Structures/Hydroponics/overlays.rsi
        state: lowwater3
        map: [ "water_alert" ]
        visible: false
      - sprite: Structures/Hydroponics/overlays.rsi
        state: lownutri3
        map: [ "nutri_alert" ]
        visible: false
      - sprite: Structures/Hydroponics/overlays.rsi
        state: alert3
        map: [ "undefined_alert" ]
        visible: false
      - sprite: Structures/Hydroponics/overlays.rsi
        state: harvest3
        map: [ "harvest_alert" ]
        visible: false
  - type: ADTPlantTrayUpgrade
    cycleDelay: 10
  - type: Machine
    board: ADTHydroponicsTrayAdvancedMachineCircuitboard
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 0.33
      - ReagentId: EZNutrient
        Quantity: 0.33
