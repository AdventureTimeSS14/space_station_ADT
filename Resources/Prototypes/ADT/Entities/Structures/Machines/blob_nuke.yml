- type: entity
  parent: NuclearBomb
  id: ADTInfectedNuclearBomb
  name: infected nuclear fission explosive
  description: A nuclear bomb consumed and wrapped in pulsating blob matter.
  components:
  - type: Sprite
    sprite: Objects/Devices/nuke.rsi
    noRot: true
    layers:
    - state: nuclearbomb_base
      map: ["enum.NukeVisualLayers.Base"]
    - state: nuclearbomb_deployed_unlit
      map: ["enum.NukeVisualLayers.Unlit"]
      shader: unshaded
      visible: false
    - sprite: ADT/Blob/Mobs/blob.rsi
      state: blob_nuke_overlay
      map: ["blob_overlay"]
      visible: true
