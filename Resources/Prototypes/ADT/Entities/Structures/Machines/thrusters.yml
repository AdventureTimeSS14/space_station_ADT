- type: entity
  id: ADTThrusterMedium
  name: medium thruster
  parent: BaseThruster
  placement:
    mode: AlignTileAny
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-1.45,1.45,0.45"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 5000
  - type: Thruster
    thrust: 480000
    basePowerLoad: 5000
    burnShape: ["-0.4,0.5","-0.1,1.7","1.1,1.7","1.4,0.5"]
    damage:
      types:
        Heat: 90
  - type: Explosive
    explosionType: Default
    maxIntensity: 60
    intensitySlope: 2
    totalIntensity: 60
  - type: Sprite
    sprite: Structures/Shuttles/thruster_large.rsi
    offset: 0.5,-0.5
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 2
  - type: Anchorable
    flags: None
  - type: StaticPrice
    price: 1500
  - type: Machine
    board: ADTMachineMediumThrusterCircuitboard
  - type: Construction
    graph: ADTMachineUnassemble
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: ContainerContainer
    containers:
      machine_parts: !type:Container
      machine_board: !type:Container

- type: entity
  id: ADTThrusterMediumDebug
  parent: ADTThrusterMedium
  name: medium thruster
  description: Big fuckin boy, BBBRRRROOOOOM.
  suffix: DEBUG
  placement:
    mode: AlignTileAny
  components:
  - type: Thruster
    requireSpace: false

- type: entity
  id: ADTThrusterBig
