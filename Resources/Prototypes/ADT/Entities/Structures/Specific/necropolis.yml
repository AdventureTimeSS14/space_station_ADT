- type: entity
  id: ADTNecropolisGate
  parent: BaseStructure
  name: necropolis gate
  description: Huge stone gates covered in ancient writing.
  components:
  - type: Sprite
    sprite: ADT/Structures/Specific/necropolis_gate.rsi
    drawdepth: Doors
    noRot: true
    layers:
    - state: gate
      map: ["gate"]
  - type: Transform
    anchored: true
    noRot: true
  - type: PointLight
    enabled: true
    radius: 8
    energy: 2
    color: "#dc4a1a"
  - type: AshStormImmune
  - type: ADTNecropolisGate
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ADTNecropolisGateVisuals.Open:
        gate:
          True: { state: gate_open }
          False: { state: gate }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - WallLayer

- type: entity
  id: ADTNecropolisGateAshWalker
  parent: ADTNecropolisGate
  suffix: Ash Walker
  description: Massive stone gates. They look sealed shut for good.
  components:
  - type: ADTNecropolisGate
    locked: true
    unlockFaction: ADTAshWalker

- type: entity
  id: ADTNecropolisArch
  parent: BaseStructure
  name: necropolis arch
  description: A massive arch above the necropolis gates, set into an equally massive stone tower.
  components:
  - type: Sprite
    sprite: ADT/Structures/Specific/necropolis_arch.rsi
    state: arch
    drawdepth: BlastDoors
    noRot: true
    offset: 0,0.75
  - type: Transform
    anchored: true
    noRot: true
  - type: AshStormImmune

- type: entity
  id: ADTTribalOven
  parent: KitchenMicrowave
  name: stone oven
  description: A huge primitive stone oven used for cooking.
  components:
  - type: Sprite
    sprite: ADT/Structures/Specific/tribal_oven.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: oven_off
      map: ["enum.MicrowaveVisualizerLayers.Base"]
    - state: oven_on
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: ADT/Structures/Specific/tribal_oven.rsi
    state: oven_off
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.Base:
          Idle: { state: oven_off }
          Broken: { state: oven_off }
          Cooking: { state: oven_off }
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { visible: false }
          Broken: { visible: false }
          Cooking: { visible: true, state: oven_on }
  - type: ApcPowerReceiver
    needsPower: false
  - type: Microwave
    capacity: 5
  - type: AshStormImmune

- type: entity
  id: ADTAshDryingRack
  parent: BaseStructure
  name: ash drying rack
  description: A wooden rack for drying meat and hides. The ash does the rest.
  components:
  - type: Sprite
    sprite: ADT/Structures/Specific/drying_rack.rsi
    state: rack
    drawdepth: Mobs
    noRot: true
  - type: Transform
    anchored: true
    noRot: true
  - type: Storage
    grid:
    - 0,0,5,2
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
  - type: AshStormImmune
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
