
- type: entity
  abstract: true
  parent: BaseStructure
  id: ADTBaseAshFlora
  suffix: Structure
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
  - type: InteractionOutline
  - type: Sprite
    sprite: ADT/Structures/Specific/ash_flora.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: entity
  abstract: true
  parent: ADTBaseAshFlora
  id: ADTAshFloraTallShroom
  name: large mushrooms
  description: A number of large mushrooms, covered in a faint layer of ash and what can only be spores.
  components:
  - type: ADTAshFlora
    product: ADTFoodMushroomShavings
    minAmount: 1
    maxAmount: 3
    harvestTime: 6
    toolWhitelist:
      components:
      - Sharp
    popupLow: adt-ash-flora-tall-shroom-low
    popupMedium: adt-ash-flora-tall-shroom-medium
    popupHigh: adt-ash-flora-tall-shroom-high

