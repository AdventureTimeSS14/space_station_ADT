    state: totem_stone
    drawdepth: Mobs
    noRot: true
    offset: 0,0.5
  - type: ADTPointOfInterest
    title: adt-point-of-interest-ash-statue
  - type: AshStormImmune
  - type: Transform
    anchored: true
    noRot: true
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable

# Деревянная табуретка
- type: entity
  id: ADTWoodenStool
  parent: Stool
  name: wooden stool
  description: A wooden stool. Comfortable enough to sit on.
  components:
  - type: Sprite
    sprite: ADT/Structures/Furniture/wooden_stool.rsi
    state: stool
  - type: Icon
    sprite: ADT/Structures/Furniture/wooden_stool.rsi
    state: stool
  - type: Construction
    graph: ADTWoodenStool
    node: stool
