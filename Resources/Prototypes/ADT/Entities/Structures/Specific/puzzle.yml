- type: entity
  id: ADTSlidingPuzzle
  parent: MarkerBase
  name: sliding puzzle generator
  description: Generates a sliding puzzle around itself.
  categories: [ HideSpawnMenu ]
  components:
  - type: ADTSlidingPuzzle
    rewardProto: ADTCrateNecropolisPuzzle
    megafaunaProto: ADTMegaFaunaDrake

- type: entity
  id: ADTPrisonCubePuzzle
  parent: MarkerBase
  name: prison cube generator
  categories: [ HideSpawnMenu ]
  description: Generates a prison cube puzzle around itself.
  components:
  - type: ADTSlidingPuzzle
    megafaunaChance: 0
    emptyTileId: 5
    returnCubeProto: ADTPrisonCube

- type: entity
  parent: BaseItem
  id: ADTPrisonCube
  name: prison cube
  description: Dusty cube with a humanoid imprint on it.
  components:
  - type: Sprite
    sprite: ADT/Misc/puzzle.rsi
    state: prison_cube
  - type: StaticPrice
    price: 33333
  - type: Item
    size: Small
  - type: ADTPrisonCube
    puzzleProto: ADTPrisonCubePuzzle

- type: entity
  id: ADTSlidingPuzzleRoomMarker
  parent: ADTBaseRoomMarker
  name: sliding puzzle ruin spawner
  components:
  - type: ADTRoomFill
    clearExisting: true
    rotation: false
    roomWhitelist:
      tags:
      - ADTSlidingPuzzle