- type: entity
  id: ADTPuzzlePillar1
  parent: BaseStructure
  name: mysterious pillar
  description: Puzzling...
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: ADT/Misc/puzzle.rsi
    state: pillar_1
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      puzzle:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 500
        mask:
        - MobMask
        layer:
        - MidImpassable
        - HighImpassable
  - type: ADTSlidingPuzzleElement

