      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
              ЖУРНАЛ НАБЛЮДЕНИЙ ЗА ОБЪЕКТОМ «ЯДРО»
      =============================================
      На сорок первый день температура объекта пульсировала с периодом 1,2 секунды, и пульсация оставалась стабильной.

      На сто двенадцатый день период сократился до 1,1 секунды. Пульсация учащается, когда к объекту приближается персонал.

      На двести третий день мы установили, что пульсация совпадает с колебаниями давления магмы в радиусе сорока километров. Объект не находится в магме, а наоборот, магма находится [bold]внутри него[/bold].

      На двести шестидесятый день сотрудник М. Джоул проводил замеры на расстоянии трёх метров и получил дозу, несовместимую с жизнью. Объект не излучал, пока Джоул к нему не приблизился. Я повторяю, что объект [bold]не излучал до его приближения[/bold].

      На трёхсот первый день период сократился до 0,9 секунды. Так учащается пульс у животного, когда к нему подходят с ножом.

      [italic]Последнюю строку зачеркнули, но её всё равно можно прочитать.[/italic]

