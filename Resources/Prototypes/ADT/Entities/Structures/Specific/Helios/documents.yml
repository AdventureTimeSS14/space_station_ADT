- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocCheckpointLog
  name: журнал поста КПП
  components:
  - type: Sprite
    state: logbook_blood
  - type: Paper
    content: |
      ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
      ⠀[color=#1b487e]░██░████░░░██░░░░[/color]      [head=3]Бланк документа[/head]
      ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]               [head=3]NanoTras_n[/head]
      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
                      ЖУРНАЛ ПОСТА КПП №1
      =============================================
      [bold]02.11.2568.[/bold] Я принял смену. Все сотрудники прошли дезинфекцию, и происшествий за смену не было.

      [bold]04.11.2568.[/bold] Двое рабочих из горной группы снова жаловались, что слышат стук в нижних секторах. Я объяснил им, что так работают насосы, и передал рапорт в отдел безопасности, как требует инструкция.

      [bold]06.11.2568.[/bold] Руководство сменило код на дверь склада. МакБернс сказал, что теперь кодом служит {WAREHOUSE_RULE}, чтобы враг не догадался. Я не понимаю, какой враг может оказаться в трёх километрах под лавой, тем более что табличка с этим годом висит прямо у входа. Впрочем, это не моё дело.

      [bold]07.11.2568.[/bold] Блок персонала закрыли на карантин после того, что случилось с Джоулом. Теперь туда пускают только тех, кто знает код руководства.

      [bold]08.11.2568.[/bold] Завтра состоится запуск. Всем выдали памятки и велели улыбаться.

      [bold]09.11.2568.[/bold] ██████████████████████
      ...пол ходит ходуном, и связи с центром больше нет. Охрана внизу не отвечает, поэтому я

      [italic]Запись обрывается, а остаток страницы залит чем-то тёмным.[/italic]

- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocDeconMemo
  name: памятка о дезинфекции
  components:
  - type: Sprite
    state: memo
  - type: Paper
    content: |
      ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
      ⠀[color=#1b487e]░██░████░░░██░░░░[/color]      [head=3]Бланк документа[/head]
      ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]               [head=3]NanoTras_n[/head]
      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
                   ПАМЯТКА О ДЕЗИНФЕКЦИИ
      =============================================
      1. Каждый сотрудник, который прибывает с поверхности, обязан пройти полную дезинфекцию.

      2. Дезинфекция длится не меньше девяноста секунд, поэтому не пытайтесь сократить процедуру.

      3. Когда процедура закончится, нажмите кнопку на стене, и шлюз откроется автоматически.

      4. Запрещается проносить в комплекс образцы породы, растений и фауны с поверхности.

      5. Запрещается выносить из комплекса что-либо. [bold]Это касается любых предметов без исключения.[/bold]

      Помните, что ваша чистота обеспечивает безопасность ваших коллег.
      NanoTrasen заботится о вас.

