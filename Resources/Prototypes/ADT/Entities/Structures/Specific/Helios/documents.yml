      [italic]Почерк тот же, но строчки пляшут по листу.[/italic]

      [bold]9 ноября, 06:30.[/bold] Все стоят на своих местах. Сегодня повесили новые плакаты с надписью «Ваш труд становится нашим светом». Мне почему-то хочется смеяться, и я не знаю почему.

      [bold]06:44.[/bold] На основной линии случилась перегрузка, и я включила линию {BRK_BAD}, как нас учили на тренировке. Табло показало «ПЕРЕГРУЗ», а потом пол ударил меня снизу.

      [bold]Позже.[/bold] Его слышно везде, причём не через стены, а прямо внутри головы. Это не стук машины, а [bold]пульс[/bold]. Он злится, потому что проснулся оттого, что мы сделали ему больно.

      [bold]Ещё позже.[/bold] Охрана заварила подъём. Говорят, что наверху стоят солдаты и что тех, кто выбрался, расстреляли как заражённых. Мы не заражены. Мы просто знаем правду.

      Я пойду вниз, к камере. Если печать ещё можно собрать, я её соберу. Если её уже нельзя собрать, я хотя бы попрошу прощения.

