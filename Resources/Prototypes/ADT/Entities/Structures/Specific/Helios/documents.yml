             РАСПОРЯЖЕНИЕ ОТДЕЛУ БЕЗОПАСНОСТИ
      =============================================
      1. Усильте посты на подъёме к поверхности и пропускайте людей только по письменному разрешению руководства.

      2. Если сотрудники говорят о «стуке», «сердцебиении» или «живом ядре», считайте это распространением панических слухов и отправляйте нарушителей в изолятор.

      3. Если у сотрудника появились признаки лучевой болезни, не позволяйте ему контактировать с остальным персоналом.

      4. Если герметичность комплекса будет нарушена или произойдёт авария, [bold]закройте выход на поверхность.[/bold] Тех, кто покинет комплекс самовольно, считайте носителями заражения. Отряд на поверхности получил приказ не допустить, чтобы они разнесли заражение.

      А. Кейн, начальник отдела безопасности

- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocSecurityLog
  name: рапорт патруля
  components:
  - type: Sprite
    state: clipboard
  - type: Paper
    content: |
      [italic]Это лист из блокнота, и видно, что записи делали на ходу.[/italic]

      В 06:41 установка вышла на рабочий режим, и свет мигнул по всему комплексу.
      В 06:44 из лаборатории сообщили, что объект «реагирует», но никто не объяснил, что это значит.
      В 06:47 случился удар. Это был не взрыв, а удар, как будто что-то огромное повернулось во сне.
      В 06:52 камера содержания перестала отвечать, и нижний пост тоже замолчал.
      В 07:03 по коридорам поползли твари с поверхности. Я не понимаю, как они попали сюда, если мы находимся в трёх километрах под землёй.
      В 07:20 стены начали осыпаться, и базальт пошёл через перекрытия, как вода.
      В 07:31 Кейн приказал закрыть подъём, хотя там остались люди. Там остались наши люди.

      [italic]Дальше тянется только неровная линия, как будто карандаш выпал из руки.[/italic]

