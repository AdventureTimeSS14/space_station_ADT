      Смену В с 16:00 до 24:00 нёс сотрудник ████████ с номером ГЛС-038-████.

      Смену В переназначили, поэтому новых кандидатов на неё не направляйте.

      Запуск назначен на 09.11, поэтому все смены должны быть на местах с 06:00. Если сотрудник откажется выйти на смену, его отказ будет считаться саботажем.

- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocDirectorAccess
  name: записка из стола директора
  components:
  - type: Sprite
    state: dossier
  - type: Paper
    content: |
      [italic]Это лист из ежедневника. Почерк размашистый, и ручку явно сильно прижимали к бумаге.[/italic]

      Я записываю коды здесь, чтобы не держать их в голове.

      Код склада равен {WAREHOUSE_RULE_SHORT}. Это было остроумно, Грегори.
      Код блока персонала равен моему табельному номеру.
      Код энергосекции равен [bold]последним четырём цифрам полного идентификатора первичного оператора[/bold]. Кейн настоял, чтобы этот код знал только оператор, и я согласился. Ворн надёжна, по крайней мере пока что.

      Код камеры знал только Джоул. Сато говорит, что он повторял этот код до последней минуты.

      Мне нельзя забыть, что после запуска я должен отправить отчёт Совету. Слово «живое» в этом отчёте использовать нельзя.

