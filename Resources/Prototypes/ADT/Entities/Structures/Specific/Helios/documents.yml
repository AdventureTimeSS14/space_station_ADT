    content: |
      ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
      ⠀[color=#1b487e]░██░████░░░██░░░░[/color]      [head=3]Бланк документа[/head]
      ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]               [head=3]NanoTras_n[/head]
      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
                      ПРИКАЗ № 1 / 2568
                О ПЕРВИЧНОМ ОТБОРЕ ЭНЕРГИИ
      =============================================
      1. Приказываю провести первичный отбор энергии от объекта «Ядро» 09.11.2568 в 06:40 по времени комплекса.

      2. Энергетическая секция должна подать на установку «Солнце-1» питание в полном объёме и держать резервные линии в готовности.

      3. Лаборатория должна фиксировать реакцию объекта. Если активность объекта превысит расчётную, [bold]отбор прерывать нельзя.[/bold]

      4. Отдел безопасности должен обеспечить порядок. Если кто-то попытается самовольно покинуть комплекс, такие попытки следует пресекать любыми средствами.

      5. Когда запуск завершится, весь персонал будет представлен к наградам, потому что NanoTrasen помнит своих героев.

      Руководящий состав «Гелиос»
      Г. МакБернс
      [italic]Внизу другой рукой приписано: «Ирма выступила против, и её возражение записано. Г. М.»[/italic]

