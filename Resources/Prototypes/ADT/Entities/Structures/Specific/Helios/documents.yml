      =============================================
                     СЛУЖЕБНАЯ ЗАПИСКА
      =============================================
      Записку составил Г. МакБернс из руководящего состава.
      Записка адресована начальнику отдела безопасности.

      Поскольку с сотрудником М. Джоулом произошёл инцидент, блок персонала переводится на карантин до особого распоряжения.

      В блок можно попасть только по коду руководства. Кодом служат последние четыре цифры моего табельного номера. Номер записан в ведомости пропусков, поэтому храните ведомость на складе, а не где попало.

      Если персонал начнёт обсуждать причины инцидента, пресекайте эти разговоры. Сообщите сотрудникам, что Джоула перевели на поверхность для лечения.

      Я повторяю, что Джоула [bold]перевели на поверхность.[/bold]

      Г. МакБернс

