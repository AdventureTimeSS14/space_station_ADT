- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocCalibration
  name: инструкция по калибровке контура «Солнце-1»
  components:
  - type: Sprite
    state: order
  - type: Paper
    content: |
      ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
      ⠀[color=#1b487e]░██░████░░░██░░░░[/color]      [head=3]Бланк документа[/head]
      ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]               [head=3]NanoTras_n[/head]
      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
               ИНСТРУКЦИЯ ПО КАЛИБРОВКЕ КОНТУРА
      =============================================
      Щитовая энергосекции блокируется автоматически, когда контур «Солнце-1» теряет калибровку. Перед тем как войти в щитовую, оператор обязан откалибровать контур на полу пультовой.

      Когда оператор нажимает на калибровочную панель, она переключает себя и четыре соседние панели, то есть верхнюю, нижнюю, левую и правую. Контур считается откалиброванным, когда горят все шестнадцать панелей, и только тогда щитовая открывается.

      Если панели никак не загораются, начните с верхнего ряда и гасите каждую тёмную панель нажатием на панель прямо под ней. Когда вы дойдёте до нижнего ряда, по оставшимся тёмным панелям будет видно, какие панели верхнего ряда нужно нажать в следующий раз.

      =============================================
      [italic]Место для печатей[/italic]

- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocSampleOrder
  name: распоряжение по хранилищу образцов
  components:
  - type: Sprite
    state: memo
  - type: Paper
    content: |
      ⠀[color=#1b487e]███░███░░░░██░░░░[/color]
      ⠀[color=#1b487e]░██░████░░░██░░░░[/color]      [head=3]Бланк документа[/head]
      ⠀[color=#1b487e]░░█░██░██░░██░█░░[/color]               [head=3]NanoTras_n[/head]
      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
                РАСПОРЯЖЕНИЕ ДОКТОРА И. САТО
      =============================================
      Зал печати заблокирован до тех пор, пока все четыре образца глифов не вернутся в свои ячейки хранилища. Я ввела это правило, потому что образцы начинают «звучать», когда лежат далеко друг от друга, и сотрудникам снятся одинаковые сны.

      Каждый контейнер нужно поставить на ячейку с таким же глифом, то есть солнце к солнцу, око к оку, пламя к пламени и волну к волне. Контейнеры слишком тяжёлые, чтобы их поднимать, поэтому их приходится тащить за собой.

      Когда последняя ячейка загорается, хранилище снимает блокировку, и затвор зала печати открывается.

      [italic]Ниже кто-то дописал от руки: «После эвакуации контейнеры остались там, где их бросили лаборанты, поэтому их придётся искать по всей лаборатории».[/italic]
