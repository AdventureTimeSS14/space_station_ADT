            ГРАФИК СМЕН ЭНЕРГЕТИЧЕСКОЙ СЕКЦИИ
      =============================================
      График составлен на неделю запуска, с 05.11 по 11.11.2568.

      Смену А с 00:00 до 08:00 несёт Элиза Ворн с номером ГЛС-072-{VORN_ID}, и она является [bold]первичным оператором[/bold].
