      =============================================
          РЕЗЕРВНАЯ ПОДАЧА ПИТАНИЯ НА ГЕРМОЗАТВОР
                  КАМЕРЫ СОДЕРЖАНИЯ
      =============================================
      Если основное питание пропало, гермозатвор камеры содержания запитывают вручную со щита, на котором находятся линии А, Б, В и Г.

      Включите линию [bold]{BRK_FIRST}[/bold], потому что это основная резервная линия.
      Линию [bold]{BRK_BAD}[/bold] [bold]нельзя включать ни при каких обстоятельствах[/bold], потому что она проходит через камеру и замыкается на объект.
      Включите линию [bold]{BRK_PAIR_A}[/bold].
      Линию [bold]{BRK_PAIR_B}[/bold] включайте только вместе с линией {BRK_PAIR_A}, потому что по отдельности она не держит нагрузку.

      Состояние щита показывает табло. Когда на табло написано «ПИТАНИЕ», створка запитана.

      [italic]Ниже карандашом приписано: «Линию {BRK_BAD} включила я в 06:44, потому что думала, что спасаю установку. Простите меня. Э. В.»[/italic]

