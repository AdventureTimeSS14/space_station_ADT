      ⠀[color=#1b487e]░░░░██░░██░██░██░[/color] [bold]Проект Гелиос[/bold]
      ⠀[color=#1b487e]░░░░██░░░████░███[/color]
      =============================================
                 ВЕДОМОСТЬ ВЫДАЧИ ПРОПУСКОВ
      =============================================
      В ведомость внесены пропуска руководства, охраны и ключевого персонала.

      Грегори МакБернс входит в руководящий состав, и его номер ГЛС-001-{MCB_ID}.
      Артур Кейн руководит отделом безопасности, и его номер ГЛС-004-2291.
      Ирма Сато работает ведущим исследователем, и её номер ГЛС-011-7735.
      Майк Джоул работал инженером установки, и его номер ГЛС-038-████.
      Элиза Ворн работает оператором энергосистем, и её номер ГЛС-072-{VORN_ID_HEAD}██.

      [italic]Строку Джоула вымарали маркером. Последние цифры номера Ворн размыты, потому что бумагу явно держали мокрыми руками.[/italic]

      Сотрудник сдаёт пропуск, когда увольняется. Уволиться можно только после эвакуации, а эвакуацию проводят по распоряжению руководства.

- type: entity
  parent: ADTHeliosDocumentBase
  id: ADTHeliosDocVornDiary1
  name: дневник Элизы Ворн, начало
  components:
  - type: Sprite
    state: diary
  - type: Paper
    content: |
      [italic]Это тетрадный лист, исписанный аккуратным почерком.[/italic]

      [bold]20 марта.[/bold] Мы спустились вниз. Лифт шёл сорок минут, и сначала у меня заложило уши, а потом стало тепло, как будто под нами стоит печь. Комплекс огромный и очень чистый, и везде висят плакаты с улыбающимся солнцем. Мне выдали форму и номер, поэтому теперь я ГЛС-072. Это звучит как название модели тостера.

      [bold]2 апреля.[/bold] Работа интересная. Моя смена следит за подачей питания на установку, то есть мы буквально запитываем приборы, которые слушают ядро. Майк сказал, что я первая, кто не спросил, зачем здесь столько охраны.

      [bold]19 июня.[/bold] Ночью я проснулась, потому что услышала стук. Он был глухой и ровный, как будто кто-то стучит через подушку. Я подумала, что это насосы, но утром выяснила, что насосы со вчерашнего дня стоят на профилактике.

      [bold]30 августа.[/bold] Майку стало плохо после смены у камеры, и его тошнило кровью. Доктор сказал, что это переутомление, а охрана велела не обсуждать случившееся.

      [bold]14 октября.[/bold] Майка больше нет в блоке. Говорят, что его отправили на поверхность, но его вещи всё ещё лежат в шкафчике, а ботинки стоят у койки. Я не понимаю, кто поедет на поверхность без ботинок.

      [bold]7 ноября.[/bold] Я нашла в мусоре бланк, из которого поняла, что Майка никуда не отправляли. Я не могу это записать, потому что у меня трясутся руки.

      [italic]Дальше строчки расплываются, и прочитать их уже нельзя.[/italic]

