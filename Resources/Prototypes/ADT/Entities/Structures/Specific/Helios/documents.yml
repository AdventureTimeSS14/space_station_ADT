      =============================================
              ОТЧЁТ № 17. ГЛИФЫ ГЛУБИННОЙ ПОРОДЫ
      =============================================
      Отчёт составила ведущий исследователь д-р И. Сато.

      На стенах каверны, которая окружает объект, мы обнаружили рельефные знаки. Эти знаки старше любой известной цивилизации Лаваленда.

      Знаки не являются письменностью в привычном смысле. Девять фрагментов складываются в единый рисунок, и когда рисунок собран, активность объекта [bold]снижается на 40%[/bold]. Когда рисунок разрушен, активность снова растёт.

      Я предполагаю, что этот рисунок является не посланием, а [bold]печатью[/bold]. Похоже, что кто-то уже пытался успокоить объект задолго до нас.

      По распоряжению руководства фрагменты печати использовали как механический замок гермозатвора камеры содержания, потому что МакБернс счёл это «символичным».

      Я считаю это ошибкой. Мы забрали печать, чтобы запирать ею дверь, и поэтому печати больше нет там, где она была нужна.

      И. Сато

