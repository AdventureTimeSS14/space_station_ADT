- type: entity
  id: ADTHeliosSampleBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: ADT/Structures/Helios/puzzles.rsi
    drawdepth: Objects
    noRot: true
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.35,0.3,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Pullable
  - type: ADTIndestructible
  - type: Tag
    tags:
    - EmagImmune

- type: entity
  parent: ADTHeliosSampleBase
  id: ADTHeliosSampleSun
  name: контейнер с образцом «солнце»
  description: Это тяжёлый свинцовый контейнер, и на его ярлыке нарисован глиф солнца. Его нельзя поднять, но можно тащить.
  suffix: Гелиос
  components:
  - type: Sprite
    state: sample_sun
  - type: ADTGlyphSample
    glyph: sun

- type: entity
  parent: ADTHeliosSampleBase
  id: ADTHeliosSampleEye
  name: контейнер с образцом «око»
  description: Это тяжёлый свинцовый контейнер, и на его ярлыке нарисован глиф ока. Его нельзя поднять, но можно тащить.
