- type: entity
  parent: ADTHeliosPuzzleElementBase
  id: ADTHeliosGlyphPlateWave
  name: ячейка хранилища «волна»
  description: На плите выгравирован глиф волны. Когда на плиту ставят контейнер с таким же глифом, её скобы загораются.
  suffix: Гелиос
  components:
  - type: Sprite
    layers:
    - state: plate_wave_off
