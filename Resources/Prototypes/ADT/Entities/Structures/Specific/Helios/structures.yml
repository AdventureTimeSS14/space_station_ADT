- type: entity
  parent: BaseStructure
  id: ADTHeliosLavalandCore
  name: ядро Лаваленда
  description: Оно не светится, а дышит, и каждый его удар отдаётся в костях. Это не минерал и не реактор, а сердце.
  suffix: Гелиос
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: ADT/Structures/Helios/core.rsi
    drawdepth: Mobs
    layers:
    - state: core
    - state: core_pulse
      shader: unshaded
  - type: PointLight
    color: "#ff5a1f"
    radius: 9
    energy: 4
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:PulseBehaviour
      id: heartbeat
      interpolate: Cubic
      maxDuration: 1.6
      startValue: 2.5
      endValue: 5
      property: Energy
      isLooped: true
      enabled: true
  - type: AmbientSound
    enabled: true
    volume: 4
    range: 14
    sound:
      path: /Audio/ADT/heart.ogg
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.45
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: RadiationSource
    intensity: 1
    slope: 0.25
  - type: ADTIndestructible
  - type: Tag
    tags:
    - EmagImmune

