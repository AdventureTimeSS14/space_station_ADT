  description: Исследователь лежит лицом вверх, и халат под ним пропитался кровью. Похоже, он умер быстро.
  suffix: Гелиос
  components:
  - type: Sprite
    state: body_sci

- type: entity
  parent: ADTHeliosRemainsBase
  id: ADTHeliosRemainsEngineer
  name: останки инженера
  description: Каска инженера откатилась, а под головой засохла кровь. Он работал до последнего.
  suffix: Гелиос
  components:
  - type: Sprite
    state: body_eng

- type: entity
  parent: ADTHeliosRemainsBase
  id: ADTHeliosRemainsGuard
  name: останки охранника
  description: Охранник лежит в луже крови, и пустая кобура на его поясе расстёгнута.
  suffix: Гелиос
  components:
  - type: Sprite
    state: body_sec

