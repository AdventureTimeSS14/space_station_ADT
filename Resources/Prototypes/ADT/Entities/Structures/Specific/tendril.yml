- type: entity
  id: ADTTendrilCollapse
  name: collapsing necropolis tendril
  description: Get clear!
  categories: [ HideSpawnMenu ]
  components:
  - type: TendrilCollapse
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: ADT/Structures/Specific/tendril.rsi
    state: tendril
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MobMask
        layer:
        - MobLayer
        density: 200
  - type: PointLight
    radius: 4
    energy: 2
    color: "#c48a18"
  - type: AshStormImmune

- type: entity
  id: ADTTendrilBase
  parent: BaseStructure
  name: necropolis tendril
  description: A vile tendril of corruption, originating deep underground. Terrible monsters are pouring out of it.
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: ADT/Structures/Specific/tendril.rsi
    state: tendril
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MobMask
        layer:
        - MobLayer
        density: 200
  - type: PointLight
    radius: 4
    energy: 2
    color: "#c48a18"
  - type: AshStormImmune
  - type: Tendril
    spawns:
      MobWatcherLavaland: 90
      MobWatcherIcewing: 5
      MobWatcherMagmawing: 5
  - type: Damageable
    damageModifierSet: Skeleton
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ADTTendrilLavaWatcher
  parent: ADTTendrilBase
  suffix: Watcher

- type: entity
  id: ADTTendrilGoliath
  parent: ADTTendrilBase
  suffix: Goliath
  components:
  - type: Tendril
    spawns:
      ADTMobLavalandGoliath: 1

- type: entity
  id: ADTTendrilLegion
  parent: ADTTendrilBase
  suffix: Legion
  components:
  - type: Tendril
    spawnDelay: 40
    spawns:
      ADTMobLegionTendril: 1

- type: entity
  id: ADTTendrilRandomThreat
  parent: ADTTendrilBase
  suffix: Random Threat
  components:
  - type: Tendril
    maxSpawns: 5
    spawnDelay: 25
    spawns:
      ADTMobLavalandGoliath: 27
      ADTMobLegionTendril: 26
      MobWatcherLavaland: 26
      MobWatcherIcewing: 1
      ADTMobMarrowWeaver: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ADTTendrilDangerous
  parent: ADTTendrilBase
  suffix: Dangerous
  components:
  - type: Tendril
    maxSpawns: 7
    spawnDelay: 15
    spawns:
      ADTMobLavalandGoliath: 17
      ADTMobLegionTendril: 15
      MobWatcherLavaland: 18
      MobWatcherIcewing: 12
      MobWatcherMagmawing: 12
      ADTMobMarrowWeaver: 12
      ADTMobMarrowWeaverFrost: 14
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ADTTendrilHypertrophied
  parent: ADTTendrilBase
  suffix: Hypertrophied
  components:
  - type: Tendril
    spawns:
      ADTAbominationHypertrophied: 1

- type: entity
  id: ADTTendrilDeath
  parent: ADTTendrilBase
  suffix: Death
  components:
  - type: Tendril
    spawns:
      ADTAbominationDeath: 1

- type: entity
  id: ADTTendrilBloated
  parent: ADTTendrilBase
  suffix: Bloated
  components:
  - type: Tendril
    spawns:
      ADTAbominationBloated: 1
