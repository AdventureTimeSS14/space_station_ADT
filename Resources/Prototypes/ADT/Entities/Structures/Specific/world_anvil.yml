- type: entity
  id: ADTWorldAnvil
  parent: BaseStructure
  name: world anvil
  description: A forge connected by lava reservoirs to the core of the planet. Whoever used it last was making something powerful.
  components:
  - type: Sprite
    sprite: ADT/Structures/Specific/world_anvil.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ADTWorldAnvilVisuals.Heated:
        base:
          True: { state: icon_heated }
          False: { state: icon }
  - type: PointLight
    enabled: false
    radius: 4
    energy: 2
    color: "#ffa14d"
  - type: InteractionOutline
  - type: ADTWorldAnvil
    maxCharges: 10
    fuels:
    - whitelist:
        components:
        - Gibtonite
      charges: 3
    recipes:
    - whitelist:
        tags:
        - ADTMagmite
      result: ADTMagmiteParts
      cost: 1
      delay: 7
    - whitelist:
        tags:
        - ADTMagmitePartsInert
      result: ADTMagmiteParts
      cost: 0
      delay: 3

- type: entity
  id: ADTWorldAnvilRoomMarker
  parent: ADTBaseRoomMarker
  name: world anvil ruin spawner
  components:
  - type: ADTRoomFill
    clearExisting: true
    rotation: false
    roomWhitelist:
      tags:
      - LavaDungeonWorldAnvil
