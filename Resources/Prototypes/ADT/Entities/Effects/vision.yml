# Low — фелинид, резоми, арахнид
- type: entity
  id: ADTEffectNightVisionLow
  categories: [ HideSpawnMenu ]
  name: night vision low
  components:
  - type: PointLight
    color: "#FFFFFF"
    energy: 0.35
    radius: 3
    softness: 24
    falloff: 5.0
