# Innate NV: neutral fill light only (no screen tint — natural colors).
# Tier: Tajaran > Shadekin/Vulp/Moth > everyone else.

# Weak (3rd) — felinid, resomi, arachnid, other innate NV
- type: entity
  id: ADTEffectNightVision
  categories: [ HideSpawnMenu ]
  name: night vision
  components:
  - type: PointLight
    color: "#FFFFFF"
    energy: 0.35
    radius: 3
    softness: 24
    falloff: 5.0
    castShadows: true

# Medium (2nd) — shadekin, vulpkanin, moth
- type: entity
  id: ADTEffectNightVisionMedium
  categories: [ HideSpawnMenu ]
  name: night vision medium
  components:
