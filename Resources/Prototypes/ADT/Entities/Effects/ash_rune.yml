- type: entity
  id: ADTAshRuneActivation
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 3
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: ADT/Effects/ashwalker_rune.rsi
    state: activate
    drawdepth: Effects
    noRot: true
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTAshRune
  name: ash rune
  description: A fully functioning rune, ready for ritual work.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: ADT/Effects/ashwalker_rune.rsi
    state: rune
    drawdepth: FloorObjects
    noRot: true
  - type: ADTRitualObject
    categories:
    - ADTAshWalker
    allowedSpecies:
    - ADTAshWalkerSpecies
    - ADTAshWalkerShamanSpecies
    - ADTDraconidSpecies
  - type: UserInterface
    interfaces:
      enum.ADTRitualUiKey.Key:
        type: ADTRitualBoundUserInterface
      enum.ADTRitualSummonUiKey.Key:
        type: ADTRitualSummonBoundUserInterface
