  components:
  - type: Sprite
    sprite: ADT/Misc/car_update.rsi
    state: janicart_upgrade_speed
  - type: Item
    size: Small
  - type: ADTJanicartUpgrade
    tags: [ ADTJanicartUpgradeSpeed ]
    examineText: janicart-upgrade-examine-speed
