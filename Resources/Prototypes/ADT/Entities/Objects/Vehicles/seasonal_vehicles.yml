# Ездовой олень Санты (спавнится из ADTReindeerCube). Восстановлено из 4b162e6b071 (#2332)

- type: entity
  parent: [ ADTVehicleATV, FlyingMobBase ]
  id: ADTReindeer
  name: ADTReindeer
  description: ADTReindeer
  components:
    - type: Vehicle
      hasKey: true
      southOver: true
      northOver: true
      northOverride: -0.1
      southOverride: 0.1
    - type: CanMoveInAir
    - type: Sprite
      sprite: ADT/Objects/Vehicles/reindeer.rsi
      drawdepth: HighFloorObjects
      layers:
      - state: deer2
        map: ["enum.VehicleVisualLayers.AutoAnimate"]
      noRot: true
    - type: Strap
      buckleOffset: "0.2, 0"
      #maxBuckleDistance: 1
    - type: MovementSpeedModifier
      acceleration: 2
      friction: 1.5
      baseWalkSpeed: 4.5
      baseSprintSpeed: 7
