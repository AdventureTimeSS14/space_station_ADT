- type: entity
  parent: Solution
  id: ADTBloodPackTransfusionSolution
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: pack
    solution:
      maxVol: 100
      reagents: []

- type: entity
  parent: Solution
  id: ADTBloodPackTransfusionFullSolution
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: pack
    solution:
      maxVol: 100
      reagents:
      - ReagentId: Blood
        Quantity: 100
