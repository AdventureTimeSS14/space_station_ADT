- type: entity
  id: ADTClockworkGolemRemains
  parent: BaseItem
  name: clockwork golem scrap
  description: A pile of scrap metal. It seems damaged beyond repair.
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/clockwork_junk.rsi
    state: golem_remains
  - type: Item
    size: Normal

- type: entity
  id: ADTClockworkFallenArmor
  parent: BaseItem
  name: fallen armor
  description: Lifeless chunks of armor. They're designed in a strange way and won't fit on you.
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/clockwork_junk.rsi
    state: fallen_armor
  - type: Item
    size: Normal

- type: entity
  id: ADTWrenchBrass
  parent: Wrench
  name: brass wrench
  description: A wrench with common uses. It is faintly warm to the touch.
  components:
  - type: Sprite
    sprite: ADT/Objects/Tools/brass_wrench.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Tools/brass_wrench.rsi
    storedSprite:
      sprite: ADT/Objects/Tools/brass_wrench.rsi
      state: icon
  - type: Tool
    qualities:
    - Anchoring
    speedModifier: 2
    useSound:
      path: /Audio/Items/ratchet.ogg

- type: entity
  id: ADTWirecuttersBrass
  parent: BaseItem
  name: brass wirecutters
  description: A pair of wirecutters made of brass. The handle feels freezing cold to the touch.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - Wirecutter
  - type: Sprite
    sprite: ADT/Objects/Tools/brass_wirecutters.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Tools/brass_wirecutters.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 2
    attackRate: 2
    soundHit:
      path: /Audio/Items/wirecutter.ogg
  - type: Tool
    qualities:
    - Cutting
    - Shearing
    speedModifier: 2
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: ToolTileCompatible

- type: entity
  id: ADTWelderBrass
  parent: WelderExperimental
  name: brass welding tool
  description: A brass welder that seems to constantly refuel itself. It is faintly warm to the touch.
  components:
  - type: Sprite
    sprite: ADT/Objects/Tools/brass_welder.rsi
  - type: Item
    sprite: ADT/Objects/Tools/brass_welder.rsi
  - type: Tool
    qualities:
    - Welding
    speedModifier: 2
    useSound:
      collection: Welder
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 10

- type: entity
  id: ADTToolboxBrass
  parent: BaseStorageItem
  name: brass box
  description: A huge brass box with several indentations in its surface. A strange energy emanates from it.
  components:
  - type: Sprite
    sprite: ADT/Objects/Tools/brass_toolbox.rsi
    state: icon
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,6,3
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: Item
    size: Ginormous
    shape:
    - 0,0,7,4
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: /Audio/Weapons/smash.ogg
  - type: Tag
    tags:
    - Toolbox

- type: entity
  id: ADTRatvarianSpear
  parent: BaseItem
  name: ratvarian spear
  description: A razor-sharp spear made of brass. It thrums with barely-contained energy.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/ratvarian_spear.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        base:
          True: { state: icon-wielded }
          False: { state: icon }
  - type: Item
    sprite: ADT/Objects/Weapons/Melee/ratvarian_spear.rsi
    size: Ginormous
  - type: Wieldable
  - type: MeleeWeapon
    wideAnimationRotation: -135
    angle: 0
    animation: WeaponArcThrust
    damage:
      types:
        Piercing: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 5
  - type: ArmorPenetration
    penetration: 0.4
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 30
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tool
    qualities:
    - Slicing

