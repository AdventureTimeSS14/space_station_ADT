- type: entity
  name: black tome
  parent: BaseItem
  id: KillTome
  suffix: KillTome, Admeme # To stay true to the lore, please never make this accessible outside of divine intervention (admeme).
  description: A worn black tome. It smells like old paper.
  components:
  - type: Sprite
    sprite: ADT/Objects/Misc/killtome.rsi
    layers:
    - state: icon
  - type: KillTome
    defaultKillDelay: 40
    damage:
      types:
        Blunt: 200
  - type: Paper
    content: killtome-rules
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FlavorProfile
    flavors:
    - paper
  - type: Item
    size: Tiny
  - type: PhysicalComposition
  - type: Tag
    tags:
    - Document
    - Paper