- type: entity
  id: ADTAutoSurgeon
  parent: Bed
  name: auto surgeon
  description: An operating table that performs the surgery by itself. Strap the patient down and activate it to install the loaded implant.
  abstract: true
  components:
    - type: Sprite
      sprite: ADT/Objects/Specific/Medical/auto_surgeon.rsi
      state: icon
      noRot: true
    - type: Icon
      sprite: ADT/Objects/Specific/Medical/auto_surgeon.rsi
      state: icon
    - type: OperatingTable
    - type: AmbientMusicMarkerMedical
    - type: ItemSlots
    - type: ContainerContainer
      containers:
        autosurgeon_slot_0: !type:ContainerSlot { }
        autosurgeon_slot_1: !type:ContainerSlot { }
    - type: AutoSurgeon
      uses: -1
      implantSlots:
        - priority: 0
          whitelist:
            tags:
              - SubdermalImplant
        - priority: 0
          whitelist:
            tags:
              - SubdermalImplant
      steps:
        - label: autosurgeon-step-incision
          duration: 2
          sound:
            path: /Audio/ADT/Medical/Surgery/scalpel1.ogg
          damage:
            types:
              Slash: 2
              Bloodloss: 1
        - label: autosurgeon-step-clamp
          duration: 1.5
          sound:
            path: /Audio/ADT/Medical/Surgery/hemostat1.ogg
        - label: autosurgeon-step-retract
          duration: 1.5
          sound:
            path: /Audio/ADT/Medical/Surgery/retractor1.ogg
          damage:
            types:
              Bloodloss: 1
        - label: autosurgeon-step-install
          duration: 2
          install: true
          sound:
            path: /Audio/ADT/Medical/Surgery/organ1.ogg
        - label: autosurgeon-step-cauterize
          duration: 2
          sound:
            path: /Audio/ADT/Medical/Surgery/cautery2.ogg
          damage:
            types:
              Heat: 1

- type: entity
  id: ADTAutoSurgeonFlatpackBase
  parent: [BaseFlatpack, BaseSyndicateContraband]
  name: auto surgeon flatpack
  description: A flatpack used for constructing an auto surgeon.
  abstract: true
  components:
    - type: Item
      size: Normal

- type: entity
  id: ADTAutoSurgeonTable
  parent: ADTAutoSurgeon
  name: auto surgeon
  description: An operating table that performs the surgery by itself. Load an implant into it, strap the patient down and activate it.
  categories: [ HideSpawnMenu ]
  components:
    - type: AutoSurgeon
      uses: -1

- type: entity
  id: ADTAutoSurgeonFlatpack
  parent: ADTAutoSurgeonFlatpackBase
  components:
    - type: Flatpack
      entity: ADTAutoSurgeonTable

- type: entity
  id: ADTSyndicateAutoSurgeonTable
  parent: ADTAutoSurgeon
  name: syndicate auto surgeon
  description: A syndicate operating table that performs the surgery by itself. Load an implant into it, strap the patient down and activate it.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: icon-syndie
    - type: Icon
      state: icon-syndie

- type: entity
  id: ADTSyndicateAutoSurgeonFlatpack
  parent: ADTAutoSurgeonFlatpackBase
  name: syndicate auto surgeon flatpack
  components:
    - type: Flatpack
      entity: ADTSyndicateAutoSurgeonTable

- type: entity
  id: ADTERTAutoSurgeonTable
  parent: ADTAutoSurgeon
  name: ERT auto surgeon
  description: An ERT operating table that performs the surgery by itself. Load an implant into it, strap the patient down and activate it.
  categories: [ HideSpawnMenu ]

- type: entity
  id: ADTERTAutoSurgeonFlatpack
  parent: BaseFlatpack
  name: ERT auto surgeon flatpack
  description: A flatpack used for constructing an ERT auto surgeon.
  components:
    - type: Item
      size: Normal
    - type: Flatpack
      entity: ADTERTAutoSurgeonTable
