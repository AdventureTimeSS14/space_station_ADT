- type: entity
  parent: BaseSubdermalImplant
  id: ADTSecondHeartImplant
  name: second heart implant
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateSecondHeartImplant
    - type: TriggerOnActivateImplant
    - type: ImplantCharges
      maxCharges: 1
    - type: MobStateTriggerCondition
      allowedStates:
      - Critical
      - Dead
      failPopup: second-heart-implant-not-crit
    - type: ReviveOnTrigger
      targetUser: true
      residualDamage:
        types:
          Asphyxiation: 50
    - type: EmitSoundOnTrigger
      targetUser: true
      sound:
        path: /Audio/ADT/Effects/ImplantsEffects/second-heart-activate.ogg
    - type: PopupOnTrigger
      targetUser: true
      text: second-heart-implant-activate
      popupType: Large
    - type: ImplantVisionOnTrigger
      targetUser: true
      vision: SecondHeartVision
      duration: 2.5
    - type: SubdermalImplantEmp
    - type: CyberneticLoad
      implantLoad: 35

- type: entity
  parent: BaseSubdermalImplant
  id: ADTBerserkImplant
  name: Berserk implant
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateBerserkImplant
    - type: TriggerOnActivateImplant
    - type: JitterOnTrigger
      targetUser: true
      time: 3
      refresh: true
    - type: ImplantBoostOnTrigger
      targetUser: true
      duration: 8
      settings:
        vision: BerserkVision
        removeOnMobStateChange: false
        trail:
          lerpTime: 0.05
          lerpDelay: 0.05
          lifetime: 0.25
          frequency: 0.07
          alphaLerpAmount: 0.5
          maxParticleAmount: 12
          color: "#DC1919C8"
        components:
        - type: BerserkImplantActive
    - type: SubdermalImplantEmp
    - type: CyberneticLoad
      implantLoad: 65

- type: entity
  parent: BaseSubdermalImplant
  id: ADTKereznikovImplant
  name: kereznikov implant
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateKereznikov
      blacklist:
        components:
        - SandevistanUser
    - type: TriggerOnActivateImplant
    - type: ImplantBoostOnTrigger
      targetUser: true
      duration: 2
      settings:
        movementSpeedModifier: 1.8
        attackSpeedModifier: 1.8
        vision: SandevistanVision
        trail:
          rainbow: true
    - type: SubdermalImplantEmp
    - type: CyberneticLoad
      implantLoad: 35

- type: entity
  parent: BaseSubdermalImplant
