- type: entity
  parent: BaseSubdermalImplant
  id: ADTSandevistanImplant
  name: sandevistan
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
    - type: SandevistanImplant
    - type: SubdermalImplantEmp
      empCooldown: 60
      empDamage:
        types:
          Shock: 0
    - type: CyberneticLoad
      implantLoad: 60

- type: entity
  parent: BaseSubdermalImplant
  id: ADTStatvekaSandevistanImplant
  name: statveka sandevistan
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
    - type: StatvekaSandevistanImplant
    - type: SubdermalImplantEmp
      empCooldown: 60
    - type: CyberneticLoad
      implantLoad: 70

- type: entity
  parent: BaseSubdermalImplant
  id: ADTBloodPumpImplant
  name: blood pump implant
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActionActivateBloodPumpImplant
    - type: TriggerOnActivateImplant
    - type: ImplantCharges
      actionDescription: blood-pump-implant-action-desc
      usedPopup: blood-pump-implant-activate
      emptyPopup: implant-charges-empty
    - type: InjectOnTrigger
      targetUser: true
      fullPopup: implant-bloodstream-full
      solution:
        reagents:
        - ReagentId: Puncturase
          Quantity: 5
        - ReagentId: ADTStypticPowder
          Quantity: 15
        - ReagentId: Saline
          Quantity: 10
        - ReagentId: Dylovene
          Quantity: 10
    - type: EmitSoundOnTrigger
      targetUser: true
      predicted: true
      sound:
        path: /Audio/Items/hypospray.ogg
    - type: ImplantVisionOnTrigger
      targetUser: true
      vision: ImplantActivationVision
    - type: SubdermalImplantEmp
    - type: CyberneticLoad
      implantLoad: 20

