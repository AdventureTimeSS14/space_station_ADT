- type: entity
  parent: [ FoodInjectableBase, BaseSlicingRefinableFood ]
  id: ADTFoodPizzaSindiBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
  - type: Edible
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/Baked/sindy_pizza.rsi
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Omnizine
        Quantity: 10
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood

- type: entity
  name: Sindi pizza
  parent: ADTFoodPizzaSindiBase
  id: ADTFoodPizzaSindi
  description: Red and scary pizza
  components:
  - type: FlavorProfile
    flavors:
      - ADTSindiPizza
  - type: Sprite
    layers:
    - state: fullpizza
  - type: ToolRefinable
    refineResult:
    - id: ADTFoodPizzaSindiSlice
      amount: 8

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: ADTFoodPizzaSindiSliceBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - ADTSindiPizza
  - type: Edible
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/Baked/sindy_pizza.rsi
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Omnizine
        Quantity: 1
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood
    - Slice


- type: entity
  name: slice of sindi pizza
  parent: ADTFoodPizzaSindiSliceBase
  id: ADTFoodPizzaSindiSlice
  description: A slice of syndicate.
  components:
  - type: FlavorProfile
    flavors:
      - ADTSindiPizza
  - type: Sprite
    layers:
    - state: pizzaslice





