- type: entity
  parent: BaseStorageItem
  id: RapidPartExchanger
  name: RPED
  description: A Rapid Part Exchange Device, perfect for quickly upgrading machines.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Research/rped.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Research/rped.rsi
    size: Normal
  - type: Clothing
    slots: [ belt ]
    quickEquip: false
  - type: PartExchanger
  - type: GuideHelp
    guides:
    - MachineParts
  - type: ActionGrant
    actions:
    - ActionRpedFilter
  - type: ItemActionGrant
  - type: UserInterface
    interfaces:
      enum.PartExchangerUiKey.Key:
        type: PartExchangerFilterBoundUserInterface
      enum.PartExchangerConsoleUiKey.Key:
        type: PartExchangerConsoleBoundUserInterface
  - type: Storage
    grid:
      - 0,0,5,3
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - MachinePart
      - MachineBoard
      - ComputerBoard
      - Stack

- type: entity
  parent: RapidPartExchanger
  id: RapidPartExchangerBorg
  name: RPED
  description: A Rapid Part Exchange Device, perfect for quickly upgrading machines.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Research/borg_rped.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Research/borg_rped.rsi

- type: entity
  id: RPEDUpgradeBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/ADT/Objects/Misc/rped_upgrade.rsi
    drawdepth: Effects
    layers:
    - state: rped_upgrade
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#b06cff"
    radius: 3
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 2

- type: entity
  parent: RapidPartExchanger
  id: BluespaceRapidPartExchanger
  name: bluespace RPED
  description: An upgraded RPED that can replace parts remotely and bypasses panel restrictions.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Research/bluespace_rped.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Research/bluespace_rped.rsi
  - type: PartExchanger
    exchangeDuration: 1.5
    doDistanceCheck: false
    requireOpenPanel: false
    exchangeSound:
      path: /Audio/Effects/teleport_arrival.ogg
    exchangeBeamPrototype: RPEDUpgradeBeam
  - type: Storage
    grid:
      - 0,0,12,8
