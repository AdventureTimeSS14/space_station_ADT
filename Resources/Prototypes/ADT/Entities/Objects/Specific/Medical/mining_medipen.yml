- type: entity
  name: survival medipen
  parent: ChemicalMedipen
  id: ADTSurvivalMedipen
  description: "A medipen for surviving in the harshest of environments, heals and protects from environmental hazards. WARNING: Do not inject more than one pen in quick succession."
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/mining_medipen.rsi
    layers:
    - state: survival
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#3D6E9B"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#3D6E9B"
      - state: base-colorB-inhand-right
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: survival_empty
  - type: Injector
    currentTransferAmount: 42
    activeModeProtoId: ADTSlowMedipenInjectMode
    allowedModes:
    - HyposprayInjectMode
    - ADTSlowMedipenInjectMode
  - type: ADTLowPressureInjector
    lowPressureMode: HyposprayInjectMode
    normalMode: ADTSlowMedipenInjectMode
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 42
        reagents:
        - ReagentId: DexalinPlus
          Quantity: 10
        - ReagentId: Leporazine
          Quantity: 15
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: Barozine
          Quantity: 2
        - ReagentId: Tricordrazine
          Quantity: 5
  - type: Tag
    tags:
    - ADTMedipen
  - type: StaticPrice
    price: 150

- type: entity
  name: emergency stabilization medipen
  parent: ChemicalMedipen
  id: ADTStabilizationMedipen
  description: A fast acting life-saving emergency autoinjector, stocked for prospectors who work a long shuttle ride away from the nearest medbay.
  components:
