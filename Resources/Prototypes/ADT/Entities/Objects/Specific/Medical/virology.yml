- type: entity
  parent: BaseChemistryEmptyBottle
  id: ADTVirusCultureBottle
  name: культура вируса
  description: Небольшая мензурка с синтетической кровью, заражённой вирусной культурой.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/virus_tube.rsi
    layers:
    - state: tube
    - state: tube-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: tube_lid
      map: [ "enum.OpenableVisuals.Layer" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: tube-
  - type: Openable
    openableByHand: true
    closeable: true
    sound:
      collection: bottleOpenSounds
    closeSound:
      collection: bottleCloseSounds
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { visible: False }
          False: { visible: True }
  - type: Label

- type: entity
  parent: BaseChemistryEmptyBottle
  id: ADTVaccineBottle
  name: вакцина
  description: Небольшая мензурка с раствором антител.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/virus_tube.rsi
    layers:
    - state: tube
    - state: tube-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: tube_lid
      map: [ "enum.OpenableVisuals.Layer" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: tube-
  - type: Openable
    openableByHand: true
    closeable: true
    sound:
      collection: bottleOpenSounds
    closeSound:
      collection: bottleCloseSounds
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { visible: False }
          False: { visible: True }
  - type: Label

- type: entity
  parent: BodyBag
  id: ADTBodyBagBiohazard
  name: биоизоляционный мешок
  description: Мешок для тел, который не даёт вирусам вырваться наружу.
  components:
  - type: ADTDiseaseContainment
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/envirobag.rsi
    layers:
    - state: bag
      map: [ "unfoldedLayer", "enum.StorageVisualLayers.Base" ]
    - state: bag_folded
      map: [ "foldedLayer" ]
      visible: false
    - state: open_overlay
      map: [ "enum.StorageVisualLayers.Door" ]
    - state: paper
      map: [ "enum.PaperLabelVisuals.Layer" ]
  - type: Icon
    sprite: ADT/Objects/Specific/Medical/envirobag.rsi
    state: bag
  - type: Item
    heldPrefix: bag

- type: entity
  parent: BaseStorageItem
  id: ADTBioBag
  name: изолирующий мешок
  description: Мешок для безопасной переноски и утилизации биологических отходов и других заразных материалов.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Medical/biobag.rsi
    state: icon
  - type: Clothing
    quickEquip: false
    sprite: ADT/Objects/Specific/Medical/biobag.rsi
    slots:
    - belt
  - type: Item
    size: Normal
    storedRotation: -90
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Small
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - FitsInDispenser
      - ADTDiseaseCulture
      tags:
      - Bottle
      - Syringe
  - type: ADTDiseaseContainment
  - type: Dumpable

