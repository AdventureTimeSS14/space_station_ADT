  suffix: Full
  components:
  - type: Sprite
    state: makeshift
  - type: Item
    heldPrefix: makeshift
  - type: ADTSplint
    selfDelay: 10
    otherDelay: 5
  - type: Stack
    stackType: ADTMakeshiftSplint
    count: 5

- type: entity
  parent: ADTMakeshiftSplint
  id: ADTMakeshiftSplint1
