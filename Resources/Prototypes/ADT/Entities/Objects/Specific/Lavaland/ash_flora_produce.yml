- type: entity
  name: mushroom shavings
  parent: FoodProduceBase
  id: ADTFoodMushroomShavings
  description: Some shavings from a tall mushroom. With enough, might serve as a bowl.
  components:
  - type: FlavorProfile
    flavors:
    - mushroom
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Sugar
          Quantity: 3
        - ReagentId: Ethanol
          Quantity: 2
  - type: Sprite
    sprite: ADT/Objects/Specific/Hydroponics/polypore.rsi
  - type: Produce
    seedId: ADTSeedPolypore
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Mushroom
    - ADTAshFloraShavings

