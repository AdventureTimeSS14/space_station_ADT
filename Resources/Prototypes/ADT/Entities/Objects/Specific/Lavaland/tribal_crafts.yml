  description: Strips of ash drake hide wrapped around the feet. Warm to the touch.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/footwraps_dragon.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/footwraps_dragon.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.9
        Caustic: 0.95
  - type: FootstepModifier
    footstepSoundCollection:
      collection: null
      params:
        volume: -10
  - type: Construction
    graph: ADTFootwrapsDragon
    node: footwraps

- type: entity
  parent: ClothingShoesBase
  id: ADTClothingShoesPathfinderTreads
  name: pathfinder treads
  description: Light boots of sinew and weaver chitin.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/pathfinder_treads.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/pathfinder_treads.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.85
    coolingCoefficient: 0.4
  - type: Construction
    graph: ADTPathfinderTreads
    node: treads

- type: entity
  parent: ClothingHandsBase
  id: ADTClothingHandsWeaverGloves
  name: weaver chitin gloves
  description: Fingerless gloves with plates of weaver chitin sewn onto the knuckles.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/weaver_gloves.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/weaver_gloves.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: StaminaDamageOnHit
    damage: 12.5
  - type: ADTHitStunChance
    knockdownChance: 0.2
    knockdownTime: 2
  - type: Construction
    graph: ADTWeaverGloves
    node: gloves

- type: entity
  parent: ClothingBeltQuiver
  id: ADTClothingBeltQuiverWeaver
  name: weaver chitin quiver
  description: A quiver made of weaver chitin. Just one spider!
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/weaver_quiver.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/weaver_quiver.rsi
  - type: Construction
    graph: ADTWeaverQuiver
    node: quiver

# Оружие

- type: entity
  parent: BaseShield
  id: ADTShieldGoliath
  name: goliath shield
  description: A shield made from interwoven plates of goliath hide.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/Tribal/goliath_shield.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Lavaland/Tribal/goliath_shield.rsi
    heldPrefix: null
  - type: Clothing
    sprite: ADT/Objects/Specific/Lavaland/Tribal/goliath_shield.rsi
    quickEquip: false
    slots:
    - back
  - type: Construction
    graph: ADTShieldGoliath
    node: shield

- type: entity
  parent: BaseItem
  id: ADTSpearChitin
  name: chitin spear
  description: A bone spear reinforced with weaver chitin.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/Tribal/chitin_spear.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Lavaland/Tribal/chitin_spear.rsi
    size: Large
  - type: Clothing
    sprite: ADT/Objects/Specific/Lavaland/Tribal/chitin_spear.rsi
    quickEquip: false
    slots:
    - back
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 2.1
    angle: 0
    animation: WeaponArcThrust
    damage:
      types:
        Piercing: 14
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
  - type: ThrowingAngle
    angle: 225
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 26
  - type: Sharp
  - type: Tag
    tags:
    - Spear
    - ADTSpearChitin
  - type: Construction
    graph: ADTSpearChitin
    node: spear

- type: entity
  parent: ADTSpearChitin
  id: ADTSpearHerBitingEmbrace
  name: her biting embrace
  description: A chitin spear with an eel bone blade and a ruby set into the shaft. It hungers.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/Tribal/her_biting_embrace.rsi
  - type: Item
    sprite: ADT/Objects/Specific/Lavaland/Tribal/her_biting_embrace.rsi
  - type: Clothing
    sprite: ADT/Objects/Specific/Lavaland/Tribal/her_biting_embrace.rsi
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 16
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 12
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 45
  - type: ADTBloodlettingOnHit
    damage:
      types:
        Slash: 25
  - type: Tag
    tags:
    - Spear
  - type: Construction
    graph: ADTSpearChitin
    node: embrace

