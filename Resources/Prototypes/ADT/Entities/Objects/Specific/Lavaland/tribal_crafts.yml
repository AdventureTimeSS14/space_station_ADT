# Хрящевая броня

- type: entity
  parent: ClothingOuterBase
  id: ADTClothingOuterCartilagePads
  name: cartilage shoulder pads
  description: Thick cartilage plates tied onto the shoulders. Pair them with greaves to get a full set.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/cartilage_pads.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/cartilage_pads.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Heat: 0.8
        Caustic: 0.8
  - type: Tag
    tags:
    - ADTCartilagePads
  - type: Construction
    graph: ADTCartilageArmor
    node: pads

- type: entity
  parent: ClothingOuterBase
  id: ADTClothingOuterCartilageGreaves
  name: cartilage greaves
  description: Thick cartilage plates tied onto the legs. Pair them with shoulder pads to get a full set.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/cartilage_greaves.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/cartilage_greaves.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Heat: 0.8
        Caustic: 0.8
  - type: Tag
    tags:
    - ADTCartilageGreaves
  - type: Construction
    graph: ADTCartilageArmor
    node: greaves

- type: entity
  parent: ClothingOuterBase
  id: ADTClothingOuterCartilageArmor
  name: cartilage armor
  description: A full set of thick cartilage plates. Light, sturdy and does not burn.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/cartilage_armor.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/cartilage_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.85
        Heat: 0.5
        Caustic: 0.5
  - type: GroupExamine
  - type: Construction
    graph: ADTCartilageArmor
    node: armor

# Одежда

- type: entity
  parent: BaseItem
  id: ADTClothingNeckSkullCodpiece
  name: skull codpiece
  description: A skull shaped ornament, intended to protect the important things in life. Attaches to a jumpsuit.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/skull_codpiece.rsi
    state: icon
  - type: Item
    size: Small
  - type: ADTAccessory
    allowDuplicates: false
    sprite: ADT/Clothing/Lavaland/skull_codpiece.rsi
    equippedState: equipped-NECK
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
  - type: Construction
    graph: ADTSkullCodpiece
    node: codpiece

- type: entity
  parent: ClothingBeltStorageBase
  id: ADTClothingBeltHunter
  name: hunter's belt
  description: A belt made of sinew and goliath hide. Holds whatever a hunter needs.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/hunter_belt.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/hunter_belt.rsi
  - type: Item
    sprite: ADT/Clothing/Lavaland/hunter_belt.rsi
  - type: Construction
    graph: ADTHunterBelt
    node: belt

- type: entity
  parent: [ ClothingOuterBaseLarge, AllowSuitStorageClothing ]
  id: ADTClothingOuterDrakeArmor
  name: drake armour
  description: A suit of armour fashioned from the remains of an ash drake.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/drake_armor.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/drake_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.2
        Caustic: 0.3
  - type: TemperatureProtection
    heatingCoefficient: 0.1
  - type: FireProtection
    reduction: 0.8
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadDrakeHood
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: GroupExamine
  - type: Construction
    graph: ADTDrakeArmor
    node: armor

- type: entity
  parent: ClothingHeadBase
  id: ADTClothingHeadDrakeHood
  name: drake helmet
  description: The skull of a dragon.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/drake_hood.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/drake_hood.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.5

- type: entity
  parent: [ ClothingOuterBaseLarge, AllowSuitStorageClothing ]
  id: ADTClothingOuterPathfinderCloak
  name: pathfinder cloak
  description: A thick cloak woven from sinew and hides, designed to protect its wearer from hazardous weather.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/pathfinder_cloak.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/pathfinder_cloak.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.5
        Caustic: 0.5
  - type: TemperatureProtection
    heatingCoefficient: 0.3
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadPathfinderKasa
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: GroupExamine
  - type: ADTGoliathPlatable
    types: [ Blunt, Slash ]
  - type: Construction
    graph: ADTPathfinderCloak
    node: cloak

- type: entity
  parent: ClothingHeadBase
  id: ADTClothingHeadPathfinderKasa
  name: pathfinder kasa
  description: A helmet crafted from bones and sinew meant to protect its wearer from hazardous weather.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Clothing/Lavaland/pathfinder_kasa.rsi
  - type: Clothing
    sprite: ADT/Clothing/Lavaland/pathfinder_kasa.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
  - type: ADTGoliathPlatable
    types: [ Blunt, Slash ]

- type: entity
