# Инструменты и прочее

- type: entity
  parent: BaseStorageItem
  id: ADTSurgeryBagPrimitive
  name: surgery bag
  description: A hide bag with crude surgical tools made of bone.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/Tribal/surgery_bag.rsi
    state: icon
  - type: Item
    sprite: ADT/Objects/Specific/Lavaland/Tribal/surgery_bag.rsi
    size: Large
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,3
  - type: StorageFill
    contents:
    - id: Scalpel
    - id: Retractor
    - id: Hemostat
    - id: Cautery
    - id: Saw
