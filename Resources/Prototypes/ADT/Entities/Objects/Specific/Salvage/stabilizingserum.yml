- type: entity
  name: stabilizing serum
  id: ADTStabilizingSerum
  parent: BaseItem
  description: Inject a legion core with this serum to preserve its healing powers indefinitely. It won't work on a decayed one.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Salvage/stabilizing_serum.rsi
    state: icon
  - type: Item
    size: Small
  - type: Tag
    tags:
    - ADTStabilizingSerum

- type: entity
  name: stable legion core
  id: ADTLegionCoreStable
  parent: BaseItem
  description: The core beats steadily, as if it had never left a body. It will never decay - smear it on a wound or implant it into your chest.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/loot.rsi
    state: legion_core_stable
  - type: ADTRegenerativeCore
    duration: 60
    applyDelay: 1
    implantDelay: 5
    instantHeal:
      types:
        Blunt: -100
        Slash: -100
        Piercing: -100
        Heat: -100
        Radiation: -100
        Caustic: -100
  - type: Construction
    graph: ADTLegionCoreStable
    node: stable
