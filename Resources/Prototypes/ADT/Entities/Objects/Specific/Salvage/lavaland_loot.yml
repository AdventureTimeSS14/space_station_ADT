- type: entity
  id: ADTVampirismCrystal
  parent: BasePKAUpgrade
  name: a red crystal
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/loot.rsi
    state: crystal
  - type: ADTGunUpgrade
    cost: 10
    tags: [ GunUpgradeVampirism ]
    examineText: gun-upgrade-examine-text-vampirism
  - type: ADTGunUpgradeVampirism
    damageOnHit:
      types:
        Slash: -2
        Piercing: -2
        Blunt: -2

- type: entity
  id: ADTMagmaGem
  parent: BaseItem
  name: calcified auric
  description: A hot, faintly glowing mineral taken from the guts of a magmawing watcher. It can be smelted down into pure gold.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Lavaland/magma_gem.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - ADTMagmaGem
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1.5
    color: "#ff7a2b"
  - type: PhysicalComposition
    materialComposition:
      Gold: 100
  - type: StaticPrice
    price: 700

