- type: entity
  id: WeaponPistolCHIMPBorg
  parent: WeaponPistolCHIMP
  name: integrated C.H.I.M.P.
  description: An even smaller particle handcannon, designed for cyborg use.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 10

- type: entity
  id: BorgModuleAdvancedAnomaly
  parent: [ BaseBorgModuleScience, BaseProviderBorgModule ]
  name: advanced anomaly cyborg module
  description: A module for the truly dedicated anomaly researcher.
  components:
  - type: Sprite
    layers:
    - state: science
    - state: icon-anomalies-adv
  - type: ItemBorgModule
    hands:
    - item: AnomalyScanner
    - item: WeaponPistolCHIMPBorg
    - item: WeaponGauntletGorilla
    - hand:
        emptyRepresentative: AnomalyCoreBluespaceInert
        emptyLabel: borg-slot-anomaly-core
        whitelist:
          tags:
          - AnomalyCore
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: adv-anomaly-module }

- type: entity
  id: ADTBorgModuleVirology
  parent: [ BaseBorgModuleMedical, BaseProviderBorgModule ]
  name: virology cyborg module
  description: Medical module for virology research. Comes with an unpowered health analyzer, a dropper, and hands for a syringe, a virus culture and a beaker.
  components:
  - type: Sprite
    layers:
    - state: medical
    - state: icon-virology
      sprite: ADT/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    hands:
    - item: HandheldHealthAnalyzer
    - item: Dropper
    droppableItems:
    - id: Syringe
      whitelist:
        tags:
        - Syringe
    - id: ADTVirusCultureBottle
      whitelist:
        components:
        - FitsInDispensers
    - id: Beaker
      whitelist:
        components:
        - FitsInDispenser
  - type: BorgModuleIcon
    icon: { sprite: ADT/Interface/Actions/actions_borg.rsi, state: viro-module }
