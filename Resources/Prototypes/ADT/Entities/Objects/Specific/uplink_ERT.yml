- type: entity
  name: product unit
  parent: BaseItem
  id: Productunit
  suffix: 20 PU
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/tradeunit.rsi
    state: tradeunit
  - type: Item
    sprite: ADT/Objects/Specific/tradeunit.rsi
    size: Tiny
  - type: Stack
    count: 20
    stackType: Productunit
  - type: StackPrice
    price: 200
  - type: Currency
    price:
      Productunit: 1

- type: currency
  id: Productunit
  displayName: store-currency-display-tradeunit
  cash:
    1: Productunit1
  canWithdraw: true

- type: stack
  id: Productunit
  name: stack-name-product-unit
  icon: ADT/Objects/Specific/tradeunit.rsi
  spawn: Productunit1

- type: entity
  parent: Productunit
  id: Productunit1
  suffix: 1 PU
  components:
  - type: Stack
    count: 1
