#Базовый аплинк ОБР
- type: entity
  id: ADTStorePresetUplinkERT
  abstract: true
  components:
  - type: Store
    name: store-preset-name-uplink
    categories:
    - ADTUplinkERTWeapon
    - ADTUplinkERTWeaponSecondary
    - ADTUplinkERTWeaponMelee
    - ADTUplinkERTAmmo
    - ADTUplinkERTGrenades
    - ADTUplinkERTAttachments
    - ADTUplinkERTImplanters
    - ADTUplinkERTMisc
    currencyWhitelist:
    - Productunit

- type: entity
  parent: [BaseItem,  ADTStorePresetUplinkERT]
  id: ADTBaseUplinkBOBERT
  name: Б.О.О.Б.Р.
  description: Блюспейс оружейная отряда быстрого реагирования.
  suffix: 35 ЕТ, Базовый
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/bobert.rsi
    layers:
    - state: icon
  - type: Item
    sprite: ADT/Objects/Specific/bobert.rsi
    heldPrefix: icon
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Productunit: 35

