#аптечка_ОБР

- type: entity
  id: ADTVialBluespaceBulletWound
  name: Bullet wound vial
  parent: NFVialBluespace
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 300
        reagents:
        - ReagentId: Puncturase
          Quantity: 150
        - ReagentId: TranexamicAcid
          Quantity: 60
        - ReagentId: PolypyryliumOligomers
          Quantity: 90

