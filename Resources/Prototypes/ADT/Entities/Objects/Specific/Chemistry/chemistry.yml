- type: entity
  name: small syringe
  description: A small syringe to take.. you guessed it, small samples of liquid.
  parent: BaseSyringe
  id: ADTSmallSyringe
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Chemistry/syringe.rsi
    layers:
      - state: fill-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: syringe_base
        map: ["enum.SolutionContainerLayers.Base"]
  - type: Icon
    sprite: ADT/Objects/Specific/Chemistry/syringe.rsi
    state: "syringe_base"
  - type: Item
    size: Tiny
    sprite: ADT/Objects/Specific/Chemistry/syringe.rsi
  - type: Solution
    solution:
      maxVol: 5
      reagents: []
  - type: FitsInDispenser
    solution: injector
  - type: Injector
    restrainedMultiplier: 2
    ignoreMobs: false
    ignoreClosed: false
    activeModeProtoId: DropperDrawMode
    allowedModes:
    - DropperDrawMode
    - DropperInjectMode
  - type: Appearance
  - type: ExaminableSolution
    solution: injector
  - type: Spillable
    solution: injector
  - type: TrashOnSolutionEmpty
    solution: injector
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Tag
    tags:
    - Syringe

- type: entity
  name: bluespace jug
  parent: Jug
  id: ADTJugBluespace
  description: Uses bluespace technology to contain an impossible amount of liquid.
  components:
    - type: Solution
      solution:
        maxVol: 2000
    - type: Sprite
      sprite: ADT/Objects/Specific/Chemistry/jug_bluespace.rsi
      layers:
        - state: jug
        - state: jug-unlit
          shader: unshaded
        - state: jug1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
    - type: Item
      sprite: ADT/Objects/Specific/Chemistry/jug_bluespace.rsi
      inhandVisuals:
        left:
        - state: inhand-left
        - state: inhand-left-unlit
          shader: unshaded
        - state: inhand-left-fill-1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
        right:
        - state: inhand-right
        - state: inhand-right-unlit
          shader: unshaded
        - state: inhand-right-fill-1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
    - type: StaticPrice
      price: 30
    - type: Destructible
      thresholds: []
    - type: SolutionContainerVisuals
      maxFillLevels: 6