
- type: entity
  id: ADTToolboxRevolution
  name: emergency toolbox
  description: A bright red toolbox, stocked with emergency tools.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    possibleSets:
    - ADTAllHandMaster
    - ADTSubversion
    - ADTTechnolover
    - ADTGunsmith
    - ADTCluwneRev
    - ADTDisarm
    - ADTMedRev
    - ADTFakeMindShieldRev
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: entity
  parent: BoxSurvival
  id: ADTBoxSurvivalRevolution
  suffix: Революция
  components:
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      adt_rev_stash: !type:ContainerSlot
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleFull
        - id: SpaceMedipen
      adt_rev_stash: !type:AllSelector
        children:
        - id: ADTRevolutionStashCompartment
  - type: ADTRevolutionStash
  - type: ADTRevolutionKit
    possibleSets:
    - ADTAllHandMaster
    - ADTSubversion
    - ADTTechnolover
    - ADTGunsmith
    - ADTCluwneRev
    - ADTDisarm
    - ADTMedRev
    - ADTFakeMindShieldRev
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: entity
  id: ADTRevolutionStashCompartment
  name: hidden compartment
  categories: [ HideSpawnMenu ]
  components:
  - type: ADTRevolutionStashCompartment
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Flash
        - id: ClothingEyesGlassesSunglasses
