- type: entity
  id: ADTPartModsuit
  parent: BaseItem
  name: MOD part
  description: A part used in MOD construction.
  abstract: true
  components:
  - type: Sprite
    sprite: ADT/Objects/Specific/Modsuits/modcore_construction.rsi
  - type: Icon
    sprite: ADT/Objects/Specific/Modsuits/modcore_construction.rsi
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  #- type: GuideHelp TODO: Guide

- type: entity
  id: ADTModsuitChestplate
  parent: ADTPartModsuit
  name: MOD chestplate
  components:
  - type: Sprite
    state: chestplate
  - type: Icon
    state: chestplate
  - type: PhysicalComposition
    materialComposition:
      Steel: 62
  - type: Tag
    tags:
    - ADTModsuitPart
    - ADTModsuitChestplate

