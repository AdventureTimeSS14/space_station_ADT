- type: entity
  id: ADTModsuitShell
  parent: ADTPartModsuit
  name: MOD shell
  components:
  - type: Appearance
  - type: Sprite
    state: shell
  - type: Icon
    state: shell
  - type: PhysicalComposition
    materialComposition:
      Steel: 125
      Plasma: 62
  - type: ContainerContainer
    containers:
      cell_slot: !type:Container
      mod-core: !type:Container
  - type: Construction
    graph: ADTModsuitConstruction
    node: start
    defaultTarget: standard
    containers:
    - cell_slot
    - mod-core
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          shell-core: { state: shell-core }
          shell-core-secured: { state: shell-core-secured }
          shell-helmet: { state: shell-helmet }
          shell-chestplate: { state: shell-chestplate }
          shell-gauntlets: { state: shell-gauntlets }
          shell-boots: { state: shell-boots }
          shell-secured: { state: shell-secured }

