- type: entity
  parent: OreBase
  id: ADTBSore
  suffix: Full
  name: Bluespace ore
  description: rock wirh pieces of bluespace ore
  components:
  - type: Stack
    stackType: ADTBSoreStack
  - type: Sprite
    sprite: ADT/Objects/Materials/BS_ore.rsi
    layers:
    - state: BS_ore
      map: [ "base" ]
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      ADTRawBSore: 300
  - type: Extractable
    grindableSolutionName: composite
  - type: Item
    heldPrefix: ADTBSore
  - type: Tag
    tags:
      - ADTBSore
      - Ore
      - ADTOreBS

- type: entity
  parent: ADTBSore
  id: ADTBSore1
  name: Bluespace ore
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: BaseStructureDynamic
  id: ADTGibtonite
  suffix: Full
  name: gibtonite ore
  description: Extremely explosive if struck with mining equipment, gibtonite is often used by miners to speed up their work by using it as a mining charge. This material is illegal to possess by unauthorized personnel under space law.
  components:
  - type: Appearance
  - type: Sprite
    sprite: ADT/Objects/Materials/gibtonite_ore.rsi
    layers:
    - state: ore_low
      map: [ "enum.ADTGibtoniteVisuals.Quality" ]
    - state: active
      map: [ "enum.ADTGibtoniteVisuals.Primed" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.ADTGibtoniteVisuals.Quality:
        enum.ADTGibtoniteVisuals.Quality:
          Low: { state: ore_low }
          Medium: { state: ore_medium }
          High: { state: ore_high }
      enum.ADTGibtoniteVisuals.Primed:
        enum.ADTGibtoniteVisuals.Primed:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Ginormous
    sprite: ADT/Objects/Materials/gibtonite_ore.rsi
  - type: MultiHandedItem
  - type: Damageable
  - type: Injurable
  - type: RequireProjectileTarget
  - type: ADTGibtoniteOre
    detonationDelay: 10
    lowExplosion:
      devastation: -1
      heavy: 1
      light: 3
    mediumExplosion:
      devastation: 1
      heavy: 2
      light: 5
    highExplosion:
      devastation: 2
      heavy: 4
      light: 9
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: SupermatterImmune

- type: entity
  parent: BaseItem
  id: ADTGibtoniteShard
  name: Gibtonite Shard womp womp
  description: write here something cool pls.
  components:
  - type: Item
    sprite: ADT/Objects/Materials/gibtonite.rsi
    size: Tiny
  - type: Sprite
    layers:
      - sprite:  ADT/Objects/Materials/gibtonite.rsi
        state: gibtonite-shard
  - type: Tool
    qualities:
    - Slicing
  - type: SupermatterImmune

