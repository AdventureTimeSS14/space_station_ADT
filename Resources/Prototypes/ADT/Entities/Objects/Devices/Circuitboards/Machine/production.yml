- type: entity
  id: EnergyChemDispenserMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: energy chem dispenser machine board
  description: A machine printed circuit board for an energy chem dispenser.
  components:
    - type: Sprite
      state: medical
    - type: MachineBoard
      prototype: EnergyChemDispenser
      stackRequirements:
        Glass: 1
        Steel: 3
      partRequirements:
        Capacitor: 2
        MatterBin: 2
        ScanningModule: 2
      componentRequirements: #ADT-Tweak: батарейка из крафта, ёмкость/заряд химки = батарейка
        PowerCell:
          amount: 1
          defaultPrototype: PowerCellHyper
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

