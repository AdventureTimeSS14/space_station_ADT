- type: injectorMode
  id: ADTMakeupTopical
  name: adt-makeup-choose
  injectOnUse: true
  behavior: Inject
  reactionMethod: Touch
  requiresExposedSkin: false
  mobTime: 5
  selfModifier: 0.4
  downedModifier: 1
  delayPerVolume: 0
  suitMobTime: 0
  transferAmounts: [1]
  popupUserAttempt: adt-makeup-applying
  popupTargetAttempt: adt-makeup-being-applied

- type: entity
  id: ADTMakeupSolutionBase
  abstract: true
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    solution:
      maxVol: 4
      canReact: false
  - type: SolutionRegeneration
    duration: 1
    generated:
      reagents: []

- type: entity
  parent: BaseItem
  id: ADTMakeupPaletteBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: UseDelay
    delay: 0.25

- type: entity
  parent: ADTMakeupPaletteBase
  id: ADTMakeupPaletteBasic
  name: regular makeup palette
  description: Select a design, then apply it to yourself (2 s) or someone else (5 s). Water washes it off.
  components:
  - type: Sprite
    sprite: ADT/Objects/Fun/general_paint.rsi
    state: icon
  - type: SolutionManager
    solutions:
    - ADTMakeupSolutionBasicClown
    - ADTMakeupSolutionBasicMime
  - type: SelectableComponentAdder
    verbCategoryName: adt-makeup-choose
    entries:
    - verbName: adt-makeup-clown
      popup: adt-makeup-selected-clown
      componentExistsBehavior: Replace
      componentsToAdd:
      - type: Injector
        netsync: false
        currentTransferAmount: 1
        activeModeProtoId: ADTMakeupTopical
        allowedModes: [ADTMakeupTopical]
        solutionName: makeupBasicClown
        ignoreBlockers: true
    - verbName: adt-makeup-mime
      popup: adt-makeup-selected-mime
      componentExistsBehavior: Replace
      componentsToAdd:
      - type: Injector
        netsync: false
        currentTransferAmount: 1
        activeModeProtoId: ADTMakeupTopical
        allowedModes: [ADTMakeupTopical]
        solutionName: makeupBasicMime
        ignoreBlockers: true

- type: entity
  id: ADTMakeupSolutionBasicClown
  parent: ADTMakeupSolutionBase
  components:
  - type: Solution
    id: makeupBasicClown
    solution:
      reagents:
      - ReagentId: ADTMakeupPigmentBasicClown
        Quantity: 4
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: ADTMakeupPigmentBasicClown
        Quantity: 1

- type: entity
  id: ADTMakeupSolutionBasicMime
  parent: ADTMakeupSolutionBase
  components:
  - type: Solution
    id: makeupBasicMime
    solution:
      reagents:
      - ReagentId: ADTMakeupPigmentBasicMime
        Quantity: 4
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: ADTMakeupPigmentBasicMime
        Quantity: 1

