- type: entity
  parent: SuperSynthesizerInstrument
  id: ADTSuperSynthesizerAquamarineInstrument
  name: aquamarine super synthesizer
  description: Blasting the ghetto with Touhou MIDIs since 2020.
  components:
  - type: Sprite
    sprite: ADT/Objects/Fun/Instruments/super_synthesizer.rsi
    layers:
    - state: base
    - state: top
      color: "#77f3b7FF"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
      - state: inhand-left-top
        color: "#77f3b7FF"
      right:
      - state: inhand-right-base
      - state: inhand-right-top
        color: "#77f3b7FF"

