- type: entity
  id: ADTShotgunTrap
  parent: [ShuttleGunBase]
  name: shotgun trap
  description: A makeshift 4-gauge shotgun hooked up to a remote signaler.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: ADT/Objects/Weapons/Traps/shotguntrap.rsi
    layers:
    - state: shotgun_trap
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      ballistic-ammo: !type:Container
        ents: []
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 60
    fireRate: 1
    soundGunshot:
      path: /Audio/ADT/Weapons/Guns/Gunshots/bigshotgun_fire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - ShellShotgun
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: Construction
    deconstructionTarget: null
    graph: ShotgunTrapPackingGraph
    node: ShotgunTrapPacked
  - type: StaticPrice
    price: 100

- type: constructionGraph # deconstruction graph
  id: ShotgunTrapPackingGraph
  start: ShotgunTrapPacked
  graph:
  - node: ShotgunTrapPacked
    entity: ADTShotgunTrap
    edges:
    - to: ShotgunTrapPacked
      completed:
      - !type:SpawnPrototype
        prototype: ADTShotgunTrapPacked
        amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 5
      
- type: entity
  id: ADTShotgunTrapPacked
  name: packed shotgun trap
  description: A disassembled makeshift shotgun trap.
  parent: BaseItem
  components:
  - type: SpawnAfterInteract
    prototype: ADTShotgunTrap
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: ADT/Objects/Weapons/Traps/shotguntrap.rsi
    state: shotgun_trap_handheld
  - type: Item
    size: Large
    sprite: ADT/Objects/Weapons/Traps/shotguntrap.rsi
  - type: Construction
    graph: ShotgunTrap
    node: shotgunTrap