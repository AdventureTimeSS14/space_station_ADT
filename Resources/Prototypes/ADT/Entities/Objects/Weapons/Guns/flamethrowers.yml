  - type: Item
    # sprite: ADT/Objects/Weapons/Guns/Ammunition/Flamethrower/makeshift_flamer.rsi
    # state: flametank_unfinished
    size: Normal
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 100
        reagents:
        - ReagentId: null
          Quantity: 100
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 100
    transferAmount: 100
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
