- type: entity
  id: BulletTrace
  parent: BasicHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: muzzle
    travelFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: trace
    impactFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: impact
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: bullet
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanReflect
    reflectiveType: NonEnergy
  - type: HitscanCreateBloodSpray

