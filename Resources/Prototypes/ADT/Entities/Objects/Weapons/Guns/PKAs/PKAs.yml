- type: entity
  name: proto-kinetic pistol
  id: ADTWeaponProtoKineticPistol
  parent: [WeaponProtoKineticAcceleratorBase, BaseCargoContraband]
  description: The Pistol trades base damage, and range, for double mod capacity, making it a truely customizable PKA.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_pistol.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: ADTUpgradeableGun
    maxModCapacity: 65
    whitelist:
      tags:
      - PKAUpgrade
    stockSprite:
      sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_pistol.rsi
      state: icon
    chassisSprites:
      super:
        sprite: ADT/Objects/Weapons/Guns/PKAs/chassis.rsi
        state: pistol-super
      hyper:
        sprite: ADT/Objects/Weapons/Guns/PKAs/chassis.rsi
        state: pistol-hyper
  - type: MeleeWeapon
    attackRate: 1.5
  - type: ADTKineticCooldown
    baseRangedMultiplier: 1.8
  - type: ContainerContainer
    containers:
      upgrades: !type:Container
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_pistol.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: BasicEntityAmmoProvider
    proto: ADTBulletKineticPistol
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_pistol.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt

- type: entity
  name: proto-kinetic repeater
  id: ADTWeaponProtoKineticRepeater
  parent: [WeaponProtoKineticAcceleratorBase, BaseGunWieldable, BaseCargoContraband]
  description: The Repeater trades mod space and a bit of damage for the ability to fire three shots in rapid succession before needing to recharge, while also doing more damage than base PKA if all three shots are landed.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_repeater.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: ADTUpgradeableGun
    maxModCapacity: 75
    whitelist:
      tags:
      - PKAUpgrade
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: GunRequiresWield
  - type: ContainerContainer
    containers:
      upgrades: !type:Container
  - type: Item
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_repeater.rsi
  - type: MeleeWeapon
    attackRate: 1.1
  - type: ADTKineticCooldown
    baseRangedMultiplier: 2.2
  - type: BasicEntityAmmoProvider
    proto: ADTBulletKineticRepeater
  - type: Gun
    burstCooldown: 0.4
    burstFireRate: 2.5
    fireRate: 2.5
    selectedMode: Burst
    angleDecay: 45
    minAngle: 2
    maxAngle: 3
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/PKAs/kinetic_repeater.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt

