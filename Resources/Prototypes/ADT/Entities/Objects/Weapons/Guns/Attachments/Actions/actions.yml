- type: entity
  id: ADTActionBase
  categories:
  - HideSpawnMenu

- type: entity
  parent: ADTActionBase
  id: ADTActionToggleScope
  name: Toggle Optics
  description: Scope
  components:
  - type: Action
    useDelay: 0.25
    raiseOnUser: false
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Attachments/scope_actions.rsi
    layers:
    - state: sniperscope
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: ADTActionBase
  id: ADTActionCycleZoomLevel
  name: Cycle Zoom Level
  description: Scope
  components:
  - type: Action
    raiseOnUser: false
    useDelay: 0.25
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Attachments/scope_actions.rsi
    layers:
    - state: sniperscope
  - type: InstantAction
    event: !type:ScopeCycleZoomLevelEvent
  - type: Tag
    tags:
    - ADTActionCycleZoomLevel

- type: entity
  parent: ADTActionBase
  id: ADTActionToggleAttachable
  name: Toggle Attachable
  description: Toggle an attachable.
  components:
  - type: Action
    raiseOnUser: false
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Attachments/scope_actions.rsi
    layers:
    - state: sniperscope
  - type: InstantAction
    event: !type:AttachableToggleActionEvent

- type: Tag
  id: ADTActionCycleZoomLevel
