- type: entity
  name: forged SMG
  parent: [BaseWeaponSubMachineGun, BaseMajorContraband]
  id: ADTWeaponSubMachineGunForged
  description: A submachine gun forged by smuggler gunsmiths. Uses .35 auto SMG magazines.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/SMGs/forged_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/SMGs/forged_smg.rsi
  - type: Gun
    minAngle: 2
    maxAngle: 12
    angleIncrease: 2.5
    fireRate: 9
    soundGunshot:
      path: /Audio/ADT/Weapons/Guns/Gunshots/forged_smg.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 900

- type: entity
  name: improvised SMG
  parent: [BaseWeaponSubMachineGun, BaseMajorContraband]
  id: ADTWeaponSubMachineGunImprovised
  description: A crude submachine gun made by smuggler gunsmiths. Uses .35 auto SMG magazines.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/SMGs/improvised_smg.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/SMGs/improvised_smg.rsi
  - type: Gun
    minAngle: 2
    maxAngle: 14
    angleIncrease: 2.5
    fireRate: 8.5
    soundGunshot:
      path: /Audio/ADT/Weapons/Guns/Gunshots/forged_smg.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 600
