- type: entity
  name: china lake
  parent: [BaseWeaponLauncher, BaseGunWieldable, BaseSyndicateContraband, ADTBaseMagneticGun, ADTBasePumpingGun]
  id: ADTWeaponLauncherChinaLake
  suffix: Actual
  description: PLOOP.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  # - type: RunAndGunBlocker
    # maxVelocity: 3
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 0.75
    damage:
      types:
        Blunt: 14
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  - type: Gun
    fireRate: 1
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - ADT40mmGrenade
    capacity: 4
    proto: ADT40mmGrenadeBlast
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2

- type: entity
  name: RPG-7
  parent: [BaseWeaponLauncher, BaseMajorContraband, ADTBaseMagneticGun, BaseGunWieldable]
  id: ADTWeaponLauncherRocket
  description: A modified ancient rocket-propelled grenade launcher.
  suffix: Actual
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
    #  - state: mag-0
    #    map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
  - type: RunAndGunBlocker
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 0.75
    damage:
      types:
        Blunt: 14
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  - type: Gun
    fireRate: 0.5
    projectileSpeed: 25
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRocket
    proto: ADTCartridgeBlastRocket
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: Scope
    zoomLevels:
    - zoom: 1.2
      offset: 12
      allowMovement: true
      doAfter: 0
    requireWielding: true
    attachment: false
  - type: GunRequiresWield
  - type: Item
    size: Huge



- type: entity
  parent: WeaponTetherGun
  id: WeaponTetherGunRecharging
  suffix: Recharging
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: WeaponForceGun
  id: WeaponForceGunRecharging
  suffix: Recharging
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  name: experimental lube cannon
  parent: BaseWeaponBattery
  id: ADTBorgLauncherLubenade
  description: This has been modified to recharge and fire lubenades instead, but odds are the borgs won't notice.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/hydra_launcher.rsi
    layers:
    - state: icon
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    clumsyProof: true
  - type: BatteryAmmoProvider
    proto: ADTBulletGrenadeLubenade
    fireCost: 60
  - type: Battery
    maxCharge: 180
    startingCharge: 180
  - type: BatterySelfRecharger
    autoRechargeRate: 1
  - type: AmmoCounter
  - type: Item
    size: Normal

