- type: entity
  name: china lake
  parent: [BaseWeaponLauncher, BaseGunWieldable, BaseSyndicateContraband, ADTBaseMagneticGun, ADTBasePumpingGun]
  id: ADTWeaponLauncherChinaLake
  suffix: Actual
  description: PLOOP.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  # - type: RunAndGunBlocker
    # maxVelocity: 3
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 0.75
    damage:
      types:
        Blunt: 14
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  - type: Gun
    fireRate: 1
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - ADT40mmGrenade
    capacity: 4
    proto: ADT40mmGrenadeBlast
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2

- type: entity
  name: RPG-7
  parent: [BaseWeaponLauncher, BaseMajorContraband, ADTBaseMagneticGun, BaseGunWieldable]
  id: ADTWeaponLauncherRocket
  description: A modified ancient rocket-propelled grenade launcher.
  suffix: Actual
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
    #  - state: mag-0
    #    map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
  - type: RunAndGunBlocker
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 0.75
    damage:
      types:
        Blunt: 14
    soundHit:
      collection: GenericHit
  - type: AltFireMelee
  - type: Gun
    fireRate: 0.5
    projectileSpeed: 25
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRocket
    proto: ADTCartridgeBlastRocket
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: Scope
    zoomLevels:
    - zoom: 1.2
      offset: 12
      allowMovement: true
      doAfter: 0
    requireWielding: true
    attachment: false
  - type: GunRequiresWield
  - type: Item
    size: Huge

- type: entity
  name: flamethrower
  parent: BaseItem
  id: ADTWeaponFlamethrowerCBURN
  suffix: РХБЗЗ
  description: GAAAAAAAAAAAAAAAANS
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Flamethrower/cburn_flamethrower.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: Gun
    cameraRecoilScalar: 0
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 0.5
    soundGunshot:
      collection: RMCFlamerShoot
    soundEmpty:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower_empty.ogg
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: ADT/Objects/Weapons/Guns/Flamethrower/cburn_flamethrower.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: RMCFlamerAmmoProvider
  - type: RMCFlamerTank
    maxIntensity: 30
    maxDuration: 20
    maxRange: 7
  - type: RMCIgniter
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents:
        - ReagentId: RMCNapalmUT
          Quantity: 100
  - type: RefillableSolution
    solution: rmc_flamer_tank
  - type: AmmoCounter

