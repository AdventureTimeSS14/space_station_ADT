

- type: entity
  id: BaseBulletHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
    maxDistance: 20
    collisionMask: BulletImpassable
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: muzzle
    travelFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: trace
    impactFlash:
      sprite: ADT/Objects/Weapons/Guns/Projectiles/bullet_trace.rsi
      state: impact
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
        state: bullet
    speed: 700
    effectLifetime: 0.15
  - type: HitscanReflect
    reflectiveType: NonEnergy
    maxReflections: 5 # Starlight #275 kinetic bounce depth
  - type: HitscanBasicEffects
    sound:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: HitscanCreateBloodSpray # Starlight: persistent blood decal on flesh hits
  - type: HitscanPierce
    chance: 0.40
    deviation: 0.2
    pierceLevel: Flesh
  - type: HitscanRicochet
    chance: 0.30

- type: entity
  id: BaseBulletHitscanPractice
  parent: BaseBulletHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Blunt: 1

- type: entity
  id: BaseBulletHitscanIncendiary
  parent: BaseBulletHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    armorPenetration: -0.25
    damage:
      types:
        Piercing: 10
        Heat: 4
  - type: HitscanIgnite
    fireStacks: 0.25

- type: entity
  id: BaseBulletHitscanAP
  parent: BaseBulletHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    armorPenetration: 0.5
    damage:
      types:
        Piercing: 11

- type: entity
  id: BaseBulletHitscanUranium
  parent: BaseBulletHitscan
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    armorPenetration: -0.25
    damage:
      types:
        Radiation: 11
