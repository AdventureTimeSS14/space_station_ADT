# ADT Hollow Point (#275): HP / FMJ / AP ammunition boxes
# Нужно переспрайтить HP / FMJ / AP на отдельные цвета (без fmj/ap overlay).

# --- .35 pistol ---
- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolHP
  name: ammunition box (.35 auto HP)
  description: A cardboard box of .35 auto hollow-point rounds.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolHP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolFMJ
  name: ammunition box (.35 auto FMJ)
  description: A cardboard box of .35 auto full metal jacket rounds.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolAP
  name: ammunition box (.35 auto AP)
  description: A cardboard box of .35 auto armor-piercing rounds.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

