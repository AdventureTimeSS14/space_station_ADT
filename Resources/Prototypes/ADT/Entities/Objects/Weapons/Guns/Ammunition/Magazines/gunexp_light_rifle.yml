    tags:
    - ADTMagazineLightRifleMaximBox
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
    capacity: 100
  - type: Item
    size: Normal
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/maxim_box.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: ADTMagazineLightRifleMaximBox
  id: ADTMagazineLightRifleMaximBoxEmpty
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
