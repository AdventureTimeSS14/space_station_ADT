- type: entity
  abstract: true
  parent: [ BaseItem, BaseMajorContraband ]
  id: ADTMagazineBoxReactive30Base
  name: ammunition box (.30 reactive)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ADTCartridgeReactive30
    proto: ADTCartridgeReactive30
    capacity: 20
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Ammunition/Boxes/reactive30.rsi
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: magb
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/ADT/Entities/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/ADT/Entities/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/ADT/Entities/ammobox_drop.ogg

