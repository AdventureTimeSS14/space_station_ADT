# Нужно переспрайтить HP / FMJ / AP на отдельные цвета (вместо Starlight fmj/ap).

# --- .35 pistol ---

- type: entity
  parent: BaseBulletHitscan
  id: BulletPistolHP
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto HP)
  components:
  - type: HitscanBasicDamage
    armorPenetration: -1
    damage:
      types:
        Piercing: 21
  - type: HitscanStaminaDamage
    staminaDamage: 5
  - type: HitscanPierce
    chance: 0.03
    deviation: 0.2
  - type: HitscanRicochet
    chance: 0.15

- type: entity
  parent: BaseBulletHitscan
  id: BulletPistolFMJ
  categories: [ HideSpawnMenu ]
  name: bullet (.35 auto FMJ)
  components:
  - type: HitscanBasicDamage
    armorPenetration: 0.25
    damage:
      types:
        Piercing: 11
  - type: HitscanPierce
    chance: 0.69
    deviation: 0.2
    pierceLevel: Wood
  - type: HitscanRicochet
    chance: 0.8

- type: entity
