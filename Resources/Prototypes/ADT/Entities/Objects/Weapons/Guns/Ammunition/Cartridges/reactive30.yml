- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseMajorContraband ]
  id: ADTBaseCartridgeReactive30
  name: cartridge (.30 reactive)
  components:
  - type: Tag
    tags:
    - ADTCartridgeReactive30
  - type: CartridgeAmmo
    proto: ADTBulletReactive30
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Ammunition/Casings/reactive30.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: ADTBaseCartridgeReactive30
  id: ADTCartridgeReactive30
  name: cartridge (.30 reactive base)
  components:
  - type: CartridgeAmmo
    proto: ADTBulletReactive30

- type: entity
