# ADT Hollow Point (#275): HP / FMJ / AP cartridges
# TODO ADT: переспрайтить HP / FMJ / AP на финальные цвета.

# --- .35 pistol ---
- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolHP
  name: cartridge (.35 auto HP)
  description: Hollow-point ammunition. High damage against unarmored targets, poor armor penetration and pierce.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolHP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#000000"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolFMJ
  name: cartridge (.35 auto FMJ)
  description: Full metal jacket ammunition. Balanced pierce and strong ricochet tendency.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolFMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B68F0E"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolAP
  name: cartridge (.35 auto AP)
  description: Armor-piercing ammunition. Lower raw damage, high armor penetration and pierce chance.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolAP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#1A8C1A"

