- type: entity
  parent: BaseMagazineGrenade
  id: ADTMagazine40mmGrenadeDrumEmpty
  name: 40 mm grenade drum
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - ADTMagazine40mmGrenadeDrum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ADT40mmGrenade
    capacity: 6
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Ammunition/Magazine/Grenade/mgl_launcher_drums.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false

