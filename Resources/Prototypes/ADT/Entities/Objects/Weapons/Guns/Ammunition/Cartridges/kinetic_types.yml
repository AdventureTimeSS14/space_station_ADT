- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolSP
  name: cartridge (.35 auto SP)
  description: Soft-point .35 auto. More damage against unarmored targets, poor penetration.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceSP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#e0c36a"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolHP
  name: cartridge (.35 auto HP)
  description: Hollow-point .35 auto. Expands in flesh, barely pierces armor or bodies.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceHP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#ff4d4d"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolFMJ
  name: cartridge (.35 auto FMJ)
  description: Full metal jacket .35 auto. Less damage, punches through targets.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceFMJ
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#c8c8c8"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolAP
  name: cartridge (.35 auto AP)
  description: Armor-piercing .35 auto. Cuts body armor and hardened metal.
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceAP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#1a1a1a"

