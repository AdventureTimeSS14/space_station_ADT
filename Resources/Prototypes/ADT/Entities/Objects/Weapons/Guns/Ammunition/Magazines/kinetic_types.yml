- type: entity
  parent: MagazinePistol
  id: MagazinePistolSP
  name: pistol magazine (.35 auto SP)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolSP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#e0c36a"

