- type: entity
  id: ADTBulletImpactEffectReactive30
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      sprite: ADT/Objects/Weapons/Guns/Projectiles/reactive30.rsi
      state: impact_bolt
  - type: TimedDespawn
    lifetime: 0.3
  - type: Tag
    tags:
    - HideContextMenu
  - type: EffectVisuals

- type: entity
  parent: BaseBullet
  id: ADTBulletReactive30
  categories: [ HideSpawnMenu ]
  name: bullet (.30 reactive)
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Projectiles/reactive30.rsi
    layers:
    - state: bullet_bolt
      shader: unshaded
  - type: Projectile
    impactEffect: ADTBulletImpactEffectReactive30
    damage:
      types:
        Piercing: 40
        Structural: 60

- type: entity
