- type: entity
  abstract: true
  parent: [ BaseItem, BaseMajorContraband ]
  id: ADTMagazineReactive30Base
  name: magazine (.30 reactive)
  components:
  - type: Tag
    tags:
    - ADTMagazineReactive30
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ADTCartridgeReactive30
    proto: ADTCartridgeReactive30
    capacity: 10
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: ADT/Objects/Weapons/Guns/Ammunition/Magazine/Reactive/reactive30_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: ADTMagazineReactive30Base
  id: ADTMagazineReactive30
  components:
  - type: BallisticAmmoProvider
    proto: ADTCartridgeReactive30
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: ADTMagazineReactive30Base
  id: ADTMagazineReactive30Blast
  components:
  - type: BallisticAmmoProvider
    proto: ADTCartridgeReactive30Blast
  - type: Sprite
    layers:
    - state: blast
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#cd9d31"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#cd9d31"

