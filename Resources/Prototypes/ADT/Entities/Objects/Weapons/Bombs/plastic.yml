- type: entity
  name: fire bomb satchel
  parent: [BasePlasticExplosive, BaseMajorContraband]
  id: ADTFireBombSatchel
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Bombs/IED_satchel.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"] 
  - type: TriggerOnStuck
    keyOut: stuck
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 10
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 30
    intensitySlope: 5
    maxIntensity: 60
    canCreateVacuum: false
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Construction
    graph: ADTFireBombSatchel
    node: ADTFireBombSatchel