- type: entity
  parent: [BaseItem, BaseSecurityCargoContraband]
  id: WeaponKineticBase
  abstract: true
  components:
  - type: Tag
    tags:
      - Pickaxe
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_spear.rsi
    state: icon
  - type: AmmoCounter
  - type: ADTKineticCooldown
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: Gun
    soundGunshot: /Audio/Weapons/plasma_cutter.ogg
    fireRate: 1
    showExamineText: false
    useKey: false
  - type: BasicEntityAmmoProvider
    proto: ADTBulletCrusherMark
  - type: DisarmMalus
  - type: TrophyHolder
  - type: ADTKineticFocusWeapon
    discipline: Crusher
    trackMelee: true
    trackRanged: true
    window: 5
    effect: ADTStatusEffectKineticInterference
    effectDuration: 8
  - type: ContainerContainer
    containers:
      upgrades: !type:Container

- type: entity
  parent: [BaseItem, BaseSecurityCargoContraband]
  id: WeaponKineticSpear
  name: kinetic spear
  description: A kinetic spear that is thrown at fauna and returns to its owner.
  components:
  - type: Tag
    tags:
      - Pickaxe
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_spear.rsi
    state: icon
  - type: ADTKineticCooldown
  - type: ADTNoWideAttack
  - type: TrophyHolder
  - type: ADTKineticFocusWeapon
    discipline: Crusher
    trackMelee: true
    trackRanged: true
    window: 5
    effect: ADTStatusEffectKineticInterference
    effectDuration: 8
  - type: ContainerContainer
    containers:
      upgrades: !type:Container
  - type: ADTCrusherSpearThrow
    range: 6
    throwSpeed: 18
    returnSpeed: 22
    cooldown: 4
    requireWielded: true
    markDuration: 1
    damage:
      types:
        Blunt: 45
        Slash: 3
    whitelist:
      components:
      - Fauna
    delayId: adtSpearThrow
    throwSound:
      path: /Audio/Weapons/bolathrow.ogg
    hitSound:
      path: /Audio/Weapons/bladeslice.ogg
    catchSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    hitEffect: BulletImpactEffectKinetic
    markProjectile: ADTBulletCrusherSpearMark
    markProjectileSpeed: 30
    catchDistance: 0.7
    maxReturnTime: 3
    trailFrequency: 0.03
  - type: Trail
    useOwnerAsRenderedEntity: true
    renderedEntityRotationStrategy: Particle
    frequency: 0
    lifetime: 0.3
    alphaLerpAmount: 0.2
    color: "#9fd8ff80"
  - type: ThrowingAngle
    angle: 225
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -1.33
        Slash: -1.33
        Piercing: -1.34
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
    attackRate: 1
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
        Slash: 4
    soundHit:
      collection: MetalThud
    angle: 0
    animation: WeaponArcThrust
    range: 2
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2
        Slash: 2
        Structural: 30
  - type: Item
    size: Ginormous
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_spear-inhands.rsi
  - type: DisarmMalus
  - type: Wieldable
  - type: BackstabDamageMultipilier
    bonusDamage:
      types:
        Slash: 8
  - type: PressureDamageModify
    minPressure: -1
    additionalDamage:
      types:
        Blunt: 8
        Slash: 12
  - type: Clothing
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_spear.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false
  - type: Utensil
    types:
      - Knife

- type: entity
  parent: WeaponKineticBase
  id: WeaponKineticHammer
  name: kinetic hammer
  description: A beefy, two-handed weapon that inflicts knockback and heavier damage than a crusher, but cannot backstab.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_hammer.rsi
    state: icon
  - type: ADTKineticCooldown
  - type: ADTNoWideAttack
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
    attackRate: 0.7
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 17.6
        Slash: 6.4
    soundHit:
      collection: MetalThud
    angle: 0
    animation: WeaponArcThrust
    range: 2
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2
        Slash: 2
        Structural: 30
  - type: Item
    size: Ginormous
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_hammer-inhands.rsi
  - type: GunRequiresWield
  - type: Wieldable
  - type: ADTCrusherStaggerOnDetonate
    hits: 3
    megafaunaHits: 6
    stunDuration: 1.5
    megafaunaVulnerableDuration: 2
    stackDecay: 6
    vulnerableEffect: ADTStatusEffectCrusherVulnerable
    staggerSound:
      path: /Audio/Effects/metal_thud3.ogg
  - type: PressureDamageModify
    minPressure: -1
    additionalDamage:
      types:
        Blunt: 16
        Slash: 12
  - type: Clothing
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_hammer.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false

- type: entity
  parent: WeaponKineticBase
  id: WeaponKineticClaws
  name: kinetic claws
  description: Unleash your inner edgelord with these claws, worn like gloves. Deals a paltry 45 damage on mark detonation, but sports a massive 120 damage backstab bonus.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_claws.rsi
    state: icon
  - type: ADTKineticCooldown
    baseMeleeMultiplier: 1.5
  - type: ADTNoWideAttack
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -0.66
        Slash: -0.66
        Piercing: -0.66
  - type: ADTWearableGun
  - type: ADTCrusherRageOnDetonate
    maxStacks: 3
    stackDecay: 5
    rageDuration: 10
    backstabExtension: 1
    maxRageDuration: 13
    leechMultiplier: 2
    rageEffect: ADTStatusEffectCrusherRage
    exhaustionEffect: ADTStatusEffectCrusherRageExhaustion
    rageSound:
      path: /Audio/ADT/hallucinations/growl2.ogg
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
    mustBeEquippedToUse: true
    attackRate: 1.5
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 12
    soundHit:
      collection: MetalThud
    angle: 0
    animation: WeaponArcThrust
    range: 2
  - type: BackstabDamageMultipilier
    bonusDamage:
      types:
        Slash: 16
  - type: Item
    size: Normal
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_claws-inhands.rsi
  - type: PressureDamageModify
    minPressure: -1
    additionalDamage:
      types:
        Blunt: 8
        Slash: 12
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95
  - type: Clothing
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_claws.rsi
    slots:
    - gloves
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Prying 
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false
  - type: Utensil
    types:
      - Knife

- type: entity
  parent: WeaponKineticBase
  id: WeaponKineticMachete
  name: kinetic machete
  description: A smaller, one-handed variant of the crusher. Deals about 40 less damage than the PKC, but has a 15% melee block chance.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_machete.rsi
    state: icon
  - type: ADTKineticCooldown
    baseMeleeMultiplier: 1.5
  - type: LeechOnMarker
    leech:
      types:
        Blunt: -1
        Slash: -1
        Piercing: -1
  - type: Gun
    soundGunshot: /Audio/Weapons/plasma_cutter.ogg
    fireRate: 1
    showExamineText: false
    useKey: true
  - type: AltFireMelee
    attackType: Heavy
  - type: ADTCrusherSpeedOnDetonate
    speedPerStack: 0.05
    maxStacks: 4
    duration: 4
    speedEffect: ADTStatusEffectCrusherMacheteSpeed
  - type: MeleeWeapon
    bluntStaminaDamageFactor: 0
    attackRate: 1.5
    damage:
      types:
        Slash: 16
    soundHit:
      collection: MetalThud
    angle: 100
    animation: WeaponArcThrust
    wideAnimationRotation: -135
    range: 2
  - type: Item
    size: Ginormous
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_machete-inhands.rsi
  - type: BackstabDamageMultipilier
    bonusDamage:
      types:
        Slash: 8
  - type: PressureDamageModify
    minPressure: -1
    additionalDamage:
      types:
        Blunt: 8
        Slash: 12
  - type: Clothing
    sprite: ADT/Objects/Weapons/Melee/Crushers/crusher_machete.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Tool
    qualities:
      - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Prying 
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: UnpoweredFlashlight
  - type: PointLight
    color: "#ffeead"
    enabled: false
  - type: Utensil
    types:
      - Knife
