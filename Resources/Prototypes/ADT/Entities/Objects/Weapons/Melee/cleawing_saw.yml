- type: entity
  name: cleaving saw
  parent: BaseItem
  id: ADTCleawingSaw
  description: This saw, effective at drawing the blood of beasts, transforms into a long cleaver that makes use of centrifugal force.
  components:
  - type: Sprite
    sprite: ADT/Objects/Weapons/Melee/cleaving_saw.rsi
    layers:
    - state: icon_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: MeleeWeapon
    attackRate: 2.5
    range: 2
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 16.67
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
    deactivatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 20
  - type: Item
    size: Large
    sprite: ADT/Objects/Weapons/Melee/cleaving_saw-inhands.rsi
    heldPrefix: "off"
  - type: ItemTogglePrefix
    prefixOn: "on"
    prefixOff: "off"
  - type: UseDelay
    delay: 0.4
  - type: DisarmMalus
    malus: 0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon_on}
          False: {state: icon_off}
  - type: Clothing
    sprite: ADT/Objects/Weapons/Melee/cleaving_saw.rsi
    quickEquip: false
    slots:
    - Belt
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/ADT/Effects/Magic/Clockwork/fellowship_armory.ogg
    soundDeactivate:
      path: /Audio/ADT/Effects/Magic/Clockwork/fellowship_armory_edited.ogg
  - type: ADTCleavingSaw
    openAttackRate: 1.25
    closedAttackRate: 2.5
    transformAttackDelay: 0.2
    nemesisWhitelist:
      components:
      - Fauna
    nemesisBonusDamage:
      types:
        Slash: 30
    clumsyChance: 0.5
    clumsyDamage:
      types:
        Slash: 10
        Heat: 10
    bleedStart: 3
    bleedBuildup: 3
    bleedCap: 10
    bleedTickInterval: 0.6
    bleedDecayDelay: 0.5
    bleedDamage:
      types:
        Slash: 200
    bleedBurstSound:
      collection: desecration
    bleedBurstEffect: DecalSpawnerBloodSplatters
