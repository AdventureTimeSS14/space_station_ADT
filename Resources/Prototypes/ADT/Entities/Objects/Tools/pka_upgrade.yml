- type: entity
  id: ADTPKAUpgradeMiningExplosion
  parent: BasePKAUpgrade
  name: PKA modkit (mining explosion)
  description: Causes the kinetic accelerator to destroy rock in an area.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#d8b26a"
    - state: overlay-2
      color: "#6b4a1f"
    - state: overlay-3
      color: "#a87c33"
  - type: ADTGunUpgrade
    cost: 30
    maximumOfType: 1
    tags: [ ADTGunUpgradeAoETiles ]
    examineText: adt-gun-upgrade-examine-text-mining-explosion
  - type: ADTGunUpgradeAoE
    mineTiles: true
    radius: 1.5
    effect: BulletImpactEffectKinetic

- type: entity
  id: ADTPKAUpgradeOffensiveMiningExplosion
  parent: BasePKAUpgrade
  name: PKA modkit (offensive mining explosion)
  description: Causes the kinetic accelerator to destroy rock and damage creatures in an area.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#d8b26a"
    - state: overlay-2
      color: "#7a1010"
    - state: overlay-3
      color: "#c85a1a"
  - type: ADTGunUpgrade
    cost: 30
    maximumOfType: 3
    tags: [ ADTGunUpgradeAoETiles ]
    examineText: adt-gun-upgrade-examine-text-offensive-mining-explosion
  - type: ADTGunUpgradeAoE
    mineTiles: true
    mobDamageModifier: 0.25
    radius: 1.5
    effect: BulletImpactEffectKinetic

- type: entity
  id: ADTPKAUpgradeOffensiveExplosion
  parent: BasePKAUpgrade
  name: PKA modkit (offensive explosion)
  description: Causes the kinetic accelerator to damage creatures in an area.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#e04a4a"
    - state: overlay-2
      color: "#7a1010"
    - state: overlay-3
