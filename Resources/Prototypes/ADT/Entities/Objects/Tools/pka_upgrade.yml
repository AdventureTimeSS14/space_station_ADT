- type: entity
  id: ADTPKAUpgradeTracerWhite
  parent: BasePKAUpgrade
  name: PKA modkit (white tracer bolts)
  description: Causes kinetic accelerator bolts to have a white tracer trail.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ffffff"
    - state: overlay-2
      color: "#9a9a9a"
    - state: overlay-3
      color: "#ffffff"
  - type: ADTGunUpgrade
    cost: 0
    maximumOfType: 1
    tags: [ ADTGunUpgradeTracer ]
    examineText: adt-gun-upgrade-examine-text-tracer
  - type: ADTGunUpgradeTracer
    boltColor: "#ffffff"
  - type: StaticPrice
    price: 250

- type: entity
  id: ADTPKAUpgradeTracerAdjustable
  parent: ADTPKAUpgradeTracerWhite
  name: PKA modkit (adjustable tracer bolts)
  description: Causes kinetic accelerator bolts to have an adjustable-colored tracer trail. Use it in hand to change the color.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ff4fd8"
    - state: overlay-2
      color: "#3cf1e0"
    - state: overlay-3
      color: "#f1e13c"
  - type: ADTGunUpgradeTracer
    boltColor: "#ffffff"
    adjustable: true
  - type: UserInterface
    interfaces:
      enum.ADTGunUpgradeTracerUiKey.Key:
        type: ADTTracerColorBoundUserInterface
  - type: ActivatableUI
    key: enum.ADTGunUpgradeTracerUiKey.Key
    inHandsOnly: true
  - type: StaticPrice
    price: 500

