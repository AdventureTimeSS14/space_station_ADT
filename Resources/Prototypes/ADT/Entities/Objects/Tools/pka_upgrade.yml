- type: entity
  id: ADTPKAUpgradeRapidRepeater
  parent: BasePKAUpgrade
  name: PKA modkit (rapid repeater)
  description: Quarters the kinetic accelerator's cooldown on striking a target, but greatly increases the base cooldown. Don't miss.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#9bf134"
    - state: overlay-2
      color: "#07901b"
    - state: overlay-3
      color: "#34f1c4"
  - type: ADTGunUpgrade
    cost: 50
    maximumOfType: 1
    tags: [ ADTGunUpgradeRepeater ]
    examineText: adt-gun-upgrade-examine-text-repeater
  - type: ADTGunUpgradeRepeater
    rechargeCoefficient: 4
    hitCoefficient: 0.25

- type: entity
  id: ADTPKAUpgradeDeathSyphon
  parent: BasePKAUpgrade
  name: PKA modkit (death syphon)
  description: Killing a creature permanently increases your damage against that type of creature.
  components:
