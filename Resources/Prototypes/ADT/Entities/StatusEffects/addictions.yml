# Лёгкий дебаф тяжёлой стадии ломки: небольшое замедление.
- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectWithdrawalWeakness
  name: withdrawal-weakness
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
  - type: MovementModStatusEffect
    walkSpeedModifier: 0.85
    sprintSpeedModifier: 0.85
