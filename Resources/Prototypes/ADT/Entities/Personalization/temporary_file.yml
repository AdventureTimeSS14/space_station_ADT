  id: ADTClothingHeadReinforcedBSHelmetRaven559
  name: worn-out parade reinforced helmet of the Officer 'Blue Shield'
  description: Extremely durable helmet, designed (or stolen?) for one specific Blue Shield Officer. The word 'DUMP TRUCK' is scratched on the front of the helmet.
  suffix: Sponsor, Raven559
  components:
