        Slash: 0.5
        Piercing: 0.5
        Heat: 0.5
        Caustic: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: StaminaResistance
    damageCoefficient: 0.65

#Illumy

- type: entity
  parent: ADTSponsorClothingShoesBase
  id: ADTClothingShoesBrasskBootsIllumy
  name: brass shoes
  description: Shoes with brass trim, designed for long service and a confident stride. It seems especially difficult to take a step back in them.
  suffix: Personal, Unlumination
  components:
  - type: Sprite
    sprite: ADT/Personalization/Illumy/brass_shoes.rsi
  - type: Clothing
    sprite: ADT/Personalization/Illumy/brass_shoes.rsi

- type: entity
  parent: ADTSponsorClothingNeckBase
  id: ADTClothingOuterJacketCoatIllumy
  name: jacket‑cloak “Valiant Flame”
  description: A crimson jacket‑cloak whose patterns resemble long ivy stems. They say it is worn by those whose valor does not fade even in the face of inevitable death.
  suffix: Personal, Unlumination
  components:
  - type: Sprite
    sprite: ADT/Personalization/Illumy/jacket_cloak.rsi
  - type: Clothing
    sprite: ADT/Personalization/Illumy/jacket_cloak.rsi
  - type: Storage
    grid:
    - 0,0,3,1
    maxItemSize: Small
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: ADTClothingSponsorHandsBase
  id: ADTClothingHandsSyntheticGlovesIllumy
  name: synthetic gloves
  description: Durable synthetic gloves, equally suitable for working with soil and everyday tasks. It seems that hands simply can’t shake in them.
  suffix: Personal, Unlumination
  components:
  - type: Sprite
    sprite: ADT/Personalization/Illumy/synthetic_gloves.rsi
  - type: Clothing
    sprite: ADT/Personalization/Illumy/synthetic_gloves.rsi

- type: entity
