  name: worn-out reinforced parade armor of Officer 'Blue Shield'
  description: A reinforced power armor that provides excellent protection while still being highly mobile, designed specifically for a single Officer of the 'Blue Shield.' On closer inspection, this armor resembles another similar red armor, as if it was stolen from somewhere and repainted, but there’s no solid evidence of this crime.
  suffix: Sponsor, Raven559
  components:
  - type: Sprite
    sprite: ADT/Personalization/Raven559/blue_shield_ceremonial_reinforced_armor.rsi
  - type: Clothing
    sprite: ADT/Personalization/Raven559/blue_shield_ceremonial_reinforced_armor.rsi
  - type: TemperatureProtection
