  id: ADTClothingUniformHeatResistantJumpsuitIllumy
  name: heat‑resistant tuxedo
  description: A strict crimson tuxedo, made of thick fabric capable of withstanding intense heat. Even near an open flame, it maintains its impeccable appearance.
  suffix: Personal, Unlumination
  components:
  - type: Sprite
    sprite: ADT/Personalization/Illumy/heatresistant_tuxedo.rsi
  - type: Clothing
    sprite: ADT/Personalization/Illumy/heatresistant_tuxedo.rsi

