- type: utilityQuery
  id: ADTHierophantMeleeTargets
  query:
    - !type:NearbyHostilesQuery
  considerations:
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve

- type: htnCompound
  id: ADTHierophantAttackTargetCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
            targetState: Dead
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: ADTHierophantMeleeTargets
              key: Target

- type: htnCompound
  id: ADTHierophantCombatPrecondition
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished
    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound
    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnPullOperator
            shutdownState: TaskFinished
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: ADTHierophantMeleeTargets
        - !type:HTNCompoundTask
          task: ADTHierophantEngageCompound

- type: htnCompound
  id: ADTHierophantEngageCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: Target
      tasks:
        - !type:HTNCompoundTask
          task: ADTHierophantAttackTargetCompound

- type: htnCompound
  id: ADTHierophantCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: HierophantBlinking
      tasks:
        - !type:HTNCompoundTask
          task: DoAbsolutelyNothingCompound
    - tasks:
        - !type:HTNCompoundTask
          task: ADTHierophantCombatPrecondition
    - tasks:
        - !type:HTNCompoundTask
          task: DoAbsolutelyNothingCompound
