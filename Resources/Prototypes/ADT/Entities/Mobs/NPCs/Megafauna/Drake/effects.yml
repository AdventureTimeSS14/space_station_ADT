- type: entity
  id: ADTDrakeFireLine
  categories: [ HideSpawnMenu ]
  name: drake fire line
  components:
  - type: ADTDrakeFireLine

- type: entity
  id: ADTDrakeFire
  categories: [ HideSpawnMenu ]
  name: fire
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: Effects
    color: "#FF4400FA"
    layers:
    - state: hotspot
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1
    color: "#FF4400"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3
      multiplierOnExisting: 3
    - !type:Ignite
  - type: TimedDespawn
    lifetime: 3
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeMeteorTarget
  categories: [ HideSpawnMenu ]
  name: target
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: BelowMobs
    layers:
    - state: target
  - type: PointLight
    radius: 2
    energy: 1
  - type: ADTDrakeMeteorTarget
    delay: 0.9
    damage: 10
    spawnSound:
      path: /Audio/ADT/Drake/fleshtostone.ogg
      params:
        variation: 0.125
    impactSound:
      collection: Explosion
      params:
        variation: 0.125
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeFallingFireball
  categories: [ HideSpawnMenu ]
  name: fireball
  description: Get out of the way!
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: Overdoors
    offset: 0,8.4375
    noRot: true
    layers:
    - state: fireball
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      offset: 0,8.4375
    - time: 0.9
      offset: 0,0
  - type: TimedDespawn
    lifetime: 0.9
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeFlightBase
  abstract: true
  categories: [ HideSpawnMenu ]
  name: ash drake
  components:
  - type: Sprite
    sprite: ADT/Mobs/Aliens/Lavaland/drake.rsi
    drawdepth: Effects
    noRot: true
    offset: 0,0.5
    layers:
    - map: [ "base" ]
      state: dragon
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeFlightRiseLeft
  parent: ADTDrakeFlightBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      offset: 0,0.5
      state: dragon
    - time: 0.3
      offset: -0.84375,1.765625
      state: swoop
      easing: OutBounce
    - time: 0.7
      offset: -8.4375,8.9375

- type: entity
  id: ADTDrakeFlightRiseRight
  parent: ADTDrakeFlightBase
  categories: [ HideSpawnMenu ]
  components:
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      offset: 0,0.5
      state: dragon
    - time: 0.3
      offset: 0.84375,1.765625
      state: swoop
      easing: OutBounce
    - time: 0.7
      offset: 8.4375,8.9375

- type: entity
  id: ADTDrakeFlightLandLeft
  parent: ADTDrakeFlightBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Mobs/Aliens/Lavaland/drake.rsi
    drawdepth: Effects
    noRot: true
    offset: -8.4375,8.9375
    layers:
    - map: [ "base" ]
      state: dragon
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      offset: -8.4375,8.9375
    - time: 0.5
      offset: 0,0.5
    - time: 0.5
      offset: 0,0.5

- type: entity
  id: ADTDrakeFlightLandRight
  parent: ADTDrakeFlightBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: ADT/Mobs/Aliens/Lavaland/drake.rsi
    drawdepth: Effects
    noRot: true
    offset: 8.4375,8.9375
    layers:
    - map: [ "base" ]
      state: dragon
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      offset: 8.4375,8.9375
    - time: 0.5
      offset: 0,0.5
    - time: 0.5
      offset: 0,0.5

- type: entity
  id: ADTDrakeLandingMarker
  categories: [ HideSpawnMenu ]
  name: certain death
  description: Don't just stand there, move!
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/bubblegum_target_circle.rsi
    drawdepth: BelowMobs
    color: "#FF0000"
    layers:
    - state: icon
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeLavaWarning
  categories: [ HideSpawnMenu ]
  name: lava warning
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: BelowMobs
    color: "#FFFFFF40"
    layers:
    - state: lava_warning
  - type: PointLight
    radius: 2
    energy: 1
  - type: ADTDrakeVisualEffect
    keyframes:
    - time: 0
      alpha: 0.25
    - time: 1.3
      alpha: 1
  - type: ADTDrakeLavaWarning
    delay: 1.3
    damage: 10
    mechDamage: 45
    spawnSound:
      path: /Audio/ADT/Drake/fleshtostone.ogg
      params:
        variation: 0.125
    impactSound:
      path: /Audio/Magic/fireball.ogg
      params:
        variation: 0.125
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeLavaSafe
  categories: [ HideSpawnMenu ]
  name: safe spot
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: BelowMobs
    layers:
    - state: lava_safe
  - type: PointLight
    radius: 2
    energy: 1
  - type: TimedDespawn
    lifetime: 1.3
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeTempLava
  categories: [ HideSpawnMenu ]
  name: lava
  description: Don't jump in. It's not worth it, no matter how funny it is.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TileEmission
    color: "#FF4500"
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Flammable
      multiplier: 3.75
      multiplierOnExisting: 0.75
    - !type:Ignite
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: Tiles/Planet/lava.rsi
    drawdepth: FloorTiles
    layers:
    - state: lava
      shader: unshaded
  - type: IconSmooth
    key: floor
    additionalKeys:
    - walls
    base: lava
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ADTDrakeFireWall
  categories: [ HideSpawnMenu ]
  name: fire barrier
  description: The true flame of the ash drake.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: ADT/Effects/drake_effects.rsi
    drawdepth: Objects
    color: "#C3630C"
    layers:
    - state: fire
      shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        layer:
        - GlassLayer
        density: 1000
  - type: Airtight
  - type: TimedDespawn
    lifetime: 8.2
