- type: utilityQuery
  id: ADTDrakeMeleeTargets
  query:
    - !type:NearbyHostilesQuery
  considerations:
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve

- type: htnCompound
  id: ADTDrakeAttackTargetCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
            targetState: Dead
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: ADTDrakeMeleeTargets
              key: Target

- type: htnCompound
  id: ADTDrakeCombatPrecondition
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished
    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: ADTDrakeMeleeTargets
        - !type:HTNCompoundTask
          task: ADTDrakeAttackTargetCompound

- type: htnCompound
  id: ADTDrakeCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: DrakeSwooping
      tasks:
        - !type:HTNCompoundTask
          task: DoAbsolutelyNothingCompound
    - tasks:
        - !type:HTNCompoundTask
          task: ADTDrakeCombatPrecondition
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
