- type: entity
  id: ADTMegaFaunaColossus
  name: colossus
  description: A monstrous creature protected by heavy shielding.
  parent: ADTBaseMobMegafauna
  components:
  - type: Sprite
    sprite: ADT/Mobs/Aliens/Lavaland/colossus.rsi
    drawdepth: Mobs
    noRot: true
    offset: 0,1
    layers:
    - map:
      - enum.DamageStateVisualLayers.Base
      state: eva
  - type: GenericVisualizer
    visuals:
      enum.ADTColossusVisuals.Attacking:
        enum.DamageStateVisualLayers.Base:
          True:
            state: eva_attack
          False:
            state: eva
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
      hitbox:
        shape: !type:PhysShapeAabb
          bounds: "-0.9,-0.45,0.9,2.4"
        density: 1
        hard: true
        layer:
        - BulletImpassable
  # ADT buff: в SS13 move_to_delay 10 (1 тайл/с)
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MovementIgnoreGravity
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  # ADT buff: в SS13 melee_damage 40
  - type: MeleeWeapon
    attackRate: 0.5
    damage:
      types:
        Blunt: 50
        Structural: 400
    range: 1.5
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      path: /Audio/ADT/Colossus/ratvar_attack.ogg
  # ADT buff: в SS13 armour_penetration 40
  - type: ArmorPenetration
    penetration: 0.5
  - type: PointLight
    radius: 3
    energy: 1
  - type: HTN
    blackboard:
      VisionRadius: !type:Single "5"
      AggroVisionRadius: !type:Single "18"
      NavSmash: !type:Bool "true"
      NavInteract: !type:Bool "true"
      MeleeRange: !type:Single "1.5"
      MeleeMissChance: !type:Single "0"
    rootTask:
      task: ADTColossusCompound
  - type: Megafauna
    speechFont: Default
    speechFontSize: 16
    speechColor: "#80282A"
    speechBold: true
    speechUppercase: true
  - type: ADTMegafaunaAI
    decisionInterval: 2
    angerDamageDivisor: 50
    maxAnger: 20
    actions:
    - ActionADTColossusSpiral
    - ActionADTColossusRandomShots
    - ActionADTColossusShotgun
    - ActionADTColossusAlternating
  - type: ADTColossus
    boltSpeed: 6
    # ADT buff: в SS13 6 зарядов (12.5, 7.5, 2.5, -2.5, -7.5, -12.5)
    shotgunAngles: [ 17.5, 12.5, 7.5, 2.5, -2.5, -7.5, -12.5, -17.5 ]
    # ADT buff: в SS13 5%
    randomShotChance: 0.07
  - type: MegafaunaLoot
    crateProto: ADTCrateColossusLoot
    loot:
    - proto: ADTGemNullCrystal
    - proto: ADTKineticTrophyBlasterTubes
    - proto: GoldOre
      max: 10
    - proto: SilverOre
      max: 10
    - proto: DiamondOre
      max: 5
    - proto: PlasmaOre
      max: 15
    - proto: UraniumOre
      max: 10
    - proto: SpaceQuartz
      max: 15
    randomLootPools:
    - pickOne:
      - ADTAnomalousCrystalHonk
      - ADTAnomalousCrystalThemeWarp
      - ADTAnomalousCrystalEmitter
      - ADTAnomalousCrystalDarkReprise
      - ADTAnomalousCrystalHelpers
      - ADTAnomalousCrystalRefresher
      - ADTAnomalousCrystalPossessor
    - pickOne:
      - ADTOrganVoiceOfGod
      - ADTClothingEyesGodEye
  - type: GpsSignal
    tag: adt-gps-signal-colossus
    description: adt-gps-signal-colossus-desc
    color: "#C80000"
  - type: StatusIcon
    bounds: -1,-2,1,1

- type: entity
  id: ADTColossusBolt
  name: death bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: ADT/Objects/Weapons/Guns/Projectiles/colossus_bolt.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 25
  - type: ArmorPenetration
    penetration: 1
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.30"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: ADTColossusBolt
    objectDamage:
      types:
        Structural: 300
    objectDamageMaxMultiplier: 3
  - type: TimedDespawn
    lifetime: 15

- type: entity
  id: ADTColossusShield
  name: anti-toolbox field
  description: A shimmering forcefield protecting the colossus.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Effects
    sprite: ADT/Effects/colossus_shield.rsi
    layers:
    - state: at_shield2
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1
  - type: TimedDespawn
    lifetime: 0.8
