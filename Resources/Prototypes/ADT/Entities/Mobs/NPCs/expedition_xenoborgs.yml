- type: entity
  abstract: true
  id: ADTMobXenoborgNpcBase
  components:
    - type: ADTNpcBorg
    - type: ADTNpcCombatMemory
      avoidObstacles: true
    - type: InputMover
    - type: MobMover
    - type: Prying
      pryPowered: true
      force: true
      speedModifier: 1
      useSound:
        path: /Audio/Items/crowbar.ogg

- type: entity
  parent: [ XenoborgHeavy, ADTMobXenoborgNpcBase ]
  id: ADTMobXenoborgHeavyNpc
  suffix: NPC
  components:
    - type: HTN
      rootTask:
        task: ADTXenoborgHeavyCompound
      blackboard:
        NavPry: !type:Bool
          true
        NavInteract: !type:Bool
          true
        VisionRadius: !type:Single
          15
        AggroVisionRadius: !type:Single
          15
        ADTPatrolRange: !type:Single
          3
        MinimumIdleTime: !type:Single
          4
        MaximumIdleTime: !type:Single
          10

