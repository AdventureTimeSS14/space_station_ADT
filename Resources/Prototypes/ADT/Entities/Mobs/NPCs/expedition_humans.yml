- type: entity
  abstract: true
  parent: MobHuman
  id: ADTMobSovietBunkerBase
  components:
    - type: NpcFactionMember
      factions:
        - ADTSovietBunker
    - type: InputMover
    - type: MobMover
    - type: ADTNpcGear
    - type: ADTNpcCombatMemory
    - type: HTN
      rootTask:
        task: ADTExpeditionHumanoidCompound
      blackboard:
        ADTMeleeSwitchRange: !type:Single
          1.8
        ADTFollowRange: !type:Single
          2.5
        ADTMeleeLeaveRange: !type:Single
          3.5
        ADTPistolRange: !type:Single
          5.5
        ADTPistolLeaveRange: !type:Single
          8
        ADTEmptyPistolRange: !type:Single
          6
        ADTSafeReloadRangeLoose: !type:Single
          10
    - type: SSDIndicator
      isSSD: false
    - type: RandomHumanoidAppearance
      randomizeName: false
      clearMarkings: true
      skinTone: 5, 45
      hairStyles:
      - HumanHairBuzzcut
      - HumanHairCrewcut
      - HumanHairCrewcut2
      - HumanHairLowfade
      - HumanHairMedfade
      - HumanHairHighfade
      - HumanHairBaldfade
      - HumanHairNofade
      - HumanHairSargeant
      - HumanHairTrimmed
      - HumanHairTrimflat
      - HumanHairSkinhead
      - HumanHairBusiness
      - HumanHairClassicBusiness
      hairColors:
      - "#1a1a1a"
      - "#2b2119"
      - "#3d2b1f"
      - "#5a3e2b"
      - "#7a5c3e"
      - "#a68b62"
      - "#6e6e6e"
      voices:
      - tihonov_tb
      - semen_baburin_tb
      - boris_petrov_father_tb
      - strelok
      - guard_guardsman_sergeant_dow
    - type: RandomMetadata
      nameSegments:
      - ADTNamesSovietRank
      - ADTNamesSovietSurname
      nameFormat: name-format-adt-soviet-soldier
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: ghost-role-information-adt-soviet-soldier-name
      description: ghost-role-information-adt-soviet-soldier-description
      rules: ghost-role-information-freeagent-rules
      raffle:
        settings: default

