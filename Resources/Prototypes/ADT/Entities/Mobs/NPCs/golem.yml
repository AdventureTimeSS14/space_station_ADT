- type: entity
  abstract: true
  parent: [ BaseMob, MobCombat ]
  id: ADTMobGolem
  name: golem
  components:
  - type: Reactive
    groups:
      Acidic: [ Touch ]
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2
  - type: MovedByPressure
  - type: StatusEffects
    allowed:
    - Weakness
    - Electrocution
  - type: Pullable
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: ZombieImmune
  - type: ProtectedFromStepTriggers
  - type: StunVisuals
  - type: Sprite
    sprite: Mobs/Elemental/golem.rsi
    layers:
    - state: golem_base
    - state: golem_head
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/smash.ogg
    damage:
      types:
        Blunt: 12
  - type: NpcFactionMember
    factions:
      - SimpleHostile

- type: entity
  parent: ADTMobGolem
  id: ADTMobQuartzGolem
  description: A golem made from quartz.
  suffix: Quartz
  components:
  - type: Sprite
    sprite: Mobs/Elemental/golem.rsi
    layers:
    - state: golem_base
    - state: golem_head
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SpaceQuartz1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

