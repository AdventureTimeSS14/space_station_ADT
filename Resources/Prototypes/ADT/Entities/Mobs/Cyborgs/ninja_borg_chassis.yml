- type: entity
  abstract: true
  id: ADTNinjaBorgBase
  parent: BaseBorgChassisNT
  name: ninja cyborg
  components:
  - type: SiliconLawProvider
    laws: Ninja
  - type: NinjaBorgChassis
  - type: ContainerFill
    containers:
      borg_brain:
      - PositronicBrain
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: StartingMindRole
    mindRole: "MindRoleSiliconBrain"
    silent: true
  - type: AccessReader
    access: [["SyndicateAgent"]] # У нас нет доступа под клан паука пока так

- type: entity
  id: ADTNinjaBorgChassisSecurity
  parent: ADTNinjaBorgBase
  name: ninja cyborg
  components:
  - type: Sprite
    sprite: ADT/Mobs/Silicon/Borgs/ninja_robot.rsi
    layers:
    - state: ninja_sec
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: ninja_sec_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: ninja_sec_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    maxModules: 6
    hasMindState: ninja_sec_e
    noMindState: ninja_sec_e
  - type: BorgTransponder
    sprite:
      sprite: ADT/Mobs/Silicon/Borgs/ninja_robot.rsi
      state: ninja_sec
    name: ниндзя-борг безопасности
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - Science
    - Security
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Science
    - Security
  - type: Inventory
    templateId: borgTall
  - type: TTS
    voice: sentrybot
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails
  - type: ContainerFill
    containers:
      borg_module:
      - BorgModuleSyndicateWeapon

