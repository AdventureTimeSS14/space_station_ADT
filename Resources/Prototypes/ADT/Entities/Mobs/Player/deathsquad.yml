- type: randomHumanoidSettings
  id: ADTDeathSquadBase
  parent: EventHumanoidCentcomm
  randomizeName: false
  species: ADTSuperHuman
  components:
    - type: GhostRole
      name: ghost-role-information-Death-Squad-name
      description: ghost-role-information-Death-Squad-description
      rules: ghost-role-information-Death-Squad-rules
      raffle:
        settings: short
      mindRoles:
      - MindRoleGhostRoleFamiliar
      job: DeathSquad
    - type: AutoImplant
      implants:
      - MindShieldImplant
      - DeathRattleImplantCentcomm
      - FreedomImplant
      - DeathAcidifierImplant
    - type: GrantHellRip
    - type: RandomMetadata
      nameSegments:
      - NamesFirstDeadSquad
      - NamesLastDeadSquadCallsign
      nameFormat: name-format-standard

