- type: entity
  parent: ADTClothingDeathSquadBackpack
  id: ADTClothingBackpackMinigun
  name: minigun ammo backpack
  description: A backpack that feeds a mounted minigun.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Back/minigun_backpack.rsi
  - type: Clothing
    sprite: ADT/Clothing/Back/minigun_backpack.rsi
  - type: Tag
    tags:
    - Backpack
    - ADTMinigunAmmoBackpack
  - type: Storage
    grid:
    - 0,0,9,6
    maxItemSize: Huge
  - type: BallisticAmmoProvider
    proto: ADTCartridgeLightRifleCaseless
    capacity: 3000
    whitelist:
      tags:
      - ADTCartridgeLightRifleCaseless
  - type: BallisticAmmoInteractLoader
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      ballistic-ammo: !type:Container
        ents: []
      minigun: !type:ContainerSlot
