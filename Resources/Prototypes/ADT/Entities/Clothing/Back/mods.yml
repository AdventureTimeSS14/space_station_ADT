# Каркас для МОДов
- type: entity
  abstract: true
  parent: Clothing
  id: ADTClothingModsuitBackBase
  name: base MOD control unit
  description: A civilian class suit by Nakamura Engineering, doesn't offer much other than slightly quicker movement.
  components:
  - type: ModSuit
    fullyEnabledSound:
      path: /Audio/ADT/Mecha/nominal.ogg
  - type: ContainerContainer
    containers:
      mod-modules-container: !type:Container
        showEnts: False
        occludes: True
        ents: []
      modsuit-part: !type:Container
        showEnts: False
        occludes: True
        ents: []
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      cell_slot: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null # ContainerContainer и UserInterface для модулей надо добавлять сюда, а через модули возможность включить
      mod-core: !type:ContainerSlot
        showEnts: False
        occludes: True
        ents: null
  - type: UserInterface
    interfaces:
      enum.ModSuitUiKey.Key:
        type: ModSuitRadialBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ModSuitMenuUiKey.Key:
        type: ModSuitMenuBoundUserInterface
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        whitelist:
          components:
            - PowerCell
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
    requireOpen: false
  - type: Item
    size: Huge
  - type: PowerCellDraw
    enabled: false
    drawRate: 1
    useCharge: 1
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ItemSlotsRequirePanel
    slots:
      cell_slot: true
  - type: EmpDisabling
    disablingTime: 30000
  - type: ShowEnergyAlarm
  - type: Geiger
    showExamine: true
    attachedToSuit: true
    showControl: true

## С батареей
- type: entity
  abstract: true
  parent: ADTClothingModsuitBackBase
  id: ADTClothingModsuitBackBaseBattery
  components:
  - type: ContainerFill
    containers:
      cell_slot:
      - PowerCellMedium


