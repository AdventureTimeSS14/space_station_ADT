- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseFoldable, BaseSecurityContraband ]
  id: ADTClothingHeadHelmetAssault
  name: assault helmet with visor
  description: Standard protective gear. Protects head and face from bullets.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Head/Helmets/assault.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-open
      map: [ "foldedLayer" ]
      visible: false
  - type: Clothing
    sprite: ADT/Clothing/Head/Helmets/assault.rsi
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: verb-common-close
    foldVerbText: verb-common-open
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedHeldPrefix: open
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.90
        Heat: 0.95
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet

- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseFoldable, BaseSecurityContraband ]
  id: ADTClothingHeadHelmetSecurityAlt
  name: security helmet
  description: Standard protective gear with built-in flashlight.
  components:
  - type: Sprite
    sprite: ADT/Clothing/Head/Helmets/securityalt.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-open
      map: [ "foldedLayer" ]
      visible: false
    - state: light-icon
      map: [ "light" ]
      visible: false
      shader: unshaded
  - type: Clothing
    sprite: ADT/Clothing/Head/Helmets/securityalt.rsi
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: verb-common-close
    foldVerbText: verb-common-open
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedHeldPrefix: open
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
  - type: Tag
    tags:
    - WhitelistChameleon
    - SecurityHelmet
  - type: PointLight
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    radius: 11
    netsync: false
  - type: Appearance
  - type: HandheldLight
    addPrefix: false
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      maxDuration: 2.0
      startValue: 3.0
      endValue: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      maxDuration: 1.0
      startValue: 0.1
      endValue: 2.0
      isLooped: true
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-HELMET-light
        shader: unshaded
  - type: ItemTogglePointLight
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
      toggleable-clothing: !type:ContainerSlot {}
  - type: PowerCellDraw
    drawRate: 2
  - type: ToggleCellDraw
