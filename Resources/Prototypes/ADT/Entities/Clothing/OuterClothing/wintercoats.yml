  id: ADTClothingOuterDownjacketBlack
  name: black downjacket
  description: A heavy winter jacket filled with synthetic down.
  components:
  - type: Sprite
    sprite: ADT/Clothing/OuterClothing/Downjacket/downjacket_black.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-open
      map: [ "foldedLayer" ]
      visible: false
  - type: Clothing
    sprite: ADT/Clothing/OuterClothing/Downjacket/downjacket_black.rsi
  - type: ToggleableClothing
    clothingPrototype: ADTClothingHeadHoodDownjacket_black
    slot: head
    verbText: toggle-clothing-verb-hood
  - type: Storage
    grid:
    - 0,0,2,1
  - type: Item
    size: Normal
    shape:
    - 0,0,1,5
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container
        ents: []
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedHeldPrefix: open
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.90
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.55
  - type: Tag
    tags:
    - WinterCoat
    - ClothMade
    - Recyclable
    - WhitelistChameleon
