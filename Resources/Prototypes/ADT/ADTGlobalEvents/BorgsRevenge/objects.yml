- type: entity
  parent: MarkerBase
  id: ADTSpawnBorgAiRemote
  name: borg ai remote spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Silicon/chassis.rsi
      state: robot
    - sprite: Mobs/Silicon/chassis.rsi
      state: robot_e
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - ADTPlayerBorgAiRemoteEvent

- type: entity
  parent: MarkerBase
  id: ADTSpawnMobIPC
  name: IPC spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Species/Human/displacement.rsi
  - type: ConditionalSpawner
    prototypes:
    - MobIPCEventCombat

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsCyborg
  suffix: Cyborg, Locked
  components:
  - type: AccessReader
    access: [["Borg"], ["StationAi"]]

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsAI
  suffix: AI, Locked
  components:
  - type: AccessReader
    access: [["StationAi"]]
# cyborg

- type: entity
  parent: PassengerPDA
  id: ADTCyborgPDA
  name: cyborg PDA
  components:
  - type: Pda
    id: ADTCyborgIDCard

# cyborg

- type: entity
  parent: IDCardStandard
  id: ADTCyborgIDCard
  name: cyborg ID card
  components:
  - type: Sprite
    layers:
    - state: default
  - type: Access
    tags:
    - Borg
  - type: IdCard
    jobTitle: job-name-cyborg
    jobIcon: JobIconBorg

- type: entity
  parent: HighSecDoor
  id: ADTHighSecCyborgLocked
  suffix: Cyborg, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsCyborg ]

- type: entity
  parent: HighSecDoor
  id: ADTHighSecAILocked
  suffix: AI, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsAI ]

- type: entity
  id: ADTPlayerBorgAiRemoteEvent
  parent: [BaseBorgChassis, BaseBorgTransponder]
  suffix: Battery, AI controllable
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesBorg
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - SiliconEmotes
    - ADTSiliconStealthWhitelist
    - ADTSiliconEmotes
    - Unimplantable
    - ADTVendingCargoAccount
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: Access
    groups:
    - AllAccess
    tags:
    - Borg
  - type: AccessReader
    access: [["Borg"]]
  - type: ShowJobIcons
  - type: ShowCrewIcons
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
  - type: BorgFlashStun
    stunDuration: 4
  - type: ContainerFill
    containers:
      borg_brain:
      - ADTAiRemoteBrain
  - type: AiRemoteController
  - type: StartingMindRole
    mindRole: "MindRoleSiliconBrain"
    silent: true
  - type: Sprite
    layers:
    - state: robot
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: robot_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: robot_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    # Default borg can take no modules until selected type.
    maxModules: 0
    hasMindState: robot_e
    noMindState: robot_e_r
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/chassis.rsi
      state: robot
    name: cyborg
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Common
    - Binary
  # ADT-Twek start
  - type: ShowHealthBars
    damageContainers:
    - Silicon
  - type: ShowHealthIcons
    damageContainers:
    - Silicon
  - type: BorgSwitchableSubtype
  - type: ShowElectrocutionHUD
  - type: StationAiVision

- type: entity
  id: MobIPCEventCombat
  parent: MobIPC
  name: IPC
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: AccessReader
    access: [["Borg"]]
  - type: AiRemoteController
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      BorgTalk: Speak
      SiliconCollectiveMind: Speak
      RobotTalk: Understand
  - type: Loadout
    prototypes: [ ADTIPCAIControlledGear ]

- type: startingGear
  id: ADTIPCAIControlledGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    shoes: ClothingShoesBootsJack
    outerClothing: ClothingOuterArmorBasic
    head: ClothingHeadHelmetBasic
    id: ADTCyborgPDA
    belt: ClothingBeltUtilityEngineering
    back: ClothingBackpack
    pocket1: WeaponPistolMk58
    pocket2: MagazinePistol
  storage:
    back:
    - ADTBoxSurvivalSiliconSecurity

- type: entity
  parent: [BaseWeaponEnergyTurretIndestructible, ConstructibleMachine]
  id: ADTWeaponEnergyTurretStationAIEvent
  name: sentry turret
  description: A high-tech autonomous weapons system designed to keep unauthorized personnel out of sensitive areas.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Fixtures
    fixtures:
      body:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 60
        mask:
          - Impassable
      turret:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 60
        mask:
          - MachineMask
        layer:
          - MachineLayer
        hard: false
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/sentry_turret.rsi
    drawdepth: HighFloorObjects
    granularLayersRendering: true
    layers:
    - state: support
      renderingStrategy: NoRotation
    - state: base_shadow
      map: [ "shadow" ]
    - state: base
      map: [ "base" ]
    - state: stun
      map: [ "enum.DeployableTurretVisuals.Weapon" ]
      shader: "unshaded"
      visible: false
    - state: cover_closed
      map: [ "enum.DeployableTurretVisuals.Turret" ]
      renderingStrategy: NoRotation
    - state: cover_light_on
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: "unshaded"
      renderingStrategy: NoRotation
      visible: false
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      renderingStrategy: NoRotation
      visible: false
  - type: AnimationPlayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryWeaponFireModeVisuals.State:
        enum.DeployableTurretVisuals.Weapon:
          BulletEnergyTurretDisabler: { state: stun }
          BulletEnergyTurretLaser: { state: lethal }
      enum.DeployableTurretVisuals.Broken:
        base:
          True: { state: destroyed }
          False: { state: base }
  - type: HTN
    enabled: false
  - type: StationAiWhitelist
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: BatteryAmmoProvider
    proto: BulletEnergyTurretDisabler
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletEnergyTurretDisabler
      fireCost: 100
    - proto: BulletEnergyTurretLaser
      fireCost: 100
  - type: DeployableTurret
    retractedDamageModifierSetId: Metallic
    deployedDamageModifierSetId: FlimsyMetallic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: TurretControlAI
    transmitFrequencyId: TurretAI
    sendBroadcastAttemptEvent: true
    prefix: device-address-prefix-turret
    examinableAddress: true
  - type: DeviceNetworkRequiresPower
  - type: WiredNetworkConnection
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-weapon-energy-turret
    layoutId: WeaponEnergyTurret
  - type: Lock
    locked: true
    unlockOnClick: false
  - type: LockedWiresPanel
  - type: UseDelay
    delay: 1.2
  - type: AccessReader
    access: [["StationAi"], ["ResearchDirector"]]
  - type: StationAiTurret
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Borg
    - BasicSilicon
  - type: Machine
    board: WeaponEnergyTurretAIMachineCircuitboard
