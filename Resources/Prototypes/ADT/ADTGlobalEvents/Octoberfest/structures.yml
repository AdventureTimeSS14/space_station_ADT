- type: entity
  parent: BaseStructure
  id: ADTWoodenTradeRack
  name: wooden trade rack
  description: A rack for storing things on.
  suffix: Oktoberfest
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/dodgeball.ogg"
  - type: Anchorable
  - type: InteractionOutline
  - type: PlaceableSurface
  - type: SpriteFade
  - type: Sprite
    sprite: ADT/ADTGlobalEvents/Octoberfest/Structures/woodenshowcase.rsi
    state: wood_rack
    snapCardinals: true
    offset: "0.0,0.5"
    drawdepth: Overdoors
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.1"
        density: 140
        mask:
        - TableMask
        layer:
        - TableMask
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Climbable
  - type: StaticPrice
    price: 30

