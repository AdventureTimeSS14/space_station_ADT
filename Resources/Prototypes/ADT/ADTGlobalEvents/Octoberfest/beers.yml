- type: reagent
  id: ADTCargoBeer
  name: cargo-beer-name
  parent: BaseAlcohol
  desc: cargo-beer-desc
  physicalDesc: reagent-physical-desc-bubbly
  flavor: adt_cargobeer
  color: "#663100"
  recognizable: true
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.2
      - !type:AdjustReagent
        reagent: Nutriment
        amount: 0.2
  metamorphicSprite:
    sprite: ADT/ADTGlobalEvents/Octoberfest/Drinks/cargobeer.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false

