    sprite: ADT/Heretic/Entities/sword.rsi
    state: icon
  - type: Item
    size: Large
    sprite: ADT/Heretic/Entities/sword-inhands.rsi
    shape:
    - 0,0,5,1
    storedRotation: 45
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcThrust
    range: 2
    attackRate: 1.25
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: ADTNoWideAttack
  - type: Clothing
    quickEquip: false
    sprite: ADT/Heretic/Entities/sword.rsi
    slots:
