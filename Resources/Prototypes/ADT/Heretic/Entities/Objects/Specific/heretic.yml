    - HereticItem

- type: entity
  parent: [ BaseItem, BaseMagicContraband ]
  id: HereticSpaceHands
  name: mansus hands
  description: Ethereal gauntlets that phase in and out of reality. They allow you to grasp what should not be grasped.
  components:
  - type: Sprite
    sprite: ADT/Heretic/items.rsi
    state: spacehand_left
  - type: Item
    size: Small
    sprite: ADT/Heretic/items.rsi
    inhandVisuals:
      left:
      - state: spacehand_right
      right:
      - state: spacehand_left
  - type: TimedDespawn
    lifetime: 9
  - type: Unremoveable
  - type: MansusGrasp
    blacklist:
      components:
      - Puddle
      - HereticRitualRune
