    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        layer:
        - WallLayer
        mask:
        - MobMask
        density: 1000
        hard: false
  - type: Clickable

- type: entity
  parent: [ BaseItem, BaseMagicContraband ]
  id: HereticRaggedSword
  name: ragged sword
  description: This blade feels cold and faintly resonant. Its surface swims with impossible, fleeting geometries.
  components:
