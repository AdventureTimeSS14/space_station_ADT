- type: entity
  parent: [ BaseItem, BaseMagicContraband ]
  id: CodexCicatrix
  name: codex cicatrix
  description: This heavy tome is full of cryptic scribbles and impossible diagrams. According to legend, it can be deciphered to reveal the secrets of the veil between worlds.
  components:
  - type: Sprite
    sprite: ADT/Heretic/book.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleAnimationVisuals.ToggleState:
        base:
          On: { state: icon-on }
          Off: { state: icon }
          TogglingOn: { state: icon-opening }
          TogglingOff: { state: icon-closing }
  - type: Item
    size: Small
    sprite: ADT/Heretic/book.rsi
  - type: UseDelay
    delay: 2.0
  - type: Appearance
  - type: ItemToggle
  - type: EldritchInfluenceDrainer
  - type: ComponentToggler
    components:
    - type: HereticMagicItem
    - type: TransmutationRuneScriber
  - type: ItemToggleSize
    activatedSize: Normal
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: ToggleAnimation
  - type: Tag # Drawing runes checks for tag component so this has to be here
    tags:
    - CodexCicatrix
    - AnchorHereticStructure

- type: entity
  parent: [ DrinkBase, BaseMagicContraband ]
  id: HereticEldritchFlask
  name: eldritch flask
  description: A flask filled with an unknown substance. Who knows what will happen when you take a sip from it.
  components:
  - type: Sprite
    sprite: ADT/Heretic/items.rsi
    state: eldritch_flask
  - type: Icon
    sprite: ADT/Heretic/items.rsi
    state: eldritch_flask
  - type: SolutionContainerManager
    solutions:
      drink:
        # it's a cryostasis flash filled with healing goodies what could possibly go wrong?
        # i will certainly not abuse it as a heretic chemist
        maxVol: 100
        canReact: false
        reagents:
        - ReagentId: EssenceEldritch
          Quantity: 100
  - type: Tag
    tags:
    - EldritchFlask

- type: entity
  id: HereticProtectiveBlade
  name: eldritch blade
  description: Maelstrom of razors flashing right before your eyes. Why are you stopping to look at it!?
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: ADT/Heretic/items.rsi
    state: protective_blade
  - type: Clickable
  - type: InteractionOutline
  - type: ProtectiveBlade
    lifetime: 60
  - type: Reflect
    reflects:
    - Energy
    - NonEnergy
    reflectProb: 1
    spread: 0
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
    angularDamping: 0
    linearDamping: 0
    canCollide: False

- type: entity
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  id: HereticProtectiveBladeProjectile
  name: eldritch blade
  description: Maelstrom of razors flashing right before your eyes. Why are you stopping to look at it!?
  components:
  - type: Sprite
    sprite: ADT/Heretic/items.rsi
    state: protective_blade
  - type: Projectile
    ignoreResistances: true
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Slash: 15
        Piercing: 15
        Structural: 100
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg

- type: entity
  parent: [ TimerGrenadeBase, BaseMagicContraband ]
  id: RustSowerGrenade
  name: rust sower
  description: A nifty little thing that explodes into rust. Causes borgs and mechs to get utterly obliterated.
  components:
  - type: Sprite
    sprite: ADT/Heretic/Entities/rustgrenade.rsi
    layers:
    - state: icon
      map: [ "enum.TriggerVisualLayers.Base" ]
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: TimerTrigger
    delay: 5
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 20
    spreadAmount: 10
    solution:
      reagents:
      - ReagentId: EldritchRust
        Quantity: 50
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      collection: ExplosionSmall
    positional: true
  - type: EmpOnTrigger
    keysIn:
    - timer
    range: 5
    energyConsumption: 50000
    disableDuration: 30
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 6
    intensitySlope: 2
    totalIntensity: 60
    canCreateVacuum: false
  - type: RustInRadiusOnTrigger
    keysIn:
    - timer
    range: 3
    lookupRange: 0.5
    rustStrength: 10
  - type: DeleteOnTrigger
    keysIn:
    - timer
  - type: Tag
    tags:
    - GrenadeIgnoreCosmicField
    - HereticItem
    - HandGrenade

- type: entity
  parent: [ BaseItem, BaseMagicContraband ]
  id: HereticPhylactery
  name: phylactery of damnation
  description: Used to steal blood from soon-to-be victims.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: ADT/Heretic/Entities/phylactery.rsi
    layers:
    - state: phylactery
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: phylactery1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Icon
    sprite: ADT/Heretic/Entities/phylactery.rsi
    state: phylactery
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: phylactery
    metamorphic: false
  - type: SolutionContainerManager
    solutions:
      phylactery:
        maxVol: 100
  - type: HereticPhylactery
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - HereticItem

