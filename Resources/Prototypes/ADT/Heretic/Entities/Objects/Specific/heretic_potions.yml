- type: entity
  parent: [ DrinkBase, BaseMagicContraband ]
  id: PotionCrucibleSoul
  name: brew of the crucible soul
  description: Wood grows around the walls of the Mansus. But as any Tellers teacher knows, the Mansus has no walls.
  components:
  - type: Sprite
    sprite: ADT/Heretic/items.rsi
    state: crucible_soul
  - type: Icon
    sprite: ADT/Heretic/items.rsi
    state: crucible_soul
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 5
        reagents:
        - ReagentId: CrucibleSoul
          Quantity: 5
  - type: Tag
    tags:
    - HereticItem

