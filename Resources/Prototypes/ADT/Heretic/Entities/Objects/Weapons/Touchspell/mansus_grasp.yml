- type: entity
  id: TouchSpellMansus
  name: mansus grasp
  description: The power of the Old Gods, channeled through your grip.
  categories: [ HideSpawnMenu ]
  components:
  - type: Unremoveable
  - type: Item
  - type: MansusGrasp
  - type: Sprite
    sprite: ADT/Heretic/mansus_grasp.rsi
    state: icon
  - type: Appearance
  - type: UseDelay
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1
    color: "#329a00"

# ADT: Rust mansus grasp, from Goob
- type: entity
  id: TouchSpellMansusRust
  parent: TouchSpellMansus
  categories: [ HideSpawnMenu ]
  components:
  - type: RustGrasp
  - type: MansusGrasp
    blacklist:
      components:
      - Puddle
  - type: UseDelay
    delays: # For rust path
      rust:
        length: 3
