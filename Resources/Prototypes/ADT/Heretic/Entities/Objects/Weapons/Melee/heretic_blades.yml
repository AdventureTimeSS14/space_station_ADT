- type: entity
  parent: [ BaseItem, BaseMagicContraband ]
  id: HereticBladeBase
  name: eldritch blade
  description: The sickly blade used by sinister individuals for rituals and sacrifices.
  components:
  - type: HereticBlade
  - type: Sharp
  - type: Sprite
    sprite: ADT/Heretic/Blades/blade_blade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -125
    attackRate: 1
    damage:
      types:
        Slash: 17.5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Normal
    sprite: ADT/Heretic/Blades/blade_blade-inhand.rsi
  - type: RandomTeleport
    radius:
      min: 10
      max: 100

- type: entity
  parent: HereticBladeBase
  id: HereticBladeAsh
  name: ashen blade
  suffix: Ash
  components:
  - type: HereticBlade
    path: Ash
  - type: Sprite
    sprite: ADT/Heretic/Blades/blade_ash.rsi
    state: icon
  - type: Item
    sprite: ADT/Heretic/Blades/blade_ash-inhand.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -125
    attackRate: 1
    damage:
      types:
        Heat: 10
        Slash: 7.5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: entity
  parent: HereticBladeBase
  id: HereticBladeBlade
  name: sundered blade
  suffix: Blade
  components:
  - type: HereticBlade
    path: Blade
  # ADT: base layer, infusion visuals, Mansus Grasp tag
  - type: Sprite
    sprite: ADT/Heretic/Blades/blade_blade.rsi
    layers:
    - state: icon
      map: [ "base" ]
  # ADT: explicit inhand Item sprite, blade was invisible in hand
  - type: Item
    size: Normal
    sprite: ADT/Heretic/Blades/blade_blade-inhand.rsi
  - type: Tag
    tags:
    - HereticItem
    - HereticBladeBlade
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.InfusedBladeVisuals.Infused:
        base:
          False: { state: icon }
          True: { state: infused }
  # ADT: two hits come from Multihit (second blade in other hand), not wielding
  - type: Multihit
    damageMultiplier: 0.75
    multihitWhitelist:
      tags:
      - HereticBladeBlade
    conditions:
    - !type:MultihitUserHereticEvent
      requiredPath: Blade
      minPathStage: 7
  - type: Reflect
    reflectProb: 0.5
    spread: 0

