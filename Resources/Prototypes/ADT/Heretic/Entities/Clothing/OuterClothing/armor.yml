- type: entity
  parent: [ ClothingOuterBaseMedium, ClothingOuterStorageToggleableBase, BaseMagicContraband ]
  id: ClothingOuterArmorHeretic
  name: ominous armor
  description: A ragged, dusty set of robes. Strange eyes line the inside.
  components:
  - type: Sprite
    sprite: ADT/Heretic/Clothing/OuterClothing/eldritch_armor.rsi
    state: icon
  - type: Clothing
    sprite: ADT/Heretic/Clothing/OuterClothing/eldritch_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.50
        Slash: 0.50
        Piercing: 0.50
        Heat: 0.50
        Caustic: 0.50
  - type: ExplosionResistance
    damageCoefficient: 0.25
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodHeretic
    slot: head
  - type: ModifyGrabStageTime
    modifiers:
      Hard: 1.75
      Suffocate: 1.5
  - type: ClothingGrantComponent
    component:
    - type: GrabProtection

- type: entity
  parent: [ ClothingOuterBaseMedium, ClothingOuterStorageToggleableBase, AllowSuitStorageClothing, BaseMagicContraband ]
  id: ClothingOuterArmorCloakVoid
  name: void cloak
  description: Black like tar, reflecting no light. Runic symbols line the outside. With each flash you lose comprehension of what you are seeing.
  components:
  - type: Sprite
    sprite: ADT/Heretic/Clothing/OuterClothing/void_cloak.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Clothing
    sprite: ADT/Heretic/Clothing/OuterClothing/void_cloak.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
        Caustic: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.7
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodVoidCloakHeretic
    slot: head
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Storage
    storageOpenSound: null
    maxItemSize: Normal
    grid:
    - 0,0,0,1
    - 2,0,2,1
    - 4,0,5,1
    - 7,0,7,1
    - 9,0,9,1
    whitelist:
      tags:
      - HereticItem
      - Knife
      - Meat
      components:
      # ADT: no BodyPart, only Organ
      - Organ
      - HereticBlade
      - CarvingKnife
      - HereticMagicItem
  - type: HereticClothing
  - type: PressureProtection
  - type: VoidCloak
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VoidCloakVisuals.Transparent:
        base:
          True: { state: transparent-icon }
          False: { state: icon }