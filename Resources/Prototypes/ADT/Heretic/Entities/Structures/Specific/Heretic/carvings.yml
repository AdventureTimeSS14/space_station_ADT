- type: entity
  id: BaseCarving
  name: elder carving
  description: Collection of unknown symbols, they remind you of days long gone...
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    drawdepth: HighFloorObjects # ADT: no FloorEffects, same Default-5 level
    sprite: ADT/Heretic/carvings.rsi
    color: '#FFFFFFB4'
  - type: Visibility
    layer: 1024
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        hard: false
        mask:
          - ItemMask
        layer:
          - SlipLayer
  - type: Physics
    bodyType: Static
  - type: WizardTrap # Wizard cuz yeah
    canReveal: false
    ignoredEntityWhitelist:
      components:
      - Ghoul
  - type: Tag
    tags:
    - HideContextMenu
    - HereticCarving
  # ADT: no damageContainer, only damageModifierSet
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/ADT/Heretic/runebreak.ogg

- type: entity
  parent: BaseCarving
  id: GraspingCarving
  name: grasping carving
  description: When stepped on, causes heavy damage leg damage and stuns the victim for 5 seconds. Has 1 charge.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: tentacle_rune
  - type: WizardTrap
    timeBetweenTriggers: 45
    triggerSound:
      path: /Audio/ADT/Heretic/demon_attack1.ogg
    stunTime: 5
  - type: DamageTrap
    damage:
      types:
        Blunt: 20

- type: entity
  parent: BaseCarving
  id: MadCarving
  name: mad carving
  description: When stepped on, causes heavy stamina damage, blindness, and muteness the victim. Has 2 charges.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: madness_rune
  - type: WizardTrap
    timeBetweenTriggers: 20
    charges: 2
    triggerSound:
      path: /Audio/ADT/Heretic/blind.ogg
  - type: MadCarving

- type: entity
  parent: BaseCarving
  id: AlertCarving
  name: alert carving
  description: A nearly invisible rune that, when stepped on, alerts the carver who triggered it and where and allows them to teleport to carving location.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    color: '#FFFFFFB4'
    state: alert_rune
  - type: WizardTrap
    sparks: false
    silent: true
    stunTime: 0
    charges: 50
    ignoredEntityWhitelist:
      components: []
    targetedEntityWhitelist:
      components:
      # ADT: HumanoidProfile instead of HumanoidAppearance
      - HumanoidProfile
      - BorgChassis
  - type: AlertCarving

# ADT: desc is a LocId for the carving radial menu
- type: runeCarving
  id: GraspingCarving
  desc: rune-carving-grasping-desc
  icon:
    sprite: ADT/Heretic/carvings.rsi
    state: tentacle_rune
  protoId: GraspingCarving

- type: runeCarving
  id: MadCarving
  desc: rune-carving-mad-desc
  icon:
    sprite: ADT/Heretic/carvings.rsi
    state: madness_rune
  protoId: MadCarving

- type: runeCarving
  id: AlertCarving
  desc: rune-carving-alert-desc
  icon:
    sprite: ADT/Heretic/carvings.rsi
    state: alert_rune
  protoId: AlertCarving
