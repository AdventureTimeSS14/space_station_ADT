- type: entity
  parent: BaseStructure
  id: HereticMansusGate
  name: ent-HereticMansusGate
  description: ent-HereticMansusGate-desc
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: ADT/Heretic/Effects/effects.rsi
    state: bhole3
    drawdepth: OverMobs
  - type: HereticMansusGate
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        layer:
        - WallLayer
        mask:
        - MobMask
        density: 1000
        hard: false
  - type: Clickable
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
