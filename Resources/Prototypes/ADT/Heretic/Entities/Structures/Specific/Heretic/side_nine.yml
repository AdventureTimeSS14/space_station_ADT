    sprite: Structures/Wallmounts/paintings.rsi
    state: painting3
  - type: HereticPainting
    kind: Weeping
  - type: ActivatableUI
    key: enum.PaintingCurseUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaintingCurseUiKey.Key:
        type: PaintingCurseBoundUserInterface

