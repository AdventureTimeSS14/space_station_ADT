- type: entity
  parent:
  - BaseMob
  - MobCombat
  - FlyingMobBase
  id: MobStarGazer
  name: star gazer
  description: A creature that has been tasked to watch over the stars.
  components:
  - type: Sprite
    sprite: ADT/Heretic/star_gazer.rsi
    layers:
    - state: star_gazer
      offset: 0, 1
  - type: ActionGrant
    actions:
    - ActionHereticCosmicExpansion
    - ActionHereticStarBlast
    - ActionStarGaze
    - ActionStarGazerSeekMaster
  - type: MeleeWeapon
    range: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    altDisarm: false
    angle: 0
    animation: WeaponArcHereticCosmic
    attackRate: 1
    # ADT: no canWideSwing
    damage:
      types:
        Slash: 10
        Piercing: 10
        Structural: 100
    # ADT: no armorPenetration
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        mask:
        - MobMask
  - type: MovementIgnoreGravity
  - type: Speech
  - type: TypingIndicator
  - type: NoSlip
  - type: Grammar
    attributes:
      gender: male
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghostrole-stargazer-name
    description: ghostrole-stargazer-desc
    rules: ghostrole-ghoul-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: short
    # ADT: no GhostRole requirements
  - type: ActiveRadio
    channels:
    - Mansus
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Mansus
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Heretic
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: Insulated
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: FlashImmunity
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Eye
    drawFov: false
  - type: ContentEye
    maxZoom: 1.5, 1.5
    targetZoom: 1.5, 1.5
  # ADT: own language system, see UniversalLanguageSpeaker
  - type: UniversalLanguageSpeaker
  - type: LanguageSpeaker
  - type: CosmicTrail
    strength: 10
  - type: PointLight
    color: "#dcaa5b"
    radius: 5
    softness: 1
  - type: Puller
    needsHands: false
  - type: StarGazer
  - type: WarpPoint
    follow: true
    location: star gazer
  # ADT: NightVision has different fields
  - type: NightVision
    innate: true
    overlay: false
  - type: SupermatterImmune
  - type: HealingAura
    componentHealMultipliers:
      CosmosPassive: 2
  - type: Tag
    tags:
    - CannotSuicide
