- type: entity
  parent: [BaseMobGhoul, BaseSpeciesAppearance]
  id: MobShatteredRisen
  name: shattered risen
  description: A corpse dragged back to near-life by a cold, rending force. Its hands are brutal nests of sharp bone-shards.
  components:
  - type: Ghoul
    totalHealth: 350
    giveBlade: false
  - type: Damageable
    damageModifierSet: ADTShatteredRisen
  - type: MobThresholds
    thresholds:
      0: Alive
      345: Critical
      350: Dead
  - type: GhostRole
    name: ghostrole-shattered-name
    description: ghostrole-shattered-desc
  - type: ShatteredRisen
  - type: MeleeWeapon
    animation: WeaponArcSmash
    soundHit:
      collection: GlassBreak
    damage:
      types:
        Slash: 18
        Piercing: 14
  - type: InitialBody
    organs:
      Torso: HereticOrganShatteredTorso
      Head: HereticOrganShatteredHead
      ArmLeft: HereticOrganShatteredArmLeft
      ArmRight: HereticOrganShatteredArmRight
      HandLeft: HereticOrganShatteredHandLeft
      HandRight: HereticOrganShatteredHandRight
      LegLeft: HereticOrganShatteredLegLeft
      LegRight: HereticOrganShatteredLegRight
      FootLeft: HereticOrganShatteredFootLeft
      FootRight: HereticOrganShatteredFootRight
