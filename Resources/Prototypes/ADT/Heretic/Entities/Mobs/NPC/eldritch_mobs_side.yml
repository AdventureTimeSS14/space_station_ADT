- type: entity
  parent: BaseMobGhoul
  id: MobGhoulMirrorMaid
  name: ent-MobGhoulMirrorMaid
  description: ent-MobGhoulMirrorMaid-desc
  components:
  - type: Ghoul
    totalHealth: 80
  - type: Sprite
    noRot: true
    sprite: ADT/Heretic/eldritch_mobs.rsi
    state: maid
  - type: GhostRole
    name: ghostrole-maid-name
    description: ghostrole-maid-desc
  - type: MirrorMaid
  - type: NightVision
    innate: true
  - type: MeleeWeapon
    animation: WeaponArcPunch
    soundHit:
      collection: GlassBreak
    damage:
      types:
        Slash: 10
        Piercing: 10
  - type: Reflect
    reflectProb: 1
    reflects:
    - Energy

