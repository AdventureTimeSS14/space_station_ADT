  description: Summon an echo per nearby victim. Attacked echoes burst with stun and Cellular damage.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 60
    itemIconStyle: NoItem
  - type: Sprite
    sprite: ADT/Heretic/abilities_heretic.rsi
    layers:
    - state: moon_ringleader
  - type: InstantAction
    event: !type:EventHereticRingleadersRise
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-moon-ringleader

