- type: entity
  parent: BaseAction
  id: ActionHereticMindGate
  name: Mind Gate
  description: Open your mind and theirs. Deals you Cellular damage and inflicts confusion, blindness and mute scaled by sanity plus Cellular damage. Knocks down low sanity targets.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 20
    itemIconStyle: NoItem
  - type: Sprite
    sprite: ADT/Heretic/abilities_heretic.rsi
    layers:
    - state: mind_gate
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:EventHereticMindGate
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-moon-mindgate

- type: entity
  parent: BaseAction
  id: ActionHereticLunarParade
  name: Lunar Parade
  description: Fire a slow parade projectile that forces those hit to join the parade and lose sanity.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 30
    itemIconStyle: NoItem
  - type: Sprite
    sprite: ADT/Heretic/abilities_heretic.rsi
    layers:
    - state: moon_parade
  - type: TargetAction
    range: 12
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:EventHereticLunarParade
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-moon-parade

- type: entity
  parent: BaseAction
  id: ActionHereticRingleadersRise
