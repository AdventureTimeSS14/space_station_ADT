- type: reagent
  id: EldritchRust
  group: Unknown
  name: reagent-name-eldritch-rust
  desc: reagent-desc-eldritch-rust
  physicalDesc: reagent-physical-desc-rusty
  flavor: rust
  color: "#b18644"
  metabolisms:
    Bloodstream:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
      - !type:Emote
        emote: Scream
        probability: 0.3
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
      - !type:ModifyStatusEffect
        effectProto: EldritchRustStatusEffect
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
      - !type:HealthChange
        damage:
          types:
            Blunt: 2
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
      - !type:Jitter
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
        ignoreResistances: false
        damage:
          types:
            Caustic: 30

- type: reagent
  id: EssenceEldritch
  group: Medicine
  name: reagent-name-eldritch
  desc: reagent-desc-eldritch
  physicalDesc: reagent-physical-desc-eldritch
  flavor: eldritch
  color: "#1f8016"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -1
            Radiation: -1
            Caustic: -1
            Poison: -1
            Asphyxiation: -1
            Bloodloss: -1
            Blunt: -1
            Slash: -1
            Piercing: -1
            Cellular: -1
        conditions:
        - !type:HereticOrGhoulCondition
      - !type:ModifyBleed
        amount: -1.5
        conditions:
        - !type:HereticOrGhoulCondition
      - !type:CleanBloodstream
        cleanseRate: 1
        conditions:
        - !type:HereticOrGhoulCondition
      - !type:GenericStatusEffect
        key: SeeingRainbows
        time: 15.0
        type: Remove
        conditions:
        - !type:HereticOrGhoulCondition
      - !type:Electrocute
        conditions:
        - !type:HereticOrGhoulCondition
          inverted: true
        probability: 0.2

