- type: entity
  id: GoldSlimeExtract
  parent: BaseSlimeExtract
  name: gold slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#e8b923"
      shader: XenoMetallic
  - type: SlimeExtract
    extractReactions:
    - GoldSlimeExtractWaterReaction
    - GoldSlimeExtractPlasmaReaction
    - GoldSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyGoldExtract

- type: extractReaction
  id: GoldSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:Jitter
      time: 3
      frequency: 20
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: RPassiveMobSpawner
      number: 5
      delay: 3
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: GoldSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:Jitter
      time: 3
      frequency: 20
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: RHostileMobSpawner
      number: 5
      delay: 3
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: GoldSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:Jitter
      time: 3
      frequency: 20
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: RNeutralMobSpawner
      number: 5
      delay: 3
    scalingOffset: 1
  shouldDelete: false
