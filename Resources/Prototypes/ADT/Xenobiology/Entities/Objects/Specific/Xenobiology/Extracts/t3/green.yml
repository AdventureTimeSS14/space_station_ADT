- type: entity
  id: GreenSlimeExtract
  parent: BaseSlimeExtract
  name: green slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#4dff4d"
  - type: Reactive
    reactions:
    - reagents: [ Radium ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction-reagent" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:ConvertReagent
        solutionName: extract
        removeReagent: Radium
        addReagent: XenobioFelinidToxin
        removeAmount: 1
        addAmount: 1
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction-reagent" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:ConvertReagent
        solutionName: extract
        removeReagent: Plasma
        addReagent: XenobioJellyGreen
        removeAmount: 1
        addAmount: 1
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction-reagent" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:ConvertReagent
        solutionName: extract
        removeReagent: Plasma
        addReagent: XenobioHumanToxin
        removeAmount: 1
        addAmount: 1
  - type: Tag
    tags:
    - XenobiologyGreenExtract