- type: entity
  id: AdamantineSlimeExtract
  parent: BaseSlimeExtract
  name: adamantine slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#005c33"
      shader: XenoMetallic
  - type: SlimeExtract
    extractReactions:
    - AdamantineSlimeExtractWaterReaction
    - AdamantineSlimeExtractPlasmaReaction
    - AdamantineSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyAdamantineExtract

- type: extractReaction
  id: AdamantineSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:CreateGas
      gas: Healium
      moles: 55
    scalingOffset: 1
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  shouldDelete: false

- type: extractReaction
  id: AdamantineSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: XenobioAdamantineBar
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: AdamantineSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: RegenerativeJelly
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false
