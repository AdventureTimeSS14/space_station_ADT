- type: entity
  id: BluespaceSlimeExtract
  parent: BaseSlimeExtract
  name: bluespace slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#f0f8ff"
      shader: XenoBluespace
  - type: SlimeExtract
    extractReactions:
    - BluespaceSlimeExtractWaterReaction
    - BluespaceSlimeExtractPlasmaReaction
    - BluespaceSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyBluespaceExtract

- type: extractReaction
  id: BluespaceSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: FloorTileItemBluespace
      number: 30
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeBluespaceRadioPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: BluespaceSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: ADTMaterialBScrystal1
      number: 5
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: BluespaceSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:RandomTeleportNearby
    scalingOffset: 1
  shouldDelete: false
