- type: entity
  parent: BaseItem
  id: SlimeNameChangePotion
  name: slime name change potion
  description: Renames a sentient creature. Set the new name through the UI.
  components:
  - type: SlimeNameChangePotion
  - type: ActivatableUI
    key: enum.SlimeNameChangePotionUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.SlimeNameChangePotionUiKey.Key:
        type: SlimeNameChangePotionBoundUserInterface
  - type: Sprite
    sprite: ADT/Xenobiology/Specific/Xenobiology/slime_potion.rsi
    layers:
    - state: slime_potion
    color: "#ff94d1ff"

