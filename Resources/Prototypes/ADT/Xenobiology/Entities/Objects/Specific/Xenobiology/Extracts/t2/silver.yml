- type: entity
  id: SilverSlimeExtract
  parent: BaseSlimeExtract
  name: silver slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#c4c4c4"
      shader: XenoMetallic
  - type: SlimeExtract
    extractReactions:
    - SilverSlimeExtractWaterReaction
    - SilverSlimeExtractPlasmaReaction
    - SilverSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologySilverExtract

- type: extractReaction
  id: SilverSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:Jitter
      time: 5
      frequency: 20
    scalingOffset: 0
  - effect: !type:AreaReactionEffect
      duration: 10
      prototypeId: AluminiumMetalFoam
      sound:
        path: /Audio/Effects/extinguish.ogg
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: SilverSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: IngotSilver1
      number: 2
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: SilverSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: XenobioGoopBall
      number: 3
    scalingOffset: 1
  shouldDelete: false
