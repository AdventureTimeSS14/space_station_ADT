- type: entity
  id: DarkBlueSlimeExtract
  parent: BaseSlimeExtract
  name: dark blue slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#1e8cfa"
  - type: SlimeExtract
    extractReactions:
    - DarkBlueSlimeExtractWaterReaction
    - DarkBlueSlimeExtractPlasmaReaction
    - DarkBlueSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyDarkBlueExtract

- type: extractReaction
  id: DarkBlueSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeFireproofPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: DarkBlueSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateGas
      gas: Frezon
      moles: 35
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: DarkBlueSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: Leporazine
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false
