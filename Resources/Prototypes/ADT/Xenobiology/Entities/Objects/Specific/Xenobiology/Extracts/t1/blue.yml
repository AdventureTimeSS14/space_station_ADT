- type: entity
  id: BlueSlimeExtract
  parent: BaseSlimeExtract
  name: blue slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#79F6FC"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:AreaReactionEffect
        duration: 10
        prototypeId: Foam
        sound:
          path: /Audio/Effects/extinguish.ogg
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction-reagent" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:ConvertReagent
        solutionName: extract
        removeReagent: Plasma
        addReagent: FrostOil
        removeAmount: 1
        addAmount: 1
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:MakeUnreactiveEntityEffect
      - !type:PopupMessage
        type: Pvs
        messages: [ "xeno-extract-reaction-reagent" ]
      - !type:PlaySoundEffect
        sound: /Audio/Effects/Chemistry/bubbles.ogg
      - !type:ConvertReagent
        solutionName: extract
        removeReagent: Blood
        addReagent: XenobioJellyBlue
        removeAmount: 1
        addAmount: 1
  - type: Tag
    tags:
    - XenobiologyBlueExtract