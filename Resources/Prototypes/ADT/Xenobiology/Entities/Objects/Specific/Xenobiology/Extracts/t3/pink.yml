- type: entity
  id: PinkSlimeExtract
  parent: BaseSlimeExtract
  name: pink slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#ff33cc"
  - type: SlimeExtract
    extractReactions:
    - PinkSlimeExtractWaterReaction
    - PinkSlimeExtractPlasmaReaction
    - PinkSlimeExtractBloodReaction
    - PinkSlimeExtractJellyReaction
  - type: Tag
    tags:
    - XenobiologyPinkExtract

- type: extractReaction
  id: PinkSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:MutateNearbyPlantsEntityEffect
      radius: 5
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: PinkSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: XenobioJellyPink
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false

- type: extractReaction
  id: PinkSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: XenobioGenderFluid
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false

- type: extractReaction
  id: PinkSlimeExtractJellyReaction
  requirements:
    Radium: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: XenobioPinkExtractJelly
      number: 1
    scalingOffset: 1
  shouldDelete: false
