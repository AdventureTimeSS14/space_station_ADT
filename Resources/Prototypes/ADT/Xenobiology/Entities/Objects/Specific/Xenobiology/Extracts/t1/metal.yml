- type: entity
  id: MetalSlimeExtract
  parent: BaseSlimeExtract
  name: metal slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#595959"
      shader: XenoMetallic
  - type: SlimeExtract
    extractReactions:
    - MetalSlimeExtractWaterReaction
    - MetalSlimeExtractPlasmaReaction
    - MetalSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyMetalExtract

- type: extractReaction
  id: MetalSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SheetGlass1
      number: 15
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SheetRGlass1
      number: 5
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: MetalSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SheetSteel1
      number: 15
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SheetPlasteel1
      number: 5
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: MetalSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: YellowSlimeExtractPowercell
      number: 1
    scalingOffset: 1
  shouldDelete: false
