- type: entity
  id: LightPinkSlimeExtract
  parent: BaseSlimeExtract
  name: light pink slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#ffb3ec"
  - type: SlimeExtract
    extractReactions:
    - LightPinkSlimeExtractWaterReaction
    - LightPinkSlimeExtractPlasmaReaction
    - LightPinkSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyLightPinkExtract

- type: extractReaction
  id: LightPinkSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:DoSmokeEntityEffect
      duration: 15
      spreadAmount: 50
      smokePrototype: Foam
      solution:
        reagents:
        - ReagentId: Pax
          Quantity: 30
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeNameChangePotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: LightPinkSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: Cognizine
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeSentiencePotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: LightPinkSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-evil" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:Jitter
      time: 3
      frequency: 20
    scalingOffset: 0
  - effect: !type:ScrambleNearbyEffect
      radius: 3
      speciesBlacklist:
      - Skeleton
      - GhostSpecies
      - IPC
      - ADTShadowlingSpecies
      - ADTLesserShadowlingSpecies
    scalingOffset: 1
  shouldDelete: false
