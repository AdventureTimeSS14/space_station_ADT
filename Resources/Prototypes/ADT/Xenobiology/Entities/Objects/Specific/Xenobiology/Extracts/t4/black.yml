- type: entity
  id: BlackSlimeExtract
  parent: BaseSlimeExtract
  name: black slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#000000"
  - type: SlimeExtract
    extractReactions:
    - BlackSlimeExtractWaterReaction
    - BlackSlimeExtractPlasmaReaction
    - BlackSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyBlackExtract

- type: extractReaction
  id: BlackSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: RandomDrinkGlass
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: BlackSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: AdvancedMutationToxin
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false

- type: extractReaction
  id: BlackSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: RandomFoodMeal
      number: 1
    scalingOffset: 1
  shouldDelete: false
