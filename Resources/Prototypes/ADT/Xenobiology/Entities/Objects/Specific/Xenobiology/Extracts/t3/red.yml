- type: entity
  id: RedSlimeExtract
  parent: BaseSlimeExtract
  name: red slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#ff3333"
  - type: SlimeExtract
    extractReactions:
    - RedSlimeExtractWaterReaction
    - RedSlimeExtractRadiumReaction
    - RedSlimeExtractPlasmaReaction
    - RedSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyRedExtract

- type: extractReaction
  id: RedSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeSpeedPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: RedSlimeExtractRadiumReaction
  requirements:
    Radium: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeFireproofPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: RedSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeMutationPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: RedSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeSpeedMechPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false
