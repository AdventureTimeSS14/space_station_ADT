- type: entity
  id: BaseSlimeExtract
  parent: BaseItem
  name: slime extract
  description: Goo extracted from a slime. Legends claim these to have "magical powers".
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#828282"
  - type: Appearance
  - type: Solution
  - type: SolutionManager
    solutions:
    - BaseSlimeExtractSolution
  - type: InjectableSolution
    solution: extract
  - type: DrawableSolution
    solution: extract
  - type: ExaminableSolution
    solution: extract
  - type: SlimeExtract
    containerName: extract
  - type: StatusEffects # used for jittering and stuff
    allowed:
    - Jitter
  - type: GuideHelp
    guides:
    - Xenobiology

- type: entity
  parent: Solution
  id: BaseSlimeExtractSolution
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: extract
    solution:
      maxVol: 50
      reagents: []
