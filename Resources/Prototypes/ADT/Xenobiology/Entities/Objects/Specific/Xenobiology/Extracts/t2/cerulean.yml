- type: entity
  id: CeruleanSlimeExtract
  parent: BaseSlimeExtract
  name: cerulean slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#2A52BE"
  - type: SlimeExtract
    extractReactions:
    - CeruleanSlimeExtractWaterReaction
    - CeruleanSlimeExtractPlasmaReaction
    - CeruleanSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyCeruleanExtract

- type: extractReaction
  id: CeruleanSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateGas
      gas: Pluoxium
      moles: 55
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: CeruleanSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:ExtinguishNearby
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeExtractEnhancerPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: CeruleanSlimeExtractBloodReaction
  requirements:
    Blood: 15
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction-reagent" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:AddReagentToSolution
      reagent: XenobioJellyCerulean
      solution: extract
    scalingFactor: 1
    scalingOffset: 0
  shouldDelete: false
