- type: entity
  id: CeruleanSlimeExtract
  parent: BaseSlimeExtract
  name: cerulean slime extract
  components:
  - type: Sprite
    layers:
    - sprite: ADT/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#2A52BE"
  - type: SlimeExtract
    extractReactions:
    - CeruleanSlimeExtractWaterReaction
    - CeruleanSlimeExtractPlasmaReaction
    - CeruleanSlimeExtractBloodReaction
  - type: Tag
    tags:
    - XenobiologyCeruleanExtract

- type: extractReaction
  id: CeruleanSlimeExtractWaterReaction
  requirements:
    Water: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:CreateGas
      gas: Pluoxium
      moles: 55
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: CeruleanSlimeExtractPlasmaReaction
  requirements:
    Plasma: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:ExtinguishNearby
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SlimeExtractEnhancerPotion
      number: 1
    scalingOffset: 1
  shouldDelete: false

- type: extractReaction
  id: CeruleanSlimeExtractBloodReaction
  requirements:
    Blood: 1
  effects:
  - effect: !type:PopupMessage
      type: Pvs
      messages: [ "xeno-extract-reaction" ]
    scalingOffset: 0
  - effect: !type:PlaySoundEffect
      sound: /Audio/Effects/Chemistry/bubbles.ogg
    scalingOffset: 0
  - effect: !type:SpawnEntityFromTable
      number: 1
      entityTable: !type:GroupSelector
        children:
        - id: CrayonRed
        - id: CrayonOrange
        - id: CrayonYellow
        - id: CrayonGreen
        - id: CrayonBlue
        - id: CrayonPurple
        - id: CrayonBlack
        - id: CrayonWhite
      offset: 0.2
    scalingFactor: 1
    scalingOffset: 0
  - effect: !type:CreateEntityReactionEffect
      entity: SprayPainter
      number: 1
    scalingOffset: 1
  - effect: !type:CreateEntityReactionEffect
      entity: SprayPainterAmmo
      number: 1
    scalingOffset: 1
  shouldDelete: true