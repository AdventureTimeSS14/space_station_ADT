  name: slime
  suffix: Adult
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: MobGrowth
    hungerRequired: 95
    growthCost: -50
    currentStage: adult
    stages:
      baby:
        nextStage: adult
        sprite: ADT/Xenobiology/Mobs/slimesBaby.rsi
        displayName: mob-slime-stage-baby
      adult:
        sprite: ADT/Xenobiology/Mobs/slimesAdult.rsi
        displayName: mob-slime-stage-adult

