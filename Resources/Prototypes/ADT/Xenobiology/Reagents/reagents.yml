- type: reagent
  id: BaseXenobioReagent
  abstract: true
  group: Biological
  flavor: horrible
  physicalDesc: reagent-physical-desc-viscous
  recognizable: false
  viscosity: 0.25

- type: reagent
  parent: BaseXenobioReagent
  id: XenobioSlimeToxin
  name: xenobio-reagent-slime-toxin-name
  desc: xenobio-reagent-slime-toxin-desc
  color: "#3CB371"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          types:
            Asphyxiation: -2
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        damage:
          types:
            Bloodloss: -7
      - !type:GenericStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        key: SeeingRainbow
        component: SeeingRainbow
        time: 5
        type: Add
      - !type:GenericStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        key: Drunk
        component: Drunk
        time: 5
        type: Add
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        type: Local
        visualType: Small
        messages: [ "slime-toxin-effect-yawn" ]
        probability: 0.1
      - !type:GenericStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        key: Drowsiness
        component: Drowsiness
        time: 2
        type: Add

- type: reagent
  parent: BaseXenobioReagent
  id: XenobioJellyPurple
  name: xenobio-reagent-jelly-purple-name
  desc: xenobio-reagent-jelly-purple-desc
  color: "#BF77F6"
  metabolisms:
    Bloodstream:
      metabolismRate: 1
      effects:
      - !type:ModifySlimeComponent
        conditions:
        - !type:ReagentCondition
          reagent: XenobioJellyPurple
          min: 1
        extractBonus: 1
        maxExtractBonus: 3
      - !type:AdjustReagent
        reagent: XenobioJellyPurple
        amount: -100.0
        conditions:
        - !type:ReagentCondition
          reagent: XenobioJellyPurple
          min: 1

