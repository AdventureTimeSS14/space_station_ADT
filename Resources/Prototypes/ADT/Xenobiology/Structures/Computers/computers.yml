- type: entity
  id: ComputerScienceXenobiologyBounty
  parent: BaseComputerAiAccess
  name: xenobiologicial bounty console
  description: Used to manage currently active bounties for xenobiological goods.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: xenobiology
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ResearchClient
  - type: XenobiologyBountyConsole
  - type: ActivatableUI
    key: enum.CargoConsoleUiKey.Bounty
  - type: UserInterface
    interfaces:
      enum.CargoConsoleUiKey.Bounty:
        type: XenobiologyBountyConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: XenobiologyBountyComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: AccessReader
    access: [["Research"]]
  - type: GuideHelp
    guides:
    - Xenobiology
    - Science

- type: entity
  id: XenobiologyBountyComputerCircuitboard
  parent: BaseComputerCircuitboard
  name: xenobiological bounty console board
  description: A computer printed circuit board for a xenobiological bounty console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ComputerScienceXenobiologyBounty
  - type: StaticPrice

- type: entity
  id: ADTComputerXenobiologyControl
  parent: BaseComputerAiAccess
  name: xenobiology control console
  description: Lets you pilot a free-flying drone eye through the station's cameras to remotely capture/place slimes and manage a monkey-cube stock.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: ai-fixer
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: XenobiologyControlConsole
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - XenobiologyRecyclerReceiver
  - type: Storage
    grid:
    - 0,0,4,4
    maxItemSize: Small
    openOnActivate: false
    whitelist:
      tags:
      - MonkeyCube
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
      board: !type:Container
        ents: [ ]
      pai_slot: !type:ContainerSlot {}
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Computer
    board: ADTXenobiologyControlComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: AccessReader
    access: [["Research"]]
  - type: GuideHelp
    guides:
    - Xenobiology
    - Science

- type: entity
  id: ADTXenobiologyControlComputerCircuitboard
  parent: BaseComputerCircuitboard
  name: xenobiology control console board
  description: A computer printed circuit board for a xenobiology control console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ADTComputerXenobiologyControl
  - type: StaticPrice
