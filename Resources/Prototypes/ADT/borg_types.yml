- type: borgType
  id: security

  # Description
  dummyPrototype: ADTBorgChassisSec

  # Functional
  extraModuleCount: 4
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - ADTBorgModuleSecurity
  defaultModules:
  - ADTBorgModuleStorage # ADT-Tweak
  - BorgModuleTool
  - ADTBorgModuleDetention

  radioChannels:
  - Science
  - Security

  # Visual
