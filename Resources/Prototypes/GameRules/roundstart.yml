- type: entity
  id: BaseGameRule
  abstract: true
  components:
  - type: GameRule

- type: entity
  parent: BaseGameRule
  id: BaseRoundstartAntagRule
  abstract: true
  components:
  - type: AntagSelection
    selectionTime: PrePlayerSpawn

- type: entity
  parent: BaseGameRule
  id: RespawnDeadRule
  components:
  - type: RespawnDeadRule
    alwaysRespawnDead: true
  - type: RespawnTracker
    respawnDelay: 10
    deleteBody: false

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRule
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: Xenoborgs
      prob: 0.05
#    - id: SubWizard
#      prob: 0.05
    # - id: Heretic # goob edit #ADT-Tweak - убрал еретиков и генокрадов из геймрула
    #   prob: 0.2
    # - id: ChangelingGameRule # ADT-Changeling-Tweak
    #   prob: 0.1
    - id: SubXenoborgs
      prob: 0.05
    - id: Changeling
      prob: 0.25

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoWizard
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: SubXenoborgs
      prob: 0.05
    - id: Changeling
      prob: 0.25

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoXenoborg
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    #ADT-Tweak-Start
    #- id: SubWizard
    #  prob: 0.05
    #ADT-Tweak-End
    - id: Changeling
      prob: 0.25

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoWizardNoXenoborg
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: Changeling
      prob: 0.25

- type: entity
  parent: BaseGameRule
  id: DummyNonAntagChance
  components:
  - type: SubGamemodes
    rules:
    - id: DummyNonAntag
      prob: 0.3

- type: entity
  id: DeathMatch31
  parent: BaseGameRule
  components:
  - type: DeathMatchRule
    rewardSpawns: !type:AllSelector
      children:
      - id: HealingToolbox
      - !type:GroupSelector
        children:
        - id: ClothingOuterArmorBasicSlim
        - id: ClothingHeadHelmetBasic
        - id: SoapNT
        - id: Bola
        - id: Spear
        - id: ClothingShoesGaloshes
        - id: FoodPieBananaCream
        - id: Stimpack
  - type: KillCalloutRule
  - type: PointManager
  - type: RespawnDeadRule
  - type: RespawnTracker
    respawnDelay: 5

- type: entity
  id: InactivityTimeRestart
  parent: BaseGameRule
  components:
  - type: InactivityRule
    inactivityMaxTime: 600
    roundEndDelay: 10

- type: entity
  id: MaxTimeRestart
  parent: BaseGameRule
  components:
  - type: MaxTimeRestartRule
    roundMaxTime: 300
    roundEndDelay: 10

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseNukeopsRule
  components:
  - type: RandomMetadata #this generates the random operation name cuz it's cool.
    nameSegments:
    - NamesOperationPrefix
    - NamesOperationSuffix
    nameFormat: name-format-nuclear-operation
  - type: NukeopsRule
  - type: RuleGrids
  - type: AntagSelection
    agentName: nukeops-roundend-name # ADT-tweak
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    #Species that do not work with nukies should be included in this list.
    #Once the issues are fixed the species should be removed from this list to be enabled.
    #Balance concerns are not a valid reason to disable a species, except for high-impact Nukie-specific exploits.
    #- Vox
  #ADT-tweak-start
  - type: AntagObjectives
    objectives:
    - NukeopsDetonateObjective
  #ADT-tweak-end


- type: entity
  parent: [ BaseNukeopsRule, BaseRoundstartAntagRule ]
  id: Nukeops
  components:
  - type: GameRule
    minPlayers: 20
  - type: LoadMapRule
    mapPath: /Maps/ADTMaps/Nonstation/nukeplanet_adt.yml # ADT-Tweak
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: NukeopsCommander
    - !type:FixedAntagCount
      proto: NukeopsMedic
    - !type:LinearAntagCount
      proto: NukeopsOperative
      range:
        min: 1
        max: 3
  - type: DynamicRuleCost
    cost: 200

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseTraitorRule
  components:
  - type: TraitorRule
  # TODO: codewords in yml
  # TODO: uplink in yml
  - type: AntagRandomObjectives
    sets:
  # ADT-Tweak start
    - groups: ADTTraitorObjectiveGroups
      maxPicks: 2
    maxDifficulty: 8
  - type: AntagDelayedObjectives
    sets:
    - groups: DelayedTraitorObjectiveGroups
      maxPicks: 1
    maxDifficulty: 3
    delay: 1800
    maxDelay: 2100
  # ADT-Tweak end
  - type: AntagSelection
    agentName: traitor-round-end-agent-name
  - type: DynamicRuleCost
    cost: 100

